name: Deploy site to GitHub Pages

# Deploys after `validate` has passed on a push to main; can also be run by
# hand from the Actions tab.
#
# It used to trigger on `push` directly, in parallel with validate.yml, so a
# push that failed validation (stale README, a commit by another account, the
# DOM suite, a stale last_updated) still went live. `workflow_run` waits for
# validate to finish, and the job below only runs when it succeeded on a push.
# It builds the exact commit validate checked (head_sha), not whatever main
# points at by then.

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.urls }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The site is a rendering of the same data as README.md, so the data
      # checks that guard the list also guard the site.
      - name: Validate data files
        run: python scripts/build.py --check

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # P0-2: the deploy must not ship what validation rejects. These are
      # the same suites validate.yml runs; running them here makes a red
      # test block the publish instead of merely mailing a failure after
      # the fact. (build_site.py already fails both workflows on a JS
      # syntax error via its built-in node --check.)
      - name: Test the search core
        run: node tests/test_search.js

      # Structured data and the changelog page, read from the same build.
      - name: Test structured data and the changelog page
        run: node tests/test_seo.js

      # build_site.py asserts canonical/og:url match the configured origin and
      # that no github.io URL leaks in when a custom domain is set; reaching
      # this step means that passed.
      - name: Show what was built
        run: ls -la site/

      # Hash every sitemap page, ship the hashes as site/page-hashes.json,
      # and compare with the live copy: IndexNow gets only what changed.
      - name: List the URLs this deploy changes
        id: changed
        run: |
          URLS=$(python scripts/changed_urls.py site "$(python -c 'import yaml;print(yaml.safe_load(open("site.config.yml"))["url"])')")
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tell IndexNow engines (Bing, Yandex, ...) which URLs changed. Best effort:
  # a failed ping never fails the deploy. Google does not use IndexNow; it
  # reads the sitemap submitted in Search Console. Only the pages whose
  # content differs from the previous deploy are sent (scripts/changed_urls.py);
  # it used to send the whole sitemap on every push.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.changed != '' && needs.build.outputs.changed != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping IndexNow with the changed URLs
        env:
          URLS: ${{ needs.build.outputs.changed }}
        run: |
          set -e
          HOST=computedtomography.org
          KEY=4bf21e09101203f8d88708830000689d
          sleep 30
          echo "URLs: $URLS"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}"
