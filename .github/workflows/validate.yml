name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repository, so grant nothing else: a compromised or
# misused dependency in the build chain then has no token worth stealing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the authorship check below walks the pushed range,
      # which a shallow (depth-1) checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The contributor graph must contain exactly one account: cslht11.
      # GitHub attributes a commit by the email *on the commit*, and the graph
      # counts the default branch only — so a single commit signed with some
      # other address becomes a permanent second "author". That is precisely
      # why this repository was rebuilt on 2026-10-12, and why `refs/pull/*`
      # (which cannot be deleted) is a reason to keep the default branch clean.
      #
      # hooks/pre-push enforces the same rule locally and checks the commits
      # themselves rather than `user.email`. But a hook in `hooks/` is not
      # enabled by Git until someone runs scripts/install-hooks.sh, so a fresh
      # clone silently has no gate at all. Repeating it here means nothing can
      # skip it — the check runs on the server side of the push.
      - name: Sole authorship
        run: |
          # The rule is "cslht11 and nobody else", not "one exact string".
          # Two addresses are legitimate and both resolve to cslht11:
          #
          #   cslht11@users.noreply.github.com — a commit made from a local
          #     checkout; the identity hooks/pre-commit pins.
          #
          #   heitieya@163.com — a commit made through the GitHub Contents API
          #     (a connector push). GitHub signs those with the account's
          #     *primary* email, and that endpoint takes no author parameter at
          #     all, so the address is not the caller's to choose. Rejecting it
          #     would not protect anything — it would just block every
          #     connector-authored push while still passing locally-made ones.
          #
          # What must never appear is a commit attributed to a *different*
          # account. That is the failure this gate exists for.
          name="cslht11"
          mails="cslht11@users.noreply.github.com heitieya@163.com"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          zero="0000000000000000000000000000000000000000"
          if [ -z "$base" ] || [ "$base" = "$zero" ]; then
            # New branch or a forced push: the range is unknowable, so fall
            # back to the tip. Not airtight, but the local hook covers the rest.
            range="HEAD~1..HEAD"
          else
            range="$base..HEAD"
          fi
          echo "checking $range"
          bad=$(git log --format='%h %an <%ae>' "$range" |
            awk -v n="$name" -v m="$mails" '
              BEGIN { split(m, a, " "); for (i in a) ok[a[i]] = 1 }
              { mail = $3; gsub(/^<|>$/, "", mail)
                if ($2 != n || !(mail in ok)) print }')
          if [ -n "$bad" ]; then
            echo "::error::commits attributed to an account other than cslht11 — each one becomes a permanent second contributor"
            echo "$bad"
            echo ""
            echo "From a local checkout, fix the author and re-push with:"
            echo "    git rebase --exec 'git commit --amend --reset-author --no-edit' <base>"
            exit 1
          fi
          echo "OK: every commit in $range is attributed to cslht11"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data files
        run: python scripts/build.py --check

      # data/meta.yaml last_updated is the date the whole site shows (homepage,
      # READMEs, JSON-LD, llms.txt, sitemap). Nothing moves it automatically,
      # so fail when data/ changed after it. Needs the full history fetched
      # above (fetch-depth: 0).
      - name: Ensure last_updated covers the newest data change
        run: python scripts/check_last_updated.py

      # build.py with no arguments renders *every* language, so both files have
      # to be checked. Checking only README.md would let a stale translation
      # through — the Chinese file is generated by the same run and goes stale
      # exactly as easily.
      - name: Ensure the generated READMEs are up to date
        run: |
          python scripts/build.py
          stale=0
          for f in README.md README.zh-CN.md; do
            if ! git diff --quiet "$f"; then
              echo "::error::$f is out of date. Run 'python scripts/build.py' and commit the result."
              git diff --stat "$f"
              stale=1
            fi
          done
          exit $stale

      # The site is a second rendering of the same data, so it is checked here
      # too — a change that breaks it should fail this run, not the deploy. This
      # also exercises build_site.py's canonical/CNAME self-check against the
      # origin configured in site.config.yml. site/ is git-ignored, so there is
      # nothing to diff afterwards.
      - name: Build the site
        run: python scripts/build_site.py

      # The search core is plain JS with no dependencies, so testing it needs
      # only Node — no npm install, nothing to flake. It runs last because it
      # reads the payloads the previous step generated (site/ is git-ignored, so
      # this is the only point at which they exist).
      #
      # tests/test_site_dom.js drives the real pages in jsdom (lineage
      # pointer-capture rule, graph slice fallback, drawer). It needs
      # jsdom from npm, installed into a scratch prefix below so the
      # checkout itself stays dependency-free.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test the search core
        run: node tests/test_search.js

      # Structured data and the changelog page, read from the same build.
      # Plain Node, no packages.
      - name: Test structured data and the changelog page
        run: node tests/test_seo.js

      # The rendered pages, driven in jsdom. jsdom goes to a scratch
      # prefix, never the checkout, so no package files pollute the repo.
      - name: Test the rendered pages (jsdom)
        run: |
          npm install --prefix /tmp/ct-dom-test jsdom
          NODE_PATH=/tmp/ct-dom-test/node_modules node tests/test_site_dom.js
