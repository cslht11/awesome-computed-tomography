name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repository, so grant nothing else: a compromised or
# misused dependency in the build chain then has no token worth stealing.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data files
        run: python scripts/build.py --check

      # build.py with no arguments renders *every* language, so both files have
      # to be checked. Checking only README.md would let a stale translation
      # through — the Chinese file is generated by the same run and goes stale
      # exactly as easily.
      - name: Ensure the generated READMEs are up to date
        run: |
          python scripts/build.py
          stale=0
          for f in README.md README.zh-CN.md; do
            if ! git diff --quiet "$f"; then
              echo "::error::$f is out of date. Run 'python scripts/build.py' and commit the result."
              git diff --stat "$f"
              stale=1
            fi
          done
          exit $stale

      # The site is a second rendering of the same data, so it is checked here
      # too — a change that breaks it should fail this run, not the deploy. This
      # also exercises build_site.py's canonical/CNAME self-check against the
      # origin configured in site.config.yml. site/ is git-ignored, so there is
      # nothing to diff afterwards.
      - name: Build the site
        run: python scripts/build_site.py

      # The search core is plain JS with no dependencies, so testing it needs
      # only Node — no npm install, nothing to flake. It runs last because it
      # reads the payloads the previous step generated (site/ is git-ignored, so
      # this is the only point at which they exist).
      #
      # tests/test_site_dom.js, which drives the real pages in jsdom, is
      # deliberately NOT here: it needs jsdom from npm, and a job that can go red
      # because a registry was unreachable teaches people to ignore red. It is a
      # pre-push check instead; tests/README.md says how to run it.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test the search core
        run: node tests/test_search.js

      # Structured data and the changelog page, read from the same build.
      # Plain Node, no packages.
      - name: Test structured data and the changelog page
        run: node tests/test_seo.js
