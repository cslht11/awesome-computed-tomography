blank_issues_enabled: false
contact_links:
  # GitHub only accepts http(s) here — a `mailto:` URL fails schema validation
  # and the whole link is dropped silently, so this points at the contact page
  # (which publishes the same address) instead.
  - name: Contact the maintainers
    url: https://computedtomography.org/contact/
    about: For anything that is not a new entry or a broken link.
