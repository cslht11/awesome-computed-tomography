# Keep the pinned GitHub Actions and the one Python dependency current.
#
# The repo has no application dependencies by design (the build is stdlib +
# PyYAML), so this file is short on purpose: action majors drift fastest, and a
# pinned runner action is the usual reason a working workflow suddenly fails.
#
# Grouped into one pull request per ecosystem per week: ungrouped, a bump to
# actions/checkout alone would open a PR, and this repository does not take
# pull requests from anyone but a maintainer — a stream of them would be noise.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
