<!-- The intro block at the top of the homepage and of /graph/ (both are
     sections of the same nav row, so they open the same way). Filled with
     the homepage's placeholders by scripts/build_site.py. -->
  <section class="hero">
    <div class="hero-art"><svg class="gantry" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="32" r="19" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 3"/><g stroke="currentColor" stroke-opacity=".6" stroke-width="2"><line x1="32" y1="5" x2="14" y2="52"/><line x1="32" y1="5" x2="32" y2="59"/><line x1="32" y1="5" x2="50" y2="52"/></g><circle cx="32" cy="5" r="4" fill="currentColor"/><ellipse cx="32" cy="34" rx="9" ry="11" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="2"/></svg></div>
    <h1 class="hero-title">{{TITLE}}</h1>
    <p class="lead">{{UI_HERO_LEAD}}</p>
    <dl class="stats">
      <div><dt>{{UI_TAB_PAPERS}}</dt><dd>{{N_PAPERS}}</dd></div>
      <div><dt>{{UI_TAB_TOOLKITS}}</dt><dd>{{N_TOOLKITS}}</dd></div>
      <div><dt>{{UI_TAB_DATASETS}}</dt><dd>{{N_DATASETS}}</dd></div>
      <div><dt>{{UI_TAB_BENCHMARKS}}</dt><dd>{{N_BENCHMARKS}}</dd></div>
      <div><dt>{{UI_TAB_LEARNING}}</dt><dd>{{N_LEARNING}}</dd></div>
      <div><dt>{{UI_STAT_LABEL_YEARS}}</dt><dd>{{UPDATED}}</dd></div>
    </dl>
  </section>
