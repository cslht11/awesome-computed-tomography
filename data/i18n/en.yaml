# English interface strings and README prose.
#
# This file is the source of truth for everything that is *not* in data/*.yaml:
# the wording of the site chrome and the prose that scripts/build.py writes into
# the README. It exists so that a translation can replace any single string
# without a template carrying hard-coded English.
#
# Other languages live beside it as data/i18n/<code>.yaml and only carry the
# keys they have actually translated; anything missing falls back to the value
# here. See scripts/i18n.py.
#
# Conventions
#   ui.*      plain text, HTML-escaped on the way out. Used by web/index.html
#             (via {{UI_*}} placeholders) and by web/app.js (via payload.ui).
#   ui.* with a name in scripts/build_site.py's RAW_UI set is inserted verbatim
#             and may contain HTML, e.g. the <kbd> in `pressSlash`.
#   ui.* with a name in MD_UI is rendered as inline Markdown, so it may contain
#             `code`, **bold** and [links](url). Absolute http(s) links are
#             given target="_blank" rel="noopener".
#   readme.*  Markdown, written into the README as-is, except that {placeholders}
#             are filled from the data counts first.
#
# Placeholders available in both: {papers} {peer} {peer_pct} {preprints}
# {toolkits} {datasets} {benchmarks} {learning} {updated} {year_min} {year_max}
# {title} {tagline} {repo} {repo_url} {build_date} {code_license}
# {code_license_url} {content_license} {content_license_url} {license_year}

lang: en

tagline: "A curated, verified list of CT reconstruction research"
# {papers} / {toolkits} / {updated} and friends are filled in at build time —
# never write a count out here, it is stale the moment a paper is added.
description: >-
  A curated list of computed tomography (CT / CBCT / micro-CT) reconstruction
  resources: {papers} papers (updated {updated}), {toolkits} toolkits,
  {datasets} datasets, {benchmarks} benchmarks and {learning} learning
  resources, covering sparse-view, limited-angle, low-dose, metal-artifact,
  spectral, cone-beam and 4D/dynamic CT.

# <meta name="keywords"> on the website. Search engines effectively ignore this
# tag, so it is kept short on purpose: roughly one term per direction the list
# actually covers, mirroring the topic ids in meta.yaml. GitHub does not read it
# either — being findable there comes from the repository description and the
# topic list, not from a keyword dump.
keywords: >-
  computed tomography, CT reconstruction, tomographic reconstruction,
  sparse-view CT, limited-angle tomography, low-dose CT,
  metal artifact reduction, cone-beam CT, CBCT, spectral CT,
  photon-counting CT, scatter correction, dynamic and 4D CT,
  filtered back projection, iterative reconstruction, Radon transform,
  deep unrolling, diffusion models, implicit neural representations,
  Gaussian splatting, awesome list

