# ---------------------------------------------------------------- pages
# Bodies of the static pages under web/pages/. Kept here rather than in the
# template so a translation can replace a whole page, and so build_site.py
# can warn when web/pages/ and this file disagree.
pages:
  about: |-
    <p class="kicker">About</p>
    <h1>About this list</h1>
    <p class="lede">Awesome Computed Tomography is an independent, hand-curated map of research on CT image reconstruction: the papers, open-source toolkits, datasets, benchmarks and learning material a researcher needs to find their way into the field, kept in one place and checked by hand.</p>

    <h2>What it covers</h2>
    <p>The list currently holds {{N_PAPERS}} papers from {{YEAR_MIN}} to {{YEAR_MAX}}, {{N_TOOLKITS}} toolkits, {{N_DATASETS}} datasets, {{N_BENCHMARKS}} benchmarks and {{N_LEARNING}} learning resources. Papers are grouped by problem (sparse-view, limited-angle, low-dose, metal artifacts, spectral, cone-beam, dynamic and 4D CT, scatter, calibration and motion) and by method family (classical and iterative solvers, deep unrolling, self-supervised methods, diffusion and generative priors, implicit neural representations, Gaussian splatting).</p>
    <p>It is a reading list, not a database of everything. An entry is included because it is useful to someone working on CT reconstruction: a method people build on, a strong baseline, a dataset or benchmark that results are reported on, or a clear introduction.</p>

    <h2>How entries are verified</h2>
    <ul>
      <li><strong>Identity.</strong> Every paper link is resolved against Crossref, arXiv or the publisher’s own record, and the title is matched against that record, so an entry cannot quietly point at a different paper.</li>
      <li><strong>Venue.</strong> {{N_PEER}} papers ({{PEER_PCT}}%) carry a peer-reviewed venue, confirmed from the DOI rather than from search results. The other {{N_PREPRINT}} are marked <em>preprint</em> and dated by their first public posting.</li>
      <li><strong>Links.</strong> Every URL is checked. Code links point at the authors’ own repositories where they exist.</li>
    </ul>
    <p>Checks catch broken links and mismatched records, not every mistake. A venue, a year or a category can still be wrong. If a detail matters for your work, follow the link and rely on the original paper.</p>

    <h2>What it is not</h2>
    <p>An entry is a pointer to someone else’s work, never a copy of it. Titles, venues and links are facts about papers that belong to their authors and publishers; inclusion is not an endorsement by them, and is not a claim that results have been reproduced here. Nothing on this site is medical advice.</p>

    <h2>Maintenance</h2>
    <p>The list is curated and maintained by its authors and updated continuously, with new arXiv papers, corrected venues and repaired links. It does not accept outside pull requests. Suggestions and corrections are welcome through the <a href="{{ROOT}}contact/">contact page</a>, and each one is checked before anything is added.</p>
    <p>The same data is published as the <a href="{{REPO_URL}}" target="_blank" rel="noopener">GitHub README</a> and as <a href="{{ROOT}}data.json">data.json</a>. Both are generated from the same source files, so they never disagree with this site.</p>

    <h2>Licence and reuse</h2>
    <p>The content (the curated records, the README and the rendered pages) is licensed under <a href="{{CONTENT_LICENSE_URL}}" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>:</p>
    <ul>
      <li><strong>Attribution.</strong> Credit “Awesome Computed Tomography” and link to computedtomography.org.</li>
      <li><strong>NonCommercial.</strong> No commercial use. For commercial use, email <a href="mailto:heitieya@163.com">heitieya@163.com</a> first.</li>
      <li><strong>ShareAlike.</strong> If you adapt the list, share your version under the same licence.</li>
    </ul>
    <p>The site’s code is MIT. Licence columns in the toolkit and dataset tables describe those projects, not this list.</p>

    <h2>Citing</h2>
    <p>The list changes continuously, so cite a fixed snapshot: the repository URL together with a commit hash, or the page URL with the date you accessed it.</p>

  contact: |-
    <p class="kicker">Contact</p>
    <h1>Contact</h1>
    <p class="lede">Corrections and suggestions make the list better. Public feedback goes through GitHub Issues; anything private goes by email.</p>

    <div class="cards">
      <a class="card" href="{{REPO_URL}}/issues/new/choose" target="_blank" rel="noopener">
        <span class="card-k">Public</span>
        <span class="card-t">GitHub Issues</span>
        <span class="card-d">Suggest a paper, report a wrong venue or a broken link. Needs a GitHub account.</span>
      </a>
      <a class="card" href="mailto:heitieya@163.com">
        <span class="card-k">Private</span>
        <span class="card-t">heitieya@163.com</span>
        <span class="card-d">Copyright, attribution, removal requests, commercial licensing, anything not for a public thread.</span>
      </a>
    </div>

    <h2>Suggesting a paper</h2>
    <p>Send the DOI or arXiv link, and say where it belongs: the problem it addresses (for example sparse-view or metal artifacts) and, if there is one, the code repository. Every suggestion is verified against Crossref or arXiv before it is added, so you don’t need to write anything else.</p>

    <h2>Reporting an error</h2>
    <ul>
      <li>The entry’s title, and the section or page it appears on.</li>
      <li>What is wrong: the venue, the year, a link, or the category.</li>
      <li>The evidence: a DOI, the publisher’s page, or the arXiv record.</li>
    </ul>
    <p>For a website problem (search, navigation, display on a phone), give the page address, what you did, what you expected and what happened, and your browser and device.</p>

    <h2>Authors</h2>
    <p>If your paper is listed and a detail is wrong, or you would like it added, removed or moved to another topic, open an issue or email. Requests from authors are handled first.</p>

    <h2>What to expect</h2>
    <p>Feedback is checked against the original sources. A suggestion may not be adopted, and there is no fixed reply time. You will never be asked for a password, a verification code or payment details. Please don’t post private material in a public issue.</p>

  privacy: |-
    <p class="kicker">Privacy</p>
    <h1>Privacy policy</h1>
    <p class="lede">Last updated 12 October 2026. This policy covers https://computedtomography.org/, a personal, non-commercial project maintained by its authors.</p>

    <h2>In short</h2>
    <p>There are no accounts, no advertising and no cookies set by this site. The only outside script is Cloudflare Web Analytics, which counts visits without cookies and without identifying you. Reading it requires nothing from you.</p>

    <h2>Hosting</h2>
    <p>The site is static and is hosted by <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">GitHub Pages</a>; the domain’s DNS is managed by <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener">Cloudflare</a>. Like any web server, GitHub receives the technical details of each request (IP address, browser, the page requested and the time) and may keep them in its logs under its own policy. This site does not receive or keep those logs.</p>

    <h2>Analytics</h2>
    <p>The site uses <a href="https://www.cloudflare.com/web-analytics/" target="_blank" rel="noopener">Cloudflare Web Analytics</a> to count page views and see which pages and referring sites are read. It sets no cookies, uses no local storage and does not fingerprint your browser. Cloudflare receives the page address, referrer, browser type and timing of each visit and handles them under its <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener">privacy policy</a>. We see only aggregate numbers, never individual visitors. There are no advertising or social-media scripts.</p>

    <h2>Storage in your browser</h2>
    <p>Your light or dark theme choice is saved in your browser’s local storage under the key <code>ct-theme</code>, so the site remembers it on your next visit. It never leaves your device. You can clear it with your browser’s site-data settings.</p>

    <h2>Search</h2>
    <p>Search and filters run entirely in your browser against a copy of the list loaded with the page; queries are not sent anywhere. Filters you apply are written into the address bar (for example <code>?q=diffusion</code>) so that a view can be shared, which means they can appear in your browser history.</p>

    <h2>External links</h2>
    <p>Entries link to publishers, arXiv, GitHub and other sites. Once you follow a link, that site’s own privacy policy applies.</p>

    <h2>Email</h2>
    <p>If you write to <a href="mailto:heitieya@163.com">heitieya@163.com</a>, the message and your address are used only to handle your request. Ordinary messages are deleted at most 12 months after the matter is closed. Please send only what is needed, and never a password, a verification code or payment details. GitHub Issues are public and governed by GitHub’s terms.</p>

    <h2>Your rights</h2>
    <p>Depending on where you live, you may have the right to access, correct or delete personal information about you, and to complain to a data-protection authority. Email <a href="mailto:heitieya@163.com">heitieya@163.com</a> to make a request. For data held by GitHub or Cloudflare, you may need to contact them directly.</p>

    <h2>Changes</h2>
    <p>When this policy changes, the date at the top of this page changes with it.</p>
