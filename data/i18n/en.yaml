readme:
  blurb: >-
    Sparse-view, limited-angle, low-dose, metal-artifact, spectral, cone-beam
    and 4D CT — from FBP and iterative solvers to unrolled networks, diffusion
    priors, neural fields and Gaussian splatting. Every paper link is resolved
    against Crossref, arXiv or the publisher's record. For search and filters,
    use the **[website]({site_url})**.
  coverage: >-
    Coverage: {papers} papers (updated {updated}), {toolkits} toolkits, {datasets} datasets,
    {benchmarks} benchmarks/challenges, {learning} learning resources. Every paper link
    was resolved against Crossref, arXiv or the publisher's own record, and every URL was checked.
  browseCollection: "[Browse all {n} entries on the website]({url})"
  papersHeading: "Papers"
  # The JSON-LD ItemList's `name` — the machine-readable title of the paper
  # collection, which needs to be more explicit than the section heading.
  legendPapers: >-
    Newest first within each topic. Each entry gives its venue and year in
    italics; _preprint_ marks work not (yet) published at a peer-reviewed venue,
    dated by its first public posting.
  toolkitsHeading: "Toolkits"
  datasetsHeading: "Datasets"
  legendDatasets: >-
    **Data** says what a release contains: _proj + image_ has raw projections and
    a reference volume, so a forward model can be scored end to end;
    _projections_ has raw data only; _image_ is image-domain only and cannot test
    a projection model.
  benchmarksHeading: "Benchmarks"
  learningHeading: "Learning"
  licenseHeading: "License"
  # ---- hero / navigation
  heroTagline: >-
    **A curated, verified list of CT reconstruction research** — papers, toolkits,
    datasets and benchmarks for CT, CBCT and micro-CT.
  navWebsite: "Website"
  badgeWebsite: "website"
  badgePapers: "papers"
  badgeLicense: "license"

