# ---------------------------------------------------------------- pages
# Bodies of the static pages under web/pages/. Kept here rather than in the
# template so a translation can replace a whole page, and so build_site.py
# can warn when web/pages/ and this file disagree.
pages:
  about: |-
    <p class="kicker">About</p>
    <h1>About this list</h1>
    <p class="lede">Awesome Computed Tomography is an independent, hand-curated map of research on CT image reconstruction: the papers, open-source toolkits, datasets, benchmarks and learning material a researcher needs to find their way into the field, kept in one place and checked by hand.</p>

    <h2>What it covers</h2>
    <p>The list currently holds {{N_PAPERS}} papers from {{YEAR_MIN}} to {{YEAR_MAX}}, {{N_TOOLKITS}} toolkits, {{N_DATASETS}} datasets, {{N_BENCHMARKS}} benchmarks and {{N_LEARNING}} learning resources. Papers are grouped by problem (sparse-view, limited-angle, low-dose, metal artifacts, spectral, cone-beam, dynamic and 4D CT, scatter, calibration and motion) and by method family (classical and iterative solvers, deep unrolling, self-supervised methods, diffusion and generative priors, implicit neural representations, Gaussian splatting).</p>
    <p>It is a reading list, not a database of everything. An entry is included because it is useful to someone working on CT reconstruction: a method people build on, a strong baseline, a dataset or benchmark that results are reported on, or a clear introduction.</p>

    <h2>How entries are verified</h2>
    <ul>
      <li><strong>Identity.</strong> Every paper link is resolved against Crossref, arXiv or the publisher’s own record, and the title is matched against that record, so an entry cannot quietly point at a different paper.</li>
      <li><strong>Venue.</strong> Paper venues are confirmed from the DOI rather than from search results. Papers without a peer-reviewed venue are marked <em>preprint</em> and dated by their first public posting.</li>
      <li><strong>Links.</strong> Every URL is checked, and an automated check reruns every week. Code links point at the authors’ own repositories where they exist.</li>
    </ul>
    <p>Checks catch broken links and mismatched records, not every mistake. A venue, a year or a category can still be wrong. If a detail matters for your work, follow the link and rely on the original paper.</p>

    <h2>What it is not</h2>
    <p>An entry is a pointer to someone else’s work. The one-line summary that appears when you point at a paper’s title is there to help you decide whether the paper is worth opening; many of those summaries quote the paper’s own abstract, and quoted text stays its authors’ and publishers’ — it is not covered by this site’s licence. Titles, venues and links are facts about papers that belong to their authors and publishers; inclusion is not an endorsement by them, and is not a claim that results have been reproduced here. Nothing on this site is medical advice.</p>

    <h2>Maintenance</h2>
    <p>The list is curated and maintained by <a href="https://github.com/cslht11" target="_blank" rel="noopener">cslht11</a> and updated continuously, with new arXiv papers, corrected venues and repaired links. It does not accept outside pull requests. Suggestions and corrections are welcome through the <a href="{{ROOT}}contact/">contact page</a>, and each one is checked before anything is added. Every change is recorded, dated, in the <a href="{{ROOT}}changelog/">changelog</a>.</p>
    <p>The same data is published as the <a href="{{REPO_URL}}" target="_blank" rel="noopener">GitHub README</a> and as <a href="{{ROOT}}data.json">data.json</a>. Both are generated from the same source files, so they never disagree with this site.</p>

    <h2>Licence and reuse</h2>
    <p>The content (the curated records, the README and the rendered pages) is licensed under <a href="{{CONTENT_LICENSE_URL}}" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>:</p>
    <ul>
      <li><strong>Attribution.</strong> Credit “Awesome Computed Tomography” and link to computedtomography.org.</li>
      <li><strong>NonCommercial.</strong> No commercial use. For commercial use, email <a href="mailto:heitieya@163.com">heitieya@163.com</a> first.</li>
      <li><strong>ShareAlike.</strong> If you adapt the list, share your version under the same licence.</li>
    </ul>
    <p>The site’s code is MIT. Licence columns in the toolkit and dataset tables describe those projects, not this list.</p>

    <h2>Citing</h2>
    <p>The list changes continuously, so cite a fixed snapshot: the repository URL together with a commit hash, or the page URL with the date you accessed it.</p>

    <h2 id="topics">Browse by topic</h2>
    <p>Each topic has its own page with a short introduction, a start-here reading list, its newest papers and the datasets and toolkits that go with them.</p>
    {{TOPIC_LINKS}}

    <h2 id="datasets-guides">Datasets, benchmarks and guides</h2>
    <p>The datasets and benchmarks used in CT reconstruction research have pages of their own, with the data each one ships, its licence and the papers in the directory that use it. The guides answer common questions, such as which dataset to start with, from the same verified records.</p>
    {{GUIDE_LINKS}}

    <h2 id="faq">Frequently asked questions</h2>
    <section class="faq">
    <h3>Which datasets are best for sparse-view CT?</h3>
    <p>The most widely used are LoDoPaB-CT and the Mayo Clinic LDCT-and-Projection-data, from which sparse sinograms are simulated, and the AAPM DL-Sparse-View CT challenge data, which isolates the sparse-view problem with noiseless 128-view sinograms. For measured rather than simulated data, use 2DeteCT, the FleX-ray walnut collection or SparseBeads. The <a href="{{ROOT}}topics/sparse-view/">sparse-view CT topic page</a> lists them next to the key papers, and the <a href="{{ROOT}}?tab=datasets">dataset table</a> has all {{N_DATASETS}} datasets.</p>
    <h3>Which open-source toolkits are used for low-dose CT research?</h3>
    <p>For reconstruction, the ASTRA Toolbox, TIGRE, ODL and the Core Imaging Library (CIL) provide projectors and iterative solvers, and DeepInverse and LION add learned and unrolled methods in PyTorch. To create realistic low-dose data from full-dose images, use the LD-CT simulator. See the <a href="{{ROOT}}topics/low-dose/">low-dose CT topic page</a> and the <a href="{{ROOT}}?tab=toolkits">toolkit table</a>.</p>
    <h3>How are entries verified?</h3>
    <p>Every paper link is resolved against Crossref, arXiv or the publisher’s own record and the title is matched against that record, and every URL is checked. Venues are confirmed from the DOI, and papers without a peer-reviewed venue are marked as preprints. The checks catch broken links and mismatched records, not every mistake, so rely on the original paper for any detail that matters.</p>
    <h3>How often is the list updated?</h3>
    <p>The list is updated continuously, and the last content update was on {{UPDATED}}. New papers, corrected venues and repaired links are added as they are checked, and the README, data.json and this site are regenerated from the same source files on every change.</p>
    <h3>How should I cite this list?</h3>
    <p>Cite a fixed snapshot, because the list changes continuously: the repository URL ({{REPO_URL}}) with a commit hash, or the page URL with the date you accessed it. To cite a method you found here, cite the original paper instead.</p>
    <h3>How can I suggest a paper or report a mistake?</h3>
    <p>Open a GitHub issue or send an email, as described on the <a href="{{ROOT}}contact/">contact page</a>. For a paper, send its DOI or arXiv link and, if there is one, its code repository and the <a href="#topics">topic</a> it belongs to. The list does not accept outside pull requests, and every suggestion is checked before anything is added.</p>
    </section>

  contact: |-
    <p class="kicker">Contact</p>
    <h1>Contact</h1>
    <p class="lede">Corrections and suggestions make the list better. Public feedback goes through GitHub Issues; anything private goes by email.</p>

    <div class="cards">
      <a class="card" href="{{REPO_URL}}/issues/new/choose" target="_blank" rel="noopener">
        <span class="card-k">Public</span>
        <span class="card-t">GitHub Issues</span>
        <span class="card-d">Suggest a paper, report a wrong venue or a broken link. Needs a GitHub account.</span>
