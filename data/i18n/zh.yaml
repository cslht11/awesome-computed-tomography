# 中文译文覆盖层（简体）。
#
# 这个文件**不替换**英文源，而是叠加在它之上：任何没有列在这里的键都会自动回落到
# data/i18n/en.yaml 与 data/*.yaml 里的英文原文。因此漏翻不会把页面弄坏，只会
# 让那一句保持英文——build.py 会打印每种语言还缺多少条，缺口是可见的而不是静默的。
#
# 键的写法：
#   ui.*      界面文案，键名见 data/i18n/en.yaml
#   readme.*  写进 README 的散文（Markdown，可用 {占位符}）
#   topics.*  以 data/meta.yaml 里的主题 id 为键
#   toolkits./datasets./benchmarks./learning.*  以该行的 name 为键
#
# 注意：这里的键必须能在英文源里找到对应项。指向已改名或已删除条目的"孤儿键"
# 会让构建失败（见 scripts/i18n.py 的 check），因为那种译文只会静默失效。
#
# ★ 中文段落一律写在一行内，不要为了好看折行。YAML 的折叠标量（>-）会把行尾换行
#   折成一个空格，英文折行后正好当空格用，但中文句子中间凭空多一个空格就是硬伤
#   （"34 个数据集、 19 个基准"）。长行不好看，但对中文是唯一正确的写法。
#
# 状态：全文已译——界面文案、17 个主题、README 散文与四条表格的说明（共 134 条）
# 均已译出；将来新增条目若暂无译文会回落英文，build.py 会报告缺口。

lang: zh-Hans

tagline: "经过核验的 CT 重建研究精选列表"
# {papers} / {toolkits} / {updated} 等在构建时填入——这里不要写死数字，
# 加一篇论文就会变陈旧。
description: >-
  计算机断层成像（CT / CBCT / 显微 CT）重建资源精选列表：{papers} 篇论文（更新于 {updated}）、{toolkits} 个工具包、{datasets} 个数据集、{benchmarks} 个基准与挑战赛、{learning} 项学习资源，覆盖稀疏视角、有限角、低剂量、金属伪影、能谱、锥束与 4D/动态 CT。
# 网站 <meta name="keywords">。搜索引擎基本忽略这个标签，所以刻意写短：
# 一个术语对应一个实际覆盖的方向，与 meta.yaml 里的主题 id 对齐。GitHub 也不读它，
# 那里的可发现性来自仓库 description 和 topics，不是靠堆关键词。
keywords: >-
  计算机断层成像, CT 重建, 断层重建, 稀疏视角 CT, 有限角层析, 低剂量 CT,
  金属伪影校正, 锥束 CT, CBCT, 能谱 CT, 光子计数 CT, 散射校正, 动态与 4D CT,
  滤波反投影, 迭代重建, Radon 变换, 深度展开, 扩散模型, 隐式神经表示,
  高斯溅射, 精选列表

