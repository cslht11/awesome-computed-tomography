  licenseShareAlike: "**相同方式共享**：改编作品须以相同许可发布。"
  licenseCodeColumn: "代码（`scripts/`、`web/`、`.github/`、`assets/`、`site.config.yml`）采用 [MIT](LICENSE) 许可，其中构建时复制进 `site/` 的前端脚本同样属于 MIT。表格中的许可列描述的是**那些项目自身**而非本列表；每条条目都只是指向论文的链接，从不复制论文内容。"

# ----------------------------------------------------------------- 主题（17 个）
topics:
  survey:
    name: 综述与回顾
    desc: 概述性论文、教程与对比研究。
  classical:
    name: 经典与迭代重建
    desc: 解析法（FBP/FDK）与迭代法（SART/SIRT/CGLS），以及手工设计的正则项（TV、TGV、非局部）。
  sparse-view:
    name: 稀疏视角 CT
    desc: 投影角度数量不足时的重建。
  limited-angle:
    name: 有限角层析
    desc: 角度楔形缺失，零空间使问题严重病态。
  low-dose:
    name: 低剂量 CT 去噪
    desc: 管电流降低带来的噪声抑制，可在图像域、投影域或双域进行。
  metal-artifact:
    name: 金属伪影校正
    desc: 高密度植入物引起的射束硬化、光子饥饿与散射。
  spectral:
    name: 能谱与双能 CT
    desc: 多能采集、物质分解与光子计数 CT。
  cbct:
    name: 锥束 CT
    desc: 圆周、螺旋与非标准 CBCT 几何；机载成像。
  dynamic:
    name: 动态与 4D CT
    desc: 时间分辨重建、运动建模、灌注与心脏 CT。
  scatter:
    name: 散射校正
    desc: 散射的估计与去除，涵盖硬件与软件两类方法。
  geometry:
    name: 几何标定与运动补偿
    desc: 几何自标定、无标记配准、刚性与非刚性运动校正。
  unrolling:
    name: 深度展开与基于模型的学习
    desc: 把经典求解器展开成网络的学习型迭代方案，可带或不带数据一致性约束。
  self-supervised:
    name: 自监督与免训练方法
    desc: 无需成对数据的训练——深度图像先验、noise2noise 类方法、无监督正则。
  diffusion:
    name: 扩散与生成式先验
    desc: 把分数模型、扩散模型以及其他学习型生成先验用作层析反演的先验或采样器。
  inr:
    name: 隐式神经表示
    desc: 用坐标网络（INR / NeRF）直接表示待求的体数据本身。
  gaussian:
    name: 高斯溅射
    desc: 以显式高斯基元作为可微的层析表示。
  other:
    name: 其他主题
    desc: 工业无损检测、相位衬度、定量 CT、重建软件，以及不属于以上各类的工作。
  related:
    name: 相关工作：重建之外
    desc: CT 基础模型、分析与生成模型，跨成像模态的一体化图像复原，以及重建工作所依赖的通用网络。仅作背景参考，不属于重建范畴。
# ------------------------------------------------------------------ 论文条目
# Per-paper overrides, keyed by the paper's `id`. Same mechanism as the
# toolkits/datasets/benchmarks/learning tables below: what is listed here wins,
# anything missing falls back to the English text in data/papers.yaml.
papers:
  "tamp":
    note: "多尺度集成 Transformer 放大器（TAMP）。在 1,080 万张物理驱动的仿真非理想测量 CT 图像上预训练，之后用参数高效微调、仅凭少量切片即可适配某一具体协议——同一个骨干同时覆盖低剂量、稀疏视角与有限角三类退化。"
  "deepsparse":
    note: "DiCE（双维跨尺度嵌入）由 HyViP（混合视角采样预训练）在稀疏视角与密集视角投影上共同预训练，再经两步微调适配新数据集。作者称其为首个面向稀疏视角 CBCT 重建的基础模型。"
  "lctfound":
    note: "在 105,184 例多中心肺部 CT 上做扩散式预训练，并联合编码影像与临床信息。覆盖八项下游任务，其中与重建相关的是 CT 增强与稀疏视角重建。"
  "radon-1917":
    note: "定义了 Radon 变换的论文——本列表中所有解析方法（FBP、FDK、傅里叶切片定理）所要反演的正是这个前向算子，它比第一台 CT 扫描仪早了 54 年。原文发表于莱比锡科学院报告第 69 卷 262–277 页；这里的链接是 P. C. Parks 的英译本《On the determination of functions from their integral values along certain manifolds》，IEEE Transactions on Medical Imaging 5(4):170–176, 1986。"
  "splat-based-metal-artifact-reduction-in-cone-beam-ct-via-com":
    note: "会议论文（CVPR 2026），提出紧凑的逐高斯衰减参数化。同一课题组的 CGF 45(2) 2026 期刊论文为其扩展版。两篇均经同行评审，故一并收录。"
  "splat-based-metal-artifact-reduction-in-cone-beam-ct-via-pol":
    note: "期刊论文（Computer Graphics Forum 45(2), 2026）。在同一课题组的 CVPR 2026 会议论文基础上，增加了光谱联合自标定、系统响应建模，并公开发布一套合成 CBCT 数据集。两篇均经同行评审，故一并收录。"

# ------------------------------------------------------------------ 工具包
toolkits:
  "TIGRE":
    note: "GPU 加速（CUDA）的锥束与平行束 CT 工具箱；提供 FDK、SART、SIRT、CGLS 及 TV 变体。"
  "ASTRA Toolbox":
    note: "历史悠久的研究型工具箱，投影算子与算法覆盖面很广；CPU/GPU 上的参照基线。"
  "tomosipo":
    note: "以极低的负担描述二维/三维投影几何；封装 ASTRA 并与 PyTorch 打通。"
  "ODL":
    note: "算子离散化库——以泛函分析的框架组织逆问题，内置 CT 几何。"
  "Core Imaging Library (CIL)":
    note: "CCPi 的变分 CT 重建框架，附有一整套优化算法目录。"
  "CCPi Regularisation Toolkit":
    note: "TV、TGV、方向性 TV 以及 CIL 所用其它正则项的 CPU/GPU 实现。"
  "LEAP":
    note: "LLNL 的 LivermorE AI Projector for Computed Tomography（LEAP）；面向三维透射 CT、达到生产级水准的基于模型迭代重建。"
  "svmbir":
    note: "快速的超体素模型迭代重建，支持近端映射插件。"
  "RTK":
    note: "构建在 ITK 之上的重建工具包；在临床 CBCT 与介入研究中广泛使用。"
  "PyTomography":
    note: "端到端的医学影像重建，带定量能力，包含基于 CT 的衰减校正。"
  "OMEGA":
    note: "开源的多维层析重建软件，覆盖 PET/SPECT/CT。"
  "TomoPy":
    note: "同步辐射显微/纳米层析的参照工具箱；gridrec、FBP 与相位恢复。"
  "RadIO":
    note: "面向肺结节流程的 CT 数据预处理与增广框架；名字虽如此，但其中并没有 Radon 变换或 FBP。"
  "pySART":
    note: "联立代数重建技术（SART）的精简参照实现。"
  "libcbct":
    note: "轻量锥束 CT 重建库，含 FDK 与迭代求解器；采用非商业许可。"
  "tofu":
    note: "架在 UFO 框架之上的辅助层，用于搭建快速 GPU 层析重建流程。"
  "sigpy":
    note: "面向迭代图像重建的信号处理包；近端算子与 NUFFT 原语。"
  "DeepInverse":
    note: "面向成像逆问题的 PyTorch 库——物理算子、学习型去噪器、展开网络与基准测试。"
  "torch-radon":
    note: "PyTorch 中的可微分 Radon 变换与滤波反投影。"
  "LION":
    note: "学习式迭代优化网络——基于 PyTorch 的展开式重建，用于 CT 与 PET。"
  "TomoPhantom":
    note: "解析式的二维/三维/四维体模生成，配合正投影，用于受控的重建实验。（学习资源一节亦收录。）"
  "xraylib":
    note: "X 射线与物质相互作用的截面、荧光产额与康普顿剖面；做真实仿真所需的物理层。"
  "pydicom":
    note: "读写 DICOM 文件——处理临床 CT 数据的标准入口。"
  "MONAI":
    note: "基于 PyTorch 的医学影像框架，提供 CT 重建相关的变换与预训练模型。"
  "tomviz":
    note: "跨平台应用，用于层析数据的可视化与处理。"
  "MIRT":
    note: "密歇根大学图像重建工具箱。涵盖极广的经典、统计与惩罚似然重建方法的参照实现；是长期存在的 MATLAB 版 MIRT 的 Julia 移植。"
  "IRtools":
    note: "迭代正则化工具——混合 Krylov 方法、Tikhonov、TV 与一般形式正则化，随包附带大规模层析测试问题。来自 Hansen 课题组。"
  "leehoy/CTReconstruction":
    note: "精简易读的 Python 与 MATLAB CT 重建代码。python/ 下已有 FBP 以及 ASD-POCS、SART、EM，但 README 仍把迭代重建列为“待补”。"
  "Algotom":
    note: "层析数据处理算法集——环状伪影与伪影去除、畸变校正、去噪、相位恢复与重建。为同步辐射光束线开发。"
  "Sarepy":
    note: "层析中环状伪影去除的数值方法——最完备的开源条纹/环状滤波器集合。"
  "DBT-Reconstruction":
    note: "数字乳腺层析（DBT）的开源重建工具箱，覆盖 DBT 特有几何，并提供 FBP 与迭代求解器。"
  "Discorpy":
    note: "亚像素级的相机与透镜畸变标定；用于在重建前校正探测器/几何畸变。"
  "Learned Primal-Dual":
    note: "学习式原始-对偶重建的参照实现——最典型的展开式原始-对偶方案，最初即用于 CT。"
  "Learned Gradient Tomography":
    note: "面向不适定层析的学习式梯度下降参照实现（Adler & Öktem）；后来许多展开式 CT 网络的源头。"
  "Physics-ArX":
    note: "基于物理的数据增强库，把真实的 CT/CBCT 噪声、散射与伪影模型注入既有图像，以构造成对训练数据。"
  "LD-CT simulator":
    note: "低剂量 CT 仿真器，用经过验证的噪声模型把高剂量图像转成逼真的低剂量对应图像。"
  "CBCT Scatter Correction Tool":
    note: "为数不多的锥束 CT 散射估计与校正工具之一；以预编译 Windows 可执行文件分发，仓库中无源码。"
  "3D Slicer":
    note: "医学影像计算领域最主要的开源平台；用于查看、分割与配准 CT 体数据，也可以以扩展模块的形式搭建重建流程原型。"
  "voxenra":
    note: "跨平台的 CT/MRI/PET-CT DICOM 阅片器，支持多平面重组、三维体绘制与融合——用来快速目检重建结果很顺手。"
  "PyLops":
    note: "线性算子库，含 Radon 变换与一整套求解器（CGLS、LSQR、TV、稀疏性促进）。不想自己写无矩阵算子时，做变分 CT 原型最干净的选择。"
  "mumott":
    note: "面向倒空间数据的张量层析重建，由丹麦技术大学（DTU）开发。专用而非通用，但它是张量层析模型最完整的开源实现。"
  "XrayPhysics":
    note: "X 射线截面、源能谱建模、多材料射束硬化校正与双能分解。出自 LEAP 的作者，需要物理上诚实的能谱时，它与仿真器天然配合。"
  "pyHST2":
    note: "ESRF 光束线的重建代码——gridrec、FBP 与迭代方法，带用于传播型相位衬度层析的相位恢复。同步辐射领域长期的主力工具。"
  "PFITRE":
    note: "感知融合迭代层析重建引擎——把承载感知知识的 CNN 作为正则项嵌入迭代求解器，用于校正 X 射线纳米层析中的有限角伪影。附演示、数据生成脚本与预训练权重（Google Drive）。出自布鲁克海文国家实验室（NSLS-II），发表于 npj Computational Materials 2025。"

# ------------------------------------------------------------------ 数据集
  "DIRECTT Reconstruction GUI":
    note: "基于 ASTRA 工具箱的 Python 图形界面，用于 X 射线 CT 数据重建，并内置 DIRECTT 算法。DIRECTT 面向的正是只有极少量投影、且扫描轨迹任意的情形，并把采集路径本身一并纳入反问题求解——多数基于算子的工具箱基本不涉及这个角度。由德国联邦材料研究与测试研究所（BAM）开发，发表于 Review of Scientific Instruments 2020；运行 Main.py 即可启动。虽属小众、星标很少，但明确处理轨迹问题的工具本就寥寥无几。"
  "CTrex":
    note: "面向研究的 GPU 迭代重建框架，把「投影—校正—反投影」整条流水线一路暴露到单个 CUDA 核，因此非理想采集效应可以直接写进算子本身，而不是事后作为校正外挂上去。几何以逐投影的齐次视图矩阵承载，使核函数与扫描路径解耦——圆轨、螺旋、偏移、传送带轨迹都支持，也覆盖运动与形变感知、事件型四维成像以及扩展视野等场景。主要针对非常规采集条件下的显微 CT。见 arXiv:2609.30166；论文未公布代码仓库，故本条暂指向预印本，待仓库公开后再改。"
  "MIRTorch":
    note: "基于 PyTorch 的可微分图像重建与优化工具箱，面向医学影像。"
  "xtomosim":
    note: "由 Giavanna Jadick 编写的 Python X 射线 CT 物理仿真器。"
  "Dual-Domain-CT-Denoising":
    note: "面向低剂量 CT 的双域深度学习去噪框架。"
  "diffct":
    note: "FAU（Maier 课题组）的可微分 CUDA CT 投影器：逐视角任意轨迹，对体积与采集几何均可自动微分，project/backproject 为严格共轭对，支持多 GPU 与多节点。技术报告 2026-10-14（doi:10.20944/preprints202605.1446.v2）。"
  "PYRO-NN":
    note: "Python Reconstruction Operators in Neural Networks（FAU Maier 课题组）：把 known-operator CT 投影器做成神经网络层，用于端到端学习式重建，支持扇束/锥束几何。"
  "X-Splat":
    note: "统一的高斯溅射框架，联合 RGB 与 X 射线做三维重建：各基元共享同一套几何，借助 X 射线几何代理实现跨模态配准。SIGGRAPH Asia 2026 论文的代码（论文一节亦收录）。"
datasets:
  "CT-RATE":
    note: "50,188 个重建完成的三维胸部 CT 体积（1,430 万张二维切片），来自 21,304 名患者的 25,692 次扫描；每个体积都配对一份影像科报告，并标注 18 类异常。体积由多种重建方法与窗宽窗位生成，因此天然带有重建差异——但只有图像域，不含原始投影。CT-CLIP 与 CT-CHAT 的训练语料。"
  "LoDoPaB-CT":
    note: "**Projection + image.** 42,895 对仿真人体胸腔切片（LIDC/IDRI），单一噪声水平（N0 = 4096）——其他剂量水平需自行重仿真。事实上的低剂量 CT 标准基准；附有调优良好的 FBP/U-Net 参考流程。"
  "LDCT-and-Projection-data":
    note: "**Projection + image.** Mayo Clinic 发布，经 TCIA 分发。299 例头部／胸部／腹部扫描（99 / 100 / 100），每例含一次常规剂量扫描外加一套仿真的降剂量投影——头部与腹部为常规剂量的 25%，胸部为 10%。胸部与腹部数据以 CC BY 4.0 开放；99 例头部扫描因可能重建出人脸，需按 NIH 受控访问流程申请。并以开放的 **DICOM-CT-PD** 格式提供原始正弦图。它源自 2016 年 AAPM 低剂量 CT 大挑战，目前是投影域方法最好的真实数据来源。"
  "2016 Low Dose CT Grand Challenge data":
    note: "**Projection + image.** 2016 年 AAPM–NIBIB–Mayo Clinic 低剂量 CT 大挑战的完整数据：30 例增强腹部 CT（10 例训练、20 例测试），含常规剂量与仿真的四分之一剂量数据；Mayo 与 AAPM 于 2021 年 9 月 21 日以与 TCIA 数据库相同的 **DICOM-CT-PD** 投影格式重新发布。20 例测试数据中有 13 例也收录在 LDCT-and-Projection-data 中，下载包内的 README 给出了病例编号的对应关系。2017 年以来多数低剂量 CT 论文所说的“Mayo 数据集”或“AAPM 数据集”指的就是它。"
  "2DeteCT":
    note: "**Projection + image.** 5,000 张真实实验采集的混合物体二维切片，三个剂量水平，多种源-探测器几何。非常适合做可复现的真实数据 CT 基准测试。"
  "Walnut-CBCT":
    note: "**Projection only.** 芬兰逆问题学会。真实采集的核桃锥束投影，提供多种角度采样——稀疏视角与有限角 CBCT 的标准测试床。"
  "Helsinki Tomography Challenge 2022":
    note: "**Projection only.** 体模与莲藕的真实有限角正弦图；配套挑战赛定义了标准的有限角协议。"
  "SPARE 4D-CBCT":
    note: "**Projection + image.** 用于呼吸运动分辨重建的胸部四维锥束 CT；动态 CBCT 的参照基准。"
  "ToothFairy2":
    note: "480 例牙科 CBCT 扫描，带三维牙齿与颌骨标注；规模可观，适合做 CBCT 域预训练。**Image domain only** — 只发布体数据，不带原始投影。"
  "Pancreatic-CT-CBCT-SEG":
    note: "**Image only.** 40 例胰腺癌放疗患者（MSKCC），每例含一次屏气计划 CT 与两次 kV CBCT 扫描——80 次 CBCT 中有 58 次为 200° 有限角采集——两类图像上都有专家勾画的危及器官轮廓。真实的配对 CT–CBCT 数据，可用于 CBCT 校正、配准与合成 CT 研究；只提供重建体，没有原始投影。"
  "LIDC-IDRI":
    note: "1,018 例胸部 CT，带四位放射科医师的结节标注。LoDoPaB-CT 与多数仿真低剂量数据所依据的解剖来源。"
  "DeepLesion":
    note: "覆盖 4,427 名患者、10,594 次检查的 32,735 处病灶标注——CT 域骨干网络的大规模预训练语料。"
  "LUNA16":
    note: "888 例薄层胸部 CT，统一重采样到 1 mm 并带结节标注；干净、整理得当的去噪/检测基准。"
  "KiTS23":
    note: "599 例腹部 CT（489 训练 + 110 测试），带肾肿瘤与囊肿标注，来自 KiTS23 一届。"
  "Pancreas-CT (NIH)":
    note: "82 例腹部增强 CT，带专家标注的胰腺掩膜；规模不大但使用极广的参照集。"
  "BTCV (Beyond the Cranial Vault)":
    note: "30 例腹部 CT，带 13 个器官标注；是多器官基准中 FLARE/AMOS 一脉的源头。"
  "TotalSegmentator":
    note: "1,228 例 CT、104 个解剖结构——规模最大的开源 CT 结构集，也是很强的预训练目标。"
  "AMOS22":
    note: "500 例 CT 加 100 例 MRI 腹部扫描、15 个器官；刻意采用异构设备，因此很考验鲁棒性。"
  "Medical Segmentation Decathlon":
    note: "十个任务，其中六个是 CT（肝、肺、胰腺、肝血管、脾、结肠）。被引用最多的多任务医学分割基准。"
  "VerSe":
    note: "355 例患者的 374 例多探测器 CT 脊柱扫描，提供椎体定位与实例分割标注（C1–L6，另含 T13 变异）。多厂商、多中心，且刻意拉开视野与病理差异——一个稳健的分割基准。"
  "RibFrac":
    note: "660 例 CT，带约 5,000 处肋骨骨折标注（420 训练 / 80 验证 / 160 评估）；常被用作 CT 辅助语料。"
  "CT-ORG":
    note: "140 例 CT，带多器官掩膜，其中含 Liver Tumor Segmentation 基准的一个子集。"
  "STOIC 2021":
    note: "2,000 例 COVID-19 胸部 CT（每名患者一例），是法国第一波疫情 10,735 名患者 STOIC 研究中公开的部分，用于重症结局预测；规模很大的真实临床分布偏移测试。通过 AWS Open Data 发布；其余患者的数据为 STOIC2021 挑战赛保留，未公开。"
  "MosMedData":
    note: "1,110 例胸部 CT，带 COVID-19 严重程度分级；常被复用为低质量/低剂量鲁棒性测试集。原站目前无法访问——Kaggle 镜像收录了同一批数据。"
  "HNSCC (Head & Neck)":
    note: "多机构的头颈部 CT，带 GTV/CTV 勾画；与 HECKTOR 挑战赛配套。"
  "CTPelvic1K":
    note: "跨 7 个子集的 1,184 例盆腔 CT；值得注意的是含**金属植入物**病例，是真实金属伪影的少数开放来源之一。"
  "FLARE22":
    note: "2,000 例腹部 CT、13 个器官标签，来自 20 余台设备；大规模鲁棒性基准。"
  "AutoPET-II":
    note: "1,014 例全身 PET/CT 检查，带病灶掩膜；当 CT 重建要喂给下游任务时相关。"
  "HECKTOR":
    note: "头颈部 PET/CT，带原发肿瘤勾画；五届标注口径一致。"
  "CT Lymph Nodes":
    note: "176 例腹部 CT，带纵隔与腹部淋巴结标注。"
  "NLST":
    note: "26,254 例基线低剂量筛查 CT——迄今最大的真实低剂量 CT 集合，但获取需要申请授权。"
  "AAPM DL-Sparse-View CT data":
    note: "**Projection + image.** 2021 年 AAPM DL-sparse-view CT 挑战赛数据：4,000 个仿真二维乳腺 CT 体模，每个配有 360° 理想无噪声 128 视角扇束正弦图及其 FBP 图像，另有 100 例测试。真值完全已知，可把稀疏视角逆问题与噪声、模型失配分开考察。"
  "Finnish Inverse Problems Society (FIPS) datasets":
    note: "**Projection only.** 一批真实测量的正弦图（核桃、莲藕、苹果、胡萝卜、体模），采集几何记录详尽——检验重建算子最干净的公开来源。"
  "LoDoPaB-CT (benchmark release paper)":
    note: "LoDoPaB-CT 数据集在 **Scientific Data** 上的数据描述论文——在该切分上报告结果时应引用的文献。记录了仿真协议与 FBP/U-Net 参照基线。"
  "COBRA2026: a large-scale multicenter pelvic cone-beam computed tomography projection dataset":
    note: "**Projection + image.** 来自六家欧洲中心的 867 例骨盆放疗 CBCT 扫描（Elekta 与 Varian 系统），含原始投影、采集几何、临床 CBCT 与计划 CT。约 950 GB，按 692/52/123 划分，以 CC BY-NC 4.0 发布于 Zenodo（doi:10.5281/zenodo.21322350）。也是 COBRA2026 重建挑战赛的数据基础。"
  "MORE: Multi-Organ Medical Image REconstruction Dataset":
    note: "覆盖 9 个解剖部位、15 类病灶的 CT 扫描，用途是检验模型对**未见解剖部位**的泛化能力，而非单一器官。以 CC BY-NC 4.0 发布；已被 ACM MM 2025 接收。"

  "TomoBank":
    note: "**Projection + image.** 由美国阿贡国家实验室 Advanced Photon Source 维护的层析数据仓库，收录大量实验采集与仿真的层析数据，覆盖多种仪器与样品类型。它的价值在于用真正来自光束线的数据来检验和比较重建方法，而不是只靠体模。"
  "SparseBeads":
    note: "**Projection + image.** 48 组真实采集的珠体体模扫描，图像稀疏程度被系统地拉开梯度，专为稀疏正则化重建的基准评测而发布。灵感来自 SophiaBeads，是在已知真值下横比不同正则项时的参照点。"
  "Walnut-21 (two dose levels)":
    note: "**Projection only.** 21 颗核桃的高分辨率锥束扫描，每颗都以两个辐射剂量水平各采一次——同一物体的一版「干净」与一版「带噪」。这种配对采集正是它的用处：噪声水平可以直接对照已知解剖结构来比较，而不是靠推测。"
  "Apple CT Data (simulated parallel-beam)":
    note: "**Projection + image.** 94 个带内部缺陷的苹果，三套仿真平行束数据（无噪、5% 高斯噪声、散射噪声）各 50 个角度，缺陷标注与真值重建分布在六个配套上传中。由真实锥束扫描仿真而来；本上传只含仿真数据。文档见 arXiv:2012.13346。"
  "Play-Doh + stones (CWI, 131 samples)":
    note: "**Projection + image.** 131 个黏土样本，每个插入 0–8 颗石子，各 1800 个投影覆盖 360°，另有平场与暗场图像；处理后的真值版本在 Zenodo 5681008。数据分五个 Zenodo 存档发布（此链接为第 1 部分）。专为有监督异物检测而构建。"
  "Deep-sea bamboo corals (µCT)":
    note: "**Image only.** 两种深海竹珊瑚（Acanella arbuscula 5 个标本；Keratoisis sp. 4 个标本）的重建 8 位 TIFF 栈，体素 15/50 µm；没有原始投影（只能向作者索取）。共 103.51 GB。文档见 Williams et al., Sci Data 2024。"

# ------------------------------------------------------- 基准与挑战赛
  "FleX-ray Walnut CBCT Collection (CWI)":
    note: "**Projection + image.** 42 个核桃，每个沿三条不同轨道各采集一次——因此可由合并视角算出无伪影的参考体，用作监督学习的真值。值得注意的是这并非又一个单一物体体模：其设计意图是同一类物体之间的自然变异。完整流水线一并给出——原始投影、扫描几何、预处理与重建脚本（均为开源软件）以及重建后的体数据，因而既可用于高锥角伪影抑制，也可用于稀疏角／有限角重建、超分辨与分割。数据分六个 Zenodo 存档发布，覆盖样本 1–42。"
  "LoDoInd":
    note: "同一批工业 CT 试件的五个剂量级别，其中含一次近乎无噪的参考扫描，全部预先配准，跨剂量级别的切片彼此对齐。与医学低剂量数据集的关键差别在于几何与试件——这是工业硬件的检测数据而非临床解剖，所以当目标是 NDT 流水线而非诊断流程时，它才是该用的基准。每级 4000 张 1250×1250 切片；因 Zenodo 单次上传上限 50 GB，拆分为三个存档。"
  "Carved cheese (FIPS)":
    note: "**Projection only.** 芬兰逆问题学会发布的一个雕花奶酪单层二维切片，提供三种分辨率，并附带把 X 射线变换写成显式线性算子的测量矩阵。正弦图之外还把前向算子直接交到你手上，可省掉一整类几何不匹配的错误，这也是它在把重建方法移植到真实实测数据时始终作为标准首测的原因。文档见 arXiv:1705.05732。"
  "3D cross phantom (FIPS, dynamic)":
    note: "**Projection only.** 三维十字体模的时变二维扇束正弦图（按分辨率不同为 16 或 30 个时间帧），随附静态与动态测量矩阵，把 X 射线变换编码为显式线性算子。文档见 arXiv:1809.00166。"
  "Emoji phantom (FIPS, dynamic)":
    note: "**Projection only.** 由小陶瓷石拼成的 33 张表情脸（15 种不同表情）的单个二维切片，来自实测的 60 投影扇束正弦图，附静态与动态测量矩阵。相比单一形状的十字体模，它的用处在于表情形状的多样性。文档见 arXiv:1802.09397。"
  "Walnut (FIPS, 2D fan-beam)":
    note: "**Projection + image.** 核桃单个二维切片的实测 120 投影扇束正弦图，三种分辨率并附测量矩阵；另有一套 1200 投影数据，配高分辨率 FBP 重建作真值。文档见 arXiv:1502.04064。"
  "Lotus root (FIPS)":
    note: "**Projection only.** 藕的单个二维切片，其孔洞被填入不同化学元素；两种分辨率并附测量矩阵，另有 FBP、Landweber 与 Tikhonov 重建的 MATLAB 代码。文档见 arXiv:1609.07299。"
  "Gel phantom (FIPS, dynamic)":
    note: "**Projection only.** 对注入液体造影剂的动态琼脂糖凝胶体模二维切片做的 17 次连续 X 射线测量，两种分辨率，另含对首帧的加密采样与额外的第 18 个时间步。不含前向算子，但格式支持无矩阵算子，以及 CPU 与 CUDA GPU 上的 FBP。文档见 arXiv:2003.02841。"
  "STEMPO (FIPS, dynamic phantom)":
    note: "**Projection + image.** 由电机驱动、计算机控制的动态层析体模，含二维与三维几何下的静态与动态扫描、以插值得到的近似真值，以及 FBP、FDK、变分与低秩+稀疏方法的示例代码；格式兼容 HelTomo 与 ASTRA。文档见 arXiv:2209.12471。"
  "Chicken bone CBCT (FIPS, 4 dose levels)":
    note: "**Projection only.** 同一根鸡骨在四个剂量水平下的锥束扫描（通过管电流与探测器曝光时间调节），每次均含平场校正后的投影与几何元数据。剂量水平相互配对，使它在已知解剖结构下成为低剂量去噪的干净测试床。"
  "Pine cone CBCT (FIPS)":
    note: "**Projection + image.** 松果的三维锥束 CT 扫描，含平场校正投影图像、描述测量几何与参数的元数据文件、样本照片，以及一例 FDK 重建。格式兼容 HelTomo。"
  "Walnut CBCT (FIPS, 3D)":
    note: "**Projection + image.** 核桃的三维锥束 CT 扫描，含平场校正投影图像、描述测量几何与参数的元数据文件，以及一例重建结果图。格式兼容 HelTomo。"
  "4D CBCT phantom dataset":
    note: "**Projection only.** 动态胸部体模（CIRS 008A）在 Varian TrueBeam 上的 6 次时间分辨（四维）锥束 CT 扫描，运动模式为 sin/cos⁴。"
  "Dynamic sparse nanotomography (PEFC)":
    note: "**Projection + image.** PEFC 催化剂水化过程的动态原始投影数据（.h5 / 正弦图），另有两套带真值的模拟正弦图与重建代码（非刚性 ASTRA）。"
  "Multienergy fan-beam CT bird chest":
    note: "**Projection + image.** 鹌鹑胸腔在 3 种 X 射线能谱（50 / 80 / 120 kV）下的原始投影数据（.tif），每种 720 个投影，含预制的二维正弦图与 FBP 示例。"
  "RabbitCT":
    note: "**Projection + image.** C 形臂锥束 CT 基准：兔尸扫描的 496 个投影、标定后的 3×4 投影矩阵、参考重建，以及一套开发套件。"
  "Dynamic anthropomorphic thorax phantom (4DCT + CBCT)":
    note: "动态拟人胸部体模（马斯特里赫特）的 4DCT（Siemens）与 CBCT（Varian Halcyon）扫描，含患者个体的呼吸曲线。文件为 DICOM + 处理后数据 + 呼吸曲线；记录未说明是否包含原始投影。"
  "Shepp-Logan-like phantom (fan-beam, experimental)":
    note: "**Projection only.** 激光切割的类 Shepp-Logan 体模（PMMA / 环氧树脂 / 空气）的实测二维扇束数据，来自 CWI FleX-ray 实验室：901 个原始投影，另有暗场与平场图像及扫描脚本。"
  "SkyScan 1172 µCT grains":
    note: "**Projection only.** SkyScan 1172 上颗粒的显微 CT：996 张投影 TIFF，附元数据（jyvat.log）。"
  "LE01 XRCT":
    note: "**Projection + image.** LE01 样本的 XRCT 原始投影（37 GB），另有 Avizo 工程文件（含重建与分割体）、重建元数据与颗粒分析表。0.03 mm 各向同性体素。"
  "Tomato micro-CT":
    note: "**Projection only.** 番茄的显微 CT（MILabs U-CT）：720 个 X 射线投影 TIFF 及几何元数据，用于锥束重建测试。"
  "Preclinical NEMA IQ phantom":
    note: "**Projection + image.** Siemens Inveon 上的临床前 NEMA 图像质量体模：原始投影图像（.cat）+ FDK 重建，3 个床位 × 121 投影。"
  "Spherical fiducials in C-arm CBCT":
    note: "**Projection + image.** 两套用于定位球形标记点的 C 形臂锥束 CT 数据集：投影电影循环 + 三维重建 + 投影矩阵 + MATLAB 代码，均为 DICOM。"
  "RECAST3D cone-beam test data":
    note: "**Projection only.** FlexRay 扫描仪上的两套锥束测试数据集（木蛋与罂粟籽腻子），打包了完整扫描参数，用于实时准三维重建（RECAST3D）。"
  "Spectral CT multi-material (DTU)":
    note: "**Projection + image.** 来自光子计数 CT 扫描仪（DTU Physics）的碘柱体模能量分辨原始投影，附 MATLAB 读取与重建代码（FBP / SIRT）以及 ASTRA 几何。"
  "Micro-CT time-series (4D)":
    note: "显微 X 射线 CT 时间序列（Diamond I13-2）：21 个断层图 × 91 投影，经 Savu 做 CGLS 重建。单个 192.7 GB 归档；记录未说明其中是原始投影还是仅含 CGLS 重建。"
  "Laminography (Lego)":
    note: "**Projection + image.** 实验室层析成像：用常规 X 射线 CT 扫描仪对乐高样本成像——计算机分层成像加有限角 CT，含原始投影数据、最终重建与 MATLAB 代码。"
  "Polychromatic CBCT phantom (simulated)":
    note: "**Projection only.** 数值体模（PolyBoneAlTi）的多色锥束 CT 模拟投影图像，用 LEAP 在 85 kV 下生成。"
  "Crystals in clay micro-CT":
    note: "**Projection + image.** 含晶体的黏土的显微 CT（DTU Nikon XTek）：投影 TIFF + .xtekct 元数据 + 重建体（.vol）+ 中心层正弦图。"
  "SESAME ID10-BEATS synchrotron CT":
    note: "**Image only.** 来自 ID10-BEATS 光束线（SESAME）的同步辐射 X 射线 CT 重建：一只黄蜂、一尊历史陶俑与埃及蓝颜料。文件只有重建结果，没有原始投影。"
  "Ptychotomography nanoporous glass":
    note: "**Projection + image.** 纳米多孔玻璃的高分辨率叠层成像层析（PSI cSAXS）：未对齐的复值投影、对齐后的相位正弦图与 delta 断层图。注意：叠层成像的物理机制与传统 CT 不同。"
  "CBCT esophagus segmentation (psCBCT)":
    note: "**Image only.** 配对的计划 CT 与物理增强伪 CBCT（psCBCT）图像及危及器官分割（23 对），用于分割与 CBCT→CT 转换。没有原始投影；psCBCT 图像为合成。"
  "NIH/3T3 fibroblast SXT":
    note: "**Image only.** 用软 X 射线层析（SXT-100）对 NIH/3T3 小鼠成纤维细胞做的三维重建，倾角范围 −53° 至 53.5°。单个 .mrc 重建体；没有原始投影。"
  "Two-phase flow 4D micro-CT + reconstruction software":
    note: "**受限访问**（文件未公开列出）。多孔介质中两相流的四维显微 CT 数据集加重建软件（实验室显微 CT）。公开记录无法确定是否包含原始投影。"
  "Pediatric CT noise texture (XCAT)":
    note: "**Image only.** 拟人 XCAT 体模（MIRT）的常规剂量与四分之一剂量 CT 模拟图像，用于噪声纹理增强。没有原始投影；属模拟数据而非实测扫描。"
  "GranulaX":
    note: "**Projection only.** 颗粒微结构的原始 CT 数据（RAW 格式）+ 预览图。记录中的规格字段仍是未填的占位符（体素尺寸、扫描仪、样本、重建方法），因此可用性未经验证。"
  "Micro-CT spiders (amber)":
    note: "**Projection + image.** 缅甸琥珀中白垩纪中期 lagonomegopid 蜘蛛的显微 CT：原始显微 CT TIFF + 三维重建。这是古生物标本扫描，并非为重建基准而设计。Dryad DOI 10.5061/dryad.7m0cfxpv0。"
  "Walnut micro-CT (Saarland)":
    note: "**Projection + image.** 单个核桃的显微 CT（Saarland）：1601 个采集投影（TIFF 栈）+ 重建体（pyXIT）。这是库中第 6 个核桃，采集方式与其他 5 个不同。"
benchmarks:
  "AAPM Low-Dose CT Grand Challenge":
    note: "2016 年由 AAPM、NIBIB 与 Mayo Clinic 主办的挑战赛：30 例增强腹部 CT（10 例训练、20 例测试），通过在投影中注入泊松噪声模拟 1/4 剂量（25%）数据。其病例与协议是 Mayo 低剂量数据的基础，至今大多数低剂量 CT 论文仍在其上报告结果。"
  "AAPM DL-Sparse-View CT Challenge":
    note: "从理想无噪声的 128 视角扇束数据恢复二维乳腺 CT 体模：4,000 组训练数据、100 例测试，按 RMSE 公开排名。深度学习稀疏视角 CT 的常用参照点。"
  "Helsinki Tomography Challenge":
    note: "真实测量的有限角正弦图。冠军是在合成数据上训练的纯学习网络；唯一的基于模型方案（CIL 团队，方向 TV）获得第三——说明经典方法在有限角任务上依然有竞争力。"
  "LoDoPaB-CT benchmark":
    note: "在 LoDoPaB-CT 切分上以大挑战赛方式评测，并发布经过调优的 FBP+U-Net 参照基线，使改进幅度可度量。"
  "SPARE Challenge":
    note: "从一分钟扫描重建胸部四维锥束 CT。首个被广泛采用的呼吸分辨动态 CBCT 基准；由悉尼大学 Image X 研究所主办。"
  "MICCAI FLARE":
    note: "跨四届（FLARE21/22/23/24）的多器官腹部 CT 分割；是 CT 重建输出的标准下游鲁棒性检验目标。"
  "Medical Segmentation Decathlon":
    note: "十个任务，测试集固定且隐藏，并严格禁止针对单一任务调优——真正公平的泛化基准。"
  "KiTS Challenge":
    note: "肾肿瘤分割，三届（2019/2021/2023），标注质量严格受控，并高度强调跨机构泛化。"
  "VerSe Challenge":
    note: "多探测器 CT 上的椎体定位与分割，与 MICCAI 2019、2020 同期举办两届（374 例扫描、355 例患者）；隐藏测试集是结果可比的关键。"
  "CHAOS Challenge":
    note: "腹部 CT 与 MRI 器官分割，并明确做跨模态评测；其 CT 为门静脉期增强扫描，并非低剂量。"
  "SPIE-AAPM-NCI LungX Challenge":
    note: "低剂量筛查 CT 上的肺结节良恶性诊断分类——任务是对照放射科医师做诊断，而非结节检测。共 70 例（10 训练、60 测试），数据经 TCIA 分发。"
  "AutoPET Challenge":
    note: "全身 PET/CT 病灶分割，自 2022 年起逐年举办（至 2025 年已四届），每届均刻意隐藏多中心测试队列。"
  "HECKTOR Challenge":
    note: "头颈部 PET/CT 肿瘤勾画；五届使其成为运行时间较长的医学影像挑战赛之一。"
  "CTooth / CTooth+":
    note: "全标注的三维牙科 CBCT 数据集与牙齿分割基准（5,803 层 CBCT），后扩展为 CTooth+。在伪影严重的领域里，是一个规模不大但标注精良的 CBCT 基准。"
  "Noise2Noise denoising protocol":
    note: "让「无需干净真值即可训练去噪器」流行起来的参照实现。在 CT 上它成为标准的「无干净真值」评测协议——多数无监督 CT 去噪论文都在此设定下、用 Mayo-LDCT 式切分报告结果。"
  "SynthRAD2023 Challenge":
    note: "从 CBCT 与 MRI 生成合成 CT。与此处相关，是因为 CBCT→CT 任务恰恰由重建伪影（散射、截断、射束硬化）主导——该挑战赛迫使方法正面处理它们，而不是假设输入干净。"
  "DeepInverse benchmark suite":
    note: "统一的 PyTorch 基准框架，覆盖 CT、MRI、去模糊与图像修复，提供可复现指标与预训练基线——把新 CT 方法与强通用求解器对比的最实用途径。"
  "Generating synthetic computed tomography for radiotherapy: SynthRAD2025 challenge report":
    note: "由 CBCT 与 MRI 生成合成 CT——SynthRAD 的 2025 届，配套报告记录了任务、数据与结果。与 2023 届同为 CBCT→CT 焦点，输入中散射线、截断与射束硬化占主导。"
  "CT-DegradBench: A Physics-Informed Benchmark for CT Degradation Detection and Severity Estimation":
    note: "面向 CT 退化（噪声、模糊、伪影）检测与严重程度估计的物理知情基准——它问的是“这张图哪里有问题”，而不只是“怎么重建”。已被 CVPR 2026 VISION Workshop（DEXTER track）接收。"

# ------------------------------------------------------------ 学习资源
learning:
  "Principles of Computerized Tomographic Imaging":
    note: "Kak & Slaney（1988）。**免费 PDF。** 奠基之作：Radon 变换、傅里叶切片定理、FBP、代数重建、扇束/锥束重排。建议先读第 1–3 章。"
  "The Mathematics of Computerized Tomography":
    note: "Natterer（1986，SIAM 重印本）。严谨的逆问题处理——Sobolev 空间上的 Radon 变换、采样理论、不适定性与正则化。"
  "Computed Tomography - From Photon Statistics to Modern Cone-Beam CT":
    note: "Buzug（2008）。从物理（光子统计、多色性、探测器响应）通向重建算法的最佳单本桥梁之作。"
  "Fundamentals of Computerized Tomography - Image Reconstruction from Projections":
    note: "Herman（第 2 版，2009）。非常实用，给出明确的算法与伪代码，并细致处理采样与离散化伪影。"
  "Medical Image Reconstruction - A Conceptual Tutorial":
    note: "Zeng（2010）。刻意以直觉优先：用最少的符号解释 FBP、迭代与解析方法为何如此表现。"
  "Foundations of Image Science":
    note: "Barrett & Myers（2004）。成像系统理论的百科式参考——傅里叶串扰、基于任务的评估，以及迭代重建的数学基础。"
  "Computed Tomography - Principles, Design, Artifacts, and Recent Advances":
    note: "Hsieh（第 3 版，2015，SPIE）。出自 CT 厂商内部视角：系统设计、剂量、伪影分类与临床校正策略。"
  "Principles of Medical Imaging (MIT OCW 22.058)":
    note: "免费的讲义与习题集，覆盖投影成像、Radon 变换与重建，并旁及 MRI、超声与 PET。"
  "ASTRA Toolbox documentation and tutorials":
    note: "最容易上手的动手入口：CPU/GPU 正投影与反投影算子、FBP、SART/SIRT、CGLS，每种几何都配可运行示例。"
  "TIGRE demos":
    note: "可运行的 GPU 演示，从解析 FBP 到迭代、全变分与即插即用重建，另附 CBCT 几何标定演示。"
  "ODL examples":
    note: "演示如何把 CT 问题表述为算子与泛函，再用近端方法求解——变分 CT 最清晰的入门。"
  "Radon transform in scikit-image":
    note: "二十行代码，从体模到正弦图再用 FBP 反推回来；接触真实几何之前建立直觉最快的途径。"
  "DeepInverse documentation":
    note: "现代的 PyTorch 优先教程路径：物理算子、学习型去噪器、即插即用与扩散采样器，全部配有 CT 示例。"
  "XDesign":
    note: "可微分的 CT 采集仿真——在训练循环内建模多色能谱、探测器响应与几何。最初与 CIL 一同开发，现由 Advanced Photon Source 维护。"
  "SpekPy":
    note: "X 射线管能谱仿真（TASMIP/IPEM 一脉），以 Python 包发布。用它生成逼真的多色能谱，用于射束硬化实验。"
  "TomoPhantom":
    note: "快速的解析式二维/三维/四维体模生成，内置噪声与偏移模型；便于做受控重建研究。（工具包表中亦收录。）"
  "gVXR (gVirtualXray)":
    note: "GPU 加速的 X 射线投影仿真器，支持任意三维场景与多色能谱——适合构建大规模合成投影数据集。"
  "SimpleITK":
    note: "医学体数据的标准 I/O 与重采样层；本列表中几乎所有 CT 数据集都通过它加载最省事。"
  "Awesome CT Reconstruction (LoraLinH)":
    note: "最知名的前作 CT 重建列表。适合交叉核对 2020–2024 年文献的覆盖情况。"
  "CT Denoising Review":
    note: "专注低剂量 CT 去噪，侧重 SSinyu/Mayo 一脉的方法。"
  "Awesome 3D Gaussian Splatting":
    note: "3DGS 的参照列表。其中贴近层析的条目（r2_gaussian、X-Gaussian、X2-Gaussian）是通往高斯溅射 CT 的桥梁。"
  "Awesome NeRF and 3DGS for SLAM":
    note: "机器人/视觉社区的神经场文献；当前被移植到 CT 的隐式表示技术即源自此处。"
  "Low-Dose CT Denoising (code collection)":
    note: "持续更新的低剂量 CT 去噪代码合集，按年份组织——便于查找某篇论文背后的实现。"
  "Awesome Medical Imaging":
    note: "更宽泛的医学影像分析资源：数据集、工具包与预训练模型，在 CT 流程中常被复用。"
  "X-Ray Data Booklet":
    note: "**LBNL。** 元素 X 射线性质的标准速查手册——吸收边、荧光产额与散射截面。仿真需要某个物理常数时的第一去处。"
  "NIST X-Ray Mass Attenuation Coefficients":
    note: "**NIST。** 全周期表 mu/rho 与 mu_en/rho 的权威表格。XrayPhysics 与 SpekPy 内部即以此校准——需要核检多色模型时很有用。"
  "CT Principles and Algorithms":
    name: "CT 原理与算法（庄天戈）"
    note: "庄天戈。中文的 CT 原理与算法入门读物；被广泛用作第一门课程的教材，也是偏好中文的读者最自然的切入点。1992 年版在出版社没有在线页面，因此链接指向标题检索。"
  "Industrial CT Technology and Principles":
    note: "张朝宗。工业（无损检测）CT 的参考书——几何、射线源、探测器与工业侧的伪影来源，正是医学教材止步之处。"
  "Medical Tomographic Image Reconstruction Simulation Experiments":
    note: "黄力宇。中文的实践型实验手册：把每个重建算法做成仿真实验，而不是当作理论来讲。"


# ---------------------------------------------------------------- pages
# 静态页面正文（保留原始 HTML 标签与 class，仅替换可见文本）
pages:
  about: |-
    <p class="kicker">关于</p>
    <h1>关于本列表</h1>
    <p class="lede">Awesome Computed Tomography 是一份独立、人工精选的 CT 图像重建研究地图：研究人员进入这一领域所需要的论文、开源工具库、数据集、基准与学习资料，集中在一处并逐条人工核对。</p>

    <h2>收录范围</h2>
    <p>本列表目前收录 {{N_PAPERS}} 篇论文（{{YEAR_MIN}}–{{YEAR_MAX}} 年）、{{N_TOOLKITS}} 个工具库、{{N_DATASETS}} 个数据集、{{N_BENCHMARKS}} 个基准和 {{N_LEARNING}} 项学习资源。论文按问题（稀疏视角、有限角、低剂量、金属伪影、能谱、锥束、动态与 4D CT、散射、标定与运动）和方法族（经典与迭代求解器、深度展开、自监督方法、扩散与生成式先验、隐式神经表示、高斯溅射）分组。</p>
    <p>这是一份阅读清单，而不是包罗万象的数据库。一个条目之所以被收录，是因为它对从事 CT 重建的人有用：别人会在此基础上继续做的方法、一个强有力的基线、结果所基于的数据集或基准，或一份清晰的入门介绍。</p>

    <h2>条目如何核验</h2>
    <ul>
      <li><strong>身份。</strong> 每条论文链接都对照 Crossref、arXiv 或出版方自身的记录解析，并与该记录的标题比对，因此条目不会悄悄指向另一篇论文。</li>
      <li><strong>发表出处。</strong> 论文出处以 DOI 为准而非搜索结果。没有同行评审发表出处的论文标记为<em>预印本</em>，按首次公开日期标注。</li>
      <li><strong>链接。</strong> 每个 URL 都经过检查，并且每周自动复查一次。若作者提供了代码仓库，代码链接指向作者自己的仓库。</li>
    </ul>
    <p>这些检查能发现失效链接和记录不匹配，但无法发现所有错误。某个发表出处、年份或分类仍可能出错。如果某个细节对你的工作很关键，请顺着链接以原始论文为准。</p>

    <h2>它不是什么</h2>
    <p>一个条目是指向他人工作的指针。鼠标停在论文标题上时出现的一句话简介，是为了帮助你判断这篇论文是否值得点开原文阅读；其中不少简介引用了论文自身的摘要，被引用的文字仍归作者与出版方所有，不在本站内容许可的范围之内。标题、发表出处与链接是关于论文的事实，归作者与出版方所有；收录并不意味着他们认可，也不表示这里复现了结果。本站内容不构成医疗建议。</p>

    <h2>维护</h2>
    <p>本列表由 <a href="https://github.com/cslht11" target="_blank" rel="noopener">cslht11</a> 策划和维护并持续更新，包括新增 arXiv 论文、更正发表出处和修复链接。它不接受外部 pull request。建议与更正欢迎通过<a href="{{ROOT}}contact/">联系页面</a>提交，每一条都会先经核对再决定是否收录。每一次改动都按日期记录在<a href="{{ROOT}}changelog/">更新日志</a>中。</p>
    <p>同样的数据也以 <a href="{{REPO_URL}}" target="_blank" rel="noopener">GitHub README</a> 和 <a href="{{ROOT}}data.json">data.json</a> 发布。两者由同一份源文件生成，因此不会与本站产生分歧。</p>

    <h2>许可与复用</h2>
    <p>内容（精选记录、README 与生成的页面）采用 <a href="{{CONTENT_LICENSE_URL}}" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a> 许可：</p>
    <ul>
      <li><strong>署名。</strong> 注明“Awesome Computed Tomography”并链接到 computedtomography.org。</li>
      <li><strong>非商业性使用。</strong> 不得用于商业用途。如需商业使用，请先邮件联系 <a href="mailto:heitieya@163.com">heitieya@163.com</a>。</li>
      <li><strong>相同方式共享。</strong> 如果你改编了本列表，需以相同许可分享你的版本。</li>
    </ul>
    <p>本站代码采用 MIT 许可。工具库与数据集表格中的许可列描述的是那些项目，而不是本列表。</p>

    <h2>引用</h2>
    <p>本列表持续变动，因此请引用固定快照：仓库 URL 连同提交哈希，或页面 URL 连同你的访问日期。</p>

    <h2 id="topics">按主题浏览</h2>
    <p>每个主题都有单独的页面，包括一段简短介绍、一份入门阅读清单、该主题的最新论文，以及与之配套的数据集和工具库。</p>
    {{TOPIC_LINKS}}

    <h2 id="datasets-guides">数据集、基准与指南</h2>
    <p>CT 重建研究中使用的数据集和基准都有单独的页面，列出各自提供的数据、许可，以及目录中使用它们的论文。指南则基于同样经过核验的记录，回答“先用哪个数据集”这类常见问题。</p>
    {{GUIDE_LINKS}}

    <h2 id="faq">常见问题</h2>
    <section class="faq">
    <h3>稀疏视角 CT 用哪些数据集最好？</h3>
    <p>最常用的是 LoDoPaB-CT 和 Mayo Clinic 的 LDCT-and-Projection-data（从中模拟稀疏正弦图），以及 AAPM DL-Sparse-View CT 挑战赛数据（用无噪声的 128 视角正弦图把稀疏视角问题单独剥离出来）。如果需要实测而非模拟的数据，可以用 2DeteCT、FleX-ray 核桃数据集或 SparseBeads。<a href="{{ROOT}}topics/sparse-view/">稀疏视角 CT 主题页</a>把它们与关键论文列在一起，<a href="{{ROOT}}?tab=datasets">数据集表格</a>收录了全部 {{N_DATASETS}} 个数据集。</p>
    <h3>低剂量 CT 研究常用哪些开源工具库？</h3>
    <p>重建方面，ASTRA Toolbox、TIGRE、ODL 和 Core Imaging Library（CIL）提供投影算子和迭代求解器，DeepInverse 和 LION 则在 PyTorch 中提供学习型方法和展开方法。若要从全剂量图像生成逼真的低剂量数据，可以用 LD-CT simulator。详见<a href="{{ROOT}}topics/low-dose/">低剂量 CT 主题页</a>和<a href="{{ROOT}}?tab=toolkits">工具库表格</a>。</p>
    <h3>条目如何核验？</h3>
    <p>每条论文链接都对照 Crossref、arXiv 或出版方自身的记录解析，并与该记录的标题比对，每个 URL 也都经过检查。发表出处以 DOI 为准，没有同行评审出处的论文标记为预印本。这些检查能发现失效链接和记录不匹配，但无法发现所有错误；重要细节请以原始论文为准。</p>
    <h3>列表多久更新一次？</h3>
    <p>列表持续更新，最近一次内容更新是 {{UPDATED}}。新论文、更正的发表出处和修复的链接在核对后随时加入，README、data.json 和本站在每次变更时都由同一份源文件重新生成。</p>
    <h3>如何引用本列表？</h3>
    <p>请引用固定快照，因为列表持续变动：仓库 URL（{{REPO_URL}}）连同提交哈希，或页面 URL 连同你的访问日期。如果要引用在这里找到的方法，请改为引用原始论文。</p>
    <h3>如何推荐论文或报告错误？</h3>
    <p>按<a href="{{ROOT}}contact/">联系页面</a>的说明，提交 GitHub issue 或发送邮件。推荐论文时，请提供 DOI 或 arXiv 链接，如有代码仓库也一并附上，并说明它属于哪个<a href="#topics">主题</a>。本列表不接受外部 pull request，每条建议都会先经核对再决定是否收录。</p>
    </section>

  contact: |-
    <p class="kicker">联系</p>
    <h1>联系</h1>
    <p class="lede">更正与建议会让这份列表更好。公开反馈请走 GitHub Issues；不便公开的内容请发邮件。</p>

    <div class="cards">
      <a class="card" href="{{REPO_URL}}/issues/new/choose" target="_blank" rel="noopener">
        <span class="card-k">公开</span>
        <span class="card-t">GitHub Issues</span>
        <span class="card-d">推荐论文、举报错误的发表出处或失效链接。需要 GitHub 账号。</span>
      </a>
      <a class="card" href="mailto:heitieya@163.com">
        <span class="card-k">私下</span>
        <span class="card-t">heitieya@163.com</span>
        <span class="card-d">版权、署名、删除请求、商业授权，以及任何不适合公开讨论的事项。</span>
      </a>
    </div>

    <h2>推荐论文</h2>
    <p>请提供 DOI 或 arXiv 链接，并说明它属于哪个方向：它解决的问题（例如稀疏视角或金属伪影），以及若有代码仓库也一并给出。每条建议都会先对照 Crossref 或 arXiv 核验再收录，因此你无需再写别的。</p>

    <h2>报告错误</h2>
    <ul>
      <li>该条目的标题，以及它所在的栏目或页面。</li>
      <li>错在哪里：发表出处、年份、链接还是分类。</li>
      <li>依据：DOI、出版方页面或 arXiv 记录。</li>
    </ul>
    <p>如果是网站问题（搜索、导航、手机端显示），请给出页面地址、你的操作、你的预期和实际结果，以及浏览器和设备。</p>

    <h2>作者</h2>
    <p>如果你的论文被收录但某项信息有误，或你希望添加、删除它，或把它移到别的主题下，请开 issue 或发邮件。来自作者的请求会优先处理。</p>

    <h2>你会得到什么</h2>
    <p>反馈会对照原始来源核对。建议未必被采纳，也没有固定的回复时限。我们绝不会向你索要密码、验证码或付款信息。请勿在公开 issue 中发布隐私内容。</p>

  privacy: |-
    <p class="kicker">隐私</p>
    <h1>隐私政策</h1>
    <p class="lede">最后更新于 2026 年 10 月 12 日。本政策适用于 https://computedtomography.org/，这是由 <a href="https://github.com/cslht11" target="_blank" rel="noopener">cslht11</a> 维护的个人非商业项目。</p>

    <h2>简而言之</h2>
    <p>本站没有账号、没有广告，也不设置 cookie。唯一的外部脚本是 Cloudflare Web Analytics，它不用 cookie、不识别你个人，只统计访问量。阅读本站不需要你提供任何东西。</p>

    <h2>托管</h2>
    <p>本站为静态站点，由 <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">GitHub Pages</a> 托管；域名的 DNS 由 <a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener">Cloudflare</a> 管理。与任何 Web 服务器一样，GitHub 会收到每次请求的技术细节（IP 地址、浏览器、请求的页面和时间），并可能按其自身政策保存在日志中。本站不会接收或保存这些日志。</p>

    <h2>分析</h2>
    <p>本站使用 <a href="https://www.cloudflare.com/web-analytics/" target="_blank" rel="noopener">Cloudflare Web Analytics</a> 统计页面浏览量，以及哪些页面、哪些来源网站被阅读。它不设置 cookie、不使用本地存储，也不对浏览器做指纹识别。Cloudflare 会收到每次访问的页面地址、来源、浏览器类型与时间，并按其<a href="https://www.cloudflare.com/privacypolicy/" target="_blank" rel="noopener">隐私政策</a>处理。我们只能看到汇总数字，看不到单个访客。本站不加载任何广告或社交媒体脚本。</p>

    <h2>浏览器中的存储</h2>
    <p>你的浅色/深色主题选择保存在浏览器的本地存储中，键名为 <code>ct-theme</code>，以便下次访问时记住。它绝不会离开你的设备。你可以通过浏览器的站点数据设置清除它。</p>

    <h2>搜索</h2>
    <p>搜索与筛选完全在你的浏览器中针对随页面加载的列表副本运行；查询不会发送到任何地方。你应用的筛选条件会写入地址栏（例如 <code>?q=diffusion</code>）以便分享某个视图，这意味着它们可能出现在你的浏览器历史记录中。</p>

    <h2>外部链接</h2>
    <p>条目会链接到出版方、arXiv、GitHub 等站点。一旦你跟随链接，适用的是该站点自身的隐私政策。</p>

    <h2>邮件</h2>
    <p>如果你写信到 <a href="mailto:heitieya@163.com">heitieya@163.com</a>，邮件内容和你的地址仅用于处理你的请求。一般邮件在事项结束最多 12 个月后删除。请只发送必要内容，绝不要发送密码、验证码或付款信息。GitHub Issues 是公开的，受 GitHub 条款约束。</p>

    <h2>你的权利</h2>
    <p>根据你所在地区，你可能有权访问、更正或删除与你有关的个人信息，并向数据保护机构投诉。请发邮件至 <a href="mailto:heitieya@163.com">heitieya@163.com</a> 提出请求。对于 GitHub 或 Cloudflare 持有的数据，你可能需要直接联系他们。</p>

    <h2>变更</h2>
    <p>本政策变更时，本页顶部的日期会随之更改。</p>

# ---- 研究团队（按 team id 覆盖 intro 与 institution；只写中文，不写排名）
teams:
  rpi-wang-axis:
    institution: "伦斯勒理工学院"
    intro: >
      伦斯勒理工学院的 WANG-AXIS 实验室与生物医学成像中心（BIC）由 Ge Wang
      领导，研究方向涵盖 X 射线 CT 成像理论、系统与重建。该团队早期的工作
      包括螺旋锥束 CT 重建与内层析成像（interior tomography），近年的工作将
      深度学习应用于断层重建，其中包括 FORCE 框架（2025），该框架将泊松流
      （Poisson flow）生成先验与数据保真相结合，用于低剂量、稀疏视角和金属
      伪影条件下的重建。该中心还运行包括光子计数（MARS）光谱显微 CT 扫描仪
      和基于光栅的 X 射线相位衬度成像平台在内的 CT 实验设备。
  uchicago-xray:
    institution: "芝加哥大学"
    intro: >
      芝加哥大学放射学系的 X 射线断层成像课题组由 Xiaochuan Pan 与
      Emil Y. Sidky 领导，为临床、临床前、安检和同步辐射 CT 开发重建算法与
      成像系统。该团队以约束总变分（TV）最小化重建著称——即 Sidky 与 Pan
      于 2008 年提出的 ASD-POCS 算法：它在满足数据约束的条件下最小化图像的
      总变分，可从稀疏或有限角度数据重建锥束 CT 图像。该团队近年的工作包括
      方向性 TV 算法、一步法光谱 CT 重建，以及截断投影数据的重建。
  jhu-istar:
    institution: "约翰斯·霍普金斯大学"
    intro: >
      约翰斯·霍普金斯大学的 I-STAR 实验室（手术、治疗与放射成像实验室）由
      Jeffrey Siewerdsen、J. Webster Stayman 与 Wojciech Zbijewski 领导，
      研究面向图像引导介入的锥束 CT（CBCT）系统与三维重建。其研究包括惩罚
      似然（基于模型的）重建、用于在植入物等已知物体存在时成像的已知组件
      重建（known-component reconstruction），以及对 X 射线散射、探测器迟滞
      和系统几何等物理效应的建模。该实验室成员的早期工作量化了平板探测器
      CBCT 中 X 射线散射的强度与影响（Siewerdsen 与 Jaffray，2001），以及
      锥束显微 CT 中基于蒙特卡罗的散射校正（Zbijewski 与 Beekman，2006）。
  umich-fessler:
    institution: "密歇根大学"
    intro: >
      密歇根大学 Jeffrey Fessler 的课题组研究统计（基于模型的）图像重建
      及其背后的优化算法，应用对象包括 CT、PET、SPECT 与 MRI。Fessler 与
      Rogers（1996）分析了空间不变断层成像中惩罚似然重建的空间分辨率特性，
      这项工作是后续设计具有可控分辨率特性的正则化方法的基础。该课题组维护
      着密歇根图像重建工具箱（MIRT），提供 MATLAB 与 Julia（MIRT.jl）两个
      版本，以及基于 PyTorch 的可微重建工具箱 MIRTorch。
  mayo-ctic:
    institution: "梅奥诊所"
    intro: >
      梅奥诊所的 CT 临床创新中心成立于 2004 年，负责开发和评估新的 CT 技术、
      临床应用与剂量降低技术，核心成员包括 Cynthia McCollough 与 Lifeng Yu。
      其工作涵盖双能与多能量 CT 以及光子计数探测器 CT，McCollough 等人
      （2015）对该领域作过综述。该中心还为 CT 研究界建立了公开数据资源：
      2016 年 AAPM 低剂量 CT 大挑战赛（Low-Dose CT Grand Challenge），以及
      托管于癌症影像档案库（TCIA）的低剂量 CT 图像与投影数据集
      （LDCT-and-Projection-data），该数据集提供 299 例头、胸、腹患者检查的
      常规剂量与模拟低剂量投影数据及全剂量图像。
  uwisc-chen:
    institution: "威斯康星大学麦迪逊分校"
    intro: >
      威斯康星大学麦迪逊分校 Guang-Hong Chen 的 CT 研究组从事低剂量与欠采样
      CT 的重建方法研究。Chen 提出了先验图像约束压缩感知（PICCS）方法，利用
      一幅先验图像作为约束，从高度欠采样的投影数据重建动态 CT 图像；PICCS
      已被应用于心脏成像、灌注成像、双能 CT 与 C 臂 CT。该组还从事能谱与
      光子计数探测器 CT 研究；威斯康星大学麦迪逊分校是 GE 医疗硅基光子计数
      CT 系统在美国的首个临床评估站点，并于 2022 年 11 月完成首批人体扫描。
  purdue-bouman:
    institution: "普渡大学"
    intro: >
      普渡大学 Charles Bouman 课题组从事 X 射线 CT 的基于模型的迭代重建
      （MBIR）研究，将重建表述为带有显式前向模型和马尔可夫随机场先验的统计
      估计问题。该组 20 世纪 90 年代与 Ken Sauer（圣母大学）合作的 MBIR
      统计重建工作，后来被 GE 医疗商业化为用于低剂量临床 CT 的 Veo MBIR
      产品。该组维护开源软件 SVMBIR——一个面向平行束与扇束 CT 的 MBIR
      实现，并已将基于模型的方法扩展到分布式与多节点重建。
  llnl-leap:
    institution: "劳伦斯利弗莫尔国家实验室"
    intro: >
      劳伦斯利弗莫尔国家实验室的 LEAP 项目提供一套三维透射 CT 算法库，包含
      预处理、正投影/反投影算子以及解析（FBP/FDK）与迭代重建算法，提供
      Python 与 C++ 接口，并带有 PyTorch 绑定，使投影算子可微、可嵌入深度
      学习流程。投影算子支持多种几何，并在多 GPU 与多核 CPU 硬件上运行，
      面向工业与实验室 CT。基于物理的建模与校正（散射、束硬化、双能分解）
      由配套软件 XrayPhysics 提供——一个带 Python 绑定的 C/C++ 库，用于 X
      射线截面与源谱建模。
  anl-aps-tomo:
    institution: "阿贡国家实验室"
    intro: >
      阿贡国家实验室先进光子源的断层成像团队开发同步辐射微米与纳米断层
      成像光束线所使用的重建与数据处理软件。其软件成果包括 TomoPy——一个
      用于同步辐射断层数据预处理与重建的 Python 框架（Gürsoy、De Carlo 等，
      2014），以及 TomocuPy——Viktor Nikitin 开发的以并发分块方式重建数据的
      GPU 流水线。该团队还维护 TomoBank，一个收录实验与模拟断层数据集及
      其描述信息的仓库，供研究者在共享的光束线数据上开发和比较重建方法。
  fau-lme:
    institution: "埃尔朗根-纽伦堡大学"
    intro: >
      埃尔朗根-纽伦堡大学（FAU）模式识别实验室自 2015 年起由 Andreas Maier
      担任负责人，将机器学习应用于医学成像，其 CT 研究主线是"已知算子"
      （known operator）方法——把投影与重建的物理过程作为可微层嵌入神经
      网络。其软件成果包括 PYRO-NN，一个面向平行束、扇束与锥束几何的可微
      CT 算子库，以及 diffct，一个 CUDA 加速的可微 CT 库，其后续版本支持
      非圆与任意采集轨迹。德国研究联合会（DFG）资助的项目
      "Deep-Learning-basierte CBCT-Rekonstruktion beliebiger Trajektorien"
      （周期 36 个月，经费 324,459 欧元，2025 年 9 月公布）与代根多夫应用
      技术大学及斯坦福大学合作，开发面向任意轨迹的基于深度学习的 CBCT
      重建方法，并使用 FAU 区域计算中心（RRZE）的算力设施。
  cambridge-cia:
    institution: "剑桥大学"
    intro: >
      剑桥大学计算图像分析组从事数学成像与反问题研究，其 CT 方向致力于
      弥合数学方法进展与临床落地之间的鸿沟。研究涵盖数据驱动重建方法
      （包括迭代展开方法、学习正则项、即插即用方法），以及变分正则化、
      Krylov 子空间求解器和四维成像。团队开发了开源软件包 LION（Learned
      Iterative Optimization Networks），收录后处理、展开、学习正则项、
      即插即用与自监督 CT 重建方法，并提供可复现的训练流程与 CT 数据集。
  cwi-ci:
    institution: "荷兰数学与计算机科学研究中心（CWI）"
    intro: >
      CWI 计算成像组开发以数学与算法驱动的三维成像方法，服务于科学、医学
      与工业，结合先进采集、参数估计与离散层析成像，包括通过 RECAST3D
      实现实时重建，以及 FleX-ray 实验室将定制 CT 扫描仪与先进处理和 AI
      算法相连。该组与安特卫普大学联合开发了 ASTRA Toolbox——面向二维与
      三维层析成像的高性能 GPU 基元 MATLAB/Python 平台，被科研人员、工业
      伙伴及大型同步辐射装置（ESRF、APS）采用；还开发了其 Python 封装
      tomosipo，用于复杂几何的三维层析，旨在把快速 GPU 计算与主流深度
      学习工具结合。
  uantwerp-visionlab:
    institution: "安特卫普大学"
    intro: >
      imec 视觉实验室下属的 ASTRA 研究组面向电子、X 射线、中子与磁共振
      成像开发层析重建算法，聚焦跨应用领域的通用重建问题。核心方向包括
      相衬 X 射线 CT、非标准采集几何的 X 射线层析（例如层析合成
      laminography、体层合成 tomosynthesis）、动态（4D）层析与离散层析。
      该组与 CWI 计算成像组联合开发了 ASTRA Toolbox——开源 GPU 加速的
      层析重建方法研发平台。
  kth-oktem:
    institution: "瑞典皇家理工学院"
    intro: >
      Öktem 在 KTH 的研究将反问题、凸优化与机器学习结合用于医学成像，
      方向之一是学习式迭代（展开）重建方法。他与 Jonas Adler 提出了
      Learned Primal-Dual 重建方法（IEEE T-MI 2018），并开发了反问题
      Python 库 ODL（Operator Discretization Library），提供正向算子、几何
      与解析方法，被后续众多 CT 重建研究采用。learned_gradient_tomography
      代码库实现了早期的迭代深度网络工作（Adler & Öktem，《用迭代深度神经
      网络求解不适定反问题》，Inverse Problems 2017）。
  creatis-rit:
    intro: >
      Simon Rit 在 CREATIS 的团队从事层析重建研究，聚焦放疗图像引导的锥束
      CT，包括正则化与稀疏（压缩感知）CT 方法，以及针对心脏与呼吸运动的
      运动补偿 X 射线 CT（其方法已转移到荷兰的临床方案）。团队开发了开源
      锥束 CT 重建工具包 RTK（openrtk.org），基于 ITK 构建、采用 Plastimatch
      的 GPU 代码，按 Apache 2.0 许可发布，既提供 C++ 类与命令行工具，也
      通过 PyPI 发布 Python 包（itkrtk）。RTK 支持 Elekta、Varian 与 IBA
      扫描仪输入、CPU/GPU 的 Feldkamp-David-Kress 重建、4D ROOSTER 等四维
      算法，以及诊断 CT 扫描仪的柱面探测器几何。
  stfc-cil:
    institution: "英国科学与技术设施委员会（STFC）"
    intro: >
      英国科学与技术设施委员会（STFC）的层析成像团队与曼彻斯特大学等伙伴
      通过层析计算成像协作计算项目（CCPi）合作，开发用于层析图像重建的
      开源软件。其核心成像库（CIL）是一个 Python 框架，用于对滤波反投影
      不足以处理的数据进行迭代正则化重建，这类数据包括带噪、不完整、非
      标准几何或多通道（动态与能谱）数据。该团队还研究协同成像，将层析
      成像与其他模态和数据源结合进行联合重建。
  kaist-bispl:
    institution: "韩国科学技术院（KAIST）"
    intro: >
      韩国科学技术院（KAIST）的生物成像与信号处理实验室（BISPL）由
      Jong Chul Ye 教授领导，研究面向生物医学成像的信号处理与机器学习
      方法。其核心研究方向之一是将扩散模型与基于分数的生成模型用作先验
      来求解成像逆问题，包括稀疏视角与有限角 CT；其 DiffusionMBIR 方法将
      预训练的二维扩散模型与基于模型的迭代重建相结合，并沿层间方向施加
      全变分先验，用于求解稀疏视角和有限角层析等三维重建问题。
  tsinghua-ep-ct:
    institution: "清华大学"
    intro: >
      清华大学工程物理系 CT 成像组由邢宇翔、张丽两位教师带领，研究 X 射线
      CT 成像系统与图像重建方法。研究内容包括层析重建算法、光子计数与
      能谱（多能）CT，以及以射线源阵列替代机架旋转的固定式多源 CT 系统
      设计。该组依托系内的粒子技术与辐射成像教育部重点实验室开展工作。
  seu-ct:
    institution: "东南大学"
    intro: >
      本条目涵盖东南大学位于南京的两个 CT 重建研究组：计算机科学与工程
      学院（影像科学与技术实验室）的陈阳教授组，以及生物科学与医学工程
      学院的罗守华教授组。他们的研究面向低剂量 CT 重建，以及稀疏视角、
      有限角等非理想测量条件下的图像增强。2026 年，由计算机学院团队主导
      的 TAMP 发表于 Nature Communications，该工作是一个在物理仿真数据上
      预训练、用于非理想测量 CT 通用增强的成像基础模型。
  hkust-xmed:
    institution: "香港科技大学"
    intro: >
      香港科技大学 XMed 实验室由电子与计算机工程学系的李小萌领导，研究
      医学人工智能与计算机视觉。其 DeepSparse 模型（IEEE Transactions on
      Medical Imaging，2026）是一个用于稀疏视角锥束 CT 重建的基础模型，在
      大规模腹部 CT 数据集（AtlasAbdomenMini，约 7k 个体数据）上预训练，
      并可用少量标注样本微调到不同解剖部位。
