  status: active
  intro: >
    Jeffrey Fessler's group at the University of Michigan works on statistical
    (model-based) image reconstruction and the optimization algorithms behind
    it, for CT as well as PET, SPECT, and MRI. Fessler & Rogers (1996)
    analyzed the spatial resolution properties of penalized-likelihood
    reconstruction for space-invariant tomographs, work that underlies later
    methods for designing regularizers with controlled resolution properties.
    The group maintains the Michigan Image Reconstruction Toolbox (MIRT) in
    MATLAB and Julia (MIRT.jl) versions, and the PyTorch-based MIRTorch
    toolbox for differentiable image reconstruction.
  works:
    papers: [fessler-rogers-1996]
