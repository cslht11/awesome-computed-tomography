  homepage: "https://radiology.uchicago.edu/research/x-ray-tomographic-imaging-clinical-preclinical-security-and-synchrotron-ct"
  focus: [classical, sparse-view, limited-angle, spectral, low-dose]
  status: active
  intro: >
    The X-ray tomographic imaging group in the Department of Radiology at the
    University of Chicago, led by Xiaochuan Pan and Emil Y. Sidky, develops
    reconstruction algorithms and imaging systems for clinical, preclinical,
    security, and synchrotron CT. The group is known for constrained
    total-variation (TV) minimization reconstruction — the ASD-POCS algorithm
    of Sidky & Pan (2008) — which minimizes image TV subject to data
    constraints and reconstructs cone-beam CT images from sparse or
    limited-angle data. Recent work from the group includes directional TV
    algorithms, one-step spectral CT reconstruction, and reconstruction from
    truncated projection data.
  works:
    papers: [sidky-pan-tv-2008]
    toolkits: [leehoy/CTReconstruction]
    datasets: []
