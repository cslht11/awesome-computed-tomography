    The CT Clinical Innovation Center at Mayo Clinic, founded in 2004, develops
    and evaluates new CT technology, clinical applications, and dose-reduction
    techniques, with core faculty including Cynthia McCollough and Lifeng Yu.
    Its work covers dual- and multi-energy CT and photon-counting-detector CT,
    reviewed in McCollough et al. (2015). The center also created public data
    resources for the CT research community: the 2016 AAPM Low-Dose CT Grand
    Challenge, and the Low Dose CT Image and Projection Data library
