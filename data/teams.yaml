  homepage: "https://www.creatis.insa-lyon.fr/site/en"
  focus: [cbct, dynamic, classical, sparse-view, other]
  status: active
  intro: >
    Simon Rit's group at CREATIS works on tomographic reconstruction with a
    focus on cone-beam CT for image-guided radiotherapy, including
    regularized and sparse (compressive-sensing) CT methods and
    motion-compensated X-ray CT for cardiac and respiratory motion — methods
    that were transferred to a clinical solution in the Netherlands. The group
    develops the Reconstruction Toolkit (RTK, openrtk.org), an open-source
    cone-beam CT reconstruction toolkit built on ITK with GPU code from
    Plastimatch, released under Apache 2.0 and distributed both as C++
    classes/command-line tools and as Python packages (itkrtk) via PyPI. RTK
    supports Elekta, Varian and IBA scanner inputs, CPU/GPU
    Feldkamp-David-Kress reconstruction, 4D algorithms such as 4D ROOSTER, and
    cylindrical-detector geometries used by diagnostic CT scanners.
  works:
