  status: active
  intro: >
    The ASTRA research group of imec-Vision Lab develops tomographic
    reconstruction algorithms for electron, X-ray, neutron and magnetic
    resonance imaging, focusing on the general reconstruction problems shared
    across application fields rather than any single application. Key
    expertises include phase-contrast X-ray CT, X-ray tomography for
    non-standard acquisition geometries (e.g., laminography, tomosynthesis),
    dynamic (4D) tomography and discrete tomography. The group developed the
    ASTRA Toolbox — an open-source, GPU-accelerated software platform for
    developing novel tomographic reconstruction methods — jointly with CWI's
    Computational Imaging group.
