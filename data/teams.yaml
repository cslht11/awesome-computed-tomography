- id: fau-lme
  name: "Pattern Recognition Lab (LME)"
  name_zh: "模式识别实验室"
  institution: "Friedrich-Alexander-Universität Erlangen-Nürnberg"
  city: "Erlangen"
  country: "Germany"
  region: europe
  pi: ["Andreas Maier"]
  homepage: "https://lme.tf.fau.de/"
  focus: [geometry, cbct, unrolling, diffusion]
  status: active
  intro: >
    The Pattern Recognition Lab at FAU Erlangen-Nürnberg, headed by Andreas
    Maier since 2015, applies machine learning to medical imaging, with a CT
    line built around known operators — embedding the physics of projection
    and reconstruction as differentiable layers inside neural networks. Its
    software output includes PYRO-NN, a library of differentiable CT operators
    for parallel, fan, and cone-beam geometries, and diffct, a
    CUDA-accelerated differentiable CT library whose later versions support
    non-circular and arbitrary acquisition trajectories. A DFG-funded project,
    "Deep-Learning-basierte CBCT-Rekonstruktion beliebiger Trajektorien"
    (36 months, 324,459 EUR, announced September 2025), develops
    deep-learning-based CBCT reconstruction for arbitrary trajectories with
    partners at TH Deggendorf and Stanford University, using FAU's RRZE
    computing infrastructure.
  works:
    papers: []
    toolkits: [diffct, PYRO-NN]
    datasets: []
    benchmarks: []
  software: "diffct (GitHub: sypsyp97/diffct) — CUDA-accelerated differentiable CT library. PYRO-NN (GitHub: csyben/PYRO-NN) — differentiable CT reconstruction operators with PyTorch support and native CUDA kernels."
  verified: 2026-10-20

