- id: jhu-istar
  name: "I-STAR Lab (Imaging for Surgery, Therapy, and Radiology)"
  name_zh: "I-STAR 实验室"
  institution: "Johns Hopkins University"
  city: "Baltimore, MD"
  country: "USA"
  region: north-america
  pi: ["Jeffrey H. Siewerdsen", "J. Webster Stayman", "Wojciech Zbijewski"]
  homepage: "https://istar.jhu.edu/"
  focus: [cbct, scatter, geometry, spectral, metal-artifact]
  status: active
  intro: >
    The I-STAR Lab (Imaging for Surgery, Therapy, and Radiology) at Johns
    Hopkins University, led by Jeffrey Siewerdsen, J. Webster Stayman, and
    Wojciech Zbijewski, works on cone-beam CT (CBCT) systems and 3D
    reconstruction for image-guided interventions. Its research includes
    penalized-likelihood (model-based) reconstruction, known-component
    reconstruction for imaging in the presence of implants and other known
    objects, and physics modeling of effects such as x-ray scatter, detector
    lag, and system geometry. Early work from lab members quantified the
    magnitude and effects of x-ray scatter in flat-panel CBCT
    (Siewerdsen & Jaffray, 2001) and Monte Carlo-based scatter correction in
    cone-beam micro-CT (Zbijewski & Beekman, 2006).
  works:
    papers: [siewerdsen-2001, zbijewski-2006]
    toolkits: []
    datasets: []
    benchmarks: []
