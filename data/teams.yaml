  name_zh: "瑞典皇家理工学院 Öktem 课题组"
  institution: "KTH Royal Institute of Technology"
  city: "Stockholm"
  country: "Sweden"
  region: europe
  pi: ["Ozan Öktem"]
  homepage: "https://www.kth.se/profile/ozan"
  focus: [unrolling, classical, other, low-dose, sparse-view]
  status: active
  intro: >
    Ozan Öktem's research at KTH combines inverse problems, convex
    optimization and machine learning for medical imaging, with a line of
    work on learned iterative (unrolled) reconstruction schemes. Together with
    Jonas Adler he introduced the Learned Primal-Dual reconstruction method
    (IEEE T-MI 2018) and the ODL (Operator Discretization Library) Python
    library for inverse problems, which provides forward operators, geometries
    and analytical methods used by many subsequent CT reconstruction studies.
    The learned gradient tomography codebase implements the earlier iterative
    deep network work (Adler & Öktem, "Solving ill-posed inverse problems
    using iterative deep neural networks", Inverse Problems 2017).
  works:
