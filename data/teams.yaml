  focus: [sparse-view, low-dose, classical, geometry]
  status: active
  intro: >
    Charles Bouman's group at Purdue University works on model-based iterative
    reconstruction (MBIR) for X-ray CT, formulating reconstruction as
    statistical estimation with explicit forward models and
    Markov-random-field priors. The MBIR statistical reconstruction work
    carried out with Ken Sauer (University of Notre Dame) in the 1990s was
    later commercialized by GE Healthcare as the Veo MBIR product for
    low-dose clinical CT. The group maintains SVMBIR, an open-source
    implementation of MBIR for parallel- and fan-beam CT, and has extended
    model-based methods to distributed and multi-node reconstruction.
  works:
    papers: [bouman-sauer-1993, sauer-bouman-1993]
    toolkits: [svmbir]
    datasets: []
    benchmarks: []
  software: "SVMBIR (GitHub: cabouman/svmbir) — supervised MBIR for parallel/fan-beam CT."
