# Research groups and labs whose papers, software or data appear in this
# directory. Shown on the website's "Teams" tab; the README points at it.
#
# Fields: id (required, permanent, lower-case kebab-case — external links and
#         anchors depend on it, never rename), name, name_zh (shown on both
#         editions when set), institution, city, country, region
#         (north-america | europe | asia), pi, homepage, focus (topic ids from
#         data/meta.yaml), status (active | legacy), intro (EN; the ZH text
#         lives in data/i18n/zh.yaml under `teams:` keyed by id), works
#         (references that must resolve: papers by id, toolkits/datasets/
#         benchmarks by name), software (optional), verified (last homepage
#         check, YYYY-MM-DD).
#
# Inactive teams are removed unless their legacy is still widely used, in
# which case status is set to `legacy`. Removal needs the maintainer's say-so.
- id: rpi-wang-axis
  name: "WANG-AXIS Lab / Biomedical Imaging Center (BIC)"
  name_zh: "WANG-AXIS 实验室 / 生物医学成像中心"
  institution: "Rensselaer Polytechnic Institute"
  city: "Troy, NY"
  country: "USA"
  region: north-america
  pi: ["Ge Wang"]
  homepage: "https://wang-axis.github.io/resources/"
  focus: [diffusion, self-supervised, low-dose, sparse-view, spectral]
  status: active
  intro: >
    The WANG-AXIS Lab and the Biomedical Imaging Center (BIC) at Rensselaer
    Polytechnic Institute, directed by Ge Wang, work on x-ray CT imaging
    theory, systems, and reconstruction. The group's earlier work includes
    spiral cone-beam CT reconstruction and interior tomography, and its recent
    work applies deep learning to tomographic reconstruction, including the
    FORCE framework (2025), which combines a Poisson flow generative prior
    with data fidelity for reconstruction under low-dose, sparse-view, and
    metal-artifact conditions. The center also operates CT hardware that
    includes a photon-counting (MARS) spectral micro-CT scanner and a
    grating-based x-ray phase-contrast imaging platform.
  works:
    papers: [force]
    toolkits: []
    datasets: []
    benchmarks: []
  software: "Code in the lab's GitHub organization (github.com/WANG-AXIS): FORCE, RDDM (low-dose CT denoising), LEARN (sparse-data CT reconstruction network), M3FM."
  verified: 2026-10-20

- id: uchicago-xray
  name: "X-ray Tomographic Imaging Group"
  name_zh: "X 射线断层成像课题组"
