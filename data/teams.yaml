  intro: >
    The Computational Image Analysis group at Cambridge works on mathematical
    imaging and inverse problems, with a dedicated CT remit on closing the gap
    between mathematical advances and clinical practice. Its tomographic work
    covers data-driven reconstruction methods — including iterative unrolled
    methods, learned regularizers, and Plug-and-Play approaches — alongside
    variational regularization, Krylov subspace solvers, and 4D imaging. The
    group develops LION (Learned Iterative Optimization Networks), an open
    software package that collects post-processing, unrolled,
    learned-regularizer, Plug-and-Play and self-supervised CT reconstruction
    methods with reproducible training pipelines and CT datasets.
