    The Computational Imaging group at CWI develops mathematics- and
    algorithm-driven methods for 3D imaging across science, medicine and
    industry, combining advanced acquisition, parameter estimation and
    discrete tomography — including real-time reconstruction via RECAST3D and
    the in-house FleX-ray lab that couples a custom CT scanner to advanced
    processing and AI algorithms. It jointly developed the ASTRA Toolbox with
    the University of Antwerp — a MATLAB/Python platform of high-performance
    GPU primitives for 2D and 3D tomography used by researchers, industrial
    partners, and large synchrotrons (ESRF, APS) — and tomosipo, its Pythonic
    wrapper for 3D tomography with complex geometries, aimed at pairing fast
