  status: active
  intro: >
    Guang-Hong Chen's CT research group at the University of Wisconsin–Madison
    works on reconstruction methods for low-dose and undersampled CT. Chen
    introduced Prior Image Constrained Compressed Sensing (PICCS), which uses
    a prior image as a constraint to reconstruct dynamic CT images from highly
    undersampled projection data, and PICCS has been applied to cardiac
    imaging, perfusion imaging, dual-energy CT, and C-arm CT. The group also
    works on spectral and photon-counting detector CT; UW–Madison was the
    first U.S. clinical evaluation site for GE Healthcare's silicon-based
    photon-counting CT system, with first human scanning in November 2022.
  works:
