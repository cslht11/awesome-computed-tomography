- id: llnl-leap
  name: "LEAP Project, Lawrence Livermore National Laboratory"
  name_zh: "劳伦斯利弗莫尔国家实验室 LEAP 项目"
  institution: "Lawrence Livermore National Laboratory"
  city: "Livermore, CA"
  country: "USA"
  region: north-america
  pi: ["Kyle Champley", "Hyojin Kim"]
  homepage: "https://github.com/LLNL/LEAP"
  focus: [geometry, spectral, cbct, other]
  status: active
  intro: >
    The LEAP project at Lawrence Livermore National Laboratory provides a
    library of 3D transmission CT algorithms — pre-processing, forward/back
    projectors, and analytic (FBP/FDK) and iterative reconstruction — with
    Python and C++ APIs and PyTorch bindings that make the projectors
    differentiable for integration into deep-learning pipelines. The projectors
    support multiple geometries on multi-GPU and multi-core CPU hardware and
    are aimed at industrial and laboratory CT. Physics-based modeling and
    correction (scatter, beam hardening, dual-energy decomposition) is provided
    through the companion XrayPhysics package, a C/C++ library with Python
    bindings for X-ray cross sections and source-spectra modeling.
  works:
    papers: []
    toolkits: [LEAP, XrayPhysics]
    datasets: []
    benchmarks: []
  software: "LEAP — LivermorE AI Projector for Computed Tomography (GitHub: LLNL/LEAP). XrayPhysics (GitHub: kylechampley/XrayPhysics) — cross sections, spectra modeling, multi-material beam-hardening correction, dual-energy decomposition."
  verified: 2026-10-20

