# Dataset and benchmark pages: /datasets/<slug>/, /benchmarks/<slug>/ and the
# /datasets/ index (each in English and Chinese).
#
# scripts/resource_pages.py decides which rows of data/datasets.yaml and
# data/benchmarks.yaml get a page of their own. Every fact on those pages is
# read from the directory record itself (note, modality, tasks, licence, year,
# links) or from data/papers.yaml; nothing here adds facts. A row gets a page
# only when it has real content:
#
#   - a description: its `note` is at least `min_note` characters long, and
#   - an official link, and
#   - at least one connection in the repository: a topic page lists it
#     (data/topics.yaml `match` / `also`), or a paper in data/papers.yaml names
#     it (title, note or abstract blurb; see `aliases`) or links to it.
#
# Rows that fail stay in the directory tables on the homepage; the build prints
# which were skipped and why. `skip` removes a row that would otherwise pass,
# with the reason recorded here.
#
# Per-row settings, keyed by the exact `name` in datasets.yaml / benchmarks.yaml
# (the build fails if a name does not exist):
#   slug      URL segment, when the name does not make a good one
#   short     display name used in <title>, when the full name is a sentence
#   aliases   extra strings that, found in a paper's title, note or abstract
#             blurb, mean the paper uses or describes this entry. Matching is
#             case-insensitive on word boundaries. Each alias must be a name
#             the entry's own record or a paper actually uses for it.
#   cite      ids in data/papers.yaml that describe this entry (its descriptor
#             or challenge paper); shown as "How to cite" and as the JSON-LD
#             `citation`.

min_note: 80

datasets:
  "LoDoPaB-CT":
    aliases: ["LoDoPaB"]
    cite: [lodopab-ct]
  "LDCT-and-Projection-data":
    slug: ldct-and-projection-data
  "2016 Low Dose CT Grand Challenge data":
    slug: aapm-2016-ldct-challenge-data
    short: "AAPM 2016 Low Dose CT Grand Challenge data"
  "Helsinki Tomography Challenge 2022":
    aliases: ["Helsinki Tomography Challenge"]
  "SPARE 4D-CBCT":
    slug: spare-4d-cbct
    cite: [spare]
  "Finnish Inverse Problems Society (FIPS) datasets":
    slug: fips-datasets
    short: "FIPS tomography datasets"
  "COBRA2026: a large-scale multicenter pelvic cone-beam computed tomography projection dataset":
    slug: cobra2026
    short: "COBRA2026"
  "MORE: Multi-Organ Medical Image REconstruction Dataset":
    slug: more
    short: "MORE"
  "Walnut-21 (two dose levels)":
    slug: walnut-21
  "FleX-ray Walnut CBCT Collection (CWI)":
    slug: flex-ray-walnuts
    short: "FleX-ray Walnut CBCT Collection"
  "Carved cheese (FIPS)":
    slug: carved-cheese
  "LoDoPaB-CT (benchmark release paper)":
    skip: "Not a separate dataset: it is the Scientific Data descriptor of LoDoPaB-CT, which is cited on the LoDoPaB-CT page."

benchmarks:
  "AAPM Low-Dose CT Grand Challenge":
    slug: aapm-low-dose-ct-grand-challenge
    aliases: ["AAPM-Mayo", "Low-dose CT Grand Challenge"]
  "Helsinki Tomography Challenge":
    aliases: ["Helsinki Tomography Challenge"]
  "LoDoPaB-CT benchmark":
    aliases: ["LoDoPaB"]
    cite: [lodopab-ct]
  "SPARE Challenge":
    aliases: ["SPARE: Sparse-view reconstruction challenge"]
    cite: [spare]
  "CTooth / CTooth+":
    slug: ctooth
    short: "CTooth / CTooth+"
  "Noise2Noise denoising protocol":
    aliases: ["Noise2Noise"]
  "Generating synthetic computed tomography for radiotherapy: SynthRAD2025 challenge report":
    slug: synthrad2025
    short: "SynthRAD2025"

