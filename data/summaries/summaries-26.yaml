# Batch: AgentCT (EN quick-read, verified against arXiv:2611.11503, 2026-11-10).
agentct: >-
  A vision-language agent for universal CT restoration: a LoRA-fine-tuned Qwen3-VL-4B controller identifies the degradation type and severity, then routes each case to a dedicated specialist — an image-domain diffusion model for low-dose CT, and projection-domain correction with data consistency, differentiable FBP and image refinement for sparse-view CT and metal artifacts. On Mayo 2020 abdominal CT across nine settings (three degradations × three severities), it reaches 46.18 dB / 0.984 overall, beating AMIR (44.93 dB) and TAMP (44.29 dB) on every setting; the sparse-view specialist alone reaches 46.04 dB with 4.2M parameters, versus 44.43 dB for single-task AMIR and 43.57 dB for all-in-one AMIR (23.5M).
