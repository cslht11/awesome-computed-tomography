# Batch: CREATIS team sweep #15 (EN quick-reads, verified against IEEE 2026-10-25; GLIMPSE year follows formal volume 2025).
glimpse-scalable-robust-ct: >-
  Multi-scale convolutional neural networks easily overfit large-scale structure, generalize poorly to out-of-distribution samples, and have memory and compute complexity growing unfavorably with image resolution; Glimpse is a local coordinate neural network that reconstructs each pixel value using only the measurements relevant to that pixel's neighborhood. It significantly outperforms successful CNNs on out-of-distribution samples, reaches comparable or better performance in-distribution, with near-resolution-independent memory (5GB to train on 1024x1024 images), and is fully differentiable, plug-and-play capable, and able to correct mismatched projection directions.

sim2real-material-decomposition: >-
  Variational methods for nonlinear spectral CT material decomposition are slow and critically depend on the choice of regularization functional, while convolutional networks need large experimental datasets; this method uses a U-Net architecture with Sim2Real transfer learning, transferring knowledge learned from synthetic data to real scenarios, where synthetic data come from soft-tissue and bone numerical phantoms generated from KiTS19 Challenge human CT volumes with simulated scanner-energy-response photon-counting data. The authors compare projection-domain and image-domain decomposition, and the proposed Sim2Real strategy against regularized Gauss-Newton (RGN) on synthetic, experimental phantom and human chest data.
