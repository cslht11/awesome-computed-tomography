# Batch: KAIST BISPL team sweep #17 (EN quick-reads, verified against IEEE/PubMed 2026-10-25).
one-network-all-rois: >-
  ROI CT reduces X-ray dose and allows small detectors, but standard analytic reconstruction such as filtered backprojection produces severe cupping artifacts, model-based iterative reconstruction is computationally heavy, and networks previously learning cupping artifacts generalize poorly across ROIs; two networks are designed, one learning ROI-size-dependent cupping artifacts from FBP images and the other inverting the truncated Hilbert transform from truncated differentiated backprojection data, with generalization tested across ROI sizes, pixel sizes, detector pitches and short-scan start angles. The new networks significantly outperform iterative methods at all ROI sizes with much lower complexity, serving as a general CT reconstruction engine unaffected by detector truncation.

dbp-domain-conebeam-artifact: >-
  Circular-trajectory cone-beam CT is widely used for its relatively simple geometry, but the standard Feldkamp-Davis-Kress algorithm shows cone-beam artifacts growing with cone angle, while iterative reconstruction needs repeated expensive forward and backprojections; a deep network in the differentiated backprojection domain performs data-driven inversion of the ill-posed deconvolution linked to the Hilbert transform, then spectral blending merges coronal and sagittal reconstructions to reduce spectral leakage. Experiments under various conditions show good generalization, beating iterative methods at significantly lower complexity.

cycle-free-cyclegan: >-
  CycleGAN achieves high-performance, ultra-fast low-dose CT denoising without paired training data, but cycle consistency requires two generators and two discriminators, demanding GPU resources and training skill; switchable CycleGAN with AdaIN uses one generator but still needs two discriminators and an extra AdaIN code generator. A cycle-free CycleGAN with only one generator and one discriminator still guarantees cycle consistency because the invertible generator automatically satisfies the cycle-consistency condition and removes the extra discriminator; across dose levels it uses only 24% of the learnable parameters, trains twice as fast, and beats existing methods on the complexity-quality tradeoff.

cardiac-cyclegan-noise-disentanglement: >-
  ECG-gated cardiac CT angiography needs continuous acquisition over the full cardiac cycle, so reducing cumulative radiation dose matters for patient safety; ECG-gated dose modulation can acquire multi-phase images at low dose but introduces noise in reconstruction. An unsupervised deep-learning method based on noise disentanglement extracts the noisiest high-frequency signals with wavelet transforms, trains a CycleGAN on high-frequency signals from unpaired low-dose and high-dose CT, and subtracts the estimated noise from the input after training; radiologist visual grading and SNR on 4%-dose CT show image quality far above low-dose CT and baseline CycleGAN, as an important denoising platform for low-dose CT.

metal-artifact-beta-cyclegan: >-
  Metal artifact reduction is an important CT research topic, but supervised learning needs paired metal-free and metal-corrupted images rarely available in real CT acquisition, while unsupervised feature-disentanglement methods are too complex in network structure for large clinical images; a β-CycleGAN from optimal-transport theory enables proper feature-space disentanglement, with convolutional block attention (CBAM) layers in the generator focusing on metal artifacts for effective removal. Experiments confirm better metal artifact reduction while preserving original detail textures.

adain-tunable-cyclegan: >-
  CycleGAN is a strong unsupervised low-dose CT denoising approach, but training needs two deep generators (only one used at inference), the auxiliary generator for cycle consistency adds memory and learnable-parameter burden, and conversion is limited to two domains without intermediate denoising levels; a single-generator tunable CycleGAN uses adaptive instance normalization (AdaIN) layers so the baseline low-to-routine-dose generator switches to high-to-low-dose by changing only the AdaIN code, minimizing extra memory and weights and training more stably even on small data, and interpolating AdaIN codes explores multiple intermediate denoising levels. It beats prior CycleGAN methods with about half the parameters and offers tunable denoising potentially useful in clinical settings.
