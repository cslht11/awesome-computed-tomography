# Batch: 2026-11-10 list review (EN quick-read, verified against arXiv abstracts, 2026-11-10).
sonar: >-
  SONAR is a structure-consistent neural operator for null-space-aware sparse-view CT reconstruction: instead of recovering the full null-space component, it predicts a low-dimensional null-space-aware representation from the acquired projections as pseudo-measurements, separates measurement and pseudo-measurement residuals, and constrains their structural effects with independent neural operators, including an anisotropic U-shaped operator for cross-discretization reconstruction. On simulated AAPM data it improves PSNR by 1.87 dB at 62 views and by 7.63 dB under zero-shot transfer to a 512x512 grid over the strongest competing methods, and it achieves the best overall performance on clinical MARS photon-counting CT data.

physics-independent-pair: >-
  A physics-driven framework for iterative self-supervised low-dose CT denoising: a learned sinogram prior and the LDCT noise model guide posterior inference of photon counts, separating the Poisson and Gaussian components, which are then processed by binomial thinning and Gaussian data thinning to build two approximately independent training branches from a single low-dose measurement. Cross-domain iteration progressively refines the prior and the training pair while staying consistent with CT acquisition physics; on simulated AAPM, LIDC-IDRI and LoDoPaB-CT data and on real LDCT data it consistently beats the evaluated self-supervised baselines and performs comparably to the evaluated supervised baseline. Submitted to IEEE TCSVT.

physics-flow-matching: >-
  Flow Matching as a generative prior for CT reconstruction: a high-resolution rectified flow model is trained on 256x256 chest images from the Mayo Clinic Low-Dose CT dataset with a two-stage strategy — strong anatomically informed augmentation first, then fine-tuning with reduced or no augmentation — and serves as the prior for flow-specific reconstruction methods including Plug-and-Play Flow, FlowDPS, Flower and Flow-Priors. Across several CT inverse-problem settings, the flow-matching approaches consistently outperform diffusion baselines (DDRM, DPS, DiffPIR) in PSNR, SSIM and perceptual quality while requiring fewer sampling steps.

higdiff: >-
  HiGDiff is a feed-forward hierarchical Gaussian diffusion framework for extreme CT reconstruction, covering sparse-angle, limited-angle and low-photon-count degradations in isolation, in pairs or jointly: physics-conditioned anatomical anchors and a foreground capacity field allocate Gaussian primitives to informative regions, a structure diffusion stage recovers global attenuation geometry and conditions a detail diffusion stage for residual boundaries and tissue transitions. On three CT benchmark datasets it achieves state-of-the-art results across isolated, paired and joint degradation settings, including +5.81 dB macro-average PSNR and +0.113 SSIM on the LDCT-PD collection.

encore: >-
  ENCORE is an efficient noise context-aware representation framework for low-dose CT denoising: it reformulates noise synthesis from a realistic non-Gaussian noise distribution, extracts local noise power and correlation contexts to guide denoising, and introduces FlyingConv, which adapts convolution weights per local image region. Manipulating the intensity of the noise-context maps at inference time enables zero-shot conditional denoising with dynamic control over output texture, with substantial gains in both denoising quality and computational efficiency.

electric: >-
  ELECTRIC is a physics-guided Bayesian formulation for CT reconstruction with iterative correction: an evidential neural network provides an image proposal and an error-predictive epistemic-uncertainty surrogate, which is converted into an adaptive precision field and inserted into a Poisson-weighted MAP update, so prior confidence becomes a learned state variable of the iteration. On held-out Mayo patients, the learned prior mean reduces reconstruction error by roughly 70% relative to filtered back-projection, the learned uncertainty is error-predictive and supports selective trust, and the adaptive-precision reconstruction matches or exceeds a validation-tuned fixed prior while remaining markedly more robust to prior-strength misspecification.

agentic-autoresearch-ct: >-
  An LLM agent that does reconstruction research on its own: in an agentic loop (edit a solver, run a short cluster job, read one frozen metric, revise) it independently implemented, tuned and benchmarked 26 reconstruction methods on Mayo low-dose CT and a 128-view sparse-view breast task from the DL-Sparse-View Challenge, all sharing one differentiable fan-beam projector. It recombined the methods into a compact 969-parameter solver that ties the top Mayo tier at the 1% level using 0.4% of the champion's parameters, and the benchmark shows noiseless leaderboards do not predict noisy-input robustness — the noiseless breast champion collapses from 0.89 to 0.00 under mild noise, while a learned primal-dual method rises to champion.

splitting-svct-design: >-
  A unified framework for splitting-based self-supervised sparse-view CT reconstruction, decomposing the design into partitioning, preprocessing and inference, with two extensions: multi-partition splitting and an alternative inference strategy. On simulated LoDoPaB-CT data under independent and correlated noise and on the real 2DeteCT dataset, the optimal partitioning depends strongly on noise structure — lattice-based splitting is favorable under independent noise, while angular masking is more robust under correlated noise and real measured data — and multi-partition splitting consistently improves over pure projection-wise splitting.
ml-spnp: >-
  Multilevel stochastic Plug-and-Play for sparse-view CT, formulated on wavelet multiresolution analysis approximation spaces: coarse-to-fine initialization followed by a finite sequence of multilevel corrections with resolution-specific denoisers. Under suitable assumptions, the fine-level iterations after the multilevel phase inherit the convergence guarantees of the underlying stochastic PnP algorithm. On two CT datasets with 20–50 projection views, it matches the reconstruction quality of the evaluated stochastic PnP methods while generally requiring less reconstruction time.

psct-net: >-
  A geometry-aware framework for reconstructing 3D pediatric skull CT from sparse bi-planar X-rays: differentiable back-projection builds a spatially faithful volumetric prior that alleviates depth ambiguity, an Attention-Guided Projection (AGP-3D) module learns non-linear voxel-wise correspondences between 2D regions and 3D locations, and a Bidirectional Mamba (BiM-3D) module captures long-range volumetric dependencies with linear complexity. It is evaluated on a private institutional pediatric skull CT cohort, PedSkull-CT, covering normal and pathological cases.

tracing-oracle: >-
  A plug-and-play framework for improving diffusion timestep scheduling in 3D CT reconstruction: densely sampled numerical integration trajectories on a few samples serve as a reference oracle, and dynamic programming extracts an optimized schedule that globally minimizes the cumulative error between the few-step approximation and the oracle, allocating the limited sampling steps to evolution stages most susceptible to truncation errors. Combined with the state-of-the-art 3D CT method DDS on the AAPM dataset, the optimized timesteps significantly improve reconstruction fidelity and efficiency over heuristic schedules, especially with at most 10 sampling steps.

gradient-step-pnp-dental: >-
  A plug-and-play gradient-step algorithm for reducing photon noise in dental cone-beam CT: a gradient-step denoiser is trained on reconstructed simulated fan-beam acquisitions with photon noise added to the projection data, then integrated into the reconstruction. Experiments on synthetic data demonstrate its denoising capability, and qualitative evaluations on real images show its performance and generalization.

fast-dip: >-
  Fractional-gradient Autoencoding Sequential Tomography DIP (FAST-DIP) for 3D CT reconstruction from incomplete or noisy measurements: input-adaptive sequential deep image prior modeling of slices is combined with a fractional l1/l2 sparsity prior on gradients along the slice (z) direction to explicitly enforce inter-slice structural consistency. The alternating minimization algorithm under the majorization-minimization framework is shown to descend monotonically and converge to a critical point under the Kurdyka–Łojasiewicz property. Experiments on 3D X-ray CT show improved reconstruction quality and structural consistency over existing DIP-based approaches.

frequencyct: >-
  The first zero-shot self-supervised method for pseudo-sample generation in the frequency domain for low-dose CT denoising: exploiting the distinct frequency-domain distributions of noise and true signal, regional low-frequency anchoring is combined with phase-preserving noise and mask perturbations on the high-frequency region to generate pseudo-samples for self-supervision, and consistent data truncation stabilizes optimization gradients. Evaluated on multiple public and real datasets, it shows clinical application potential.

neighbor2inverse: >-
  A self-supervised denoising framework for low-dose propagation-based phase-contrast CT (PBI-CT) that generalizes to clinical CT: building on the Neighbor2Neighbor principle, each noisy projection is subsampled into two variants preserving structural information but containing independent noise realizations, which are reconstructed separately and used as training pairs for an image-domain denoising network. In region-of-interest PBI-CT experiments it achieves superior noise suppression while preserving fine structural details, with improved contrast-to-noise ratio, spatial resolution and composite image quality metrics; competitive performance is also observed on clinical CT under simulated low-dose conditions.

residual-gaussian-splatting: >-
  Residual Gaussian Splatting (RGS) for ultra sparse-view cone-beam CT: a spectrally-decoupled Gaussian representation stratifies the volumetric field into a geometric base component and a residual detail component, turning explicit high-frequency fitting into a physically consistent implicit residual compensation task that respects the non-negativity of X-ray attenuation, with wavelet multi-resolution analysis supplying high-frequency information. A spectral-spatial collaborative optimization strategy coordinates geometric anchoring and texture refinement to prevent spectral crosstalk. On clinical datasets, RGS captures highly refined geometric textures and resolves the trade-off between artifact suppression and detail preservation, with superior visual fidelity in complex trabecular and vascular structures over existing neural rendering baselines.
deep-rl-angle-selection: >-
  Dose-aware acquisition and reconstruction for sparse-view CT: a PWLS-PnP reconstruction backbone is combined with a reinforcement-learning strategy for adaptive angle selection that explicitly accounts for angle-dependent photon statistics, so more dose goes to the most informative directions instead of uniform angles and equal dose. Numerical experiments show it improves reconstruction quality and defect detectability over conventional strategies, especially with only a small number of projections or a constrained dose budget.

memory-efficient-inr-ct: >-
  Implicit neural representations are parameter-efficient and fully differentiable, but optimizing them for CT with standard auto-differentiation is prohibitively GPU-memory-intensive in 3D, because simulating ray projections needs many INR evaluations. This paper proposes a memory-efficient stochastic gradient approximation that decomposes the gradient into a Jacobian-vector product amenable to stochastic subsampling, trading GPU memory against gradient accuracy; on synthetic 2D data it uses far less memory than standard INR training with comparable convergence and mean squared error, and it enables memory-efficient 3D sparse-view cone-beam CT reconstruction.

ipv2: >-
  An improved image-purification strategy for real-world ultra-low-dose (2% dose) lung CT denoising: the original strategy corrected the spatial misalignment between real ultra-low-dose and normal-dose CT but suppressed noise only in the chest wall and bone, leaving the background and lung parenchyma untreated. IPv2 redesigns it with three modules — Remove Background, Add noise, Remove noise — giving the model denoising capability in both background and lung tissue, and on a real-world patient lung CT dataset at 2% dose it consistently improves background suppression and lung parenchyma restoration across multiple mainstream denoisers.

plot-ct: >-
  PLOT-CT tackles low-dose CT reconstruction in the pre-log domain, where most methods work in the image or post-log projection domain and the logarithmic transform amplifies noise. It applies Voronoi decomposition to pre-log sinograms, disentangling the data into distinct components embedded in separate latent spaces, which improves discriminative feature learning, mitigates noise and preserves pre-log information; experiments show a 2.36 dB PSNR improvement over traditional methods at the 1e4 incident photon level.

hybrid-2d-3d-cnn: >-
  Presented at IEEE NSS/MIC/RTSD 2025, this hybrid framework reduces artifacts in undersampled 3D cone-beam CT: a 2D U-Net first extracts feature maps slice by slice, which are stacked across the volume and fed to a 3D decoder that uses cross-slice context to predict an artifact-free 3D CT volume. The two-stage design balances the efficiency of 2D processing with the volumetric consistency of 3D modeling, substantially improving inter-slice consistency in the coronal and sagittal directions with low computational overhead.

principled-confidence-ct: >-
  A principled framework for confidence estimation in deep CT reconstruction, built on sequential likelihood mixing with theoretical coverage guarantees and a realistic Beer-Lambert log-linear forward model with Poisson noise. It applies to classical algorithms and deep methods alike, including U-Nets, U-Net ensembles and generative diffusion models; empirically, deep methods yield substantially tighter confidence regions than classical reconstructions without sacrificing coverage, and the framework enables hallucination detection with interpretable visualizations of the confidence regions.

vsgc: >-
  VSGC is a visible-singularities-guided correlation network for limited-angle CT, designed around the core imaging characteristics of the task — the directionality of artifacts and the directional loss of structural information caused by missing projection angles. It first extracts visible-singularity (VS) edge features from the limited-angle image and focuses attention on them, then correlates those features with other image regions, with a multi-scale loss under an anisotropic constraint; validated on simulated and real datasets, it improves PSNR by 2.45 dB and SSIM by 1.5% over alternatives in small angular ranges.

dufal: >-
  Published in TMLR, DuFal is a dual-frequency-aware framework for high-fidelity, extremely sparse-view cone-beam CT reconstruction that integrates frequency- and spatial-domain processing in a dual-path architecture. Its core is the High-Local Factorized Fourier Neural Operator — a global high-frequency-enhanced FNO branch capturing global frequency patterns and a local branch processing spatially partitioned patches to preserve locality — plus a Spectral-Channel Factorization scheme that cuts FNO parameters and a Cross-Attention Frequency Fusion module; on LUNA16 and ToothFairy it significantly outperforms state-of-the-art methods in preserving high-frequency anatomical features under extremely sparse views.
