# Batch: 68-item list follow-up (EN quick-read, verified against arXiv:2303.14739 2026-10-25).
geometry-aware-attenuation-learning-sparse-view-cbct: >-
  Sparse-view CBCT reconstruction reduces radiation dose, but recent deep learning and neural rendering methods either produce unsatisfactory results or suffer time inefficiency from per-case optimization; a geometry-aware encoder-decoder framework encodes multi-view 2D features from X-ray projections with a 2D CNN, leverages CBCT scanning geometry to back-project them into a comprehensive 3D volumetric feature map, and recovers the CBCT image with a 3D CNN decoder. Respecting the geometric relationship between the 3D image and its 2D projections during back-projection and using population-learned priors, it adapts to extremely sparse inputs without individual training, such as only 5 or 10 projections; extensive evaluations on two simulated datasets and one real-world dataset demonstrate exceptional reconstruction quality and time efficiency.
