# Batch: KTH Oktem team sweep #14 (EN quick-reads, verified against ScienceDirect/SIAM/IEEE/AIMS 2026-10-25).
deep-microlocal-limited-angle: >-
  This method simultaneously solves tomographic reconstruction and wavefront-set extraction, based on a digital wavefront-set extractor and the microlocal canonical relation of the Radon transform; it requires the network to extract both the correct true wavefront set and the true image from X-ray data to improve reconstruction. As theoretical basis, the authors give a digital microlocal canonical relation for deep convolutional residual networks, supported by numerical evidence.

dictionary-learning-tomographic: >-
  Combining clinical low-dose tomographic reconstruction with sparse signal processing and deep learning, this work describes dictionary-based sparse representation statistically and interprets dictionary learning as aligning a generative model distribution with the empirical signal distribution. Sparse coding with a learned dictionary thus resembles a specific variational autoencoder with a linear decoder and a sparse-coding encoder; dictionary learning also benefits from deep-learning parallel and stochastic optimization, and dictionary regularization in CT reconstruction reaches performance comparable to existing model-based and data-driven methods.

photon-counting-learned-forward: >-
  Photon-counting CT promises higher spatial resolution and material decomposition in reconstruction, but efficient modeling of inter-detector crosstalk is a major difficulty; a trained deep convolutional network models crosstalk as a partially learned forward operator, with convergence proven in second-order optimization for spectral CT. In numerical experiments on small-scale CT acquisitions based on a realistic physics model, against a full crosstalk model as reference, the method improves PSNR by 20 dB over fully ignoring crosstalk while roughly halving the full model's compute time, and generalizes well to unseen data.

helical-learned-primal-dual: >-
  Deep-learning CT reconstruction excels on simulated 2D low-dose data, especially domain-adaptive networks incorporating handcrafted physics models, which reduce training-data needs and improve generalization; but training for 3D helical CT — the most common medical imaging acquisition geometry — quickly becomes computationally prohibitive, and clinical data add flux-measurement errors, resolution mismatch and missing ground truth not covered by simulation. Adapting the Learned Primal-Dual architecture by splitting the helical trajectory into segments and applying unrolled LPD iterations per segment enables training and testing on full-size low-dose clinical data on a single 24GB GPU, claimed as the first unrolled deep-learning architecture applied to such data.

sparse-view-elongated-objects: >-
  In the wood industry, logs are often quality-checked by discrete X-ray scans from few source positions on a conveyor belt, and single-slice data are insufficient for 3D reconstruction preserving biological features. A learned iterative reconstruction method based on Learned Primal-Dual networks suits sequential-scan geometry and accumulates information across adjacent slices rather than reconstructing each slice alone; assessed with a knot-segmentation U-Net, reconstruction from only five source positions is accurate enough to identify knots, heartwood and sapwood.

sdf-self-supervised-denoiser: >-
  SDF is a self-supervised training method for learned image denoisers for X-ray CT: pretraining relies only on observed data and fine-tuning needs only few images, suiting sparse-view and low-dose CT. Its core trains the denoiser in sinogram space, defining the denoising learning task as predicting one sinogram subset from another with no ground-truth image data, exploiting the rich sinogram data in CT; in 2D fan-beam and 3D cone-beam CT, SDF beats other analytical and self-supervised frameworks in PSNR, and fine-tuning gains with few samples are retained, making it a pretraining method when high-quality image data are scarce and a potential building block for CT foundation image-enhancement models.
