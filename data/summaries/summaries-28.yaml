# Batch: 2026-11-21 arXiv sweep follow-up (EN quick-read, verified against arXiv abstract, 2026-11-21).
acus: >-
  An uncertainty score for incomplete-view CT. Sparse-view and limited-arc scans are usually treated as projection completion and ranked by similarity to one ground-truth image, but that score can be high even at angles far from every acquired view, where a learned prior may invent anatomy the scan never constrained. ACUS instead computes the Winkler interval score of a nominal 90% predictive interval on held-out projections, binned by distance to the nearest acquired view: it charges interval width and adds a large miss penalty when a held-out pixel falls outside the interval, with collapse on acquired angles as a consistency check on the predictor. On chest and dental cone-beam orbits, interval width grows with the angular gap, empirical coverage ranges from 77% to 92%, and the point estimate's PSNR falls as the width rises; nearest-neighbour, interpolation and point completion each show zero far coverage. ACUS exposes gap-dependent overconfidence that point-estimate PSNR alone does not measure.
