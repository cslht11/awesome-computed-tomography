# Batch: SEU team sweep #19 (7 journal methods, verified 2026-10-25) + HKUST XMed sweep #20 (2 journal metal-artifact methods, verified 2026-10-25). All no code shown on checked pages.
- id: "prior-4d-cbct"
  abbr: "PRIOR"
  title: "PRIOR: Prior-Regularized Iterative Optimization Reconstruction For 4D CBCT"
  year: 2022
  venue: "IEEE J. Biomed. Health Inform."
  topics: [cbct, dynamic]
  paper: "https://doi.org/10.1109/JBHI.2022.3201232"
  note: "Combining physics-based modeling with data-driven methods for severely streaky 4D CBCT, where each phase has extremely sparse projections; the dedicated PRIOR-Net mines static information from a prior image reconstructed from fully sampled projections to improve each phase, validated on simulated and clinical 4D CBCT with good streak suppression, soft-tissue recovery and detail preservation."

- id: "direct-net-dect"
  abbr: "DIRECT-Net"
  title: "DIRECT-Net: A unified mutual-domain material decomposition network for quantitative dual-energy CT imaging"
  year: 2022
  venue: "Med Phys"
  topics: [spectral]
  paper: "https://doi.org/10.1002/mp.15413"
  note: "An end-to-end unified mutual-domain (sinogram + image) material decomposition network that directly uses cross-domain data, with stacked convolutional layers performing denoising and material decomposition together; trained on physics-simulated DECT data and validated on XCAT phantoms, biological specimens, calcium chloride and iodine phantoms, with fewer water/bone-basis artifacts and quantitative errors under 4% for calcium chloride and iodine."

- id: "cross-limited-angle"
  abbr: "CROSS"
  title: "CROSS: Cross-Domain Residual-Optimization-Based Structure Strengthening Reconstruction for Limited-Angle CT"
  year: 2023
  venue: "IEEE Trans. Radiat. Plasma Med. Sci."
  topics: [limited-angle]
  paper: "https://doi.org/10.1109/TRPMS.2023.3242662"
  note: "A cross-domain framework alternating three steps between image and measurement domains, regularizing both image space and residual error space (unlike conventional dual-domain algorithms) to strengthen organ recovery in high-attenuation regions, plus a structure-enhancement network for tissue preservation; beats comparisons on simulated and preclinical data in artifact removal and edge preservation."

- id: "sea-net-limited-angle-cbct"
  abbr: "SEA-Net"
  title: "SEA-Net: Structure-Enhanced Attention Network for Limited-Angle CBCT Reconstruction of Clinical Projection Data"
  year: 2023
  venue: "IEEE Trans. Instrum. Meas."
  topics: [limited-angle, cbct]
  paper: "https://doi.org/10.1109/TIM.2023.3318712"
  note: "For limited-angle CBCT from real clinical projection data, comparing image-domain, data-domain and hybrid deep learning approaches, SEA-Net uses a dedicated structure-enhancement subnetwork for texture preservation and spatial attention to highlight regions tied to the non-uniform wedge-artifact distribution; claimed as the first feasibility study of limited-angle CBCT on clinical projection data."

- id: "cas-pred-limited-angle-cbct"
  abbr: "Cas-PRED"
  title: "Cas-PRED: A Limited-Angle Cone Beam CT Reconstruction Research Based on Prior Information"
  year: 2024
  venue: "IEEE Trans. Instrum. Meas."
  topics: [limited-angle, cbct]
  paper: "https://doi.org/10.1109/TIM.2023.3335513"
  note: "A cascaded prior residual encoder-decoder network using full-angle CT reconstructions as prior information to guide training, addressing noise and artifacts from limited-angle data and the cost of cone-beam forward/backprojection in conventional iterative (e.g. total variation) reconstruction; reports PSNR 33.69 ± 0.90 dB, SSIM 0.9557 ± 0.0029, RMSE 22.73 ± 1.56 on [0°, 150°] reconstructions."

- id: "gdp-net-ring-artifact"
  abbr: "GDP-Net"
  title: "GDP-Net: Global Dependency-Enhanced Dual-Domain Parallel Network for Ring Artifact Removal"
  year: 2025
  venue: "TMI"
  topics: [other]
  paper: "https://doi.org/10.1109/TMI.2025.3545121"
  note: "For ring artifacts from inconsistent detector responses, exploiting their different signatures in Cartesian vs polar coordinates with a dual-domain parallel architecture, plus a Mamba mechanism for global receptive field at low cost (ring artifacts are globally correlated, which convolutions model poorly); validated on simulations and two unseen real datasets with good ring removal and detail recovery."

- id: "delta-net-high-pitch-helical"
  abbr: "Delta-Net"
  title: "Delta-Net: Deep Dual-Domain Alternating Optimization Network for High Pitch Helical CT Reconstruction"
  year: 2026
  venue: "TMI"
  topics: [sparse-view]
  paper: "https://doi.org/10.1109/TMI.2025.3617899"
  note: "A deep dual-domain alternating optimization network for incomplete high-pitch helical CT data, each sub-iteration combining projection-domain correction with image-domain refinement; learned per-domain priors enter as regularization, all hyperparameters are auto-optimized in training, and a structure-aware joint loss strengthens artifact suppression and structure recovery, beating comparisons in artifact suppression, detail recovery and generalization."

- id: "deep-sinogram-completion-mar"
  title: "Deep Sinogram Completion With Image Prior for Metal Artifact Reduction in CT Images"
  year: 2021
  venue: "TMI"
  topics: [metal-artifact]
  paper: "https://doi.org/10.1109/TMI.2020.3025064"
  note: "Metal artifact reduction framed as sinogram completion, combining image- and sinogram-domain strengths: SinoNet restores metal-affected projections while PriorNet generates a good prior image to improve continuity at metal-trace boundaries; the two nets are jointly trained end-to-end through differentiable forward projection with residual sinogram learning, and FBP reconstructs the artifact-reduced image from the completed sinogram, beating comparisons on simulated and real artifact data while preserving anatomy."

- id: "mar-self-supervised-cross-domain"
  title: "Metal artifact reduction in 2D CT images with self-supervised cross-domain learning"
  year: 2021
  venue: "PMB"
  topics: [metal-artifact]
  paper: "https://doi.org/10.1088/1361-6560/ac195c"
  note: "A self-supervised cross-domain framework removing the need for perfectly paired metal-artifact and clean CT images of identical anatomy: the network first restores the metal-trace region (from forward-projecting the metal mask) in the metal-free sinogram, a new FBP reconstruction loss encourages more complete completion, and a residual-learning image refinement module reduces secondary artifacts; metal-trace replacement with a CNN prior sinogram preserves detail and fidelity."
