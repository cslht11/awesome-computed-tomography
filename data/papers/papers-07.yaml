- id: "bcd-net"
  abbr: "BCD-Net"
  title: "BCD-Net for Low-Dose CT Reconstruction: Acceleration, Convergence, and Generalization"
  year: 2019
  venue: "MICCAI"
  topics: [low-dose, unrolling]
  paper: "https://doi.org/10.1007/978-3-030-32226-7_4"
  note: "Iterative regression network combining a denoising CNN with MBIR modules, with convergence properties and a faster MBIR solver; generalizes far beyond non-iterative FBPConvNet on clinical data."

- id: "pwls-ultra"
  abbr: "PWLS-ULTRA"
  title: "PWLS-ULTRA: An Efficient Clustering and Learning-Based Approach for Low-Dose 3D CT Image Reconstruction"
  year: 2018
  venue: "TMI"
  topics: [low-dose]
  paper: "https://doi.org/10.1109/TMI.2018.2832007"
  note: "PWLS with a union of pre-learned transforms (ULTRA) regularizer, alternating reconstruction with sparse coding and clustering, accelerated by relaxed linearized augmented Lagrangian and ordered subsets."

- id: "dl-denoising-generalizability"
