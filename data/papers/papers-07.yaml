- id: "dect-multra"
  abbr: "DECT-MULTRA"
  title: "DECT-MULTRA: Dual-Energy CT Image Decomposition With Learned Mixed Material Models and Efficient Clustering"
  year: 2020
  venue: "TMI"
  topics: [spectral]
  paper: "https://doi.org/10.1109/TMI.2019.2946177"
