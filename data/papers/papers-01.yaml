# CT reconstruction papers.
# Generated by scripts/merge_papers.py from community sources + verified
# supplementary entries. Fields: id, abbr, title, year, venue, topics,
# paper, code, project, note.
#
# `note` is optional and used by a handful of landmark entries where the bare
# title is not enough — it is rendered as a paragraph under the entry in the
# README and is searchable on the site. Keep it short.
#
# `authors` is NOT a field here: attribution lives in the venue/title, and the
# site does not render an author list. Do not add one.

- id: "tamp"
  abbr: "TAMP"
  title: "Imaging foundation model for universal enhancement of non-ideal measurement CT"
  year: 2026
  venue: "Nat Commun"
  topics: [low-dose, sparse-view, limited-angle]
  paper: "https://doi.org/10.1038/s41467-026-73943-y"
  code: "https://github.com/YutingHe-list/TAMP"
  note: "Multi-scale integrated Transformer Amplifier. Pre-trained on 10.8M physics-driven simulated non-ideal-measurement images, then adapted to a protocol with a parameter-efficient fine-tune on a few slices — one backbone for low-dose, sparse-view and limited-angle at once."

- id: "deepsparse"
  abbr: "DeepSparse"
  title: "DeepSparse: A Foundation Model for Sparse-View CBCT Reconstruction"
  year: 2026
  venue: "TMI"
  topics: [sparse-view, cbct]
  paper: "https://doi.org/10.1109/tmi.2026.3674948"
  code: "https://github.com/xmed-lab/DeepSparse"
  note: "DiCE (Dual-Dimensional Cross-Scale Embedding) pre-trained by HyViP (Hybrid View Sampling Pretraining) on both sparse- and dense-view projections, then fine-tuned in two steps. Presented as the first foundation model for sparse-view CBCT."

- id: "lctfound"
