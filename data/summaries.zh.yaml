# 中文一句话简介（覆盖层）。
# 英文原文在 data/summaries.yaml；这里的条目按论文 id 覆盖它。
# 没有列在这里的论文会回落显示英文原文——缺口是可见的，不是静默的。
# 由 scripts/oneoff/translate_summaries.py 写入，也欢迎手工增补。
2-step-sparse-view-ct-reconstruction-with-a-domain-specifi: >-
  本文提出一个新的稀疏视角层析框架，把重建解耦为两步：先用一个在稀疏投影上训练的超分网络 SIN 克服其病态性。

3d-cbct-artefact-removal-using-perpendicular-score-based-dif: >-
  为此提出一种基于垂直分数扩散模型的三维牙种植体修复方法：模型在两个不同平面上各训练一次，并在投影域中运行。

3d-field-of-junctions: >-
  受 Field of Junctions（ICCV 2021）在二维去噪上的表现启发，本文提出完全体素化的三维 FoJ 表征：为体积中每个三维块优化一组最能解释它的三维楔形连接，并约束重叠块之间保持一致。

3dip: >-
  本质上，本文提出在测试时用模型驱动先验补足二维扩散先验在剩余方向上的不足，从而在所有维度上取得连贯的重建。

3padmm: >-
  本文提出一种面向低剂量 CT 的参数化即插即用 ADMM 框架，在单一深度学习框架内联合优化学习先验与重建参数，在噪声伪影抑制和边缘细节保留上优于现有方法。

4dcbct-prior: >-
  本文开发一种利用先验信息与有限角投影来估计在体四维 CBCT 的技术，用于肺部放疗中潜在的四维靶区验证。把在体四维 CBCT 的每一相位视为计划四维 CT 某一选定相位（先验体积）的形变。

4dgs-4dcbct: >-
  本文提出一个利用时空高斯表征从稀疏投影做四维 CBCT 重建的新框架，在条状伪影抑制、动态运动保持与细节恢复之间取得平衡。

a-ct-geometry-with-multiple-centers-of-rotation-for-solving-: >-
  随着碳纳米管（CNT）的出现，静态、瞬时 CT 扫描成为可能。把传统上旋转的热源换成由多个 CNT 组成的静态环形阵列源，成像系统就能实现高时间分辨率的扫描。

a-learnt-half-quadratic-splitting-based-algorithm-for-fast-a: >-
  本文提出一种基于半二次分裂的算法，用卷积神经网络从大规模稀疏视角 CBCT 测量中获得高质量重建，同时克服常规方法的困难。

a-review-on-deep-learning-in-medical-image-reconstruction: >-
  医学影像对现代临床的疾病诊断与治疗至关重要。医学图像重建（更广义地说，是计算机视觉中的图像复原）里的数学模型一直扮演着重要角色。

accelerated-optimization-of-implicit-neural-representations-: >-
  隐式神经表征（INR）把 CT 图像表示为一个小型神经网络：输入空间坐标、输出衰减值。本文提出两条加速途径：(1) 使用条件数更好的修改版损失函数；(2) 基于交替方向乘子法的算法。

acdnet: >-
  针对这一问题，本文提出自适应卷积字典网络（ACDNet）：兼取模型驱动与学习方法之长——既继承模型驱动方法清晰的可解释性，又保持学习方法强大的表征能力。

acid-a: >-
  ACID 将数据训练的深度网络与压缩感知启发的核感知及迭代修正结合，最小化数据残差，从而稳定不稳定的深度重建网络，消除三种已报告的不稳定模式并抵抗对抗攻击。

acid-b: >-
  本文从迭代重建的角度分析 ACID 层析重建流程，用 Lipschitz 常数证明其数值收敛性与对噪声的局部稳定性，并给出针对选定重建网络及整个 ACID 流程的对抗攻击算法。

active-view-selection-with-perturbed-gaussian-ensemble-for-t: >-
  本文提出 Perturbed Gaussian Ensemble：一个把不确定性建模与序贯决策结合起来的主动视角选择框架，面向 X 射线高斯泼溅。

ad-gs: >-
  AD-GS 用解剖密度引导的三维高斯溅射做稀疏视角牙科 CBCT 重建，以衰减感知 MCMC 采样替代不稳定的梯度驱动致密化，并加入来自医学图像分割一切模型的零样本语义正则。

adaptive-diffusion-models-for-sparse-view-motion-corrected-h: >-
  本文提出一个新框架，把联合重建与运动估计（JRM）同自适应扩散模型（ADM）结合起来，同时应对头部 CBCT 的运动补偿与稀疏视角重建。

admm-net-la: >-
  在 CT 成像的实际应用中，受扫描条件限制，被扫描物体的投影数据通常只在有限角范围内采集；而且在某些情况下重建图像质量不尽人意。

advancing-limited-angle-ct-reconstruction-through-diffusion-: >-
  有限角 CT 常因角度信息缺失而困难重重。与以往在图像域操作的方法不同，本文提出的新方法专注于正弦图修补。

airnet: >-
  稀疏数据 CT 很常见，例如乳腺断层合成、C 形臂 CT、在体四维 CBCT 与工业 CT。但由于数据高度欠采样，稀疏数据重建依然困难。

alpd: >-
  因此，亟需发展性能可与有监督方法竞争的无监督学习范式。受最大似然原理启发，本文提出一个求解病态逆问题的无监督学习框架。

alvarez-1976: >-
  常规 CT 对 X 射线能谱做积分，丢掉了能谱信息。本文指出，任意材料的能谱信息都可用少数与能量无关的常数概括，并通过低分辨率能谱测量结合常规 CT 在每个点上求解这些常数，患者剂量与常规系统相当。

an-iterative-reconstruction-method-for-dental-cone-beam-comp: >-
  牙科 CBCT 中，紧凑低成本的设计往往采用小探测器，导致视野被截断、无法完整覆盖患者头部。本文提出两阶段方法来缓解牙科 CBCT 的截断伪影。

anatomy-preserving-unpaired-cone-beam-ct-refinement-for-imag: >-
  临床上很难拿到配对的 CBCT 与 CT 数据（运动、解剖变化、采集不匹配）。本文提出 RefineCBCT：一个非配对的 CBCT 优化框架，用伪标签引导加短步扩散压制伪影，同时保住患者个体化的解剖结构。

arm-cbct: >-
  把本方法与一个循环配准算法结合使用，所得组合几乎对稀疏视角伪影不敏感，从而同时保证高空间分辨率与高时间分辨率。

ascon: >-
  本文提出新的解剖感知监督对比学习框架 ASCON：为低剂量 CT 去噪挖掘解剖语义，同时提供解剖可解释性。

at-fulltilt: >-
  为此提出 FullTilt：一个端到端框架，直接在已对齐的二维倾斜系列上做三维检测，并引入倾斜系列编码器高效融合跨视角信息。

atv-limited-angle: >-
  有限角 CT 的数据一致性随角度变化，而全变分最小化是各向同性的。本文提出一种各向异性 TV 方法，使平滑适应可用的角度信息，在体模和真实 CT 图像上优于标准 TV 重建。

autodiff-ct-workflows-2024: >-
  通过四个案例研究，本文表明自动微分在神经网络训练之外同样极为有效，可延伸到包含经典算法与机器学习算法各种组合的 CT 工作流。

automap: >-
  本文提出统一的图像重建框架 AUTOMAP（流形近似自动变换）：把图像重建重新表述为数据驱动的有监督学习任务，让传感器域到图像域的映射从合适的训练语料中自行涌现。

awtv: >-
  自适应加权全变分（AwTV）模型用局部强度梯度的指数函数给相邻体素加权，保留传统 TV 会过度平滑的边缘，并以 AwTV-POCS 方案求解，用于稀疏视角低剂量 CT 重建。

baggagect: >-
  本方法把多光谱神经衰减场重建与线性推扫（LPB）相机模型的位姿优化结合起来，并通过颜色编码网络增强新视角渲染的一致性。

balancing-efficiency-and-restoration-lightweight-mamba-based: >-
  为此提出 MARMamba，在保持图像原有解剖结构完整的前提下，有效消除不同尺寸金属造成的伪影。

bergner-2010: >-
  本文评估了若干用于慢旋转设备四维 CBCT 的算法。四维 CBCT 用于对运动物体（例如呼吸中的患者）做相位相关重建；因此像 MKB 这样的快速迭代方法可视为一种合适的折衷。

bigger-isn-t-always-better-towards-a-general-prior-for-medic: >-
  扩散模型已成功应用于 MRI、CT 重建等众多逆问题。用两种不同的后验采样算法，本文从经验上表明这类大网络并非必要。

binary-ct-limited-view-2026: >-
  针对衰减系数已知的二值工业对象 CT，本文从沿射线路径的投影直方图推导 0/1 矩阵，再经 Sigmoid 映射恢复分布，在有限视角下优于 SART 与 FBP，噪声下误差降低超 40%。

cadl: >-
  本文刻画了一种商用深度学习 CT 重建算法的噪声与空间分辨率特性：做了两组体模实验，并对各算法做了比较。

cargo-fewview: >-
  本文介绍一种 X 射线货柜安检系统，结合数字 X 线成像、少视角成像与 CT，其中少视角成像比 CT 更快给出三维图像，并配有从严重稀疏投影重建的算法。

cascaded-diffusion-discrepancy-2025: >-
  稀疏视角 CT 重建是降低辐射暴露的有前景途径，但不可避免地带来图像退化。该级联框架把部分推理步骤从像素空间移到潜空间，从而压低计算成本。

casredscan: >-
  有限视角重建伪影严重，且重建图像与实测正弦图不一致。本文提出级联残差密集空间-通道注意力网络，并加入投影数据保真层，改善了有限角和稀疏视角重建。

cbct-based-synthetic-ct-generation-using-conditional-flow-ma: >-
  放疗图像引导（IGRT）中每日或每周要做 CBCT 来精确摆位，但严重的伪影与不准的 HU 值限制了它在定量任务上的临床价值。

cbct-pose-trajectory-optimisation: >-
  CBCT 的轨迹优化决定了稀疏视角扫描能采集到哪些信息。固定候选池无法做离格精化，而且每换一种采集流形都得重做一次与物体相关的预计算。

ccn-cl: >-
  CCN-CL 用内容-噪声互补网络结合对比学习做低剂量 CT 去噪，以正常剂量图像为正样本、原始低剂量图像为负样本引导网络学习。

cd-net: >-
  CD-Net 利用双能 CT 高低能图像之间的冗余，用一个综合域网络结合投影域网络、解析重建算子和图像域网络，直接从稀疏投影生成高质量双能 CT 图像。

cg-glore-a-conjugate-gradient-based-global-local-regularizat: >-
  提出 CG-GLORE：一个受二阶优化启发的紧凑深度展开框架，用于稀疏视角 CT 重建。它只是「二阶启发式」，并非对完整学习目标做精确牛顿法。

cl-vs-ct: >-
  本文定量比较了平板样品的计算层析成像（CL）与有限角 CT：缺失角范围大时 CL 占优；投影受噪声限制时，CT 在噪声与缺失角之间的权衡更好。

clear: >-
  CLEAR 针对低剂量 CT 激进降噪后细微结构退化与模糊的问题，用综合域生成器把原始投影直接映射为高质量图像，配合多级损失与 WGAN-GP 统计迁移来抑制过平滑。

cnn-inverse: >-
  本文提出一种新的基于深度卷积网络的算法来求解病态逆问题。基于这一观察，我们提出用「先直接反演、再用 CNN」的方式求解正规卷积逆问题。

cnn-invrev: >-
  本文综述卷积神经网络在成像逆问题中的应用，包括去噪、反卷积、超分辨率和医学图像重建，这些方法已开始超越压缩感知等基于稀疏性的方法。

cnnrpgd: >-
  本文用卷积神经网络替代投影梯度下降中的投影算子：梯度下降保证测量一致性，CNN 将解递归投影到期望图像空间，优于 TV、字典学习和直接深度重建方法。

coco-pnp: >-
  为此本文提出 cocoercive 保守（CoCo）去噪器：它可以是（残差）扩张的，从而改善去噪。大量实验表明，本方法在视觉质量与定量指标上都优于密切相关的方法。

cocodiff-a-contextual-conditional-diffusion-model-for-low-: >-
  CoCoDiff 是一种面向低剂量 CT 去噪的上下文条件扩散模型，以低剂量图像为条件逆转马尔可夫链生成残差图像，并利用相邻切片上下文抑制结构失真、泛化到未见过的噪声水平。

coded-aperture: >-
  本文不用随机编码孔径，而是基于系统点扩散函数优化压缩 X 射线 CT 的编码照明模式，改善传感矩阵质量（RIP 与相干性），在仿真上 PSNR 优于随机编码，并给出真实投影的结果。

complex-wavelet-based-sinogram-segmentation-for-metal-artifa: >-
  金属物体是锥束 CT 的一大难题：其强且依赖能量的 X 射线衰减造成投影不一致，重建图像上出现严重的条状与明暗伪影。

compressed-sensing-2006: >-
  压缩感知领域表明，一个稀疏但其余任意的向量，可以从少量随机构造的线性投影（样本）中被精确恢复。本文进一步表明，在某些情形下（如离散取值向量或大幅失真）所需样本数还能减少。

computed-tomography-reconstruction-algorithm-using-markov-ra: >-
  X 射线 CT 通过倾斜系列的投影图像无损揭示材料内部结构。FBP 因计算开销小而被广泛采用。

conditional-diffusion-for-3d-ct-volume-reconstruction-from-2: >-
  胸部 X 光便宜且易得，但只有二维投影、病理信息有限。本文提出 AXON：一个多阶段扩散框架，直接从真实 X 光重建三维 CT 体积，保真度显著优于现有方法。

conditional-diffusion-posterior-alignment-for-sparse-view-ct: >-
  提出条件扩散后验对齐（CDPA），让三维稀疏视角 CT 重建可扩展。同一套原理还能增强快速去噪 U-Net，以很小的算力接近扩散级质量。

cone-beam-artifact-reduction-in-gamma-knife-cbct-images-usin: >-
  部分患者的 Gamma Knife CBCT 图像存在明显锥束伪影，原因在于锥形射束在其下缘与探测器垂直相交。

cone-beam-ct-image-quality-enhancement-using-a-latent-diffus: >-
  本文提出一种无过校正的 CBCT 图像质量增强方法，基于条件潜扩散模型与伪 CBCT 图像——后者由 CT 图像用简单方法模拟 CBCT 伪影生成，并与 CT 图像空间一致。

continuity-driven-synergistic-diffusion-with-neural-priors-f: >-
  CBCT 的临床应用受限于辐射剂量与图像质量之间的固有折衷。为此提出 CSDN（连续性驱动协同扩散，配神经先验），用于超稀疏视角 CBCT 重建。

coord-sos-pact: >-
  本文提出一种高效的自监督联合重建方法，为环形阵列 PACT 系统同时恢复声速（SOS）与高质量图像。相比当前最优方法，本方法去除 SOS 像差更准确，且快 35 倍。

cross-distribution-diffusion-priors-driven-iterative-reconst: >-
  提出 CDPIR 框架来解决 SVCT 的分布外问题：把源自可扩展插值 Transformer（SiT）的跨分布扩散先验，与模型驱动的迭代重建结合起来。

cross-modal-guidance-for-fast-diffusion-based-computed-tomog: >-
  扩散模型已成为求解 CT 逆问题的强先验。本文提出在不重训扩散先验的前提下引入另一模态，从而加速昂贵模态的成像。

cryoderec: >-
  冷冻电镜断层成像重建受极低信噪比和缺失楔伪影困扰。本文提出 cryoDeRec，一个联合去噪与缺失楔恢复的有监督多任务框架，用基于真实 EMDB 结构的物理仿真断层图训练。

cs-cbct-fom: >-
  本文考虑从一组欠采样、且可能带噪的投影测量中重建 CBCT 图像的问题。所提算法的性能通过一系列数字体模与实验体模研究加以展示。

csc-ct: >-
  过去几年，基于字典学习的方法已成功用于各类图像重建问题。但传统的字典学习 CT 重建方法基于图像块，忽略了重叠块之间像素的一致性。

ct-evolution: >-
  这篇综述回顾了 CT 重建从滤波反投影到迭代方法再到人工智能的演变，讨论了迭代重建的临床影响，以及光子计数 CT、相位衬度 CT、暗场 CT 和 AI 驱动方法的前景。

ctformer: >-
  低剂量 CT 去噪是 CT 研究中的重要问题：相比常规剂量 CT，LDCT 图像噪声与伪影严重。本文提出无卷积的 Token2Token 空洞视觉 Transformer（CTformer）用于 LDCT 去噪。

ctnet: >-
  本文提出通过隐式正弦图补全来解决该问题，用的是一个困难的真实数据集，包含常见托运行李的扫描。大量实验表明这一组合策略优于许多有竞争力的基线。

cvg-diff: >-
  基于深度学习的方法能做到单步伪影抑制，但在高度稀疏时往往产生过度平滑的结果。为此本文提出跨视角广义扩散模型（CvG-Diff），把稀疏视角 CT 重建重构为一个广义扩散过程。

dadn: >-
  基于深度学习的方法在 LDCT 成像中扮演着越来越重要的角色。本文提出领域自适应去噪网络（DADN），通过噪声估计与迁移学习来解决 LDCT 成像中的分布外问题。

dan-net: >-
  DAN-Net 用双域自适应缩放非局部网络做 CT 金属伪影校正：先用自适应缩放校正受损正弦图以保留组织与骨骼细节，再用残差正弦图学习与非局部模块抑制伪影。

data-driven-filter-design-in-fbp-transforming-ct-reconstru: >-
  本文在 FBP 框架内为 CT 重建引入一个基于傅里叶级数的可训练滤波器，代码与数据均已公开。

data-efficient-limited-angle-ct-using-deep-priors-and-regula: >-
  本文提出一种极低数据量的方法，从严重角度受限的 Radon 变换重建原图。方法在 Helsinki Tomography Challenge 2022 的数据集上评估，任务是从有限角正弦图重建二值圆盘。

datadriven: >-
  逆问题领域近期研究试图为「把数据驱动模型（尤其是深度学习模型）与物理-解析模型中蕴含的领域知识结合起来」建立数学上自洽的基础。

dbt-task: >-
  本文首次以任务为导向对比数字乳腺断层合成中的 FBP、SART 与最大似然重建，用信号 CNR 和通道化 Hotelling 观察者评估迭代次数、投影数、角度范围与剂量等参数的影响。

dc-pnpdp: >-
  为此提出双变量耦合 PnP 扩散（DC-PnPDP）：恢复经典的对偶变量以提供积分反馈，逐步迫使数据一致性与先验达成一致。

dctr: >-
  DCTR 用隐式神经表示结合参数化运动场扭曲重建有限角 4D-CT 中的快速变形场景，以自监督方式对实测正弦图优化，无需任何训练数据。

dd-net: >-
  DD-Net 先从稀疏采样正弦图做 FBP 重建，再用带捷径连接的 DenseNet–反卷积网络清理伪影，相比先进稀疏视角方法结构相似度最高提升 18%，均方根误差最高降低 42%。

ddcl: >-
  稀疏视角滤波反投影图像存在伪影和噪声。本文提出双域闭环学习网络，在训练时耦合投影到图像与图像到投影两个映射，推理时只用前一个映射，推理时间和硬件需求不增加。

dddm: >-
  提出一种新的深度学习方法——双域扩散模型（DDDM），用于稀疏视角 CT 重建，由串联的正弦图升级模块（SUM）与图像精修模块（IRM）组成。

deacnn: >-
  本文提出一个统一的低剂量 CT 卷积神经网络去噪框架，通过解剖先验融合模块和空间注意力机制编码不同身体部位的解剖先验信息，用单一网络改善多个解剖部位的去噪效果。

dear: >-
  DEAR 是三阶段稀疏视角 CT 重建网络：深度嵌入把测量扩展为伪影减轻的图像，深度注意力去除稀疏视角伪影并纠正嵌入错误，深度细化恢复更精细的特征与结构。

deep-pseudo-proximal-map: >-
  为此提出伪近端映射（PPM）：把数据拟合近端映射重新表述为某个合成概率模型的最小均方误差估计。

deepcnn: >-
  为应对这些问题，本文提出一种使用深度卷积网络的算法，作用于低剂量 CT 图像的小波变换系数。此外我们表明，相比图像域 CNN，小波域 CNN 在去除低剂量 CT 噪声上更高效。

deepsparse: >-
  为此提出 DeepSparse——首个面向稀疏视角 CBCT 重建的基础模型；其核心 DiCE（双维跨尺度嵌入）融合了多视角二维特征与多尺度三维特征。

deer: >-
  由于乳腺对 X 射线敏感，降低乳腺 CT 剂量是个重要课题，少视角扫描是主要途径。本文提出深度高效端到端重建网络（DEER），用于少视角乳腺 CT 重建。

deman-2001: >-
  该迭代极大似然算法把多色 X 射线谱建模为离散能量，并将衰减分解为光电与康普顿散射分量，在仿真与体模中有效消除束硬化伪影，金属伪影抑制是其有前景的应用。

denomamba: >-
  为高质量恢复 LDCT 图像，本文提出 DenoMamba：一种基于状态空间建模（SSM）的去噪方法，能高效捕捉医学图像中的短程与长程上下文。

desdgan: >-
  本文提出双编码器单解码器 GAN 用于低剂量 CT 去噪。一个编码器处理边缘、纹理等浅层视觉特征，另一个处理组织结构等深层语义特征，两者融合后在图像质量和诊断可接受性上均优于单编码器 GAN。

dfdlm: >-
  低剂量 CT 因能减少物体受到的 X 射线辐射而备受关注。但在临床场景中收集大量配对数据很困难，这限制了此类有监督学习方法在实际 LDCT 重建中的应用。

dgr: >-
  本文提出离散高斯表征（DGR）：一个用一组离散高斯函数、以端到端方式直接重建三维体积的新框架。

dgr-2: >-
  本方法利用了这样一个思路：深度卷积网络生成模式比生成噪声更容易，因此随机初始化的生成网络可以作为正则化重建的合适先验。

dict-learning-low-dose-2012: >-
  本文提出一个低剂量 CT 统计迭代重建框架，用冗余字典提供稀疏表示，字典可预先固定或在重建过程中自适应定义，在所选案例中相比滤波反投影和 TV 方法噪声更低、结构细节更丰富。

dif-gaussian: >-
  为此本文提出新重建框架 DIF-Gaussian：用三维高斯表示三维空间中的特征分布，为衰减系数的估计提供额外的三维空间信息。

diffmed: >-
  具体地，本文介绍了扩散模型背后的坚实理论基础与基本概念，以及三类通用的扩散建模框架：扩散概率模型、噪声条件分数网络与随机微分方程。

diffnaf: >-
  多源静态 CT 近来因能快速重建而受到关注，适合时间敏感的临床与工业场景。Diff-NAF 把神经衰减场表征与双分支条件扩散模型结合起来。

diffnr-diffusion-enhanced-neural-representation-optimization: >-
  神经表征（神经场、三维高斯）能有效建模 CT 体积，但在稀疏视角下伪影严重。为此提出 DiffNR：用扩散先验增强神经表征优化的框架。

diffraction-neural-volumetric-prior: >-
  本文提出神经体积先验（NVP），用于从稀疏视角显微图像对半透明生物样本做高保真体积重建。NVP 融合了显式与隐式神经表征，并纳入衍射光学的物理先验。

diffrecon: >-
  更好的医学图像重建算法能提升图像质量，并实现采集时间与辐射剂量的下降。对可能图像分布的先验理解是实现这些收益的关键。

diffusion-based-limited-angle-ct-reconstruction-under-noisy-: >-
  为提升在真实噪声下的鲁棒性，本文提出 RNSD⁺：一种新的噪声感知矫正机制，显式建模推理时的不确定性，从而实现可靠且鲁棒的重建。

digs-dynamic-cbct-reconstruction-using-deformation-informed-: >-
  为此本文引入基于自由形变（FFD）的空间基函数，以及一个形变知情框架：在统一形变场下耦合高斯均值位置、尺度与旋转的时间演化，从而施加一致性约束。

dinr: >-
  本文提出扩散式 CT 反演框架 DINR，用于正则化隐式神经表征，实现稀疏视角中子 CT 的高质量重建。

dior: >-
  DIOR 在残差域结合迭代优化与深度学习解决有限角 CT，用非对称卷积增强深度先验的特征提取，并以低频和高频分量的感知损失保留组织细节。

dip: >-
  本文研究了在小样本训练条件下把深度学习方法用于低剂量与稀疏角度 CT。为克服有关问题，我们把深度图像先验与经典正则化以及一个初始重建结合起来。

dip-warm-start-2022: >-
  深度图像先验（DIP）近来作为一种有效的无监督图像复原方法被提出：它把待恢复图像表示为深度卷积网络的输出，并学习网络参数使输出匹配受损观测。

dir-view-interp: >-
  为抑制锥束 CT 稀疏角采样造成的条纹伪影，本文用基于结构张量的形状驱动方向插值生成中间视角，明显优于传统插值，以少量新增模糊为代价减少条纹与噪声。

dl: >-
  有限角 CT 重建是不适定问题。本文将字典学习与图像梯度 l0 范数最小化结合：字典保留图像细节与特征，l0 范数保护边缘并减少阴影伪影，优于全变分基线方法。

dl-cl: >-
  针对有限角平移 CT，本文将 SART 重建与 U-net 卷积网络结合，在仿真实验中与现有方法相比，能有效抑制噪声和有限角伪影并保留结构。

dl-ct-incomplete-data-review-2024: >-
  这篇综述回顾了从不完整投影数据做 CT 重建的深度学习方法，涵盖稀疏视角、有限角、金属伪影去除、内重建与环伪影去除，并讨论了局限与未来方向。

dl-ct-rev: >-
  这篇《自然·机器智能》综述回顾 2016 年以来深度学习在断层成像重建中的研究，突出医学成像的代表性成果，并讨论该新兴领域仍需解决的关键问题。

dl-incomplete: >-
  该框架把 U-Net 与 CT 重建在正弦图域紧密耦合，从不完整数据估计完整投影正弦图并重建高质量图像，在稀疏视角与有限角算例上用仿真与实验数据验证。

dl-invprob: >-
  机器学习近期的工作表明，深度神经网络可用于求解计算成像中的各类逆问题。本文梳理这一新兴领域的核心主题，并给出一套可对问题与重建方法分类的谱系。

dl-piccs: >-
  动态 CT 采集中遇到的稀疏视角重建在技术上颇具挑战。近来许多深度学习策略被提出来从稀疏视角采集重建 CT 图像，结果令人期待。

dlct: >-
  本文将滤波反投影类算法映射为神经网络，提出锥束反投影层，其反向传播即为投影操作。该方法可在体积域和投影域联合优化校正步骤，在有限角设置下将感兴趣区 PSNR 提高 23%。

dlmir: >-
  本文将角向稀疏数据的图像重建表述为优化问题，用循环神经网络展开迭代求解器的固定步数迭代，并将其应用于 CT 和 SAR 稀疏视角重建，与传统方法比较。

dm4ct: >-
  为系统评估扩散模型在该场景下的表现并与既有重建方法对比，本文提出 DM4CT——一个面向 CT 重建的综合基准。

dnnss: >-
  本文提出一种由深度神经网络驱动的正弦图合成方法，用于稀疏视角 CT，并表明它优于现有插值方法以及迭代图像重建方法。

dolce-2023: >-
  本文提出 DOLCE：一个面向有限角 CT 的新深度模型驱动框架，以条件扩散模型作为图像先验。在多个困难的真实 LACT 数据集上，同一个预训练 DOLCE 模型在差异很大的图像类型上都达到了 SOTA。

dose-aware-cold-diffusion-with-physics-consistency-for-gener: >-
  为此提出剂量感知冷扩散（DACD）：一个物理一致的框架，把辐射剂量显式建模为冷扩散过程中的连续潜因子。

dream-net: >-
  DREAM-Net 是面向稀疏视角 CT 的展开式迭代网络，同时在投影域、残差空间和图像域施加深度约束：投影修复补全缺失视角，残差感知估计残差图像，图像细化学习非标准正则项。

drone: >-
  DRONE 是面向稀疏视角 CT 的双域残差优化网络，含嵌入、精炼与感知三个模块，扩展稀疏正弦图、抑制伪影、恢复残差细节并保证一致性，在临床前与临床数据上展现出边缘保持与特征恢复。

dse: >-
  锥束 CT 中散射会引起杯状伪影和暗条纹，而蒙特卡罗散射估计太慢无法常规使用。本文提出深度散射估计，用卷积网络仅从投影数据复现蒙特卡罗散射输出，可实时运行，与真值的偏差在 2% 以内。

dsignet: >-
  DSigNet 在分层神经网络中结合 CT 采集过程的降采样成像几何模型与数据驱动先验，用临床患者数据实现精确 CT 重建，并有望降低计算复杂度、加快重建速度。

dts-deform: >-
  该方法通过求解变形场来重建数字断层合成体积：把先验 CBCT 或计划 CT 体积变形以匹配新的有限角投影，将可变形配准与有限角重建结合，用于放疗图像引导。

du-gan: >-
  为更好地正则化 LDCT 去噪模型，本文提出 DU-GAN：在 GAN 框架中利用基于 U-Net 的判别器，在图像域与梯度域同时学习去噪图像与常规剂量图像之间的全局与局部差异。

dual-dict: >-
  该少视角重建方法把 SART 与字典学习、稀疏表示及 TV 最小化结合，使用两个字典——过渡字典做原子匹配、全局字典做图像更新，在仿真与真实投影上均优于 SART 与 SART–TV。

dual-domain-u-nets-with-embedded-back-projection-operators-f: >-
  本文提出从常规自由呼吸扫描做运动分辨四维 CBCT 重建的深度学习方法，既不需要呼吸信号也不做显式投影分箱；专家在肿瘤可见性上更偏好本方法。

dudodp-mar: >-
  本文提出一种基于扩散模型的无监督金属伪影消除方法（扩散模型具有很强的数据分布表达能力）。在临床数据集上，本方法的视觉效果优于有监督与无监督方法。

dudodr-net-2022: >-
  DuDoDR-Net 用双域数据一致循环网络同时处理稀疏视角与金属伪影，针对的是此前稀疏视角或金属伪影方法无法直接解决的复合问题。

dudotrans: >-
  DuDoTrans 用双域 Transformer 做稀疏视角 CT 重建，通过长程建模恢复信息性正弦图，并结合增强与原始正弦图，参数更少、泛化更好。

dvg-diffusion-dual-view-guided-diffusion-model-for-ct-recons: >-
  具体地，本文提出双视角引导扩散模型（DVG-Diffusion）：把一帧真实输入 X 光视角与一帧合成的新 X 光视角耦合起来共同引导 CT 重建。实验表明本方法优于当前最优方法。

dynamic-black-hole-emission-tomography: >-
  为突破 BH-NeRF 的强假设，本文提出 PI-DEF：一种物理知情方法，用可微神经渲染从 EHT 观测拟合四维（时间＋三维）发射率场。

eagle-an-edge-aware-gradient-localization-enhanced-loss-fo: >-
  为克服这些局限，本文提出 Eagle-Loss：一种旨在提升 CT 重建视觉质量的新损失函数。结果表明它能在多种网络架构上持续改善重建图像的视觉质量，超越当前最优方法。

easel: >-
  降低 CT 剂量对减少临床应用中的辐射风险至关重要。迭代重建是补偿光子通量下降所致噪声增加的最有希望途径之一。

edcnn: >-
  本文提出基于边缘增强的稠密连接卷积神经网络（EDCNN），其中设计了一个使用新型可训练 Sobel 卷积的边缘增强模块。

efficient-unrolled-networks: >-
  本文提出区域划分策略与正规算子近似，使端到端重建模型能把任意大规模问题的前向算子纳入架构并训练。

elbakri-2002: >-
  本文提出一种考虑多能 X 射线源能谱和能量依赖衰减的统计重建方法，以惩罚似然形式建模并用有序子集算法求解，显著减少含骨骼与软组织物体的束硬化伪影。

empirical-interpolation-projections-2023: >-
  本文提出用经验插值方法，在有被检对象先验信息时为稀疏视角工业 X 射线 CT 选择最具信息量的投影，仅用十余个投影即可获得良好的重建质量。

end-to-end-deep-learning-for-interior-tomography-with-low-do: >-
  主要结果：本文证明所提方法优于传统的图像域深度学习方法，而且投影域 CNN 的表现好于许多研究者常用的图像域 CNN。

enhancing-synthetic-ct-from-cbct-via-multimodal-fusion-and-e: >-
  CBCT 因采集快、剂量低而广泛用于术中成像。为克服模态之间固有的错位，本文在合成 CT 流程中引入一个端到端可学习的配准模块。

epi-naf: >-
  本文提出一个基于 X 射线投影图像中对应极线之间一致性条件的新损失项，用于正则化神经衰减场的优化。相比基线方法，该损失在定性与定量上都带来改善。

equivariance2inverse-a-practical-self-supervised-ct-reconstr: >-
  深度学习在降低 CT 噪声与伪影上成绩亮眼；自监督方法因不需要真值训练样本，在真实场景中尤其有吸引力。

equivariant-conditional-diffusion-model-for-head-and-neck-ct: >-
  CBCT 是放疗图像引导的常用模态，能实时显示解剖，采集成本与剂量都低。本文提出新的扩散式条件生成模型 EqDiff-CT，从 CBCT 合成高质量 CT 图像。

equivariant-multiscale-learned-invertible-reconstruction-for: >-
  本文提出 LIRE⁺⁺：一个端到端、旋转等变的多尺度可学习可逆原对偶方案，用于快速且内存高效的 CBCT 重建。它由本文同时开发的快速拟蒙特卡洛 CBCT 投影模拟器生成的模拟数据训练而来。

etedn: >-
  ETEDN 是端到端网络，用三个级联模块把稀疏正弦图直接映射为 CT 图像：正弦图去噪与插值、基于 FBP/FDK 的正弦图到图像映射、图像去噪，避免了全连接转换层。

event-based-bos-tomography: >-
  本章提出基于事件的背景纹影断层成像，从事件流重建时变四维密度场，用神经隐式场、折射光线追踪与物理信息正则化改善稀疏视角重建。

exact-gs: >-
  Exact-GS 用数学上严谨的闭式溅射解替代 3D 高斯溅射的仿射近似，在无近似的前提下达到光线追踪的渲染质量，实现快速 CUDA 光栅化，用于三维 X 射线 CT 重建与新视角合成。

extreme-few-view-ct-reconstruction-using-deep-inference: >-
  本文提出一种深度网络驱动的方法来应对极端少视角 CT：把基于卷积神经网络的推断纳入当前最优的迭代重建之中。在胸部 CT 数据集上的重建实验证明了其有效性。

fact-gs-fast-and-scalable-ct-reconstruction-with-gaussian-sp: >-
  高斯泼溅已成为图像渲染的主流技术，并迅速被移植到 X 射线 CT 重建。FaCT-GS 在标准 512×512 投影上比当前最优的 GS 重建快 4 倍以上，在 2k 投影上快 13 倍以上。

fast-ct-limited-projections-2023: >-
  凭借能建立体数据这一优势，X 射线 CT 越来越多地被用作先进制造零件（含复杂非视线特征）质量控制中的无损评估手段，同时还能按比例缩减数据量。

fast-ct-ml-generalization-2025: >-
  机器学习增强快速工业 CT 时必须在不同扫描条件下泛化，才能保持测量精度。本文提出一套方法，量化精度提升对泛化程度的敏感性，为机器学习融入快速断层成像流程奠定基础。

fc-cs-rpca: >-
  本文提出特征约束压缩感知重建，用鲁棒主成分分析从临床图像数据库提取先验知识，将特征约束与全变分结合，在体模和临床图像的有限角 CT 重建上得到改善。

fdk-1984: >-
  Feldkamp-Davis-Kress（FDK）算法给出了从锥束投影直接重建三维密度函数的近似卷积反投影公式，在中间平面退化为标准扇束公式，对许多实际几何仍实用。

fdm: >-
  近来许多深度学习网络相比迭代重建算法取得了理想表现。本文提出一个单一的退化感知深度学习框架，通过理解频域与图像域两个层面的退化差异来预测清晰 CT 图像。

field-of-view-extension-in-dental-cone-beam-ct-via-implicit-: >-
  牙科 CBCT 系统常采用截断视野的探测器配置，只能覆盖患者解剖的一小部分。本文用截断视野扫描的投影重建出扩展视野。

find-net-fourier-integrated-network-with-dictionary-kernels-: >-
  为此本文提出 FIND-Net（带字典核的傅里叶集成网络）：一个把频域与空间域处理结合起来的新金属伪影消除框架，实现更优的伪影抑制与结构保持。

fista-net: >-
  本文提出模型驱动的深度学习网络 FISTA-Net：兼取模型驱动 FISTA 算法的可解释性与通用性，以及数据驱动神经网络强正则化、免调参的优势。

font-sir: >-
  FONT-SIR 把跨谱域与空域的相似图像块组成四阶张量，在加权核范数与 TV 范数约束下分解为低秩与稀疏分量，用 ADMM 求解，优于先进方法。

foundation-vae: >-
  变分自编码器把高分辨率 CT 体积压缩成紧凑潜表示，同时保留临床相关结构。结果表明 Foundation VAE 是可扩展地复用 CT 表征、并忠实生成 CT 的实用接口。

freeseed: >-
  稀疏视角 CT 是加快扫描、降低患者辐射暴露的有前景方案，但重建图像含严重条状伪影，会影响后续筛查与诊断。

from-sparse-x-rays-to-3d-ct-training-free-reconstruction-wit: >-
  为打破这一依赖，本文提出 TF-PRDiT：一个免训练的条件采样框架，把冻结的体素级三维扩散 Transformer 先验转化为通用的医学逆问题求解器。

fstensor: >-
  能分辨 CT 每个能段的光子数更少，图像天然更嘈杂。本文提出 FSTensor，把多能图像视为三阶张量，结合张量分解、张量全变分和全谱先验信息，抑制噪声伪影并改善材料估计。

ganext-a-fully-convnext-enhanced-generative-adversarial-netw: >-
  本文提出 GANeXt：一个基于三维块、完全由 ConvNeXt 驱动的生成对抗网络，用于跨模态、跨解剖部位的统一 CT 合成。

gao-2012: >-
  在体四维 CBCT 提供呼吸相位分辨的体积成像，提升了图像引导放疗中靶区定位的精度。基于 STF 的算法实现在 GPU 平台上以提升计算效率。

gaussian-material-fields: >-
  提出高斯材料场：用共享的各向异性三维高斯基元，配各自独立的非负材料系数，来表示多种材料分布。结果表明它是体积多材料重建的一种显式、自适应表征。

gb-svfbp-gaussian-based-shift-variant-fbp-neural-network: >-
  本文提出基于高斯的位移变化 FBP 神经网络，面向非圆轨迹锥束 CT 的高效重建。

generative-modeling-in-sinogram-domain-for-sparse-view-ct-: >-
  为缓解这一局限，本文提出一个完全无监督、基于分数的正弦图域生成模型，用于稀疏视角 CT 重建。实验表明其性能与有监督方法相当甚至更好。

geometry-aware-diffusion-approximate-posterior-sampling-for-: >-
  稀疏视角 CT 能降低辐射剂量与采集时间，还可能缓解运动伪影。本文提出几何感知的扩散引导随机重建框架，面向稀疏视角与有限角 CT。

gglf: >-
  把 CT 重建算子纳入可微流程，在许多应用中已被证明有益。这类方法通常聚焦投影数据，而让采集几何保持固定。

gh-naf: >-
  GH-NAF 解耦神经衰减场的哈希网格层级，并用不确定性引导的网格自适应注意力自适应加权，在均匀组织中稳定低频建模，同时在结构边界附近保留高频细节，用于稀疏视角 CBCT。

glfc-unified-global-local-feature-and-contrast-learning-with: >-
  本文提出面向合成 CT 生成的全局-局部特征与对比学习（GLFC）框架；并进一步提出多对比损失（MCL），在不同强度窗下计算合成损失，以同时改善软组织与骨区的质量。

gmm-unnet: >-
  GMM-unNet 是无监督低剂量 CT 重建方法，通过把未配对正弦图纳入训练并以高斯混合模型刻画 CT 噪声，应对协议相关的分布偏移，用期望最大化算法优化。

gr-gaussian: >-
  GR-Gaussian 是面向稀疏视角 CT 的图基三维高斯溅射框架，通过去噪点云初始化策略与像素-图感知梯度策略抑制针状伪影，在 X-3D 与真实数据集上验证。

h3d-marnet-wavelet-guided-dual-path-learning-for-metal-artif: >-
  提出 H3D-MarNet：一个两阶段框架，用于从千伏 CT（kVCT）到兆伏 CT（MVCT）的伪影感知域转换。第一阶段用基于小波的预处理模块，通过频率感知去噪抑制金属伪影并保留解剖结构。

haru-net-hybrid-attention-residual-u-net-for-edge-preserving: >-
  为此本文提出混合注意力残差 U-Net（HARU-Net），用于 CBCT 数据的高质量去噪，在 3D Accuitomo 170 高分辨率协议采集的人体下颌骨尸体数据集上训练。

hd-cnn: >-
  有限角配置下 CT 的条状伪影抑制颇具挑战。本文提出混合域卷积神经网络（hdNet），用于降低有限角 CT 中的条状伪影。

hdnet: >-
  HDNet 把稀疏视角 CT 重建拆成两个阶段，各专注一项任务以降低学习难度，在仿真与临床数据集上相比竞品在伪影抑制、细小结构恢复与对比度保持上均有明显提升。

high-energy-ct-metrology-review-2022: >-
  以增材制造为代表的先进制造技术近年来增长显著，使工程师能设计出更轻、同时保持结构与功能完整性的零件，因此这些零件的质量极为重要。

high-fidelity-3d-tooth-reconstruction-by-fusing-intraoral-sc: >-
  提出一条全新、全自动的流程，用深度隐式表征融合 CBCT 与口内扫描（IOS）数据：先分割并鲁棒配准各牙齿实例，再构造混合代理网格，把 IOS 的牙冠与 CBCT 的牙根拼在一起。

horuseye-2026: >-
  本文提出 HorusEye，一个用于 X 射线断层成像修复的自监督基础模型，通过层间对比预训练从数据中学习真实的采集退化过程。它在超过 1 亿张图像上训练，可跨模态和任务泛化，优于任务专用方法。

ictnet: >-
  稀疏视角 CT 只在物体周围采集少量投影图像，正弦图插值方法对最终图像质量影响显著；稀疏程度高时，需要更先进的正弦图插值方法。

idol-net: >-
  由于金属植入物的存在，CT 成像质量会严重退化。为此本文提出面向 CT 金属伪影消除的交互式双域并行网络 IDOL-Net。

ilv-iterative-latent-volumes-for-fast-and-accurate-sparse-vi: >-
  本文提出迭代潜体积（ILV）：一个前馈框架，把数据驱动先验与经典迭代重建原理结合起来，克服以往前馈模型在稀疏视角 CBCT 重建上的关键局限。

imap-tv: >-
  本文将低剂量 CT 正弦图预处理表述为最大后验估计，同时建模 X 射线光子统计和电子噪声两种噪声源，并用编码正弦图分段线性结构的新先验，用交替方向乘子法求解。

incode: >-
  但现有 INR 在捕捉细粒度细节、处理噪声以及适应多样信号类型上存在局限。为此本文提出 INCODE：用深层先验知识增强 INR 中正弦激活函数的可控性。

indudonet: >-
  针对这些问题，本文提出可解释的双域网络 InDuDoNet，兼取模型驱动与数据驱动方法之长。在合成与临床数据上的大量实验显示了它的优越性。

inr-joint: >-
  CT 在工业质检与医学诊断中举足轻重。鉴于 CT 常常扫描相似的对象，本文提出用 INR 对多个对象做联合重建来提升重建质量。

insideout-integrated-rgb-radiative-gaussian-splatting-for-co: >-
  本文提出 InsideOut：3D 高斯泼溅的扩展，弥合高保真 RGB 表面细节与亚表面 X 射线结构之间的鸿沟。RGB 与 X 射线成像的融合在医学诊断、文化遗产修复、制造业等领域价值不凡。

integration-of-spectral-ct-with-pet-and-spect-bringing-tissu: >-
  把 PET 或 SPECT 与 X 射线 CT 融合，已经改变了分子影像，但它刻画组织成分的能力仍未被充分利用。

intratomo: >-
  IntraTomo 是自监督框架，把正弦图预测模块（用神经网络表示从不完整正弦图学习的密度场）与利用局部和非局部先验的几何细化模块结合，迭代应用。

iradonmap: >-
  Radon 变换广泛用于物理与生命科学，其主要应用之一是 X 射线 CT。本文提出一个通过深度学习做 Radon 反演的新的统一框架。

irds: >-
  IRDS 提出一种判别稀疏变换迭代重建方法做低剂量 CT，以基于学习稀疏变换的后处理图像作为先验图像，避免经典先验图像方法的配准与匹配问题。

irr-tv: >-
  IRR-TV 把迭代重建–重投影（在投影与图像空间之间外推估计缺失投影）与 TV 正则结合，用于少视角 CT，加速收敛并改善少视角扇束重建，还给出短扫描变体。

iscs: >-
  三维医学影像需求旺盛，是临床诊断与科研的基础。在多个医学成像问题上的实验表明，本方法能有效提升基于二维扩散模型的三维医学成像表现。

isia: >-
  由于辐射对患者有害，临床上减少 X 射线暴露很重要。对 CT 而言，从稀疏视角或有限角层析做重建正越来越频繁地用于低剂量成像；为解决该问题，近来已发展出多种方法。

joint-decoupled-iterative-cbct-reconstruction-with-hybrid-sc: >-
  本文提出一个物理驱动的迭代框架，植根于多色 Polyquant 衰减模型：在散射估计与相对电子密度（RED）重建之间建立优化回路，从而把这些伪影解耦开。

k-neas-scalable-multi-material-ct-reconstruction-using-neura: >-
  CT 存在明显的电离辐射风险，稀疏视角重建因此成为刚需。本文提出 $K$-NeAS：一个统一、可扩展的架构，用于自动化的多材料表面重建。

kbr-perfusion: >-
  动态脑灌注 CT 因多次采集带来高辐射剂量。本文提出基于 Kronecker 基表示张量稀疏正则化的张量鲁棒主成分分析，把低秩解剖背景与稀疏的时变灌注信号分离，在低至 20 mAs 的采集中仍有提升。

klip: >-
  提出一种基于扩散先验与后验分布之间 KL 散度的分布外检测指标：既不需要任何校准数据、也不需要知道偏移后的分布，并且既能判定整图为分布外，也能定位图内的分布外小块。

ksae: >-
  本文用 K 稀疏自编码器从正常剂量图像学习流形，在迭代重建中联合最小化重建图像与流形的距离及数据保真项，在低剂量 CT 挑战赛数据上去噪并保留细节。

ksvd-2006: >-
  K-SVD 是推广 K 均值的迭代字典学习算法：交替进行基于当前字典的稀疏编码，以及同步更新字典原子与稀疏表示，以更好地拟合训练信号。

l0-fewview: >-
  梯度幅值图像的 L1 范数（即众所周知的全变差模型）被广泛用作少视角 CT 重建的正则项。仿真表明本文提出的算法能明显改善重建质量。

l0-grad: >-
  在降低患者所受 X 射线辐射的同时，人们希望从有限的 CT 数据重建出准确图像。以图像梯度幅值的 L1 范数定义的全变差（TV）在从不完整投影数据重建 CT 中很流行。

l1l2: >-
  本文为一个无约束优化模型设计了特定的分裂框架，使交替方向乘子法（ADMM）在一定条件下具有收敛保证。

lab-lamino: >-
  本文证明用常规工业实验室显微 CT 扫描仪、无需专用设备即可做计算层析成像：采用倾斜旋转扫描几何与 CGLS 重建，对平面对象成像，伪影更少、分辨率比有限角扫描更各向同性。

latent-space-consistency-for-sparse-view-ct-reconstruction: >-
  为此本文提出一致潜空间扩散模型（CLS-DM）：引入跨模态特征对比学习，从二维 X 光图像中高效提取潜三维信息，并实现模态间的潜空间对齐。

lctfound: >-
  带标注的肺部 CT 数据稀缺，限制了临床 AI 的应用。本文提出 LCTfound，一个在 105,184 例多中心肺部 CT 扫描上经扩散模型预训练的基础模型，在从诊断到稀疏视角重建、低剂量增强的八类任务上均优于此前最优模型。

ldct-cnn: >-
  本文用深度卷积神经网络逐块将低剂量 CT 图像映射为对应的正常剂量图像，无需访问原始投影数据，在 PSNR、RMSE 和 SSIM 上大幅改善，速度比迭代方法快一个数量级。

learn: >-
  压缩感知已被证明能有效从稀疏采集或欠采样测量中做层析重建，这对少视角 CT、断层合成、内部层析等都很有实际意义。

learn-plus-plus-2023: >-
  压缩感知 CT 已被证明对若干临床应用很重要，例如稀疏视角 CT、数字断层合成与内部层析。

learned-convex-regularizers-for-inverse-problems: >-
  基于输入凸神经网络的凸正则项以对抗方式训练，用来区分真值图像与未正则化的重建。特别地，本文证明当惩罚参数随噪声范数次线性衰减时，变分问题的最优解收敛到真值。

learning-the-invisible-2019: >-
  本方法之所以可靠，在于我们只学习模型驱动方法可证明无法处理的那部分，同时对剩余部分施加理论上可控的稀疏正则化。

learning-wavelet-sparse-fdk-for-3d-cone-beam-ct-reconstructi: >-
  本文提出一个增强的基于 FDK 的神经网络：在余弦加权与滤波阶段有选择地引入可训练元素，从而保留经典算法的可解释性。

learning-where-and-what-to-lift-for-bi-planar-x-ray-to-ct-re: >-
  我们观察到，一旦解剖区域的空间组织确定下来，估计它们的 CT 强度就变得容易得多。据此提出 LiftXR：一个交错式、几何引导的框架，把空间布局恢复显式纳入 CT 重建。

leng-2008: >-
  本文用先验图像约束压缩感知（PICCS）重建各呼吸相，借助全采样先验图像约束仅 10–20 个投影的重建，实现高时间分辨率（约 100 毫秒）且无条纹伪影的 4D-CBCT。

leveraging-image-editing-foundation-models-for-data-efficien: >-
  提出一种范式转变：把伪影消除重新表述为上下文推理任务，用参数高效的低秩适配（LoRA）改造一个通用视觉-语言扩散基础模型。

limited-angle-cbct-reconstruction-via-geometry-integrated-cy: >-
  本文提出有限角几何集成循环域框架（LA-GICD）用于 CBCT 重建，由两个去噪扩散概率模型（DDPM）构成，并通过解析的锥束前向与反向投影算子相连。

limited-angle-nano-ct-2025: >-
  为应对这一挑战，本文提出名为「感知融合迭代层析重建引擎」的方法：把卷积神经网络与感知知识作为智能正则项，融入一个迭代求解引擎。

limited-angle-spect-image-reconstruction-using-deep-image-pr: >-
  本文提出一种有限角 SPECT 重建方法，采用端到端深度图像先验（DIP）框架来提升重建质量，并在 20 个数值体模与临床患者数据上做了评估。

linct-tv-admm: >-
  针对有限角、数据不足的直线扫描 CT，该方法把 TV 最小化重构成可分等式约束问题并用交替方向法求解，在仿真与真实数据上重建稳健高效，优于部分以往方法。

lingo: >-
  本文提出统一的潜初始化与梯度优化（LINGO）框架来解决这些问题，并引入初始化点云结构偏差（IPSD）指标来评估初始化质量。

live: >-
  目前没有任何三维或四维体 X 射线成像技术，能在实际治疗实施过程中、或两次射束之间对靶区位置做分次内验证，而这对手术放射外科与体部立体定向放疗至关重要。

lmfi: >-
  LMFI 把稀疏视角 CT 重构成傅里叶域插值问题，用多尺度网络直接从极坐标下可用傅里叶系数预测笛卡尔坐标下的二维傅里叶系数，精度达先进水平且效率更高。

lodopab-ct: >-
  用于层析图像重建的深度学习方法已变得非常有效，并被证明在该领域具有竞争力。但这些方法在很大程度上依赖训练所用的数据与设置，因此比较它们颇具挑战。

low-dose-ct-using-denoising-diffusion-probabilistic-model-: >-
  本文引入条件去噪扩散概率模型（DDPM）以提升 LDCT 去噪性能，并以较高的计算效率给出了令人鼓舞的结果。

low-level-dataset-distillation: >-
  医学图像增强临床价值很高，但现有方法需要大规模数据集才能学到复杂的像素级映射。为此本文提出首个面向医学图像增强的低层数据集蒸馏方法——值得注意的是，下游用户接触不到原始患者数据。

lowmas-sparseview: >-
  低剂量 CT 可同时采用低 mAs 与稀疏视角，但所得正弦图噪声大且不完整。本文提出 ASR-TV-POCS 两步策略，将自适应正弦图修复与全变分凸集投影结合，在降噪、对比噪声比和边缘细节保持上均有改善。

lpd: >-
  本文提出用于层析重建的学习式原对偶算法（LPD）：通过展开一个近端原对偶优化方法，把（可能非线性的）前向算子纳入深度神经网络，只是其中的近端算子被替换成了卷积神经网络。

lr-tv-perfusion: >-
  本文把序贯脑灌注 CT 图像堆成低秩矩阵，结合非凸谱范数与时空全变分正则做低剂量恢复，利用序列图像间的相似冗余。

lrtp: >-
  本文在统一贝叶斯框架中结合低秩表示的通道间相关性与区域特异纹理保持马尔可夫随机场，用于光子计数能谱 CT，在每个能道中保持纹理并抑制噪声。

lucid-learned-undersampling-adaptive-consistency-guided-infe: >-
  提出 Lucid：一个稀疏度自适应、一致性引导的重建框架，基于流匹配生成先验，面向稀疏视角 CT。推理时把采样稀疏度显式纳入，用来调整单个预训练模型的生成轨迹。

magic: >-
  能有效缓解辐射问题的低剂量 CT 扫描会降低成像质量。本文提出一个新的 LDCT 重建网络，它展开迭代方案，并在图像空间与流形空间中同时执行。

maier-2019: >-
  X 射线散射会导致 CT 图像对比度下降、CT 值不准，并出现条状与杯状伪影。为此本文提出深度散射估计（DSE）：用深度卷积神经网络实时推导高度准确的散射估计。

malar: >-
  MALAR 以多重对抗学习框架增强超低剂量对比剂 CT 血管造影的血管强度：双侧域映射、双重相关约束，以及抑制高噪声金属干扰的自适应融合模块。

map-nn: >-
  MAP-NN 是面向低剂量 CT 的模块化神经网络，采用端到过程而非端到端映射，让放射科医生按任务调节去噪深度，效果可与三大厂商的商用迭代重建媲美。

mar-4dec: >-
  该综述回顾近 40 年 CT 金属伪影抑制研究，从束硬化、散射、噪声与部分容积效应的物理成因到六类校正方法，指出未来在于改进采集与先进重建相结合。

mccollough-2015: >-
  本文综述双能与多能 CT 的物理原理：第二种 X 射线能谱可区分具有相同 CT 值的材料。文章介绍包括光子计数探测器在内的技术路线，以及当前和新兴的临床应用。

mdst-2023: >-
  稀疏视角 CT 能降低患者辐射剂量并加快数据采集，已成为研究者特别关注的领域；现有深度学习重建方法大多基于卷积神经网络。

medgmae: >-
  MedGMAE 用三维高斯基元预测替代掩码自编码器中的体素重建，从稀疏可见图块学习预测完整高斯参数集，在下游医学任务上优于传统 MAE 基线。

metainv-net: >-
  X 射线 CT 广泛用于诊断、图像引导介入等临床场景。本文提出一个新的基于深度学习的 CT 重建模型，其骨干架构由展开一个迭代算法构成。

mgmar-metal-guided-metal-artifact-reduction-for-x-ray-comput: >-
  提出 MGMAR：一种金属引导的金属伪影消除方法，在整个重建流程中显式利用与金属有关的信息。这种先验嵌入的初始化降低了对随机初始化的敏感度，也加快了针对具体测量条件的精修收敛。

mindi-3d-iterative-deep-learning-in-3d-for-sparse-view-cone-: >-
  本文提出 MInDI-3D（三维直接迭代医学反演）：首个面向真实稀疏视角 CBCT 伪影消除的三维条件扩散模型，目标是降低成像辐射暴露。

ml-industrial-ct-review-2024: >-
  这篇综述梳理机器学习与深度学习在整个工业 X 射线 CT 工作流中的应用，从重建到分割与特征表征，并指出不确定性量化与可解释性是进一步推广的关键。

mlem-1982: >-
  这篇论文给出发射层析的精确泊松统计模型，推导出最大化观测探测器计数似然的 EM 算法，即迭代最大似然重建。

momentum-net: >-
  本文提出首个快速且收敛的 INN 架构 Momentum-Net：通过把使用动量与主化子的分块 MBIR 算法同回归神经网络结合而推广得来。

monstr-model-oriented-neutron-strain-tomographic-reconstruct: >-
  本文提出面向模型的中子应变层析重建（MONSTR）算法，从中子布拉格边应变测量中重建二维残余应变张量。

moreau-shearlet-tv-2020: >-
  带稀疏正则化的迭代 CT 重建能大幅减少投影数据量。原因在于，仅使用局部先验信息时，很难把结构细节与噪声区分开。

motion-grad: >-
  本文提出一种用基于梯度的优化算法做 CBCT 运动估计的新途径，利用了锥束 CT 几何下反投影算子的广义导数。

multi-scale-learned-iterative-2020: >-
  模型驱动的学习式迭代重建近来被证明优于经典重建算法。作为这些限制的一种解法，本文提出多尺度学习式迭代重建方案：在分辨率递增的离散化上计算迭代。

mw-cnn: >-
  MWCNN 用多级小波卷积神经网络做稀疏视角 CT 重建，对 60、120、180 个投影的 FBP 重建结果做处理，结合小波多尺度分析与深度学习。

n2s: >-
  本文证明，在低剂量 CT 重建任务中，本方法在解析 CT 体模与真实 CT 图像的重建上，定性与定量地都优于传统方法以及基于压缩感知的迭代重建方法。

nab: >-
  受许多工业物体呈矩形结构的启发，本文提出神经自适应分箱（NAB），把矩形先验有效融入重建过程：先把坐标空间映射到一个分箱向量空间。

naf: >-
  本文面向稀疏视角 CBCT 重建提出一种快速的自监督方案，不需要任何外部训练数据：离散地合成投影，并通过最小化真实投影与合成投影之间的误差来训练网络。

ndi-tv: >-
  PWLS-ndiTV 用正常剂量图像诱导的全变分先验重建稀疏视角 CT，以正常剂量图像诱导的非局部均值滤波降低期望图像与先验图像之间错位的影响。

neural-discrete-representation-learning-for-sparse-view-cbct: >-
  本文提出 DeepPriorCBCT：一个三阶段深度学习框架，仅用常规辐射剂量的六分之一即可达到诊断级重建。开发与验证共纳入来自 12 个中心的 4,102 名患者、8,675 次 CBCT 扫描。

neural-field-denoising-2024: >-
  该方法用去噪正则化为三维稀疏视角 CT 的神经场提供条件，把去噪器与神经场优化解耦以节省显存，适用于包括锥束在内的任意 CT 几何，重建质量持平或优于先进方法且显存占用最低。

neuromorphic-xray-ct: >-
  为填补这一空白，本文提出神经形态 X 射线 CT 框架，具体给出事件增强神经衰减场（ENAF）：联合利用稀疏投影与事件流来建模体积衰减场。

ngps: >-
  提出邻域引导块采样（NGPS）：一个轻量框架，在层间局部错位的条件下、无需显式配准就能构造邻近监督。在所评估的 CT 与合成 Rician MRI 场景中，NGPS 提升了保真度与结构敏感指标。

nlctf: >-
  谱 CT 用多个窄能窗的投影重建依赖材料的衰减图像，对材料识别与分解很有意义。本方法通过聚类一系列非局部空间-谱立方体来构造这样的组。

nlm-review: >-
  由于对过量辐射暴露的担忧日增，低剂量 X 射线 CT 成像在临床上被高度推荐。此后它被移植并应用到许多其他图像类型与各类逆问题上。

noise-inspired-diffusion-model-for-generalizable-low-dose-ct: >-
  本文提出面向可泛化低剂量 CT 重建的噪声启发扩散模型 NEED：针对每个域的噪声特性来定制扩散模型，源码已公开。

noise2match: >-
  本文提出 Noise2Match：一种基于自适应切片间匹配的自监督低剂量 CT 去噪方法。切片间匹配网络建模相邻切片间的标签过渡过程，再对去噪器输出做校正，以满足 Noise2Noise 的等均值条件；该方法对低剂量 CBCT 去噪也有效。

non-circular-scan-trajectories-for-reducing-cone-beam-artifa: >-
  Gamma Knife CBCT 图像受锥束伪影破坏，且伪影沿上方方向增强。采用源轴向步进 3.5 mm 的 line-arc-line 轨迹，几乎消除了全部锥束伪影。

nonperiodic-dynamic-ct-reconstruction-using-backward-warping: >-
  动态 CT 重建在处理运动伪影上面临重大挑战，尤其是心率快的心脏成像这类非周期快速运动。本文提出基于 INR 的新框架 BIRD，用于非周期动态 CT 重建。

offset-cbct: >-
  偏移探测器可扩大 CBCT 视野，但解析算法不太可能从稀疏视角数据重建出准确图像。本文研究基于优化的算法，包括自适应最速下降加权凸集投影，结果表明它们有望用比临床常规更少的投影数得到可用图像，从而降低成像剂量。

openpros: >-
  本文提出 OPENPROS——首个面向有限角前列腺超声 CT 的大规模基准数据集，用于系统评估求解定量逆问题的机器学习方法。

ordered-subsets-multi-diffusion-model-for-sparse-view-ct-rec: >-
  基于分数的扩散模型在稀疏视角 CT 重建上展现出很大潜力，但投影数据集庞大且冗余严重。为此本文提出有序子集多扩散模型（OSMM）。

ox-nerf: >-
  为解决这一问题，本文提出优化 X 射线神经辐射场（OX-NeRF）：把跨场景特征学习与场景专属优化结合起来，重建一组彼此相关的场景。

pbac: >-
  CT 图像质量常受伪影困扰，伪影会降低图像的诊断价值。许多情况下，这些伪影源于投影数据中缺失或损坏的区域，例如金属、截断与有限角伪影。

pde: >-
  本文提出一种区域自适应变分 PDE 模型做 CT 重建，结合图像梯度 L2 能量与全变分，由阈值函数控制：在低密度区用 L2 加快重建，在高密度区用 TV 保留重要特征。

pdf: >-
  参数依赖框架 PDF 用多几何、多剂量数据训练一个重建网络，把几何和剂量参数送入多层感知机来调制网络特征图，性能媲美几何专用网络，同时节省训练成本。

photon-pile-up-normalizing-flow: >-
  本文给出一个机器学习方案：用基于仿真的推断框架，从发生堆叠（pile-up）的 eROSITA 数据中估计物理源参数的后验分布。

phydict: >-
  提出 PhyDiCT：一个免训练框架，把以 Beer-Lambert 定律为基础的可微物理前向模型，与文本条件扩散这一强先验结合，用来重建三维肺部 CT 图像。

physics-inspired-gaussian-kolmogorov-arnold-networks-for-x-r: >-
  CBCT 用平板探测器实现高空间分辨率的三维成像。为解决该问题，本文提出一种受物理先验启发、基于深度学习的散射伪影校正方法。

piccs: >-
  PICCS 用由交错动态数据集并集构建的先验图像约束每帧的压缩感知重建，从高度欠采样的投影重建动态 CT 图像序列，体内实验达到 32 倍欠采样。

piner: >-
  PINER 在无源域数据的情况下对黑盒深度稀疏视角 CT 模型做测试时自适应，用先验引导的隐式神经表示在未知噪声水平下构建适配输入，在多个解剖部位与黑盒模型上均优于先进方法。

pixel-wise-metrics-reliability: >-
  为弥补这一局限，本文提出一套新的解剖感知评价指标，用于评估各类解剖结构（大器官、小器官、肠道、血管）上的结构完整性。

planet: >-
  稀疏视角 CT 方法关注网络设计，却忽视了采哪几个投影视角。本文提出 PLANet，在重建训练中学习不同视角角度的重要性并选出信息量最大的视角，在统一深度学习框架内提升重建质量。

pnp-proximal-trajectory-2024: >-
  本章将即插即用重建中的高斯去噪网络替换为针对伪影的恢复网络，沿预定义优化轨迹训练，在两个三维锥束 CT 数据集上 PSNR 优于先进方法。

polyner: >-
  本文提出多色神经表征（Polyner），应对人体内存在金属植入物时 CT 成像的难题。Polyner 转而从非线性逆问题的视角来建模金属伪影消除。

prior-adapted-progressive-time-resolved-cbct-reconstruction-: >-
  CBCT 为放疗的图像引导与治疗调整提供在体三维解剖。借助 DREME-adapt，可从每位患者的治疗前 4D-CT 生成一个「虚拟分次」，用于干净的「冷启动」重建。

projection-embedded-diffusion-bridge-for-ct-reconstruction-f: >-
  从不完整投影数据重建 CT 图像因问题病态而困难。本文提出投影嵌入扩散桥（PEDB），并引入一个自由参数来控制反向过程中的随机性水平。

projection-volume-fidelity-divergence-diagnosing-and-control: >-
  为刻画这一行为，本文引入几何与体积两个层面的诊断指标，度量针状高斯退化与体素化密度场的稳定性。据此提出 LADES：一个面向稀疏视角高斯层析、不依赖真值的优化控制器。

psrv: >-
  本文证明，将患者投影 X 线片映射到三维解剖的深度学习模型，能从单个投影视角生成体 CT 图像，有望用于图像引导介入操作。

ptpn: >-
  许多图像处理问题可以表述为优化问题。本文提出一种用深度强化学习训练系统的方法，使其能像人一样自动调节参数。

r2-gaussian: >-
  本文提出 R²-Gaussian：首个基于三维高斯泼溅的稀疏视角层析重建框架。为此提出一种新的校正技术，通过重构从三维到二维高斯的投影来实现。

rad: >-
  本文推导了基于先验图像的 CT 重建中偏倚的定量度量，以及偏倚与先验正则化强度之间的解析关系，从而可以前瞻性地选择正则化强度以容纳特定的解剖变化。

radioactive-3d-gaussian-ray-tracing-for-tomographic-reconstr: >-
  三维高斯泼溅近来在计算机视觉中崭露头角，成为一种有前景的渲染技术。为克服其局限，本文提出基于三维高斯光线追踪的层析重建框架。

radon-1917: >-
  Radon 1917 年的论文定义了线积分变换：探讨函数能否由沿直线的积分唯一恢复，并给出二维情形的反演及推广。

radon-transforms-aleksandrov-fenchel: >-
  本文研究格拉斯曼流形上的 Radon 变换，把它看作凸体上的几何算子，联系 Minkowski 投影体映射与 Goodey-Weil 平均截面体映射。证明了关于混合体积平均值的新的 Aleksandrov-Fenchel 不等式，进而证明平均截面体的全部内蕴体积都是对数凹的。

ram: >-
  本文提出一种全新的非迭代、轻量架构：它把关于前向算子（采集物理与噪声参数）的知识纳入模型，而不依赖展开。

ramachandran-lakshminarayanan-1971: >-
  本文为「从透射阴影图重建三维物体」这一数学过程提出了一种新技术：它使用定义在物体实空间中的函数做卷积，而不使用傅里叶变换。

ratv: >-
  该重加权各向异性 TV 方法针对有限角 CT，用重加权更好逼近 l0 稀疏度量，并按角覆盖给不同方向赋权，防止模糊方向损害边缘检测，优于现有 TV 类方法。

rbp-dip-2024: >-
  RBP-DIP 在无训练 U-Net 上加入残差反投影连接，改进深度图像先验在高度病态 CT 重建中的表现，每轮迭代优化网络权重的同时增强正则化。

red-cnn: >-
  处理重建图像的低剂量 CT 方法难以在去噪的同时保留结构。本文提出 RED-CNN，一个结合自编码器、反卷积网络与短路连接的残差编解码卷积网络，在降噪、结构保持和病灶检出上表现有竞争力。

redaep: >-
  REDAEP 用去噪自编码先验改善稀疏视角 CT 重建：通过变量增广学习更高维的三通道网络，并用鲁棒 Lp 回归损失替代 L2 损失以保留纹理细节，性能优于现有方法。

remar-ds-recalibrated-feature-learning-for-metal-artifact-re: >-
  本文提出一个面向金属伪影消除与 kVCT→MVCT 域转换的深度学习框架。与传统 MAR 方法不同，它在高分辨率 kVCT 与抗伪影的 MVCT 之间搭桥，服务于放疗计划。

resolution-agnostic-neural-operators-for-multi-rate-sparse-v: >-
  稀疏视角 CT 从有限投影重建以降低辐射与扫描时间，是个病态逆问题。本文提出 CTO——首个面向 CT 重建的神经算子框架。

revisiting-pose-sensitivity-in-splat-based-computed-tomograp: >-
  X 射线 CT 通过穿透目标的投影图像重建物体的体积表征。经过细致分析，我们发现这些伪影主要源自采集几何中的位姿误差，而不是视角稀疏本身。

riner: >-
  由于 X 射线探测器的非理想响应，环状伪影在三维锥束 CT 中很常见，严重影响图像质量与诊断可靠性。本文提出 Riner：一种新的无监督环状伪影消除方法。

rit-2009: >-
  呼吸运动会在慢旋转加速器一体机上采集的锥束 CT 图像中造成伪影。本文开发了一种即时（on-the-fly）方案，在从全部锥束投影重建三维 CBCT 图像的过程中估计并补偿呼吸运动。

robust-uncertainty-2006: >-
  例如，本文表明：只要跳变（不连续）的数量满足上述条件，就可以通过最小化其他凸泛函（例如 f 的全变差）从不完整的频率样本中重建分段常数（一维或二维）物体。

robustness-and-stability-analysis-of-differentiable-shift-va: >-
  本文系统研究了可微 SV-FBP 在困难采集条件下的鲁棒性与适应性。结果表明，采样点的空间分布所起的作用更为主导。

roessl-2007: >-
  本文研究了能量敏感光子计数探测器的 X 射线 CT K 边成像，表明能量选择性光子计数能测量钆基对比剂的局部密度，并区分对比剂充盈的管腔与斑块。

rof-tv-1992: >-
  Rudin-Osher-Fatemi 模型通过最小化全变分做图像去噪，以拉格朗日乘子施加噪声统计约束，用梯度投影法求解，在去噪的同时保持锐利边缘。

sacnn: >-
  SACNN 用三维自注意力 CNN 对低剂量 CT 降噪，捕捉层内与层间的长程空间上下文，并用自监督自编码器感知损失，在 AAPM–Mayo 低剂量 CT 数据上持平或优于先进方法。

sagan: >-
  低剂量 CT 在受辐射限制的应用中带来巨大好处，但光子数不足导致的量子噪声可能损害诊断性能。本文提出一种基于深度学习的方法来缓解这一问题。

sart-1984: >-
  SART 改进代数重建技术，对同一投影内所有射线的 ART 误差校正项同时应用，结合纵向加权与双线性元，一次迭代即可得到良好的重建结果。

sax-nerf: >-
  本文提出结构感知 X 射线神经辐射密度场（SAX-NeRF）框架，用于稀疏视角 X 射线三维重建；首先设计了基于线段的 Transformer（Lineformer）作为其骨干。

scatter-dl: >-
  本章综述 X 射线散射如何损害锥束 CT 的对比度、锐度、噪声与背景均匀性，并评述基于深度学习的散射校正方法及其临床应用。

scatter-rev: >-
  锥束体积 CT 中的散射辐射会带来定量误差、伪影与噪声上升，使 CT 图像严重退化，因此散射抑制是 CBCT 成像中与图像质量相关的主要议题之一。凡觉得相关之处，本文都补入了额外参考文献。

scatter-rev-p2: >-
  散射校正流程的主要组成部分是散射估计与散射补偿算法。本文接续前文——前文在「已有散射估计方法」的前提下给出了散射补偿的通用框架。

schlomka-2008: >-
  基于能量分辨探测器的 K 边缘 CT 有望实现材料特异性成像。本文验证了定量 K 边缘成像，将碘和钆造影剂与解剖背景分离，测得浓度与真实值一致。

sdb: >-
  本文提出系统嵌入扩散桥模型（SDB）：一类新的监督式桥方法，把已知的线性测量系统显式嵌入矩阵值随机微分方程的系数中。

semantic-contrastive-learning-for-orthogonal-x-ray-computed-: >-
  为应对这些挑战，本文提出一种新的语义特征对比学习损失：在高层潜空间评估语义相似度，在浅层潜空间评估解剖相似度。

semimar: >-
  SemiMAR 是一个半监督金属伪影校正框架，仅用单个生成器学习无伪影部分，通过相减推断伪影，并以对比学习潜在约束蒸馏双域知识，性能可与现有半监督 MAR 方法媲美。

senp: >-
  CT 是用于有症状与无症状患者成像的最常用模态之一。本文旨在提升四分之一剂量图像的质量，并以常规剂量图像作为真值来选取最佳超参数。

shape-guided-gaussian-splatting-for-sparse-view-x-ray-3d-rec: >-
  本文提出一个面向稀疏视角 X 射线三维重建的形状引导高斯泼溅框架。方法保证解剖一致性，并在仅 5 个视角时把 PSNR 比当前最优的高斯泼溅基线提升 2.83 dB。

shearlet: >-
  本文把基于剪切波的正则化用于迭代 CT 重建，表明剪切波变换的方向敏感性比全变分更好地保留图像纹理（全变分易产生阶梯效应），但使用不当可能导致波浪状伪影。

shepp-logan-1974: >-
  这篇经典论文提出头部截面的傅里叶重建，用改进加权函数同时实现精度、简洁、低计算量与低噪声敏感性，优于需 12 次迭代且更怕噪声的搜索算法。

sidky-pan-tv-2008: >-
  本文提出 ASD-POCS，一种在数据一致性和非负性约束下最小化全变分的迭代算法，用于圆轨迹锥束 CT。它似乎对锥束伪影鲁棒，在角范围受限或采样稀疏时尤其有用。

siewerdsen-2001: >-
  本文以散射-原射比量化平板探测器锥束 CT 中的 X 射线散射随物体尺寸和锥角的变化，表明散射会降低对比噪声比，而通过增加剂量、层厚或两者可恢复损失。

sinogram-interpolation-2024: >-
  本文提出一种深度学习正弦图插值方法，将采集数据重采样为 spinogram 表示来预测缺失投影，在五个激光烧结物体的真实 XCT 扫描上验证。

sinonet: >-
  Un-SinoNet 无需配对训练数据即可恢复低剂量 CT 正弦图，在最大后验框架下以 CT 测量的噪声生成机制驱动，纯无监督地学习低剂量正弦图的梯度。

sire-net-2025: >-
  SIRE-Net 面向平板型电池的有限角 CT，用结构保持伪影去除网络与注意力上下文增强网络组成生成器，配合 WGAN-GP 判别器，在真实电池数据上减少边缘伪影并保持结构与细节。

sister: >-
  多能 CT 图像噪声严重。本文提出 SISTER，把相似的空间-谱图像块聚类为四阶张量组并应用张量分解与增强稀疏性，在边缘保持、细节恢复和噪声抑制上优于张量字典学习方法。

sisvm: >-
  iCT-Net 是一个通用架构的深度网络，经训练可从正弦图数据在多种采集条件下精确重建 CT 图像，包括稀疏视角与内层析纠缠的难题。

snaf: >-
  本文提出 SNAF：通过学习神经衰减场来做稀疏视角 CBCT 重建，并发明了一种新的视角增强策略，用来克服稀疏输入视角下数据不足带来的挑战。

sonke-2005: >-
  与直线加速器集成的锥束 CT 扫描仪是图像引导放疗的强有力工具。本文为 CBCT 开发了一种替代性的呼吸相关流程，并评估了它的性能。

soul-net: >-
  为缓解这些问题，本文提出面向谱 CT 重建的稀疏低秩展开网络（SOUL-Net），以数据驱动方式学习其中的参数与阈值。

spare: >-
  目前四维 CBCT 需要 3–4 分钟的全扇扫描才能保证可用的图像质量。稀疏视角四维 CBCT 重建的进展，为缩短扫描时间与剂量带来了可能。本文共生成 9 名患者的 32 次 CBCT 扫描。

sparse-sampling: >-
  为降低与辐射剂量相关的健康风险，学界正积极研究低剂量 CT 的各种扫描方法与重建算法。作者提出五种不同的稀疏采样方案并做了仿真，以实现既定的剂量削减目标。

sparse-tomography: >-
  本文在投影数据极度受限的层析背景下，研究一种基于小波的稀疏促进重建方法。这类成像问题是病态逆问题，对测量误差与建模误差极为敏感。

sparse-view-laminography-2014: >-
  本文为稀疏视角计算层析成像提出球面正弦扫描轨迹，表明用压缩感知 TV 重建仅 40 个视角时，它在对比度上优于单弧、双弧和斜向轨迹，斜向轨迹的分辨率与之相当。

sparsity2dl: >-
  医学图像重建领域大致出现过四类方法。这些方法通常很快，但存在次优性质，例如 CT 的分辨率-噪声折衷较差；迭代方法则通过降低噪声与伪影改善了图像质量。

special: >-
  SPECIAL 通过增强对抗学习与单次投影误差校正模块结合图像域与投影域信息，改善有限角 CT 的伪影去除、边缘保持与细小结构恢复，包括高衰减组织区域。

spectral-consistent-flow: >-
  本文提出频谱一致流（SC-Flow）：一个在潜空间单次函数求值（1-NFE）的三维医学图像转换框架。

spener: >-
  此外，现有方法尚未充分挖掘图像域先验来求解稀疏视角 CT 的逆问题。本文表明，不完美的重建结果可以为 INR 提供有效的图像域先验，从而提升性能。

spie-dir-2023: >-
  有限角双能 CT 尽管两能谱间存在冗余仍具挑战。本文提出 SPIE-DIR，从两组互补的有限角扫描中提取自先验信息，并在投影、残差和图像三个域施加约束，Wasserstein GAN 进一步改善视觉感知。

spir-de: >-
  本文提出一种迭代算法，以支持一种新的数据采集方案：需要一次全扫描加一次稀疏视角扫描，从而有望降低双能 CT 的成像剂量与工程成本。

splat-based-metal-artifact-reduction-in-cone-beam-ct-via-com: >-
  本文提出一个基于泼溅的金属伪影消除框架，把物理上站得住的多色前向模型引入连续高斯表征，用于锥束 CT。

splat-based-metal-artifact-reduction-in-cone-beam-ct-via-pol: >-
  提出一种新的物理启发、自校准的金属伪影消除方法，在重建三维 CBCT 体积的同时校正射束硬化伪影。这是首个基于泼溅、面向降低 CBCT 射束硬化的方法。

spqi: >-
  本文用基于块对比学习的 GAN 从锥束 CT 生成类 CT 图像，在非配对 CT 与 CBCT 数据上训练，在改善图像质量和 HU 准确性的同时保留解剖结构。

spss: >-
  SPSS 用 20 层残差 CNN 从稀疏视角数据合成全视角正弦图，以零阶和一阶差分损失保留锐度——区域边界与组织纹理，而不是生成过度平滑的正弦图。

spultra: >-
  低剂量 CT 重建近年来是热门研究方向。基于取对数后测量的典型方法是惩罚加权最小二乘（PWLS）。本框架中由稀疏性诱导的数据保真项与正则项都是非凸的。

ssdae: >-
  SSDAE 用堆叠稀疏去噪自编码器做低剂量 CT 后处理恢复，在抑制噪声的同时恢复结构细节，优于 TV-POCS、BM3D 与 U-Net 等基线方法。

statistical-image-reconstruction-using-mixed-poisson-gauss: >-
  X 射线 CT 的统计图像重建方法能产生高质量、准确的图像，同时大幅降低患者受照剂量。本文提出一种新的统计重建方法 MPG（混合泊松-高斯）。

stcnet: >-
  本文提出 STCNet：一个利用时空一致性学习的稀疏视角 4D CBCT 重建框架。每呼吸相位仅需 16 个投影即可重建高质量图像，用物理驱动的位置编码保证投影域几何一致性、用时间编码捕捉呼吸运动，双域协同优化投影域与图像域。

steerable-conditional-diffusion-2025: >-
  去噪扩散模型已成为求解成像逆问题的首选生成框架。为弥合训练与测试之间的落差、提升重建精度，本文提出新的采样框架——可操纵条件扩散。

super: >-
  传统的模型驱动图像重建（MBIR）把前向模型与噪声模型同简单的物体先验结合起来。本文提出统一的监督-无监督（SUPER）学习框架，用于 X 射线 CT 图像重建。

super-2: >-
  本文提出新的监督-无监督（SUPER）重建框架用于 LDCT 重建，兼取有监督学习方法与基于（无监督）变换学习的方法（例如涉及高度图像自适应聚类的 PWLS-ULTRA）之长。

sv-cbct-data-consistent-2023: >-
  从有限投影集重建 CT 图像，在从医学到工业的多个场景中都很重要。为应对数据受限，本文用图像子体积训练、并在测试时做块聚合。

sv-cbct-eval: >-
  该评估表明约束 TV 最小化能用远少于常规的投影数据重建出有用的平板锥束 CT 图像，有望根据扫描条件与成像任务大幅降低成像工作量与辐射剂量。

sv-spectral-lr: >-
  在 kVp 切换能谱 CT 中，每个能谱测量只有稀疏视角。本文提出带能谱块低秩惩罚的惩罚最大似然方法，利用跨能谱的图像块自相似性，定性与定量上均改善了能谱图像；GPU 实现降低了计算成本。

sv-tgv: >-
  PWLS-TGV 用高阶导数的全广义变分正则化替代全变分的分段常数假设，并结合数据依赖的方差加权，减少稀疏视角 CT 重建中的块状伪影。

swap-net-2025: >-
  Swap-Net 是面向稀疏视角 3D CBCT 重建的内存高效 2.5D 网络，用轴交换操作端到端重建三维体积而无需完整 3D 卷积，在惯性约束聚变模拟上验证。

sword: >-
  以小波变换作为引导性的稀疏先验，能显著增强扩散模型的鲁棒性。本文提出逐级小波优化精修扩散（SWORD）模型，用于稀疏视角 CT 重建。

synergizing-physics-model-based-and-data-driven-methods-fo: >-
  自 2016 年以来，深度学习在层析成像上取得了显著成功，尤其是低剂量 CT。一个新兴趋势是把成像物理与模型融入深度网络，实现物理/模型驱动与数据驱动的混合。

synthetic-ct-image-generation-from-cbct-a-systematic-review: >-
  用深度学习从 CBCT 生成合成 CT 是放射肿瘤学的重要进展。本文识别并分析了 35 项相关研究，发现深度学习方法在该任务中占主导。

tamp: >-
  非理想测量 CT（NICT）采用次优成像协议来拓展 CT 的应用。本文提出多尺度集成 Transformer 放大器（TAMP）——首个面向通用 NICT 增强的成像基础模型。

tensor-dl: >-
  在动态 CT 重建中，数据采集速度限制了时空分辨率。本文提出一种自适应方法，在重建过程中训练基于张量的时空字典，用于图像序列的稀疏表示。

tensor-net: >-
  该方法不直接在投影或图像域学习，而是用逐视角反投影张量训练网络——它携带求和前的无损信息，在细节保持上优于图像域、投影域与混合域学习框架。

texture-preserving-implicit-neural-representation-for-cone-b: >-
  CBCT 常受数据截断困扰，这会带来严重伪影并限制有效视野。为此本文提出一个基于神经场景表征的自监督三维重建框架。

tfu-net: >-
  特别地，本文表明双框架 U-Net、紧框架 U-Net 等替代变体满足所谓的框架条件，使它们更适合在稀疏视角 CT 中有效恢复高频边缘。

tg-field-geometry-aware-radiative-gaussian-fields-for-tomogr: >-
  三维高斯泼溅以卓越的效率与质量革新了三维场景表征。为应对这些挑战，本文提出层析几何场（TG-Field）：一个几何感知的高斯形变框架，同时面向静态与动态 CT 重建。

time-resolved-dynamic-cbct-reconstruction-using-prior-model-: >-
  时间分辨 CBCT 重建出反映扫描内运动的动态 CBCT 序列（每张 X 光投影对应一个 CBCT，不做相位排序或分箱），对规则与不规则运动刻画、患者摆位以及运动自适应放疗都很有价值。

tomo-21st: >-
  本文综述解析断层重建方法，介绍线积分模型，并区分二维重建与完全三维重建——后者中射线在空间中取任意方向，而非位于平行平面内。

tomotransformer: >-
  TomoTransformer 是面向 CT 重建的 Transformer 基础模型，把每个局部滤波投影当作 token，在反投影空间中用自注意力预测缺失视角，可处理任意数量的投影、角度与探测器尺寸而无需重训。

toward-a-foundation-plug-and-play-prior-for-computed-tomogra: >-
  CT 的吞吐量受扫描时间限制，而扫描时间同时随采集的投影数量和每个投影的探测器积分时间增长。

toward-ct-equivalent-image-quality-in-low-dose-radiotherapy-: >-
  标准放疗计划过程中往往需要反复做 CT 扫描用于摆位、验证与自适应计划，累积 X 射线剂量随之上升。为缓解这一点，治疗实施过程中会常规采集低剂量 CBCT。

towards-reconstructing-experimental-sparse-view-x-ray-ct-dat: >-
  基于扩散的图像生成器是稀疏视角 X 射线 CT 这类病态逆问题的有前景先验。结果表明域偏移的作用相当微妙：严重不匹配会导致模型崩塌与幻觉，而多样化的先验能做到与匹配良好但狭窄的先验相当、甚至更好。

tv-stokes: >-
  TVS-POCS 在全变分重建中引入等照度线方向，使沿法向和切向的一致性都得到保留，消除块状伪影并保留细微结构，在满视角情况下接近滤波反投影。

tv-wtf: >-
  该方法把全变分与小波紧框架正则化结合用于有限角 CT，加入 l1 和 l0 项并以基于 TV 的 SART 与 ADMM 求解，抑制有限角伪影的同时保留低对比物体。

tvwfr: >-
  为消除稀疏视角 CT 中 TV 正则的阶梯伪影，该方法对小波框架低频系数施加 TV、高频系数施加 l0 惩罚并用 ADMM 求解，在保持边缘的同时抑制阶梯效应与噪声。

two-view-industrial-diffusion-2024: >-
  工业 CT 需要 360° 扫描，太慢而无法在线检测。本文提出双视角 CT 重建，用多尺度条件潜在扩散网络，仅从两个正交投影生成 CT 切片，准确恢复产品几何形状与内部微小缺陷。

ultrafast-deep-learning-based-scatter-estimation-in-cone-bea: >-
  进一步在大规模模拟数据集、以及水与 Sedentex CT 体模的真实 CBCT 扫描上比较散射校正后的重建，清楚证明了本方法的鲁棒性。

uncertainr-uncertainty-quantification-of-end-to-end-implic: >-
  隐式神经表征在场景重建与计算机图形学上成果斐然，而其性能此前主要按重建精度来评价。

undip: >-
  UN-DIP 用无训练生成器网络结合深度图像先验做稀疏视角与有限角 CT 重建，在重建过程中联合优化潜向量与生成器权重。

unsupervised-idbp-svct-2025: >-
  本文提出一个无监督深度学习框架 ADMM-DRP：把未经训练的神经网络与交替方向乘子法（ADMM）迭代重建算法结合起来。

unsupervised-metal-artifact-reduction-in-dental-cbct-using-f: >-
  牙种植体产生的金属伪影会显著降低 CBCT 体数据质量，遮蔽关键解剖结构、损害诊断精度。

variational-garrote: >-
  稀疏正则化在求解由不完整或受损测量引起的逆问题中居于核心地位。本文构建了统一的实验框架，覆盖信号重采样、信号去噪与稀疏视角 CT 等多个重建任务。

view-covariance-loss-2026: >-
  本文提出视角协方差损失，通过近似重建归一化均方误差来度量一组视角的联合信息，并给出选择使该损失最小的视角子集的算法，误差更低、伪影更少，优于现有方法。

view-dependent-detector-displacement-cbct: >-
  工业锥束 CT 用探测器平移来抑制环状伪影，但由此产生的探测器运动在不同投影视角之间可能非均匀变化，形成无法用固定偏移表示的探测器位置。

viss: >-
  本文用卷积神经网络插值稀疏采样正弦图中的缺失视角，补全缺失投影数据，使图像可用解析算法重建，而不必依赖迭代重建。

vodasure: >-
  本文表明，这类性能很大程度上来自在降采样数据上训练，而不是来自真实的低分辨率扫描。为此提出 VoDaSuRe：一个包含配对高、低分辨率扫描的大规模体数据数据集。

vol3dgs: >-
  本文表明泼溅中的核心近似并非必要——即便在光栅化器内部也可以避开。我们改为直接对三维高斯做体积积分、解析地计算其透射率，从而以更高精度、更少的点表示不透明表面。

voxelsynth3d-interpretable-volumetric-image-domain-metal-art: >-
  术后肌骨 CT 中的金属伪影会遮蔽骨-植入物与邻近软组织的界面。本文提出 VoxelSynth3D：一个面向重建后 CT 的免训练三维图像域框架，组合了支撑掩膜、归一化组织合成、偏差门控与受限边缘精修。

vvbp-tsvd: >-
  本文分析 FBP 中排序后的逐视角反投影张量，用张量奇异值分解去噪，利用结构自相似性、稀疏性与噪声统计，在低毫安秒 CT 中优于正弦图预处理、图像后处理与迭代方法。

wav-sgm: >-
  基于分数的生成模型在训练数据含噪时表现受限，如低剂量 CT 或欠采样 MRI。本文提出小波改进框架，通过互反馈机制耦合小波子网络与分数模型，从含噪样本中学习分数，达到用干净数据训练的水平。

wavresnet: >-
  为解决该问题，本文提出一种新的基于框架小波的去噪算法，使用小波残差网络：把小波框架去噪算法的性能保证与深度学习的表达能力协同起来。

wgan-vgg: >-
  本文提出一种新的 CT 图像去噪方法，基于使用 Wasserstein 距离与感知相似度的生成对抗网络。Wasserstein 距离是最优传输理论的核心概念，有望提升 GAN 的表现。

when-are-diffusion-priors-helpful-in-sparse-reconstruction-a: >-
  扩散模型在图像生成上表现最优，并正在稀疏医学图像重建任务中受到关注。本文在低剂量胸壁 CT 的脂肪量量化任务上做了比较。

why-fbp: >-
  这篇综述探讨了尽管迭代和压缩感知重建取得进展，CT 扫描仪的重建算法为何 25 年来几乎没有变化，提炼了背后的数学问题，并建议加强应用数学家与工程师的联系以弥合差距。

x-gaussian: >-
  本文提出基于三维高斯泼溅的框架 X-Gaussian，用于 X 射线新视角合成，并实现了带 CUDA 的可微辐射光栅化（DRR）。它在稀疏视角 CT 重建上的应用也体现了其实用价值。

x-grm-large-gaussian-reconstruction-model-for-sparse-view-x-: >-
  CT 是临床工作流中不可或缺的工具。本文提出 X-GRM（X 射线高斯重建模型）：一个大型前馈模型，从稀疏视角的二维 X 光投影重建三维 CT 体积。

x2-gaussian: >-
  X²-Gaussian 用动态辐射高斯溅射做连续时间四维 CT 重建，通过生理驱动的周期一致性损失从投影中自监督学习患者特异呼吸运动，无需外部呼吸门控设备。

xden-1k: >-
  对物理世界的深入理解是机器人操作与物理真实仿真的前提。为填补这一空白，本文提出 XDen-1K：首个为真实物体提供物理驱动密度场的大规模多模态数据集。

xgenrecon-2025: >-
  XGenRecon 通过在受控几何参数下生成辅助 X 射线投影，从超稀疏投影重建 CBCT：X-Correction 协调生成的投影，CT-Correction 细化重建图像。

zbijewski-2006: >-
  该迭代散射校正方案用经高斯基拟合加速的快速蒙特卡罗模拟从初始重建估计散射，模拟时间缩短三到四个数量级，水体模定量误差从约 12% 降至 1%。

zero-shot-ct-super-resolution-using-diffusion-based-2d-proje: >-
  CT 在临床诊断中很重要，但获取高分辨率 CT 受辐射风险制约。为此本文提出一个零样本三维 CT 超分框架，把基于扩散的上采样二维投影先验融入三维重建过程。

zero-shot-low-dose-ct-denoising-via-sinogram-flicking: >-
  本文提出一种基于正弦图闪动的零样本低剂量 CT 成像方法：它在单张图像内部运作，通过随机共轭射线匹配生成大量副本。仿真研究表明本方法优于 ZS-N2N 等当前最优方法。

zhu-2006: >-
  大面积探测器 CT 中散射会引起严重伪影。本文提出一种利用棋盘格主调制器的散射校正方法：主射线被高频调制而散射保持低频，滤波与解调即可分离两者，仿真中误差从 74.2% 降至 1% 以下。
