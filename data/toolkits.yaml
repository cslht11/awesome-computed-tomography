- name: pyHST2
  group: operators
  url: https://gitlab.esrf.fr/tomotools/pyhst2
  homepage: https://ftp.esrf.fr/scisoft/PYHST2/
  language: C / Python
  license: See repository
  tags: [synchrotron, phase-contrast, reconstruction]
  note: The ESRF beamline reconstruction code — gridrec, FBP and iterative methods with phase retrieval for propagation-based phase-contrast tomography. Long-standing workhorse of the synchrotron community.
- name: DIRECTT Reconstruction GUI
  group: operators
  repo: BAMresearch/DIRECTT
  language: Python
  license: GPL-2.0
  stars: 1
  tags: [GUI, ASTRA, iterative, limited-projections, trajectories]
  note: A Python GUI built on the ASTRA toolbox for reconstructing X-ray CT data, with the DIRECTT algorithm included. DIRECTT targets the regime where only a handful of projections are available along an arbitrary scanning trajectory and folds the acquisition path itself into the inverse problem - a corner that operator-based toolboxes mostly leave untouched. From BAM and published in Review of Scientific Instruments 2020; run Main.py to launch. Niche and lightly starred, but there is little else that covers trajectories explicitly.

- name: CTrex
  group: operators
  url: https://arxiv.org/abs/2609.30166
  homepage: https://arxiv.org/abs/2609.30166
  language: Python / CUDA (PyCUDA)
  license: See source
  tags: [micro-CT, GPU, iterative, geometry, trajectories, kernel-level]
  note: A research-oriented GPU iterative reconstruction framework that exposes the projection–correction–backprojection pipeline all the way down to the individual CUDA kernels, so non-ideal acquisition effects can be folded into the operators themselves instead of being bolted on afterwards as corrections. Geometry is carried as per-projection homogeneous view matrices, which keeps the kernels agnostic to the scan path — circular, helical, offset and conveyor-belt trajectories all work, as do motion- and deformation-aware, event-based 4D and extended-field-of-view cases. Aimed squarely at micro-CT under unconventional acquisition. Described in arXiv:2609.30166; the paper announces no code repository, so this entry points at the preprint until one appears.

- name: PFITRE
  group: operators
  repo: chonghangzhao/PFITRE
  language: Python
  license: MIT
  stars: 11
  tags: [limited-angle, nano-tomography, iterative, CNN]
  note: Perception Fused Iterative Tomography Reconstruction Engine — a CNN carrying perceptual knowledge as a regularizer inside an iterative solver, correcting limited-angle artefacts in X-ray nano-tomography. Ships a demo, a data-generation script and pretrained weights (Google Drive). From Brookhaven National Lab (NSLS-II); published in npj Computational Materials 2025.

