- name: XrayPhysics
  group: operators
  repo: kylechampley/XrayPhysics
  homepage: https://xrayphysics.readthedocs.io/
  language: C++ / Python
  license: MIT
  stars: 56
  tags: [physics, spectra, cross-sections, dual-energy, beam-hardening]
