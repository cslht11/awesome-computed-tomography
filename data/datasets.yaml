# CT reconstruction datasets.
# Fields: name (required), url | repo (required, at least one),
#         modality, tasks, license, note
# Projection-domain data (raw sinograms) is marked in `note` — it is the most
# valuable kind for reconstruction research, but far rarer than image-domain data.

# ---------------------------------------------------------------- projection domain
- name: LoDoPaB-CT
  url: https://zenodo.org/records/3384092
  homepage: https://lodopab.grand-challenge.org/
  modality: 2D fan-beam
  tasks: [low-dose, sparse-view, denoising, reconstruction]
  license: CC BY 4.0
  note: "**Projection + image.** 42,895 simulated human thorax slice pairs (LIDC/IDRI) at a single noise level (N0 = 4096) — other dose levels have to be re-simulated. The de-facto standard low-dose CT benchmark; ships a well-tuned FBP/U-Net reference pipeline."

- name: LDCT-and-Projection-data
  url: https://www.cancerimagingarchive.net/collection/ldct-and-projection-data/
  modality: helical CT
  tasks: [low-dose, reconstruction, denoising]
  license: CC BY 4.0 (head scans NIH controlled access)
  note: "**Projection + image.** Mayo Clinic, released through TCIA. 299 head / chest / abdomen exams (99 / 100 / 100), each with a routine-dose scan plus one simulated lower-dose projection set — head and abdomen at 25% of routine dose, chest at 10%. Chest and abdomen are open under CC BY 4.0; the 99 head scans need an NIH controlled-access request because they could be used to reconstruct a face. Raw sinograms in the open **DICOM-CT-PD** format. It grew out of the 2016 AAPM Low Dose CT Grand Challenge and is now the best real-data source for projection-domain methods."

- name: 2016 Low Dose CT Grand Challenge data
  url: https://aapm.app.box.com/s/eaw4jddb53keg1bptavvvd1sf4x3pe9h
  modality: helical CT
  tasks: [low-dose, reconstruction, denoising]
  license: see source
  note: "**Projection + image.** The complete data of the 2016 AAPM–NIBIB–Mayo Clinic Low Dose CT Grand Challenge: 30 contrast-enhanced abdominal CT cases (10 for training, 20 for testing) at routine and simulated quarter dose, re-released by Mayo and the AAPM on 21 September 2021 in the same **DICOM-CT-PD** projection format as the TCIA library. 13 of the 20 test cases are also in LDCT-and-Projection-data, and a README in the download maps the case IDs. This is the data most low-dose CT papers from 2017 onward mean by \"the Mayo\" or \"the AAPM\" dataset."

- name: 2DeteCT
  url: https://doi.org/10.1038/s41597-023-02484-6
  modality: 2D fan-beam
  tasks: [reconstruction, limited-angle, sparse-view, denoising]
  license: CC BY 4.0
  note: "**Projection + image.** 5,000 real experimental 2D slices of mixed objects, 3 dose levels, multiple source-detector geometries. Excellent for reproducible real-data CT benchmarking."

- name: Walnut-CBCT
  url: https://www.fips.fi/dataset.php
  modality: cone-beam
  tasks: [reconstruction, geometry]
  license: CC BY 4.0
  note: "**Projection only.** Finnish Inverse Problems Society. Real cone-beam projections of a walnut at several angular samplings — a standard test bed for sparse-view and limited-angle CBCT."

- name: Helsinki Tomography Challenge 2022
  url: https://www.fips.fi/HTC2022.php
  modality: 2D fan-beam
  tasks: [limited-angle, reconstruction]
  license: CC BY 4.0
  note: "**Projection only.** Real limited-angle sinograms of phantoms and of a lotus root; the accompanying challenge defines the standard limited-angle protocol."

- name: SPARE 4D-CBCT
  url: https://image-x.sydney.edu.au/spare-challenge/
  modality: cone-beam, 4D
  tasks: [dynamic, cbct, reconstruction]
  license: research use
  note: "**Projection + image.** Thoracic 4D cone-beam CT for breathing-motion-resolved reconstruction; the reference benchmark for dynamic CBCT."

- name: ToothFairy2
  url: https://doi.org/10.5281/zenodo.10990960
  homepage: https://toothfairy2.grand-challenge.org/
  modality: cone-beam, dental
  tasks: [cbct, reconstruction, segmentation]
  license: CC BY 4.0
  note: "480 dental CBCT scans with 3D tooth and jaw annotations; large-scale and useful for CBCT-domain pretraining. **Image domain only** — volumes are released without raw projections."

- name: Pancreatic-CT-CBCT-SEG
  url: https://www.cancerimagingarchive.net/collection/pancreatic-ct-cbct-seg/
  modality: cone-beam
  tasks: [cbct, registration, segmentation]
  license: CC BY 4.0
  note: "**Image only.** 40 pancreatic-cancer radiotherapy patients (MSKCC), each with one breath-hold planning CT and two kV CBCT scans — 58 of the 80 CBCTs are 200° limited-view acquisitions — with expert organ-at-risk contours on both. Real paired CT–CBCT data for CBCT correction, registration and synthetic-CT work; reconstructed volumes only, no raw projections."

# ---------------------------------------------------------------- image domain
- name: CT-RATE
  url: https://huggingface.co/datasets/ibrahimhamamci/CT-RATE
  modality: chest CT
  tasks: [reconstruction, denoising, detection, segmentation]
  license: CC BY-NC-SA 4.0
  note: "50,188 reconstructed 3D chest CT volumes (14.3M 2D slices) from 25,692 scans of 21,304 patients, every volume paired with its radiology report and labelled for 18 abnormalities. Reconstructed with several methods and window settings, so it carries realistic reconstruction variability — but image domain only, with no raw projections. The corpus behind CT-CLIP and CT-CHAT."

- name: LIDC-IDRI
  url: https://www.cancerimagingarchive.net/collection/lidc-idri/
  modality: helical CT
  tasks: [denoising, segmentation, low-dose]
  license: CC BY 3.0
  note: "1,018 thoracic CT scans with four-radiologist nodule annotations. The source anatomy behind LoDoPaB-CT and most simulated low-dose data."

- name: DeepLesion
  url: https://nihcc.app.box.com/v/DeepLesion
  modality: helical CT
  tasks: [detection, denoising]
  license: CC BY 3.0
  note: "32,735 lesion annotations across 10,594 studies from 4,427 patients — a large-scale pretraining corpus for CT-domain backbones."

- name: LUNA16
  url: https://luna16.grand-challenge.org/
  modality: helical CT
  tasks: [detection, denoising]
  license: CC BY 3.0
  note: "888 thin-slice chest CT scans with unified 1 mm resampling and nodule annotations; a clean, well-curated denoising/detection benchmark."

- name: KiTS23
  url: https://kits-challenge.org/kits23/
  modality: contrast CT
  tasks: [segmentation, reconstruction]
  license: CC BY-NC 4.0
  note: "599 abdominal CT scans (489 training + 110 test) with kidney-tumour and cyst annotations, from the KiTS23 edition."

- name: Pancreas-CT (NIH)
  url: https://www.cancerimagingarchive.net/collection/pancreas-ct/
  modality: contrast CT
  tasks: [segmentation]
  license: CC BY 3.0
  note: "82 abdominal contrast CT scans with expert pancreas masks; a small but very widely used reference set."

- name: BTCV (Beyond the Cranial Vault)
  url: https://www.synapse.org/#!Synapse:syn3193805/wiki/217789
  modality: contrast CT
  tasks: [segmentation]
  license: CC BY-NC 4.0
  note: "30 abdominal CT scans with 13-organ annotations; the origin of the FLARE/AMOS lineage of multi-organ benchmarks."

- name: TotalSegmentator
  url: https://zenodo.org/records/10047292
  modality: contrast CT
  tasks: [segmentation, reconstruction]
  license: CC BY 4.0
  note: "1,228 CT scans with 104 anatomical structures — the largest open CT structure set, and a strong pretraining target."

- name: AMOS22
  url: https://amos22.grand-challenge.org/
  modality: CT / MRI
  tasks: [segmentation]
  license: CC BY-NC-SA 4.0
  note: "500 CT + 100 MRI abdominal scans, 15 organs; deliberately heterogeneous scanners, so it stresses robustness."

- name: Medical Segmentation Decathlon
  # http, not https: the site serves a certificate that does not match
  # medicaldecathlon.com, so https fails the handshake (verified 2026-10-11).
  url: http://medicaldecathlon.com/
  modality: CT / MRI
  tasks: [segmentation, reconstruction]
  license: CC BY-SA 4.0
  note: "Ten tasks, six of them CT (liver, lung, pancreas, hepatic vessels, spleen, colon). The single most cited multi-task medical segmentation benchmark."

- name: VerSe
  url: https://github.com/anjany/verse
  modality: CT
  tasks: [segmentation]
  license: CC BY-SA 4.0
  note: "374 multi-detector CT spine scans from 355 patients, with vertebral labelling and instance segmentation (C1–L6 plus T13 variants). Multi-vendor, multi-site, and deliberately varied in field of view and pathology — a robust segmentation benchmark."

- name: RibFrac
  url: https://ribfrac.grand-challenge.org/
  modality: CT
  tasks: [detection, segmentation]
  license: CC BY-NC 4.0
  note: "660 CT scans carrying ~5,000 rib-fracture annotations (420 training / 80 validation / 160 evaluation); often used as an auxiliary CT corpus."

- name: CT-ORG
  url: https://www.cancerimagingarchive.net/collection/ct-org/
  modality: contrast CT
  tasks: [segmentation]
  license: CC BY 3.0
  note: "140 CT scans with multi-organ masks, including a subset of the Liver Tumor Segmentation benchmark."

- name: STOIC 2021
  url: https://registry.opendata.aws/stoic2021-training/
  modality: CT
  tasks: [diagnosis, low-dose]
  license: CC BY-NC 4.0
  note: "2,000 COVID-19 chest CT scans (one per patient), the public part of the 10,735-patient STOIC study from the French first wave, collected for severe-outcome prediction; a large real-clinical distribution-shift test. Distributed through AWS Open Data; the remaining patients were kept private for the STOIC2021 challenge."

- name: MosMedData
  url: https://mosmed.ai/en/datasets/datasets/covid191110/
  # mosmed.ai is unreachable as of 2026-10-11: the TLS handshake drops with
  # UNEXPECTED_EOF even when certificate checks are skipped, so the whole host
  # is down rather than just misconfigured. The official URL is kept in case it
  # returns; this mirror is the same collection and answers 200.
  homepage: https://www.kaggle.com/datasets/andrewmvd/mosmed-covid19-ct-scans
  modality: CT
  tasks: [diagnosis, low-dose]
  license: CC BY-NC-ND 3.0
  note: "1,110 chest CT scans with COVID-19 severity grades; frequently reused as a low-quality / low-dose robustness set. The original site is currently down — the Kaggle mirror carries the same collection."

- name: HNSCC (Head & Neck)
  url: https://www.cancerimagingarchive.net/collection/hnscc/
  modality: contrast CT + PET
  tasks: [segmentation, reconstruction]
  license: CC BY-NC 3.0
  note: "Multi-institution head-and-neck CT with GTV/CTV delineations; pairs with the HECKTOR challenge."

- name: CTPelvic1K
  url: https://github.com/MIRACLE-Center/CTPelvic1K
  modality: contrast CT
  tasks: [segmentation, metal-artifact]
  license: CC BY-NC 4.0
  note: "1,184 pelvic CT scans across 7 sub-datasets; notably includes **metal-implant** cases, one of the few open sources of real metal artefacts."

- name: FLARE22
  url: https://flare22.grand-challenge.org/
  modality: contrast CT
  tasks: [segmentation]
  license: CC BY-NC-SA 4.0
  note: "2,000 abdominal CT scans with 13-organ labels across 20+ scanners; a large-scale robustness benchmark."

- name: AutoPET-II
  url: https://autopet-ii.grand-challenge.org/
  modality: PET/CT
  tasks: [segmentation, reconstruction]
  license: CC BY-NC 4.0
  note: "1,014 whole-body PET/CT studies with lesion masks; relevant when CT reconstruction feeds a downstream task."

- name: HECKTOR
  url: https://hecktor.grand-challenge.org/
  modality: PET/CT
  tasks: [segmentation, prognosis]
  license: CC BY-NC 4.0
  note: "Head-and-neck PET/CT with primary-tumour delineations; five editions of consistent annotations."

- name: CT Lymph Nodes
  url: https://www.cancerimagingarchive.net/collection/ct-lymph-nodes/
  modality: contrast CT
  tasks: [detection, segmentation]
  license: CC BY 3.0
  note: "176 abdominal CT scans with mediastinal and abdominal lymph-node annotations."

- name: NLST
  url: https://www.cancerimagingarchive.net/collection/nlst/
  modality: low-dose CT
  tasks: [denoising, detection]
  license: restricted (TCIA NCI)
  note: "26,254 baseline low-dose screening CT scans — by far the largest real low-dose CT collection, though access is gated."

- name: AAPM DL-Sparse-View CT data
  url: https://www.aapm.org/GrandChallenge/DL-sparse-view-CT/
  modality: 2D fan-beam (simulated)
  tasks: [sparse-view, reconstruction]
  license: CC BY 4.0
  note: "**Projection + image.** Data of the 2021 AAPM DL-sparse-view CT challenge: 4,000 simulated 2D breast-CT phantoms, each with an ideal noiseless 128-view fan-beam sinogram over 360° and its FBP image, plus 100 test cases. Truth is known exactly, so it isolates the sparse-view inverse problem from noise and model mismatch."

- name: Finnish Inverse Problems Society (FIPS) datasets
  url: https://www.fips.fi/dataset.php
  modality: fan-beam / cone-beam
  tasks: [reconstruction, geometry, calibration]
  license: CC BY 4.0
  note: "**Projection only.** A family of real measured sinograms (walnut, lotus root, apple, carrot, phantoms) with carefully documented acquisition geometry — the cleanest public source for testing reconstruction operators."

- name: LoDoPaB-CT (benchmark release paper)
  url: https://doi.org/10.1038/s41597-021-00893-z
  homepage: https://lodopab.grand-challenge.org/
  modality: 2D fan-beam
  tasks: [low-dose, reconstruction, benchmarking]
  license: CC BY 4.0
  note: "The **Scientific Data** descriptor for the LoDoPaB-CT dataset — the citation to use when you report results on this split. Documents the simulation protocol and the FBP/U-Net reference baseline."

- name: "COBRA2026: a large-scale multicenter pelvic cone-beam computed tomography projection dataset"
  url: "https://arxiv.org/abs/2607.20037"
  modality: cone-beam
  tasks: [reconstruction, benchmarking, low-dose, scatter]
  license: CC BY-NC 4.0
  year: 2026
  note: "**Projection + image.** 867 pelvic radiotherapy CBCT exams from six European centres (Elekta and Varian systems), with raw projections, acquisition geometry, clinical CBCT and planning CT. ~950 GB, split 692/52/123; released under CC BY-NC 4.0 on Zenodo (doi:10.5281/zenodo.21322350). Also the basis of the COBRA2026 reconstruction challenge."

- name: "MORE: Multi-Organ Medical Image REconstruction Dataset"
  url: "https://arxiv.org/abs/2510.26759"
  homepage: "https://more-med.github.io/"
  modality: CT
  tasks: [reconstruction, benchmarking]
  license: CC BY-NC 4.0
  year: 2025
  note: "CT scans across 9 anatomies and 15 lesion types, built to test generalisation to unseen anatomy rather than a single organ. Released under CC BY-NC 4.0; accepted to ACM MM 2025."


# ---- recovered from the review bibliography (landing pages checked before writing)
- name: TomoBank
  url: https://tomobank.readthedocs.io/en/latest/
  modality: synchrotron micro-CT
  tasks: [reconstruction, denoising, segmentation]
  license: see source
  note: "**Projection + image.** A repository of experimental and simulated tomographic datasets curated at the Advanced Photon Source, covering a wide range of instruments and specimen types. Built for validating and comparing reconstruction methods on data that actually looks like what a beamline produces, rather than on phantoms."

- name: SparseBeads
  url: https://zenodo.org/records/290117
  modality: micro-CT
  tasks: [sparse-view, reconstruction]
  license: CC BY 4.0
  note: "**Projection + image.** 48 measured scans of bead phantoms whose image sparsity varies systematically, released specifically as a benchmark for sparsity-regularised reconstruction. Inspired by SophiaBeads, and the reference point for comparing a regulariser across known ground truth."

- name: Walnut-21 (two dose levels)
  url: https://zenodo.org/records/3763412
  modality: cone-beam
  tasks: [low-dose, denoising, reconstruction]
  license: CC BY 4.0
  note: "**Projection only.** High-resolution cone-beam scans of 21 walnuts, each acquired at two radiation dose levels - a good and a noisy version of the same object. The paired acquisition is what makes it useful: the noise level can be compared against known anatomy instead of being inferred."
- name: FleX-ray Walnut CBCT Collection (CWI)
  url: https://zenodo.org/records/2686726
  homepage: https://doi.org/10.1038/s41597-019-0235-y
  modality: cone-beam micro-CT
  tasks: [reconstruction, limited-angle, sparse-view, cone-beam, segmentation]
  license: CC BY 4.0
  note: "**Projection + image.** 42 walnuts scanned on three different orbits each, so that artefact-free reference volumes can be computed from the combined views and used as supervised-learning ground truth. Worth noting that this is not another single-object phantom: the intent is natural variability across a class of objects. Ships the complete pipeline - raw projections, scanning geometry, pre-processing and reconstruction scripts (open software) and the reconstructed volumes - which makes it usable for high cone-angle artefact reduction, sparse and limited-angle reconstruction, super-resolution and segmentation alike. Split across six Zenodo deposits covering Samples 1-42."

- name: LoDoInd
  url: https://zenodo.org/records/10356955
  homepage: https://doi.org/10.58286/29228
  modality: industrial cone-beam CT
  tasks: [low-dose, denoising, reconstruction]
  license: CC BY-NC 4.0
  note: "Five dose levels of the same industrial CT specimens, including a near-noise-free reference scan, all pre-registered so slices line up across levels. What sets it apart from the medical low-dose sets is the geometry and the specimens - this is inspection data from industrial hardware, not clinical anatomy, so it is the reference to use when the target is an NDT pipeline rather than a diagnostic one. 4000 slices at 1250x1250 per level, spread over three Zenodo deposits because of the 50 GB per-upload cap."

- name: Carved cheese (FIPS)
  url: https://zenodo.org/records/1254210
  modality: 2D fan-beam
  tasks: [reconstruction, sparse-view, limited-angle]
  license: CC BY 4.0
  note: "**Projection only.** A single 2D slice of a carved cheese from the Finnish Inverse Problems Society, published at three resolutions together with the measurement matrices that encode the X-ray transform as an explicit linear operator. Getting the forward operator handed to you alongside the sinogram removes an entire class of geometry-matching bugs, which is why it stays a standard first test whenever a reconstruction method is ported onto real measured data. Documentation lives at arXiv:1705.05732."

- name: 3D cross phantom (FIPS, dynamic)
  url: https://doi.org/10.5281/zenodo.1446516
  modality: 2D fan-beam, dynamic
  tasks: [dynamic, reconstruction]
  license: CC BY 4.0
  note: "**Projection only.** Time-dependent 2D fan-beam sinograms of a 3D cross phantom (16 or 30 time frames depending on resolution), shipped with static and dynamic measurement matrices that encode the X-ray transform as an explicit linear operator. Documentation lives at arXiv:1809.00166."

- name: Emoji phantom (FIPS, dynamic)
  url: https://doi.org/10.5281/zenodo.1183532
  modality: 2D fan-beam, dynamic
  tasks: [dynamic, reconstruction]
  license: CC BY 4.0
  note: "**Projection only.** A single 2D slice of 33 emoji faces (15 different emoji) made of small ceramic stones, from a measured 60-projection fan-beam sinogram, with static and dynamic measurement matrices. The shape diversity across emoji faces is what sets it apart from the single-shape cross phantom. Documentation lives at arXiv:1802.09397."

- name: Walnut (FIPS, 2D fan-beam)
  url: https://doi.org/10.5281/zenodo.1254206
  modality: 2D fan-beam
  tasks: [reconstruction, sparse-view, limited-angle]
  license: CC BY 4.0
  note: "**Projection + image.** A single 2D slice of a walnut from a measured 120-projection fan-beam sinogram, at three resolutions with the measurement matrices, plus a 1200-projection set with a high-resolution FBP reconstruction as ground truth. Documentation lives at arXiv:1502.04064."

- name: Lotus root (FIPS)
  url: https://doi.org/10.5281/zenodo.1254204
  modality: 2D fan-beam
  tasks: [reconstruction, sparse-view, limited-angle]
  license: CC BY 4.0
  note: "**Projection only.** A single 2D slice of a lotus root whose holes are filled with different chemical elements, at two resolutions with the measurement matrices, plus MATLAB code for FBP, Landweber and Tikhonov reconstructions. Documentation lives at arXiv:1609.07299."

- name: Gel phantom (FIPS, dynamic)
  url: https://doi.org/10.5281/zenodo.3696816
  modality: 2D, dynamic
  tasks: [dynamic, reconstruction]
  license: CC BY 4.0
  note: "**Projection only.** Seventeen consecutive X-ray measurements of a 2D slice of a dynamic agarose-gel phantom perfused with a liquid contrast agent, at two resolutions, plus denser sampling of the first and an extra 18th time step. No forward operators are shipped, but the format supports matrix-free operators and FBP on CPU and CUDA GPUs. Documentation lives at arXiv:2003.02841."

- name: STEMPO (FIPS, dynamic phantom)
  url: https://doi.org/10.5281/zenodo.7081688
  modality: fan-beam / cone-beam, dynamic
  tasks: [dynamic, reconstruction, cbct]
  license: CC BY 4.0
  note: "**Projection + image.** A computer-controlled motor-powered phantom for dynamic tomography, with static and dynamic scans in 2D and 3D geometry, an approximate ground truth via interpolation, and example code for FBP, FDK, variational and low-rank+sparse methods; format compatible with HelTomo and ASTRA. Documentation lives at arXiv:2209.12471."

- name: Chicken bone CBCT (FIPS, 4 dose levels)
  url: https://zenodo.org/records/6990764
  modality: cone-beam
  tasks: [low-dose, denoising, reconstruction]
  license: CC BY 4.0
  note: "**Projection only.** Four cone-beam scans of the same chicken bone at four dose levels, varied via tube current and detector exposure time, each with flat-field-corrected projections and geometry metadata. The matched dose levels make it a clean test bed for low-dose denoising against known anatomy."

- name: Pine cone CBCT (FIPS)
  url: https://zenodo.org/records/6985407
  modality: cone-beam
  tasks: [reconstruction, cbct]
  license: CC BY 4.0
  note: "**Projection + image.** A 3D cone-beam CT scan of a pine cone, with flat-field-corrected projection images, a metadata file describing the measurement geometry and settings, pictures of the sample and an example FDK reconstruction. Format compatible with HelTomo."

- name: Walnut CBCT (FIPS, 3D)
  url: https://zenodo.org/records/6986012
  modality: cone-beam
  tasks: [reconstruction, cbct]
  license: CC BY 4.0
  note: "**Projection + image.** A 3D cone-beam CT scan of a walnut, with flat-field-corrected projection images, a metadata file describing the measurement geometry and settings, and pictures of an example reconstruction. Format compatible with HelTomo."

- name: 4D CBCT phantom dataset
  url: https://zenodo.org/records/10303690
  modality: cone-beam, 4D
  tasks: [dynamic, cbct, reconstruction]
  license: CC BY-NC-SA 4.0
  note: "**Projection only.** Six time-resolved (4D) cone-beam CT scans of a dynamic thorax phantom (CIRS 008A) on a Varian TrueBeam, with sin/cos^4 motion patterns."

- name: Dynamic sparse nanotomography (PEFC)
  url: https://zenodo.org/records/12662041
  modality: nanotomography, dynamic
  tasks: [dynamic, reconstruction]
  license: CC BY 4.0
  note: "**Projection + image.** Raw projection data (.h5 / sinograms) of dynamic PEFC catalyst hydration, plus two simulated sinogram sets with ground truth and reconstruction code (non-rigid ASTRA)."

- name: Multienergy fan-beam CT bird chest
  url: https://zenodo.org/records/11388131
  modality: 2D fan-beam, multienergy
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Projection + image.** Raw projection data (.tif) of a quail chest at 3 X-ray spectra (50 / 80 / 120 kV), 720 projections each, with pre-built 2D sinograms and FBP examples."

- name: RabbitCT
  url: https://zenodo.org/records/21267885
  modality: cone-beam
  tasks: [reconstruction, cbct, benchmarking]
  license: CC BY 4.0
  note: "**Projection + image.** C-arm cone-beam CT benchmark: 496 projections of a rabbit post-mortem scan, calibrated 3×4 projection matrices, a reference reconstruction and a development kit."

- name: Dynamic anthropomorphic thorax phantom (4DCT + CBCT)
  url: https://zenodo.org/records/17256015
  modality: cone-beam, 4D
  tasks: [dynamic, cbct, reconstruction]
  license: CC BY 4.0
  note: "4DCT (Siemens) + CBCT (Varian Halcyon) scans of a dynamic anthropomorphic thorax phantom (Maastricht), with patient-specific breathing traces. Files are DICOM + processed data + breathing curves; the record does not state whether raw projections are included."

- name: Shepp-Logan-like phantom (fan-beam, experimental)
  url: https://zenodo.org/records/19933728
  modality: 2D fan-beam
  tasks: [reconstruction, sparse-view, limited-angle]
  license: CC BY 4.0
  note: "**Projection only.** Experimental 2D fan-beam data of a laser-cut Shepp-Logan-like phantom (PMMA / epoxy / air) from the CWI FleX-ray lab: 901 raw projections plus dark- and flat-field images and scan scripts."

- name: SkyScan 1172 µCT grains
  url: https://zenodo.org/records/12744181
  modality: micro-CT
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Projection only.** Micro-CT of grains on a SkyScan 1172: 996 projection TIFFs with metadata (jyvat.log)."

- name: LE01 XRCT
  url: https://zenodo.org/records/21669376
  modality: micro-CT
  tasks: [reconstruction, segmentation]
  license: CC BY 4.0
  note: "**Projection + image.** XRCT raw projections (37 GB) of the LE01 sample, plus an Avizo project with reconstructed + segmented volume, reconstruction metadata and a particle-analysis table. 0.03 mm isotropic voxels."

- name: Tomato micro-CT
  url: https://zenodo.org/records/21263177
  modality: cone-beam
  tasks: [reconstruction, cbct]
  license: CC BY 4.0
  note: "**Projection only.** Micro-CT of a tomato (MILabs U-CT): 720 X-ray projections in TIFF with geometry metadata, for cone-beam reconstruction testing."

- name: Preclinical NEMA IQ phantom
  url: https://zenodo.org/records/4646835
  modality: cone-beam
  tasks: [reconstruction, cbct]
  license: CC BY 4.0
  note: "**Projection + image.** Preclinical NEMA image-quality phantom on a Siemens Inveon: raw projection images (.cat) + FDK reconstruction, 3 bed positions × 121 projections."

- name: Spherical fiducials in C-arm CBCT
  url: https://zenodo.org/records/4445444
  modality: cone-beam
  tasks: [reconstruction, cbct, geometry]
  license: CC BY 4.0
  note: "**Projection + image.** Two C-arm cone-beam CT datasets for localizing spherical fiducials: projection cine loops + 3D reconstructions + projection matrices + MATLAB code, in DICOM."

- name: RECAST3D cone-beam test data
  url: https://zenodo.org/records/1154166
  modality: cone-beam
  tasks: [reconstruction, cbct]
  license: CC BY 4.0
  note: "**Projection only.** Two cone-beam test datasets (wooden egg + poppy-seed putty) from a FlexRay scanner, packaged with the full scan settings, for real-time quasi-3D reconstruction (RECAST3D)."

- name: Spectral CT multi-material (DTU)
  url: https://zenodo.org/records/4482071
  modality: spectral CT
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Projection + image.** Raw energy-resolved CT projections of an iodine-cylinder phantom from a photon-counting CT scanner (DTU Physics), with MATLAB loading / reconstruction code (FBP / SIRT) and ASTRA geometry."

- name: Micro-CT time-series (4D)
  url: https://zenodo.org/records/4293394
  modality: micro-CT, dynamic
  tasks: [dynamic, reconstruction]
  license: CC BY 4.0
  note: "Micro X-ray CT time-series (Diamond I13-2): 21 tomograms × 91 projections, with a CGLS reconstruction via Savu. Single 192.7 GB archive; the record does not state whether it contains raw projections or only the CGLS reconstruction."

- name: Laminography (Lego)
  url: https://zenodo.org/records/2540509
  modality: laminography
  tasks: [reconstruction, limited-angle]
  license: CC BY 4.0
  note: "**Projection + image.** Laminography in the lab: a Lego sample imaged with a conventional X-ray CT scanner — computed laminography + limited-angle CT, with raw projection data + final reconstructions + MATLAB code."

- name: Polychromatic CBCT phantom (simulated)
  url: https://zenodo.org/records/17078431
  modality: cone-beam
  tasks: [reconstruction, cbct]
  license: CC BY 4.0
  note: "**Projection only.** Simulated polychromatic cone-beam CT projection images of a numerical phantom (PolyBoneAlTi), generated with LEAP at 85 kV."

- name: Crystals in clay micro-CT
  url: https://zenodo.org/records/4912635
  modality: micro-CT
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Projection + image.** Micro-CT of clay with crystals (DTU Nikon XTek): projection TIFFs + .xtekct metadata + reconstruction volume (.vol) + centre-slice sinogram."

- name: SESAME ID10-BEATS synchrotron CT
  url: https://zenodo.org/records/20795982
  modality: synchrotron CT
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Image only.** Synchrotron X-ray CT reconstructions from the ID10-BEATS beamline (SESAME): a wasp, a historic terracotta figurine and Egyptian blue pigment. Files are reconstructions only; no raw projections."

- name: Ptychotomography nanoporous glass
  url: https://zenodo.org/records/3539581
  modality: ptychotomography
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Projection + image.** High-resolution ptychotomography of nanoporous glass (PSI cSAXS): unaligned complex-valued projections, aligned phase sinogram and delta tomogram. Note: ptychographic physics differs from conventional CT."

- name: CBCT esophagus segmentation (psCBCT)
  url: https://zenodo.org/records/5035494
  modality: cone-beam (synthetic)
  tasks: [segmentation]
  license: CC BY 4.0
  note: "**Image only.** Paired planning-CT / physics-augmented pseudo-CBCT (psCBCT) images with organ-at-risk segmentations (23 pairs), for segmentation and CBCT→CT conversion. No raw projections; the psCBCT images are synthetic."

- name: NIH/3T3 fibroblast SXT
  url: https://zenodo.org/records/7186217
  modality: soft X-ray tomography
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Image only.** 3D reconstruction of an NIH/3T3 mouse fibroblast cell by soft X-ray tomography (SXT-100), tilt range −53° to 53.5°. Single .mrc reconstruction volume; no raw projections."

- name: Two-phase flow 4D micro-CT + reconstruction software
  url: https://zenodo.org/records/10050812
  modality: micro-CT, 4D
  tasks: [dynamic, reconstruction]
  license: CC BY 4.0
  note: "Restricted access (files not publicly listed). A 4D micro-CT dataset + reconstruction software for two-phase flow in porous media (laboratory-based micro-CT). Whether raw projections are included cannot be determined from the public record."

- name: Pediatric CT noise texture (XCAT)
  url: https://zenodo.org/records/12538350
  modality: simulated CT
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Image only.** Simulated routine- and quarter-dose CT of an anthropomorphic XCAT phantom (MIRT), for noise-texture augmentation. No raw projections; simulation data, not measured scans."

- name: GranulaX
  url: https://zenodo.org/records/22295109
  modality: micro-CT
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Projection only.** Raw CT data (RAW format) of granular microstructures + preview image. The record's specification fields are unfilled placeholders (voxel size, scanner, sample, reconstruction method), so usability is unverified."

- name: Micro-CT spiders (amber)
  url: https://zenodo.org/records/5504523
  modality: micro-CT
  tasks: [reconstruction]
  license: CC0
  note: "**Projection + image.** Micro-CT of mid-Cretaceous lagonomegopid spiders in Burmese amber: raw Micro-CT TIFFs + 3D reconstruction. A paleontology specimen scan, not designed as a reconstruction benchmark. Dryad DOI 10.5061/dryad.7m0cfxpv0."

- name: Walnut micro-CT (Saarland)
  url: https://zenodo.org/records/7115152
  modality: micro-CT
  tasks: [reconstruction]
  license: CC BY 4.0
  note: "**Projection + image.** Micro-CT of a single walnut (Saarland): 1601 acquired projections (TIFF stack) + reconstructed volume (pyXIT). Sixth walnut in the library; a different acquisition from the other five."

- name: Apple CT Data (simulated parallel-beam)
  url: https://doi.org/10.5281/zenodo.4212301
  modality: parallel-beam (simulated)
  tasks: [reconstruction, sparse-view, segmentation]
  license: CC BY 4.0
  note: "**Projection + image.** 94 apples with internal defects, three simulated parallel-beam sets (noiseless, 5% Gaussian noise, scattering noise) at 50 angles, with defect labels and ground-truth reconstructions in six companion uploads. Simulated from real cone-beam scans; this upload carries the simulated sets only. Documentation lives at arXiv:2012.13346."

- name: Play-Doh + stones (CWI, 131 samples)
  url: https://doi.org/10.5281/zenodo.5866228
  modality: cone-beam micro-CT
  tasks: [reconstruction, segmentation]
  license: CC BY 4.0
  note: "**Projection + image.** 131 Play-Doh samples with 0–8 inserted stones, 1800 projections each over 360° plus flat/dark-field images; a processed ground-truth version lives in Zenodo 5681008. Split across five Zenodo deposits (this link is Part 1). Built for supervised foreign-object detection."

- name: Deep-sea bamboo corals (µCT)
  url: https://data.bas.ac.uk/metadata.php?id=GB/NERC/BAS/PDC/01752
  modality: micro-CT
  tasks: [segmentation]
  license: see source
  note: "**Image only.** Reconstructed 8-bit TIFF stacks of two deep-sea bamboo coral species (Acanella arbuscula, 5 specimens; Keratoisis sp., 4 specimens) at 15/50 µm voxels; no raw projections (available from the authors only). Total 103.51 GB. Documentation lives at Williams et al., Sci Data 2024."

- name: 4D-Lung
  url: https://www.cancerimagingarchive.net/collection/4d-lung/
  modality: 4D CT (fan-beam + cone-beam)
  tasks: [dynamic, cbct, reconstruction]
  license: CC BY 3.0
  note: "**Image only.** 20 locally advanced NSCLC patients during chemoradiotherapy: 4D fan-beam CT (16-slice helical, 10 respiratory phases, 3 mm slices) and 4D cone-beam CT (Varian on-board imager, ~2500 projections sorted into 10 phases and reconstructed with an in-house FDK) — 183 GB of DICOM images plus RTSTRUCT contours; no raw projections in the download. Data citation required: Hugo et al. 2016, DOI 10.7937/K9/TCIA.2016.ELN8YGLE. The simulation source for PRIOR's PRIOR-Net (17 train / 3 test patients); distinct from the SPARE 4D-CBCT challenge data."
