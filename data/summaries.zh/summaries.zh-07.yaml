# Batch: Mayo team sweep #5（中文速读，忠实翻译，技术术语/缩写保留英文）。
model-based-motion-simulation-dynamic-wrist: >-
  针对动态腕关节 4DCT 训练数据稀缺的问题，基于模型的运动仿真框架通过模拟腕骨与软组织同步运动及弹性变形，生成带配对静态真值的仿真数据。仅用仿真数据训练的物理信息深度学习模型在仿真、尸体和在体 4DCT 中均有效减轻运动伪影，骨区 LIRS 与 SSIM 均显著改善。

hr-cnn-pcd-spatial-resolution: >-
  临床 PCD-CT 的视觉空间分辨率常受大像素和噪声限制；结合小视野、锐重建核与专用高分辨率卷积神经网络 HR-CNN 进行降噪，体模线对分辨率可达 20–22 lp/cm。在 5 例间质性肺病患者评价中，HR-CNN 处理图像在整体质量、噪声、空间分辨率和总体偏好上均获两位胸部放射科医师一致首选。

ct-harmonization-learned-vmi: >-
  TANZANITE 在虚拟单能域协调不同管电压的 CT 扫描，由多个预训练 CNN 学习 keV 到 keV 的转换，使不同 kV 扫描统一到可比的能量水平。CT 值一致性和器官特异性影像组学可重复性得到改善，且无需原始投影数据或针对扫描仪的专门训练。

diamond-monoenergetic-coronary: >-
  DIAMOND 从常规能量积分探测器 CT 直接生成不同能量的虚拟单能图像，旨在减轻严重钙化斑块造成的晕影伪影；模型先用超高分辨率光子计数 CT 的虚拟单能图像训练，再应用于能量积分 CT 的冠状动脉 CTA。结果显示 DIAMOND 显著减少晕影，使狭窄定量结果更接近光子计数 CT，有助于钙化冠状动脉狭窄评估。

voi-helical-ct: >-
  多排螺旋 CT 的感兴趣区成像方法只对感兴趣区集中照射，并用残差 U-Net 架构的 VOI-Net 校正截断伪影。在胸部和腹盆部病例仿真评价中，VOI-Net 有效校正了截断伪影；在 10 cm 直径感兴趣区内，辐射剂量可降低 71% 而不牺牲区内图像质量，放射科医师也确认病灶显示得到改善。

ilumenate-eid-cta: >-
  能量积分探测器 CT 的空间分辨率限制了冠状动脉 CTA 的诊断价值，而超高分辨率光子计数 CT 尚未普及；ILUMENATE 卷积神经网络用光子计数 CT 数据训练后应用于能量积分 CT 图像。结果显示图像分辨率明显提高、钙化晕影减轻，整体图像质量和狭窄评估得到改善。

palette-low-dose-synthesis: >-
  准确的低剂量 CT 仿真对评估重建和降剂量技术很重要，但投影域噪声插入常需厂商专有信息；PALETTE 整合基于物理的噪声先验生成、Noise2Noisier 子网络和噪声纹理合成子网络。结果显示其噪声功率谱峰值频率与参考一致，并能生成与解剖相关的真实局部和全局噪声纹理，可作为投影域方法的图像域替代方案。

uhr-pcd-temporal-bone-denoising: >-
  超高分辨率光子计数 CT 虽能提高分辨率，但噪声增大，迫使使用较平滑的重建核而牺牲分辨率；专用去噪卷积神经网络使最锐重建核的图像在保留分辨率的同时显著降噪。结果显示噪声较 Hr96-QIR3 降低 80%、较 Hr84-QIR3 降低 50%，且关键颞骨解剖结构的显示和整体图像质量排名最高。

noise-texture-training-curation: >-
  高分辨率能量积分探测器心脏 CT 需要控制噪声，但监督去噪网络的训练常难以获得无偏的高质量噪声估计；该研究比较了用不同方法估计的纯噪声图像训练 U-Net 模型，包括高低迭代重建强度相减和相邻层相减。各模型均可使高分辨率图像降噪约 74%–79%，而相邻层相减在噪声功率谱逼近上更优，提示训练数据筛选对保留噪声纹理和解剖准确性有重要影响。

pkaid-net: >-
  针对光子计数 CT 高分辨率虚拟单能图像噪声过高的问题，先验知识感知迭代去噪网络 PKAID-Net 利用低噪声虚拟单能图像作为先验，并通过迭代方式利用不同能量虚拟单能图像特有的噪声特性。结果显示噪声较滤波反投影降低 96%、较迭代重建降低 65%，同时保持了空间和频谱保真度。

zircon-multi-kernel-head-ct: >-
  头部 CT 常规需用不同重建核和层厚重建多个序列，给阅片带来冗余负担；ZIRCON 用自编码 U-Net 同时输入平滑核与锐核低剂量图像，并以任务损失函数针对脑组织和骨骼区域分别优化，输出单一薄层低噪声序列。结果显示更薄层厚和平滑核损失改善了灰白质对比，兼顾了软组织对比与骨骼锐度。

atom-cardiac-motion-correction: >-
  ATOM 网络结合注意力门与空间变换子网络，利用跨时相时空信息校正冠状动脉 CTA 运动伪影；模型在体模和患者 CTA 图像上训练与测试，覆盖 140 ms 和 75 ms 两种时间分辨率。客观指标和放射科医师盲评均显示校正后图像质量改善，表明该方法具有较好的泛化能力。

st-cnn-self-trained-denoising: >-
  常规监督去噪网络需要大量配对的高低质量数据，训练繁琐且泛化受限；自训练深度卷积网络 ST_CNN 仅利用患者自身投影数据，通过多次独立噪声插入和旋转增强生成配对训练数据。结果显示 ST_CNN 与常规监督 CNN 在图像质量上无显著差异，表明不依赖既有训练集也可实现可比的 CT 降噪效果。

pie-net: >-
  光子计数 CT 可同时获得多能量数据并生成高分辨率虚拟单能图像，但高分辨率图像噪声显著升高；Pie-Net 以低噪声虚拟单能图像作为先验信息，降低高分辨率冠状动脉 CTA 虚拟单能图像的噪声。在 10 例患者中，Pie-Net 噪声较滤波反投影降低 95%±1%、较迭代重建降低 60%±8%，同时保留了高分辨率图像的空间和频谱特性。

multislice-residual-cnn-denoising: >-
  该研究探讨多层输入是否优于单层输入，以及 3D 网络是否比 2D 网络更善于利用多层信息；比较了 2D 和 3D 残差卷积网络在 1 层、3 层和 7 层输入下的降噪表现，结果显示 2D 模型随输入层数增加呈现改善趋势。结论是多层输入是改善 2D 深度去噪模型性能的有效策略。

phantom-training-framework-denoising: >-
  卷积神经网络降噪的主要瓶颈是难以获得配对的高噪声与低噪声训练数据，尤其在无法获得原始投影数据时；基于体模的训练框架用体模扫描得到的纯噪声图像叠加到患者图像上，合成低剂量训练数据。在保留的四分之一剂量全身低剂量 CT 图像测试中，该框架实现了较强的噪声降低，同时保留了结构细节，并可在任意 CT 扫描仪上高效实施。

agate-virtual-noncalcium: >-
  双能量 CT 的虚拟无钙图像可评估多发性骨髓瘤的局灶性髓内骨髓受累，但现有商用方法因物质分解而噪声和伪影过大；AGATE 用定制的双任务卷积神经网络同时进行物质定量与去噪。在不同体模尺寸和辐射剂量下，AGATE 的物质定量准确性保持一致，虚拟无钙图像的噪声和伪影减少，局灶病变的可视化得到改善。

dedicated-cnn-uhr-pcd-denoising: >-
  该研究为超高分辨率光子计数 CT 开发专用卷积神经网络降噪方法，仅使用临床可用的重建图像即可实施；方法采用基于图像的噪声插入和空间解耦的噪声与信号训练策略，用 U-Net 进行监督学习。研究纳入 39 例受试者，涵盖骨骼普查、肺筛查和头颅 CTA，结果显示该方法在临床应用中改善了病变与血管的可视化。

ufp-net-ultra-fast-pitch: >-
  单源螺旋 CT 的螺距通常不超过 1.5，否则会因数据不足产生重建伪影，限制采集速度；超快螺距网络 UFP-Net 从螺距不小于 2 的伪影图像中恢复潜在解剖结构。在螺距为 2 和 3 的测试中，UFP-Net 较标准滤波反投影大幅改善图像质量，表明深度学习有望在不牺牲图像质量的前提下实现临床 CT 超快采集。

incept-net-virtual-monoenergetic: >-
  该研究开发 Incept-net，直接从多能量 CT 图像合成低能量虚拟单能图像，以降低噪声和束硬化伪影；网络采用编码器-解码器结构与定制的 Inception 模块和训练损失，用体模数据及合成的随机形状插入物训练，并在未见过的真实插入物和患者图像上测试。结果显示体模噪声降低约 53% 且束硬化伪影大幅抑制，低密度插入物的 CT 值准确性优于商用虚拟单能软件。

incept-net-direct-inversion: >-
  该研究开发 Incept-net 卷积神经网络，可直接从多能量 CT 图像估计基物质的质量密度分布，而无需进行常规物质分解；网络采用编码器-解码器框架、多分支多尺度模块和图像梯度相关正则化，以改善边缘保留和抗噪稳健性。结果显示 Incept-net 在定性图像外观、定量准确性和噪声水平上均优于 U-Net 及传统的最小二乘与全变分物质分解方法。

multi-kernel-synthesis-dcnn: >-
  解析重建中不同卷积核在噪声与空间分辨率之间存在权衡，临床常需为一次 CT 检查重建多个核的图像；该研究训练深度卷积网络，将平滑核与锐核图像合成为单一输出图像，兼顾低噪声与锐核特征。结果显示合成图像的噪声水平略低于平滑核图像，同时保留了锐核图像的特征，可减少多序列重建带来的计算、存储与阅片负担。

cnn-mar-uhr-pcd-ear: >-
  中耳和内耳金属植入物的亚毫米结构需要超高分辨率成像，但金属伪影会遮挡邻近微结构和细微病变；该研究开发图像域卷积神经网络，用钛和铂镫骨假体模型在头颅体模中的扫描数据训练，以减少植入物附近的金属伪影。结果显示均方误差训练存在伪影减轻与细节保留之间的权衡，而任务特异性超参数的网络可降低伪影严重程度。
