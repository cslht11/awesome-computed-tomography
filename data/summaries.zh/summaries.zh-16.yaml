# Batch: KTH Oktem team sweep #14（中文速读，忠实翻译，技术术语/缩写保留英文）。
deep-microlocal-limited-angle: >-
  该方法同时解决层析重建与波前集提取问题，依据数字波前集提取器和 Radon 变换的微局部典范关系。它要求神经网络同时从 X 射线数据中提取正确的真实波前集与真实图像，以此改善重建。作为理论基础，作者给出了深度卷积残差网络的数字微局部典范关系，并以数值证据支持方法的有效性。

dictionary-learning-tomographic: >-
  该工作把临床低剂量层析重建与稀疏信号处理、深度学习结合，从统计视角描述基于字典的稀疏表示，并把字典学习解释为生成模型分布与真实信号经验分布的对齐过程。由此可见，用学习字典做稀疏编码类似于一种特定的变分自编码器，其中解码器为线性函数、编码器为稀疏编码算法。字典学习还可受益于深度学习中的并行与随机优化等计算手段，且字典正则化在 CT 重建中达到了与现有模型方法和数据驱动方法可比的性能。

photon-counting-learned-forward: >-
  光子计数 CT 有望提高空间分辨率并实现重建中的材料分解，但探测器间串扰的高效建模是一大难点。作者用训练好的深度卷积神经网络建模串扰，构成部分学习的前向算子，并证明了其在光谱 CT 二阶优化方法中的收敛性。在基于真实物理模型的小规模 CT 采集数值实验中，以完整串扰模型为基准，该方法比完全忽略串扰提高了 20 dB 的峰值信噪比，同时把完整模型的计算时间大约减半，并对未见数据表现出良好的泛化能力。

helical-learned-primal-dual: >-
  深度学习 CT 重建在模拟二维低剂量数据上表现突出，尤其是融入手工物理模型的领域自适应网络，可减少训练数据需求并改善泛化。但其训练在三维螺旋 CT（最常见的医学成像采集几何）中计算资源需求迅速变得难以承受，临床数据还带来通量测量误差、分辨率失配和缺乏真实基准等模拟未涵盖的问题。作者改造了 Learned Primal-Dual 架构，把螺旋轨迹分段并对各段应用展开的 LPD 迭代，使其可在单张 24GB GPU 上对低剂量 CT 全尺寸临床数据进行训练与测试，据称是首次将展开式深度学习架构用于此类数据。

sparse-view-elongated-objects: >-
  木材工业中，原木常在传送带上接受少数源位置的离散 X 射线扫描质检，单一切片数据不足以很好保留生物特征的三维重建。作者提出基于 Learned Primal-Dual 神经网络的学习迭代重建方法，适用于顺序扫描几何，并在相邻切片之间累积信息，而非仅用单一切片重建。以节疤分割 U-Net 评估表明，仅用五个源位置时，该方法对原木的重建已足够准确地识别节疤、心材与边材等生物特征。

sdf-self-supervised-denoiser: >-
  SDF 是面向 X 射线 CT 的学习图像去噪器的自监督训练方法，预训练仅依赖观测数据，微调只需少量图像，适用于稀疏视角与低剂量 CT。其核心是在正弦图空间训练去噪器，把去噪学习任务定义为由一个正弦图子集预测另一个子集，无需真实图像数据，并利用 CT 中丰富的正弦图数据。在二维扇形束与三维锥形束 CT 中，SDF 在峰值信噪比上优于其他解析与自监督框架，且少量样本微调后的提升得以保留，因而可作为高质量图像数据稀缺时的预训练方法，并有望成为 CT 基础图像增强模型的构建模块。
