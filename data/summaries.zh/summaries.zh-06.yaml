# Batch: JHU I-STAR team sweep #3（中文速读，忠实翻译，技术术语/缩写保留英文）。
dps-nonlinear-measurement-model: >-
  该方法用无条件扩散模型学习先验分数函数，再将其与非线性物理测量模型导出的似然分数结合，得到后验分数用于反向扩散采样，且无需针对新系统重新训练。仿真表明，非线性扩散后验采样优于传统重建和线性模型版本，并能在不同采集协议下提供高质量图像。

spectral-dps: >-
  Spectral DPS 将一次性无监督训练的扩散先验与任意解析物理系统模型结合，并引入 jumpstart 采样、Jacobian 近似和多步似然更新，实现一步重建与多材料分解。仿真双层与 kV 切换系统及物理锥束 CT 体模实验表明，其采样变异性与计算成本低于基线 DPS，均匀区平均密度误差小于 1%，且在准确性与鲁棒性上优于条件去噪扩散模型。

mixed-prior-implants: >-
  针对致密植入物引起的束硬化与局部体积伪影，该方法对解剖使用基于学习的先验、对植入物使用稀疏先验，并结合混合单能-多能正向模型与多分辨率植入物模型，交替进行扩散后验采样与经典优化。心脏支架与椎弓根螺钉仿真显示，植入物结构清晰、解剖图像中的条纹伪影得到有效抑制，SSIM 与 PSNR 优于频率分裂金属伪影抑制和基于模型重建。

blur-noise-restoration: >-
  针对仅凭退化图像难以获知噪声与模糊特性的盲修复问题，该方法把系统模糊与噪声表征作为辅助输入，与退化图像一同输入深度学习模型，并比较了输入变量与权重变量两种融合方式。结果表明，辅助输入使模型优于无辅助输入基线，PSNR 与 SSIM 均有提升，且在模糊与噪声参数偏离真值时仍保持一定鲁棒性。

dl-vif-motion: >-
  DL-VIF 是一种无需无运动参考图像的相似度度量，用卷积神经网络学习真实解剖中与运动伪影相关的特征，作为传统视觉图像保真度的无参考替代，并嵌入自动聚焦运动补偿框架。仿真与尸体研究表明，2-ResBlock 架构更好地反映运动严重程度并外推至未见数据，3-ResBlock 更不易过拟合；与梯度熵相比，DL-VIF 在运动补偿后 SSIM 提升更大、方差更小，即使在严重运动退化图像上也能改善图像质量。

dl-recon-brain-cbct: >-
  DL-Recon 结合物理模型与深度学习 CBCT 至诊断 CT 合成，用不确定性调制的条件生成对抗网络进行合成，以蒙特卡洛 dropout 估计认知不确定性，再按认知不确定性空间加权融合合成图与滤波反投影重建图。20 对真实与仿真头颅 CBCT 训练验证及 7 例术中神经外科试点表明，该方法在保持图像质量提升的同时减轻了合成误差，SSIM 最高提升 32%，病灶分割 Dice 系数最高提升 25%。
