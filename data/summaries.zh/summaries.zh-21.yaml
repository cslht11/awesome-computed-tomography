# Batch: SEU #19（7 篇）+ HKUST #20（2 篇），中文速读，忠实翻译，技术术语/缩写保留英文。
prior-4d-cbct: >-
  4D CBCT 每时相投影极度稀疏，会导致严重条纹伪影。该文将基于物理的模型与数据驱动方法结合，提出 PRIOR 框架：专用网络 PRIOR-Net 在编码阶段从全采样投影重建的先验图像中挖掘静态信息，以改善各时相图像的重建。在仿真与临床 4D CBCT 数据上的实验表明，该方法在条纹伪影抑制、软组织恢复和细节保留方面表现良好。

direct-net-dect: >-
  定量双能 CT 物质分解可同时利用正弦图域与图像域数据，但传统方法对两个域分别处理。该文提出端到端统一互域物质分解网络 DIRECT-Net，直接利用互域数据，并用堆叠卷积层同时完成降噪与物质分解。在按 DECT 成像物理数值生成的训练数据上训练，并在 XCAT 数字体模、生物标本、氯化钙体模和碘溶液体模上验证，结果显示水与骨基图像伪影更少，氯化钙与碘的定量误差小于 4%。

cross-limited-angle: >-
  有限角度 CT 存在伪影与结构丢失问题，而传统双域算法每次只对一个域正则化。CROSS 框架在图像域与测量域之间交替进行三步处理，同时对图像空间和残差误差空间正则化，以增强高衰减系数区域的器官恢复，并采用结构增强网络增强组织保留。仿真与临床前数据实验表明，该方法在伪影去除和边缘保留方面优于对比方法。

sea-net-limited-angle-cbct: >-
  针对真实临床 CBCT 投影数据的有限角重建，深度学习研究很少，大多工作使用仿真数据。该文比较了图像域、数据域与混合域等深度学习方法，提出 SEA-Net：采用专门的结构增强子网络促进纹理保留，并利用空间注意力模块突出与非均匀楔形伪影分布相关的区域、忽略无关区域，从而获得更准确的纹理恢复。作者称其为据其所知首个基于临床投影数据的有限角 CBCT 可行性研究。

cas-pred-limited-angle-cbct: >-
  有限角度数据会导致噪声与伪影，而传统迭代重建（如全变分）在锥束正反投影计算上耗时较长。Cas-PRED 为级联先验残差编解码网络，以多级级联网络为核心架构，利用全角 CT 重建结果作为先验信息指导深度学习网络的训练过程。在 [0°, 150°] 重建中，该方法报告 PSNR 为 33.69 ± 0.90 dB，SSIM 为 0.9557 ± 0.0029，RMSE 为 22.73 ± 1.56。

gdp-net-ring-artifact: >-
  环形伪影源于探测器响应不一致且具有全局相关性，卷积网络难以建模长程依赖。该文利用环形伪影在笛卡尔坐标与极坐标下特征不同的事实，提出双域并行架构 GDP-Net，从不同域提取并利用潜在特征，并引入 Mamba 机制以较低计算代价获得全局感受野。仿真与两组未见过的真实数据实验表明，该方法在消除环形伪影和恢复图像细节方面表现良好。

delta-net-high-pitch-helical: >-
  高螺距螺旋 CT 采样不足会导致伪影。Delta-Net 是针对高螺距螺旋 CT 不完全扫描数据的深度双域交替迭代优化网络，每个子迭代包括投影域校正与图像域精修；深度网络学习各域先验并作为正则化项纳入优化，所有超参数在训练中自动优化，同时设计了结构感知联合损失以增强伪影抑制与结构恢复能力。定量与定性结果表明，该方法在伪影抑制、细节恢复与泛化方面优于对比方法。

deep-sinogram-completion-mar: >-
  金属伪影去除可建模为正弦图补全问题，但图像域方法会丢失正弦图一致性，正弦图域方法又难以处理金属迹边界。该框架结合两者优点：SinoNet 负责恢复受金属影响的投影，PriorNet 则生成良好的先验图像以改善金属迹边界处补全投影的连续性；两网络通过可微前向投影以端到端方式联合训练，并采用残差正弦图学习策略更有效地利用先验信息；最终用滤波反投影从补全正弦图重建去伪影 CT 图像。在仿真与真实伪影数据上，该方法均优于对比方法并保留解剖结构。

mar-self-supervised-cross-domain: >-
  有监督金属伪影去除需要同一解剖结构完全相同的含金属伪影与无伪影 CT 图像对，难以获取。该文提出自监督跨域学习框架：网络先恢复无金属正弦图中由金属掩模前向投影确定的金属迹区域，再用新设计的滤波反投影重建损失鼓励更完善的补全结果，并用残差学习图像精修模块减少重建图像中的次生伪影。为保留细节与保真度，框架将金属迹替换纳入流程，用 CNN 输出前向投影生成的先验正弦图替换原始正弦图中的金属受影响投影，再用 FBP 重建最终图像。
