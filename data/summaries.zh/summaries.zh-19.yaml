# Batch: KAIST BISPL team sweep #17（中文速读，忠实翻译，技术术语/缩写保留英文）。
one-network-all-rois: >-
  ROI CT 有利于降低 X 射线剂量并使用小探测器，但标准解析重建如滤波反投影会产生严重 cupping 伪影，现有基于模型迭代重建计算量大，而先前学习 cupping 伪影的网络对不同 ROI 泛化不佳。本文设计了两类网络：一类从 FBP 图像学习与 ROI 尺寸相关的 cupping 伪影，另一类从截断微分反投影（DBP）数据反演截断 Hilbert 变换，并考察了对不同 ROI 尺寸、像素尺寸、探测器间距和短扫描起始角的泛化能力。实验表明新型网络在所有 ROI 尺寸上均显著优于现有迭代方法且运行复杂度显著更低，可作为通用 CT 重建引擎用于多种实际应用而不受探测器截断影响。

dbp-domain-conebeam-artifact: >-
  圆轨迹锥束 CT 因几何相对简单而应用广泛，但标准 Feldkamp、Davis and Kress 算法随锥角增大而出现锥束伪影，迭代重建方法则需多次计算昂贵的正投影与反投影。本文在微分反投影域设计深度网络，对与 Hilbert 变换相关的病态反卷积问题进行数据驱动反演，再用谱混合技术合并冠状与矢状方向重建结果以减少谱泄漏。多种条件下的实验表明该方法泛化良好，优于现有迭代方法且运行复杂度显著降低。

cycle-free-cyclegan: >-
  CycleGAN 无需配对训练数据即可实现高性能、超快速的低剂量 CT 去噪，但为保证循环一致性需要两个生成器和两个判别器，对 GPU 资源与训练技能要求高；使用 AdaIN 的可切换 CycleGAN 虽只用一个生成器，仍需两个判别器和额外的 AdaIN 码生成器。本文提出仅含一个生成器和一个判别器、仍保证循环一致性的 cycle-free CycleGAN，关键在于可逆生成器可自动满足循环一致性条件并省去额外判别器。在不同剂量水平 CT 图像上的实验表明，该方法仅用 24% 的可学习参数、训练速度快一倍，且在复杂度与重建质量的权衡上优于现有方法。

cardiac-cyclegan-noise-disentanglement: >-
  心电图门控心脏 CT 血管成像需连续采集覆盖整个心动周期的多期相图像，累积辐射剂量降低对患者安全重要；虽可用 ECG 门控剂量调制以低剂量采集多期相图像，但降剂量会在重建中引入噪声。本文提出基于噪声解纠缠的无监督深度学习方法：用小波变换提取含最多噪声的高频信号，并以 cycleGAN 对低剂量与非配对高剂量 CT 提取的高频信号进行无监督训练，训练完成后从输入图像中减去估计的噪声成分得到去噪图像。由有经验的放射科医师对仅 4% 剂量 CT 图像的去噪结果按清晰度、噪声水平与结构可见度进行视觉分级并计算信噪比，结果显示该方法图像质量远优于低剂量 CT 图像与基线 cycleGAN 结果，可作为低剂量 CT 的重要去噪平台。

metal-artifact-beta-cyclegan: >-
  金属伪影降低是 CT 的重要研究课题，监督学习方法最常用，但实际 CT 采集中难以获得配对的无金属伪影与含金属伪影图像；基于特征解纠缠的无监督方法虽有前景，但网络结构过于复杂，难以处理大尺寸临床图像。本文提出基于最优传输理论的新型 β-cycleGAN 架构以实现恰当的特征空间解纠缠，并在生成器中加入卷积块注意力模块（CBAM）层，使金属伪影更受关注从而被有效去除。实验结果证实该方法在保留原始图像细节纹理的同时实现了更好的金属伪影降低。

adain-tunable-cyclegan: >-
  CycleGAN 已成为低剂量 CT 无监督去噪的有力方案，但训练阶段需要两个深度生成器（推理阶段只用一个），辅助生成器为保证循环一致性带来了额外内存与可学习参数负担，且只能在两个域之间转换，无法考察中间去噪水平。本文提出使用单个生成器的新型可调 CycleGAN：用自适应实例归一化（AdaIN）层实现单个生成器，使低剂量 CT 转常规剂量 CT 的基线生成器仅通过改变 AdaIN 码即可切换为高剂量转低剂量；共享基线网络使额外内存与权重增加最小化，即使小训练数据也能更稳定地训练。通过在两个域之间插值 AdaIN 码，还可考察多种中间去噪水平。实验表明该方法仅用约一半参数即优于以往 CycleGAN 方法，并提供了可能在临床环境中有用的可调去噪特性。
