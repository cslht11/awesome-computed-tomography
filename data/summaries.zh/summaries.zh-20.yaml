# Batch: Tsinghua EP team sweep #18（中文速读，忠实翻译，技术术语/缩写保留英文）。
slice-wise-low-dose-cbct: >-
  低剂量锥束 CT 中，传统 Feldkamp 方法难以同时兼顾降噪与分辨率，而优化迭代方法计算成本很高。该文把锥束成像物理融入残差卷积网络，提出端到端逐层重建方法，将三维投影问题转化为二维逐层问题。网络由锥束到扇束变换、二维解析反演和图像精修三个串联子网络组成，从而降低计算量并便于并行处理。

dual-domain-sparse-helical: >-
  该文针对轴向稀疏多探测器加多缝准直器的新型螺旋 CT 原型，因数据不足而使重建成为病态逆问题。方法引入 Radon 逆算子并逐层解耦，由投影域卷积网络补全缺失投影并转为二维扇束投影、解析线性算子转到图像域、图像域卷积网络精修三部分端到端训练。在 AAPM 低剂量 CT 挑战赛的 8 例患者仿真数据上训练，并在仿真与临床数据上评估，视觉与定量结果均令人鼓舞。

interweaving-monochromatic: >-
  光子计数探测器存在谱畸变与串扰等问题，直接重建的单能图像并不准确，而传统校准补偿方法的效果依赖模型校准精度。该文提出工作于正弦图域的 Interweaving Network（WeaveNet），其结构基于谱畸变机理设计。在光子计数锥束 CT 上验证并经 FDK 重建后评估，得到更准确、噪声更低的单能图像。

mbdl-unsupervised-low-dose: >-
  低剂量 CT 具有降低辐射风险的意义，但有监督学习需要配对的常规剂量图像，获取成本很高。该文提出基于模型的无监督深度学习方法 MBDL-US，用广义最大后验损失仅以低剂量投影训练，无需标签，并可与少量有监督数据结合为半监督方法 MBDL-SS。在 AAPM 数据上，MBDL 优于基于模型的迭代重建且计算成本显著更低，性能接近有监督方法。

sams-net-limited-angle: >-
  有限角度 CT 是典型的严重病态问题，传统解析与迭代方法在不完备投影下会出现严重结构失真与伪影。Sam's Net 为多阶段自增强网络，通过交替最小化实现端到端重建，由正弦图补全网络 SCNet、伪影抑制网络 ASNet 以及域变换层构成跨域优化骨架，并引入在线自增强模块与基于数据保真度的替代约束和可学习权重层。在 90 度与 120 度有限角度实验中，该方法表现优于对比方法。

udamar-metal-artefact: >-
  有监督金属伪影去除方法在仿真与实际数据之间存在域差异，而纯无监督方法效果不足。该文提出 UDAMAR，在典型图像域有监督方法中引入无监督域自适应正则化损失，通过特征空间对齐缩小仿真与实际伪影差异，同时学习有标签仿真数据与无标签实际数据。在牙科与躯干数据上，该方法优于对比方法。

pwls-som-limited-view: >-
  深度学习方法在有限视角 CT 中虽能减轻条纹伪影，但向实际应用的泛化仍具挑战。PWLS-SOM 将深度学习先验与针对具体病例的数据一致性结合，采用三阶段策略优化的惩罚加权最小二乘重建框架。在 90 视角圆形扫描与多段直线扫描的稀疏视角实验中，该方法优于有监督深度学习方法，并用离体大鼠数据做了验证。

disentangled-interior-low-dose: >-
  低剂量内层析成像同时受噪声与截断投影影响，噪声与数据截断的耦合效应给精确重建带来很大挑战。该文提出解耦框架 DPER 及其改进版 DPER-Pro，分离噪声与背景或截断效应，并采用由粗到精的策略。在仿真躯干与真实体模数据上验证，该框架为内层析成像提供了稳健有效的解决方案。

dental-metal-interpolation: >-
  牙科 CT 中金属伪影常见，传统插值方法的效果有限。该方法先用受金属影响的局部插值数据做粗重建，再用深度网络去除伪影并恢复非金属结构，最后加回感兴趣区的金属。在仿真数据集上训练并用独立仿真数据验证，同时提出了从仿真到实际系统的可迁移学习策略。

fourier-linogram-symmetric: >-
  该文研究光源与探测器呈线性分布且位置固定的对称几何 CT 的傅里叶性质，建立了加权投影的一维傅里叶变换与变形物体二维傅里叶变换之间的简单数学联系，即对称几何 CT 的傅里叶切片定理。基于该定理及其在傅里叶空间的独特数据采样方式，提出基于 Linogram 的傅里叶重建方法，并把整个重建过程作为已知算子嵌入端到端神经网络，形成 Linogram-Net。数值仿真与对称几何 CT 原型平台的物理实验表明，该方法可从双对称几何扫描实现精确重建，并大幅降低计算复杂度，尤其改善了有限角度等非理想成像场景的图像质量。
