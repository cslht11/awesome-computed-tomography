# Batch: 2026-11-10 list review（中文速读，忠实翻译，技术术语/缩写保留英文）。
sonar: >-
  SONAR 是一种结构一致的神经算子，用于零空间感知的稀疏视角 CT 重建：它不恢复完整的零空间分量，而是从已采集投影预测低维零空间感知表示作为伪测量，分离测量残差与伪测量残差，并用独立的神经算子约束它们的结构效应，其中各向异性 U 形神经算子支持跨离散化重建。在仿真 AAPM 数据上，它在 62 视角下较最强对比方法提升 PSNR 1.87 dB，在零样本迁移到 512×512 网格时提升 7.63 dB，并在临床 MARS 光子计数 CT 数据上取得全部评估设置的最佳整体表现。

physics-independent-pair: >-
  面向迭代自监督低剂量 CT 去噪的物理驱动框架：学习到的正弦图先验与 LDCT 噪声模型引导光子计数的后验推断，分离 Poisson 与 Gaussian 分量，再分别经 binomial thinning 与 Gaussian 数据 thinning 构建两条近似独立的训练分支，只需一次低剂量测量。跨域迭代在保持与 CT 采集物理一致的同时逐步优化先验与训练对；在仿真 AAPM、LIDC-IDRI 与 LoDoPaB-CT 数据及真实 LDCT 数据上，它在各剂量水平下一致优于所评自监督基线，性能与所评有监督基线相当。已投稿 IEEE TCSVT。

physics-flow-matching: >-
  以 Flow Matching 作为 CT 重建的生成先验：一个高分辨率 rectified flow 模型在 Mayo Clinic 低剂量 CT 数据集的 256×256 胸部图像上训练，采用两阶段策略——先用强解剖信息数据增强，再以减弱或无增强微调以提升结构保真度——并作为 Plug-and-Play Flow、FlowDPS、Flower 与 Flow-Priors 等流匹配重建方法的先验。在多个 CT 逆问题设置中，流匹配方法在 PSNR、SSIM 与感知质量上一致优于扩散基线（DDRM、DPS、DiffPIR），且采样步数更少。

higdiff: >-
  HiGDiff 是面向极端 CT 重建的前馈分层高斯扩散框架，覆盖稀疏角度、有限角度与低光子计数退化（单独、成对或联合出现）：物理条件解剖锚点与前景容量场把可学习的高斯基元分配到信息丰富的区域，结构扩散阶段先恢复全局衰减几何，再以其学习表示条件化细节扩散阶段处理残余边界与组织过渡。在三个 CT 基准数据集上，它在单独、成对与联合退化设置下均达 SOTA，包括在 LDCT-PD 数据集上宏平均 PSNR 提升 5.81 dB、SSIM 提升 0.113。

encore: >-
  ENCORE 是面向低剂量 CT 去噪的高效噪声上下文感知表示框架：它基于真实的非 Gaussian 噪声分布重新构建噪声合成过程，提取局部噪声功率与相关性上下文引导去噪，并引入 FlyingConv，按局部图像区域自适应调整卷积权重。在推理时调节噪声上下文图的强度可实现零样本条件去噪，动态控制输出图像纹理，去噪质量与计算效率均有显著提升。

electric: >-
  ELECTRIC 是带迭代校正的物理引导贝叶斯 CT 重建方法：证据神经网络（evidential neural network）给出图像提议与可预测误差的认知不确定性（epistemic-uncertainty）替代量，后者转化为自适应精度场并嵌入 Poisson 加权的 MAP 更新，使先验置信度成为迭代重建的一个学习状态变量。在留出的 Mayo 患者数据上，学习到的先验均值较滤波反投影（FBP）降低重建误差约 70%，学习到的不确定性可预测误差并支持选择性信任，且自适应精度重建达到或超过经验证调优的固定先验，对先验强度误设明显更鲁棒。

agentic-autoresearch-ct: >-
  一个能独立做重建研究的 LLM 智能体：在智能体循环（编辑求解器、跑短集群任务、读取一个固定指标、再修订）中，它独立实现、调优并评测了 26 种重建方法，覆盖 Mayo 低剂量 CT 与 DL-Sparse-View Challenge 的 128 视角稀疏视角乳腺任务，所有方法共享同一个可微扇束投影器。它将这些方法重组为仅 969 个参数的紧凑求解器，以冠军 0.4% 的参数量追平 Mayo 顶级梯队（1% 差距内）；评测表明无噪声排行榜不能预测含噪输入下的鲁棒性——无噪声乳腺冠军在轻微噪声下从 0.89 跌至 0.00，而学习型 primal-dual 方法则升至冠军。

splitting-svct-design: >-
  面向分裂式自监督稀疏视角 CT 重建的统一框架，将设计分解为划分、预处理与推理三部分，并提出两项扩展：多划分分裂与一种替代推理策略。在独立与相关噪声下的仿真 LoDoPaB-CT 数据及真实 2DeteCT 数据上，最优划分策略强烈依赖测量噪声结构——格点分裂在独立噪声下表现更好，角度掩码在相关噪声与真实测量数据下更鲁棒——且多划分分裂在多个设置下一致优于纯投影向分裂。
ml-spnp: >-
  面向稀疏视角 CT 的多级随机即插即用方法，建于小波多分辨率分析近似空间：先由粗到细初始化，再用分辨率专属去噪器做有限次多级校正。在适当假设下，多级阶段后的精细层迭代继承底层随机 PnP 算法的收敛保证。在两个 CT 数据集（20–50 个投影视角）上，其重建质量与所比较的随机 PnP 方法相当，耗时通常更少。

psct-net: >-
  面向稀疏双平面 X 光重建 3D 小儿颅骨 CT 的几何感知框架：可微反投影建立空间忠实的体素先验以缓解深度歧义，Attention-Guided Projection（AGP-3D）模块学习 2D 区域与 3D 位置之间的非线性体素级对应，Bidirectional Mamba（BiM-3D）模块以线性复杂度捕捉长程体素依赖。在私有机构小儿颅骨 CT 队列 PedSkull-CT（涵盖正常与病理病例）上评估。

tracing-oracle: >-
  面向 3D CT 重建的即插即用扩散 timestep 调度优化框架：以少数样本上稠密采样的数值积分轨迹作为参考 oracle，用动态规划提取最优调度，全局最小化少步近似与 oracle 之间的累积误差，把有限的采样步分配给最易受截断误差影响的演化阶段。在 AAPM 数据集上与最先进的 3D CT 方法 DDS 结合，优化后的 timestep 较启发式调度显著提升重建保真度与效率，尤其在不超过 10 个采样步的严格预算下。

gradient-step-pnp-dental: >-
  面向牙科锥束 CT 光子噪声抑制的即插即用梯度步算法：先在模拟扇束采集（投影数据中加入光子噪声）的重建结果上训练梯度步去噪器，再将其集成到重建中。合成数据实验验证了其去噪能力，真实图像的定性评估展示了算法性能与泛化能力。

fast-dip: >-
  面向不完整或带噪测量 3D CT 重建的分数梯度自编码序列 Tomography DIP（FAST-DIP）：将切片的输入自适应序列深度图像先验建模与沿切片（z）方向梯度的分数 l1/l2 稀疏先验结合，显式强化层间结构一致性。majorization-minimization 框架下的交替最小化算法被证明单调下降，并在 Kurdyka–Łojasiewicz 性质下收敛到临界点。3D X 射线 CT 实验表明，其重建质量与结构一致性优于已有 DIP 方法。

frequencyct: >-
  首个面向低剂量 CT 去噪的频域零样本自监督伪样本生成方法：利用噪声与真实信号在频域分布的差异，结合区域低频锚定与高频区域的保相位噪声和掩码扰动生成伪样本用于自监督，并以一致的数据截断稳定优化梯度。在多个公开与真实数据集上评估，展现出临床应用潜力。

neighbor2inverse: >-
  面向低剂量传播式相位衬度 CT（PBI-CT）的自监督去噪框架，可推广到临床 CT：基于 Neighbor2Neighbor 原理，将每张带噪投影下采样为两个保留结构信息但含独立噪声实现的变体，分别重建后作为训练对，用于训练图像域去噪网络。在感兴趣区 PBI-CT 实验中，它在保留精细结构细节的同时实现更优的噪声抑制，对比度-噪声比、空间分辨率与综合图像质量指标均有提升；在模拟低剂量条件下的临床 CT 上也表现相当。

residual-gaussian-splatting: >-
  面向超稀疏视角锥束 CT 的残差高斯溅射（RGS）：谱解耦高斯表示将体素场分层为几何基底与残差细节两部分，把显式高频拟合转化为物理一致的隐式残差补偿任务（符合 X 射线衰减的非负性），并以小波多分辨率分析提供高频信息；谱-空间协同优化策略协调几何锚定与纹理精修以防止谱串扰。在临床数据集上，RGS 捕捉到高度精细的几何纹理，化解了伪影抑制与细节保留之间的权衡，在复杂的骨小梁与血管结构上视觉保真度优于已有神经渲染基线。
deep-rl-angle-selection: >-
  面向稀疏视角 CT 的剂量感知采集与重建：PWLS-PnP 重建主干结合基于强化学习的自适应角度选择，显式考虑角度相关的光子统计，使剂量分配给信息量最大的方向，而非均匀角度与均等剂量。数值实验表明，它比常规策略提高重建质量与缺陷可检出性，在投影数很少或剂量预算受限时优势尤为明显。

memory-efficient-inr-ct: >-
  隐式神经表示（INR）参数高效且完全可微，但用标准自动微分优化它做 CT 重建时 GPU 显存消耗极大，尤其在三维成像中，因为模拟射线投影需要大量 INR 求值。本文提出一种显存高效的随机梯度近似，把梯度分解为可随机子采样的 Jacobian-vector product，在 GPU 显存与梯度精度之间权衡；合成二维数据上它比标准 INR 训练省得多，收敛行为与均方误差相当，并能实现显存高效的三维稀疏视角锥束 CT 重建。

ipv2: >-
  面向真实世界超低剂量（2% 剂量）肺部 CT 去噪的改进图像纯化策略：原策略纠正了真实超低剂量与常规剂量 CT 之间的空间错位，但只抑制胸壁与骨骼区域的噪声，背景与肺实质未得到处理。IPv2 用 Remove Background、Add noise、Remove noise 三个模块重新设计，使模型在背景与肺组织两处都具备去噪能力；在 2% 剂量的真实患者肺部 CT 数据集上，它在多个主流去噪模型上一致提升背景抑制与肺实质恢复。

plot-ct: >-
  PLOT-CT 在 pre-log 域做低剂量 CT 重建：多数方法在图像域或 post-log 投影域工作，而对数变换会放大噪声。它对 pre-log 正弦图做 Voronoi 分解，把数据解耦为不同成分并嵌入各自的 latent space，提升判别特征学习能力、抑制噪声并保留 pre-log 信息；实验表明，在 1e4 入射光子水平上比传统方法提高 2.36 dB PSNR。

hybrid-2d-3d-cnn: >-
  发表于 IEEE NSS/MIC/RTSD 2025 的混合框架，用于减少欠采样三维锥束 CT 的伪影：2D U-Net 先逐层提取特征图，再沿体积堆叠后送入 3D 解码器，利用跨层上下文预测无伪影的三维 CT 体数据。两阶段设计兼顾二维处理的高效与三维建模的体积一致性，以很低的计算开销显著改善冠状面与矢状面的层间一致性。

principled-confidence-ct: >-
  面向深度 CT 重建的原则性置信估计框架，基于 sequential likelihood mixing，具备理论覆盖保证，并采用贴近实际的 Beer-Lambert 对数线性正向模型与 Poisson 噪声。它既适用于经典算法，也适用于 U-Net、U-Net 集成与生成式扩散模型等深度方法；实验表明，深度方法在不牺牲覆盖保证的前提下给出比经典重建紧得多的置信区域，还能检出重建中的幻觉，并提供置信区域的可解释可视化。

vsgc: >-
  VSGC 是面向有限角 CT 的可见奇异性引导相关网络，围绕该任务的核心成像特点设计——伪影的方向性，以及缺失投影角度导致的结构信息方向性丢失。它先从有限角图像中提取可见奇异性（VS）边缘特征并聚焦于此，再建立这些特征与其他图像区域的相关性，配合各向异性约束的多尺度损失；在仿真与真实数据集上验证，在小角度范围内比其他方法提高 2.45 dB PSNR 与 1.5% SSIM。

dufal: >-
  发表于 TMLR 的 DuFal 是面向高保真极稀疏视角锥束 CT 重建的双频感知框架，以双路架构融合频域与空域处理。核心是 High-Local Factorized Fourier Neural Operator：全局高频增强 FNO 分支捕捉全局频率模式，局部高频增强 FNO 分支处理空间分块以保留局部性，另有 Spectral-Channel Factorization 方案减少 FNO 参数，以及 Cross-Attention Frequency Fusion 模块融合空域与频域特征；在 LUNA16 与 ToothFairy 上，它在极稀疏视角下保留高频解剖特征方面显著优于现有最优方法。
