# Batch: SEU #19 第二批（13 篇），中文速读，忠实翻译，技术术语/缩写保留英文。
fda-recon-limited-angle-cbct: >-
  真实临床数据的有限角度 CBCT 存在伪影，而有监督方法需要配对的全角度参考图像。FDA-Recon 为无监督三阶段方法：目标到源数据自适应、源数据图像恢复，以及先验图像约束的目标域保真重建；前两阶段使用深度学习并引入 spiral-Mamba。在真实头颈数据集上验证，该方法减少了伪影并恢复了结构。

spectral-x-mamba: >-
  多能 CT 恢复可受益于全谱先验信息，但跨能量融合先验并建模长程依赖并不容易。Spectral-X 利用增强全谱先验图像的潜在表示，采用带特征融合块的 X 形网络自适应捕捉潜在空间中的多尺度先验信息，并集成全方位 Mamba 机制建模长程依赖。该方法在光子计数 CT 去噪和限视多源 CT 恢复任务上得到验证。

msdu-nets-dual-energy-limited-angle: >-
  双能有限角度 CT 仅有部分扫描数据，需要同时利用两个域的信息。MsDu-Nets 为多阶段双域网络，每阶段连接正弦图域和图像域并用 FBP 连接；信息先验通过拼接双能投影数据与 Parker 加权反投影重建得到，自增强用于缓解条纹伪影。该方法仅需 180° 扫描。

mjcnet-planning-ct-limited-angle: >-
  计划 CT 可为有限角度 CBCT 提供强先验，但逐层使用先验会残留层间伪影。MJCNet 为多维联合级联网络：粗阶段为二维网络，用两个编码器利用计划 CT 先验逐层去除伪影；精修阶段为三维密集注意力网络，用于改善细节并去除层间伪影。

large-diffnet-planning-ct: >-
  局部平滑、稀疏性等手工正则化限制了有限角度 CBCT 的图像质量。LARGE-DiffNet 为计划 CT 引导的深度扩散模型，学习理想 CBCT 图像的分布级先验知识。在临床 CBCT 数据集上验证，该方法旨在提高限角 CBCT 图像质量和图像引导放疗中的配准精度。

spear-net-limited-angle-dect: >-
  有限角度双能 CT 在两个能量通道都缺乏完备投影。SPEAR-Net 含 IP-Net、两个 DIP-Net 和 DSP-Net，利用双四分之一扫描先验，通过前向投影补全限角投影，用于限角双能 CT 的自先验增强伪影去除。

time-net-limited-angle-dect: >-
  有限角度双能 CBCT 需要两个能量通道的互补信息。TIME-Net 含图像编码器、先验编码器、Transformer 编码器三个编码器，低能与高能两个解码器，以及一个特征融合模块；融合模块将特征压缩为紧凑共享特征后送入解码器做差分学习。它可用两个互补四分之一扫描获得高质量双能 CBCT，并验证了虚拟平扫成像和碘定量两种临床应用。

lwcdnet-metal-artifact: >-
  金属伪影去除受益于可解释模型对伪影与组织的分离。LWCDNet 基于迭代软阈值算法提出学习加权卷积字典单元，用于表示伪影特征；用轻量残差网络改善组织衰减分量恢复，并通过金属掩模对不同分量实现判别表示与约束。它在合成与临床数据集上得到验证。

dcdl-gs-sparse-view: >-
  稀疏视角 CT 重建受益于黑箱网络之外的可解释先验。DCDL-GS 将投影数据与图像先验知识整合为可解释的深度迭代模型，网络由卷积字典学习和非局部组稀疏先验组成，在统计迭代重建框架内结合神经网络进行多次迭代，并引入新的组阈值操作以改善特征表示与约束能力，还包含滤波反投影重建和快速滑动窗口非局部相似性操作。

mvss-pcr-self-supervised-denoising: >-
  自监督 CT 去噪采用下采样时，训练输入与目标之间存在像素错位问题，且卷积网络捕捉长程依赖的能力不足。MVSS 通过聚合多视图正弦图增强训练图像与目标图像的对齐，结合全局搜索的非局部均值模块提供更高质量的训练目标；最后用带自适应步长调整的先验约束迭代重建框架保证数据一致性、恢复精细解剖结构并加速收敛。

dp-resnet-low-dose: >-
  低剂量 CT 质量可通过同时处理投影域与图像域来改善，但单域网络会遗漏互补信息。DP-ResNet 为域渐进三维残差卷积网络，包含三个阶段：正弦图域网络（SD-net）、滤波反投影（FBP）和图像域网络（ID-net）；SD-net 与 ID-net 均基于残差网络结构，对最终低剂量 CT 质量改善起互补作用。在模拟与真实投影数据上验证表明，结合两个域的网络处理可显著改善性能。

dire-low-dose: >-
  传统迭代重建用于低剂量 CT 时计算成本很高。DIRE 策略用深度网络从低剂量 CT 的解析重建图像估计迭代重建图像，以避免传统迭代重建的高计算成本；其网络为三维残差卷积网络（3D ResNet）。它在多个模拟与真实数据集上与现有方法比较，验证了对低剂量 CT 图像质量的改善效果。

cascaded-resunet-spectrum-loss: >-
  低剂量 CT 去噪需要在抑制严重伪影噪声的同时保留目标结构与噪声纹理。Ca-ResUnet 为带改进噪声功率谱损失的三维级联 ResUnet 神经网络，工作流程包括经域变换模块的滤波反投影重建、作用于 CT 图像的 ResUnet、图像补偿模块，以及第二个带改进谱损失的 ResUnet。在 AAPM 与 United Imaging Healthcare 数据集上验证，该方法可显著减少严重伪影噪声并保留目标结构。
