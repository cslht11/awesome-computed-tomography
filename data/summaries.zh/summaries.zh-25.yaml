# Batch: AgentCT（中文速读，忠实翻译，技术术语/缩写保留英文）。
agentct: >-
  面向通用 CT 恢复的视觉-语言智能体：经 LoRA 微调的 Qwen3-VL-4B 控制器先识别退化类型与严重程度，再把病例分流给专科模型——低剂量 CT 用图像域扩散模型，稀疏视角与金属伪影结合投影域校正、数据一致性、可微 FBP 与图像精修。在 Mayo 2020 腹部 CT 的 9 种设置（三退化 × 三严重程度）上整体达到 46.18 dB / 0.984，9 项全部高于 AMIR（44.93 dB）与 TAMP（44.29 dB）；稀疏视角专科仅 4.2M 参数即达 46.04 dB，高于单任务 AMIR 的 44.43 dB 与 all-in-one AMIR 的 43.57 dB（23.5M 参数）。
