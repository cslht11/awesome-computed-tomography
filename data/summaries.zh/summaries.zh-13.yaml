# Batch: CWI team sweep #12（中文速读，忠实翻译，技术术语/缩写保留英文）。
filter-design-noise-robust: >-
  传统滤波反投影在噪声、不完全采样或非标准扫描几何下性能会明显下降；该研究提出直接从训练数据学习滤波反投影滤波器和投影权重，在不牺牲计算效率的前提下提高鲁棒性，并可表述为线性反问题的正则化优化问题。二维和三维实验均优于传统滤波反投影和 Feldkamp–Davis–Kress 方法，且在合成层析数据上训练的滤波器能较好地泛化到真实测量，图像质量接近先进迭代方法而计算成本更低。

cone-angle-artifact-reduction: >-
  圆形锥束 CT 中的高锥角伪影会严重影响诊断和治疗计划；该方法利用伪影与旋转扫描几何的关系，把三维伪影问题高效地化为二维问题，用从锥束 CT 扫描中径向采样的图像切片训练卷积神经网络，并比较了 U-Net 与 Mixed-Scale Dense 网络。结果表明，该几何感知降维方法大幅减少了高锥角伪影，优于基于笛卡尔切片的深度学习方法，并显著提高了后续图像分割的准确性。

on-the-fly-resolution: >-
  断层重建三维体积的分辨率受探测器像素分辨率和光学因素限制，而现有机器学习超分辨率方法通常需要一批相似物体的高质量训练数据，在许多断层应用中并不可行。该研究基于物体内部局部结构相似的假设，提出一种无需相似物体训练集的方法，将专门设计的扫描流程与超分辨率机器学习方法相结合。模拟数据和实验数据的验证均表明，该方法能够显著提高断层重建的分辨率。

msdnet-limited-data: >-
  受限数据下，直接重建算法往往不够准确，而更准确的迭代算法计算成本又过高；以往基于编码器–解码器网络的方法在处理大型断层图像时也存在不足。该研究提出使用 Mixed-Scale Dense 卷积神经网络改进直接算法的重建质量，以避免上述缺点。在多种受限类型和对象类型、模拟数据与大规模真实实验数据上的结果表明，即使数据严重受限，该网络也能显著提高重建质量并优于现有算法。
