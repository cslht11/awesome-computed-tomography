# Batch: Cambridge CIA team sweep #11（中文速读，忠实翻译，技术术语/缩写保留英文）。
learned-denoising-simulated-experimental: >-
  机器学习降噪高度依赖高质量训练数据，模拟噪声与真实噪声之间的迁移是关键问题；本文用大型二维 CT 数据集系统比较 U-Net 与 MSD-Net 在模拟噪声与实验噪声上的表现，并比较正弦图域与重建域处理。结果表明模拟数据在正弦图域的优势不一定迁移到重建域，而实验噪声训练的直接正弦图到重建映射效果更好，提示需要更逼真的噪声模拟。

task-specific-sampling-sparse-view: >-
  稀疏视图 CT 低剂量、快速但伪影严重，通用采样策略未必适合不同扫描部位与下游临床任务；本文提出多任务深度学习框架，以统一重建网络为不同任务学习最优采样策略。多类扫描与下游任务实验表明该策略可提升成像质量与下游表现，且共享网络便于在现有设备上切换任务模块。

phase-contrast-data-driven-prior: >-
  光栅干涉相衬 CT 兼具常规 CT 的三维分辨率与更高的软组织对比，但光栅缺陷与光子不足会放大噪声，且微分前向算子高度病态；本文提出结合改进层析算子与深度网络数据驱动先验的新型正则化迭代重建算法，并用 L-BFGS 与非扩张网络约束支撑收敛与稳定性分析。模拟数据与真实测量均显示高质量成像。

noisier2inverse: >-
  本文提出无需真值、无需显式外推的自监督方法，针对测量噪声空间相关的情形，通过加噪数据训练并在测量空间定义损失来恢复外推图像；数值证据表明它优于以往处理相关噪声的自监督方法。关于 CT：CT 是主要实验应用，不是次要例子——数值实验节限定为二维平行束 CT 重建，两个数据集均为 CT（32 张 CBCT Walnut 数据与 107 张心脏 CT 数据，采用 512 个投影角与 FBP 初始重建，并另有 64 投影稀疏实验），该节未见显微或地震实验。
