# Batch: FAU Maier team sweep #10（中文速读，忠实翻译，技术术语/缩写保留英文）。
known-operator-geometry-conversion: >-
  X 射线是广泛使用的实时成像技术，而 MRI 的多种对比度有助于介入引导，但两者采集几何根本不同，传统重分箱方法会损失分辨率。为此作者推导了一种平行束到锥束转换的新型重分箱公式，并按已知算子学习范式将其映射为带可微投影算子的神经网络，仅学习剩余未知算子。实验表明，该网络优于传统基线方法，且可用仿真数据训练后直接用于真实数据，无需重训或迁移学习。

extended-fov-reconstruction: >-
  当患者超出 CT 扫描视野时，缺失数据会造成截断伪影，作者用深度学习扩展视野并抑制截断伪影，目标是在扫描视野之外给出较好的患者数据估计，而非提供完全诊断级图像。研究比较了 ConvNet、自编码器与 U-Net 三种卷积网络，以及 L1、L2、结构相异性与感知损失的影响。在 12 例截断测试患者上，U-Net 结合结构相异性损失在扫描视野外区域的图像恢复上表现最好，证明深度学习可以实现截断伪影去除。

two-view-topogram: >-
  为在扫描前前瞻性估计 CT 有效剂量并用于患者风险最小化方法，需要仅用尽量少的投影重建解剖结构尽可能正确的 CT 体数据。作者提出一种基于生成对抗网络的优化模型，仅用前后位与侧位两张 CT 投影重建三维体数据，并在训练中加入预训练器官分割网络与三维感知损失以增强解剖结构。结果显示，该方法在重建指标上略优于基线，平均器官 Dice 系数由基线的 0.63 提高到 0.71，器官形状与边界更清晰，便于识别相关解剖结构。

trainable-joint-bilateral: >-
  低剂量 CT 去噪希望在降低患者剂量的同时保持图像质量，但深度学习去噪模型在训练数据之外泛化不稳，限制了临床应用。作者提出混合去噪方法，用可训练联合双边滤波器结合卷积深度去噪网络预测引导图像，兼顾深度特征提取能力与传统滤波器的可靠性。实验在无金属腹部数据上训练、在含金属腹部数据与头部数据上测试，混合模型在金属区域与头部数据上均改善了去噪指标，表明可训练联合双边滤波器限制了深度网络的误差界。

filter2noise: >-
  深度学习在低剂量 CT 去噪上进展显著，但黑箱模型难以被放射科医生验证与控制，而零样本方法又难以处理 CT 的空间相关噪声。作者提出 Filter2Noise（F2N），用注意力引导的双边滤波器替代传统深度网络，并用欧氏局部洗牌与多尺度自监督损失从单张噪声图像中学习。在 Mayo Clinic 低剂量 CT 挑战上，F2N 达到 39.76 dB 的峰值信噪比，比次优零样本方法高 1.88 dB，且仅用 3.6k 参数，参数量约为对比方法的 1/360；光子计数 CT 验证显示其可将低剂量图像提升至与全剂量无显著差异的对比噪声比水平，且滤波策略完全可视化、可交互调整。

ultralow-parameter-denoising: >-
  多数数据驱动去噪方法基于深度神经网络，含有数十万可训练参数，难以理解且易出现预测失败。作者提出基于双边滤波思想的 CT 去噪框架，其滤波层每层仅含三个空间参数与一个强度范围参数，共四个可训练参数，并可融入任意深度学习流程或通过可微反投影用于原始探测器数据与重建体数据。实验表明，仅用极少参数的流程即可与拥有数十万参数的深度去噪结构竞争，在 X 射线显微镜骨数据与 2016 年低剂量 CT 大挑战数据上分别取得了有竞争力的结构相似性与峰值信噪比。
