# Batch: WANG-AXIS team sweep #1（中文速读，忠实翻译，技术术语/缩写保留英文）。
uswin-limited-angle-cardiac: >-
  U-Swin 将 U-Net 与 Swin transformer 结合用于有限角度心脏 CT：U-Net 恢复因投影缺失而丢失的结构，transformer 捕捉全局特征分布。在合成 XCAT 数据与临床 Stanford COCA 心脏 CT 数据上，该方法在 120° 与 90° 有限角度下均优于已有深度学习方法，有望更好地“冻结”跳动的心脏。

lama-dual-domain-sparse-view: >-
  LAMA 是从变分模型导出的可学习交替极小化算法，其非光滑非凸正则项在图像域和正弦图域均被参数化为深度网络。结合平滑技术与残差学习，该方法声称复杂度更低、内存效率更高、具有可证明的收敛性，并在多个基准 CT 数据集上大幅优于现有方法。

ultra-spectral-ct: >-
  ULTRA 针对能谱 CT 各能量通道信噪比低的问题，采用结合 Lp 范数、全变分与残差学习的各向异性自适应 U-Net，并利用多尺度特征融合、多通道滤波增强与跨能量通道相关性先验。在三个大规模能谱 CT 数据集上均优于竞争算法。

virtual-monoenergetic-dl: >-
  改进的残差网络把单能谱 CT 图像映射为预定能量水平的虚拟单能图像，避免了双能 CT 增加的系统复杂度和辐射剂量。虚拟单能图像相对双能 CT 的误差小于 2%，三类组织多物质分解精度与双能 CT 相当。

deep-silicon-pc-denoising-rl: >-
  Dueling double deep Q-network 结合多智能体方法，以最大化对比噪声比为目标对深硅光子计数 CT 投影去噪，并处理数据的非平稳性。单通道与多通道扫描的图像质量均显著改善，且在各通道上表现一致。

ldm-dn-metal-artifact: >-
  LDM-DN 在对抗解纠缠网络中加入低维块流形约束，使恢复图像位于 CT 图像块的低维流形上。结合配对与无配对数据混合学习，该方法恢复了仅靠对抗损失会丢失的小结构细节，在合成与临床数据上均优于竞争方法。

dual-stream-metal-streak: >-
  双流卷积网络在 NMAR 初步校正后，用条纹掩膜引导的残差学习校正金属条纹伪影，使网络聚焦于伪影区域。对比均方误差损失与感知损失的结果表明，图像域深度学习对金属伪影减少高度有效，包括质子治疗计划这类对图像质量要求很高的应用。

tod-net-low-dose: >-
  TOD-Net 在低剂量 CT 去噪中引入下游任务导向损失，使网络保留各下游应用真正需要的区域。任务导向损失补充了任务无关损失，普遍提升了多种下游方法的性能。

# Batch: UChicago team sweep #2（中文速读，忠实翻译，技术术语/缩写保留英文）。
do-cnns-solve-ct-inverse-problem: >-
  该研究检验卷积神经网络能否解决稀疏视角 CT 图像重建中的逆问题，在专用乳腺 CT 仿真中用两种对象模型生成训练与测试图像/数据对。CNN 重建图像与原始图像存在显著差异，而 TVmin 能够准确重建测试图像。因此，在所选 CNN 方法和所测试对象模型条件下，稀疏视角 CT 逆问题并未被解决，这一结论也使医学成像中类似的、缺乏支撑的 CNN 求解逆问题主张受到质疑。
