# Batch: CREATIS team sweep #15（中文速读，忠实翻译，技术术语/缩写保留英文）。
glimpse-scalable-robust-ct: >-
  多尺度卷积神经网络容易过拟合大尺度结构，在分布外样本上泛化较差，且内存与计算复杂度随图像分辨率不利地增长。Glimpse 是一种局部坐标神经网络，仅处理与目标像素邻域相关的测量来重建该像素值。它在分布外样本上显著优于成功的 CNN，在分布内数据上达到相当或更好的性能，同时内存占用几乎与分辨率无关，在 1024×1024 图像上训练仅需 5GB 内存，且完全可微，可即插即用并能校正失配的投影方向。

sim2real-material-decomposition: >-
  求解谱 CT 非线性材料分解的变分方法计算缓慢且关键依赖正则化泛函的选择，而卷积神经网络又需要大量实验数据集。本文提出基于 U-Net 架构与 Sim2Real 迁移学习的方法，将从合成数据学到的知识迁移到真实场景，其中合成数据来自 KiTS19 Challenge 数据集人体 CT 体数据生成的软组织与骨骼数值体模，并模拟了扫描仪能量响应的光子计数数据。作者比较了投影域与图像域两种分解方式，并将所提 Sim2Real 策略与正则化 Gauss-Newton（RGN）方法在合成数据、实验体模数据和人体胸部数据上进行了对比。
