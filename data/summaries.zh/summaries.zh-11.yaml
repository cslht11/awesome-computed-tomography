# Batch: ANL APS team sweep #9（中文速读，忠实翻译，技术术语/缩写保留英文）。
low-dose-dcnn-tomography: >-
  同步辐射 X 射线层析成像可对材料和生物组织内部进行快速、大规模、高分辨率重建，但辐射敏感样品在长采集损伤与短采集信号不足之间存在根本权衡。本文提出一种深卷积神经网络方法，通过改善记录投影的质量，在低剂量快速采集中将获取的 X 射线层析信号提高至少 10 倍。经 CNN 增强的短曝光投影信噪比接近长曝光投影，且在模拟样品和小鼠脑实验数据中得到验证，并可用于自动追踪低剂量数据中的脑结构。

limited-angle-deep-image-physics-priors: >-
  在电子或 X 射线层析成像中，样品架或样品形状可能导致无法采集全部角度的投影，从而形成病态的有限角度重建问题，常规重建会产生畸变和伪影。本文提出一种自训练生成模型，将数据似然与图像先验结合到单一深度网络中，并辅以全变分正则化和基于交替方向乘子法的求解器，用于约束基于物理的方法的解。不同缺失角度范围和噪声水平的数值结果表明，该方法能有效改善有限角度重建。
