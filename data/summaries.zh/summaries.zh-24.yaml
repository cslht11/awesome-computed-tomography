# Batch: Jiayang Shi 三篇（中文速读，忠实翻译，技术术语/缩写保留英文）。
efmct: >-
  基于扩散的 CT 重建依赖随机微分方程做前向扩散与反向去噪，但这种随机性会干扰 CT 重建所需的一再数据一致性校正，而临床与介入 CT 往往对时间很敏感。流匹配把采样建模为确定性常微分方程，轨迹平滑且不注入随机噪声，因而天然适配反复的数据一致性操作。该文观察到流匹配预测的速度场在相邻步之间高度相关，据此提出 FMCT 及其高效变体 EFMCT：在连续步之间复用之前预测的速度场，大幅减少神经网络函数求值次数，并从理论上证明结合数据一致性时复用引入的误差有界。实验表明，该方法在重建质量与扩散方法相当的同时，计算效率显著提升。
multi-stage-artifact-reduction-parallel-beam-ct: >-
  同步辐射 CT 相比实验室 CT 具有更高的空间与时间分辨率，但投影数据要经过多阶段计算流水线，采集过程中引入的伪影会沿流水线传播、劣化重建图像。已有深度学习方法要么不能针对性处理特定伪影，要么计算代价过高。该文在流水线的每个阶段（投影域、正弦图域、重建域）各放一个深度学习模型，使各类伪影在本地以数据驱动方式处理，并加入 bypass 连接，把前一阶段输出与原始数据一起送入后一阶段，最大限度减少误差传播。在仿真与真实数据集上的评估表明，该方法能有效减少同步辐射平行束 CT 的伪影。
sr4zct: >-
  医学 CT 的层间（through-plane）分辨率常差于层内分辨率，且层间可能存在重叠，影响诊断。自监督层间分辨率增强在层内图像上训练、在层间方向上推理，但已有方法要么忽略重叠，要么只能处理固定的分辨率与重叠组合。SR4ZCT 沿用同样的离轴训练思路，同时可处理任意分辨率与重叠组合，使自监督层间增强能用于层间距与重叠各异的真实 CT 体数据。

hounsfield-1973: >-
  Hounsfield 对首台临床 CT——EMI 扫描仪——的描述：X 射线源与探测器在多个角度采集透射读数，再由计算机据此重建出头部的横断面图像。

zou-pan-pi-line-2004: >-
  证明螺旋锥束 CT 中每条 PI 线上的图像都能由最少量的投影数据精确重建，由此得到能容忍截断投影的反投影滤波（BPF）算法。

os-em-1994: >-
  提出有序子集 EM（OS-EM）：每次迭代依次使用投影的各个子集，使期望最大化重建的速度大致提高子集数倍。它是多数临床迭代重建以及后来 CT 有序子集方法的基础。

erdogan-fessler-os-1999: >-
  把有序子集方法推广到透射数据，即 CT 的模型：借助可分抛物面替代函数，在泊松透射模型下实现快速的惩罚似然重建，且易于并行。

thibault-mbir-2007: >-
  面向多层螺旋 CT 的三维统计（基于模型的）迭代重建，对扫描几何、光子统计与保边先验建模，噪声低于 FBP、细节更清晰；是商用基于模型迭代重建的先驱工作。

joseph-1982: >-
  Joseph 前向投影算法：沿每条射线逐行或逐列对图像做线性插值。它是标准的射线驱动投影器之一，代价与最近邻采样相近，但更准确。

siddon-1985: >-
  Siddon 算法通过追踪射线与网格平面的交点，精确计算射线在三维网格每个体素内的长度；是经典的精确射线驱动投影器。

distance-driven-2004: >-
  三维距离驱动投影与反投影：把体素与探测器单元的边界映射到同一坐标轴上，按重叠长度加权，以相近的速度避免像素驱动与射线驱动方法的伪影。迭代 CT 中常用的选择。

ldct-grand-challenge-report-2017: >-
  2016 年 AAPM–NIBIB–Mayo 低剂量 CT 大挑战的结果论文：各参赛去噪与迭代方法处理四分之一剂量的腹部 CT，再由放射科医师评估肝转移灶能否仍被检出和分类。

ldct-projection-dataset-2021: >-
  介绍 Mayo 在 TCIA 发布的低剂量 CT 数据库的论文：299 例头部、胸部与腹部检查，含常规剂量与仿真低剂量的投影数据（开放的 DICOM-CT-PD 格式）以及重建图像。

aapm-sparse-view-challenge-report: >-
  AAPM 深度学习稀疏视角 CT 挑战赛的报告：各队从 128 个视角的数据中恢复乳腺 CT 体模图像。最好的网络在这一理想化任务上接近精确恢复，报告也讨论了这一结果对真实数据意味着什么、不意味着什么。

leuschner-comparison-2021: >-
  在统一协议下比较各类学习型 CT 重建方法（后处理、学习迭代、完全学习与无监督），低剂量用 LoDoPaB-CT、稀疏角用苹果 CT 数据，同时报告图像质量与对测量数据的一致性。

gloredi: >-
  通过表征蒸馏做稀疏视角 CT：教师网络学习全视角图像的全局表征，再训练稀疏视角网络与之对齐，使少量投影也能恢复图像的全局结构。

regformer: >-
  将稀疏视角 CT 的迭代求解器展开，在每一级用局部（卷积）与非局部（Transformer）两部分共同学习正则项。

score-inverse-medical: >-
  把只用图像训练的无条件分数（扩散）模型作为医学反问题的先验，用于稀疏视角 CT 与欠采样 MRI，同一个模型无需重新训练即可适配任意测量过程。

mcg: >-
  为基于扩散模型的反问题求解加入流形约束修正，使样本在数据一致性步骤中仍保持在数据流形附近；在图像修补、上色与稀疏视角 CT 上验证。

dps: >-
  扩散后验采样（DPS）：借助去噪估计近似似然梯度，使预训练扩散模型能够求解含噪声乃至非线性的反问题。是 CT 扩散模型论文中的标准对比基线。

dds: >-
  分解扩散采样器（DDS）：用在去噪估计上做几步共轭梯度数据一致性，取代代价高昂的流形梯度，大幅加速大规模三维稀疏视角、有限角 CT（以及 MRI）的扩散重建。

aapm-ct-mar-challenge-report: >-
  AAPM CT 金属伪影校正大挑战的报告：各方法在含金属的仿真 CT 数据上训练，在保留的测试病例上排名，为金属伪影校正提供了共同的基准。

photon-counting-ct-2018: >-
  光子计数 CT 综述：能量分辨探测器如何逐个计数光子，由此在噪声、空间分辨率与能谱成像上带来的收益，以及临床前景与尚待解决的技术问题。

vision-2020-photon-counting: >-
  医学成像用单光子计数 X 射线探测器综述：探测器物理、脉冲堆积、电荷共享等能谱失真，以及它们对能谱 CT 的影响。

long-fessler-mmd-2014: >-
  惩罚似然重建，把能谱（双能）CT 数据直接分解为多幅材料图像，并借助约束使两种以上材料的分解成为可解问题。

aapm-spectral-challenge-report: >-
  AAPM 深度学习能谱 CT 大挑战的报告：各队直接从乳腺体模的仿真能谱 CT 数据中重建组织图，报告比较了领先方法的表现。

perspective-deep-imaging: >-
  Ge Wang 的观点文章，认为深度学习将从分析图像走向生成图像本身；它提出了面向层析重建的“深度成像”议程。

image-recon-new-frontier: >-
  2018 年 IEEE TMI“机器学习用于图像重建”专刊的社论，概述第一批学习型重建方法及其引出的问题。
