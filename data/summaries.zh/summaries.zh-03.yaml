resolution-agnostic-neural-operators-for-multi-rate-sparse-v: >-
  稀疏视角 CT 从有限投影重建以降低辐射与扫描时间，是个病态逆问题。本文提出 CTO——首个面向 CT 重建的神经算子框架。

revisiting-pose-sensitivity-in-splat-based-computed-tomograp: >-
  X 射线 CT 通过穿透目标的投影图像重建物体的体积表征。经过细致分析，我们发现这些伪影主要源自采集几何中的位姿误差，而不是视角稀疏本身。

riner: >-
  由于 X 射线探测器的非理想响应，环状伪影在三维锥束 CT 中很常见，严重影响图像质量与诊断可靠性。本文提出 Riner：一种新的无监督环状伪影消除方法。

rit-2009: >-
  呼吸运动会在慢旋转加速器一体机上采集的锥束 CT 图像中造成伪影。本文开发了一种即时（on-the-fly）方案，在从全部锥束投影重建三维 CBCT 图像的过程中估计并补偿呼吸运动。

robust-uncertainty-2006: >-
  例如，本文表明：只要跳变（不连续）的数量满足上述条件，就可以通过最小化其他凸泛函（例如 f 的全变差）从不完整的频率样本中重建分段常数（一维或二维）物体。

robustness-and-stability-analysis-of-differentiable-shift-va: >-
  本文系统研究了可微 SV-FBP 在困难采集条件下的鲁棒性与适应性。结果表明，采样点的空间分布所起的作用更为主导。

roessl-2007: >-
  本文研究了能量敏感光子计数探测器的 X 射线 CT K 边成像，表明能量选择性光子计数能测量钆基对比剂的局部密度，并区分对比剂充盈的管腔与斑块。

rof-tv-1992: >-
  Rudin-Osher-Fatemi 模型通过最小化全变分做图像去噪，以拉格朗日乘子施加噪声统计约束，用梯度投影法求解，在去噪的同时保持锐利边缘。

sacnn: >-
  SACNN 用三维自注意力 CNN 对低剂量 CT 降噪，捕捉层内与层间的长程空间上下文，并用自监督自编码器感知损失，在 AAPM–Mayo 低剂量 CT 数据上持平或优于先进方法。

sagan: >-
  低剂量 CT 在受辐射限制的应用中带来巨大好处，但光子数不足导致的量子噪声可能损害诊断性能。本文提出一种基于深度学习的方法来缓解这一问题。

sart-1984: >-
  SART 改进代数重建技术，对同一投影内所有射线的 ART 误差校正项同时应用，结合纵向加权与双线性元，一次迭代即可得到良好的重建结果。

sax-nerf: >-
  本文提出结构感知 X 射线神经辐射密度场（SAX-NeRF）框架，用于稀疏视角 X 射线三维重建；首先设计了基于线段的 Transformer（Lineformer）作为其骨干。

scatter-dl: >-
  本章综述 X 射线散射如何损害锥束 CT 的对比度、锐度、噪声与背景均匀性，并评述基于深度学习的散射校正方法及其临床应用。

scatter-rev: >-
  锥束体积 CT 中的散射辐射会带来定量误差、伪影与噪声上升，使 CT 图像严重退化，因此散射抑制是 CBCT 成像中与图像质量相关的主要议题之一。凡觉得相关之处，本文都补入了额外参考文献。

scatter-rev-p2: >-
  散射校正流程的主要组成部分是散射估计与散射补偿算法。本文接续前文——前文在「已有散射估计方法」的前提下给出了散射补偿的通用框架。

schlomka-2008: >-
  基于能量分辨探测器的 K 边缘 CT 有望实现材料特异性成像。本文验证了定量 K 边缘成像，将碘和钆造影剂与解剖背景分离，测得浓度与真实值一致。

sdb: >-
  本文提出系统嵌入扩散桥模型（SDB）：一类新的监督式桥方法，把已知的线性测量系统显式嵌入矩阵值随机微分方程的系数中。

semantic-contrastive-learning-for-orthogonal-x-ray-computed-: >-
  为应对这些挑战，本文提出一种新的语义特征对比学习损失：在高层潜空间评估语义相似度，在浅层潜空间评估解剖相似度。

semimar: >-
  SemiMAR 是一个半监督金属伪影校正框架，仅用单个生成器学习无伪影部分，通过相减推断伪影，并以对比学习潜在约束蒸馏双域知识，性能可与现有半监督 MAR 方法媲美。

senp: >-
  CT 是用于有症状与无症状患者成像的最常用模态之一。本文旨在提升四分之一剂量图像的质量，并以常规剂量图像作为真值来选取最佳超参数。

shape-guided-gaussian-splatting-for-sparse-view-x-ray-3d-rec: >-
  本文提出一个面向稀疏视角 X 射线三维重建的形状引导高斯泼溅框架。方法保证解剖一致性，并在仅 5 个视角时把 PSNR 比当前最优的高斯泼溅基线提升 2.83 dB。

shearlet: >-
  本文把基于剪切波的正则化用于迭代 CT 重建，表明剪切波变换的方向敏感性比全变分更好地保留图像纹理（全变分易产生阶梯效应），但使用不当可能导致波浪状伪影。

shepp-logan-1974: >-
  这篇经典论文提出头部截面的傅里叶重建，用改进加权函数同时实现精度、简洁、低计算量与低噪声敏感性，优于需 12 次迭代且更怕噪声的搜索算法。

sidky-pan-tv-2008: >-
  本文提出 ASD-POCS，一种在数据一致性和非负性约束下最小化全变分的迭代算法，用于圆轨迹锥束 CT。它似乎对锥束伪影鲁棒，在角范围受限或采样稀疏时尤其有用。

siewerdsen-2001: >-
  本文以散射-原射比量化平板探测器锥束 CT 中的 X 射线散射随物体尺寸和锥角的变化，表明散射会降低对比噪声比，而通过增加剂量、层厚或两者可恢复损失。

sinogram-interpolation-2024: >-
  本文提出一种深度学习正弦图插值方法，将采集数据重采样为 spinogram 表示来预测缺失投影，在五个激光烧结物体的真实 XCT 扫描上验证。

sinonet: >-
  Un-SinoNet 无需配对训练数据即可恢复低剂量 CT 正弦图，在最大后验框架下以 CT 测量的噪声生成机制驱动，纯无监督地学习低剂量正弦图的梯度。

sire-net-2025: >-
  SIRE-Net 面向平板型电池的有限角 CT，用结构保持伪影去除网络与注意力上下文增强网络组成生成器，配合 WGAN-GP 判别器，在真实电池数据上减少边缘伪影并保持结构与细节。

sister: >-
  多能 CT 图像噪声严重。本文提出 SISTER，把相似的空间-谱图像块聚类为四阶张量组并应用张量分解与增强稀疏性，在边缘保持、细节恢复和噪声抑制上优于张量字典学习方法。

sisvm: >-
  iCT-Net 是一个通用架构的深度网络，经训练可从正弦图数据在多种采集条件下精确重建 CT 图像，包括稀疏视角与内层析纠缠的难题。

snaf: >-
  本文提出 SNAF：通过学习神经衰减场来做稀疏视角 CBCT 重建，并发明了一种新的视角增强策略，用来克服稀疏输入视角下数据不足带来的挑战。

sonke-2005: >-
  与直线加速器集成的锥束 CT 扫描仪是图像引导放疗的强有力工具。本文为 CBCT 开发了一种替代性的呼吸相关流程，并评估了它的性能。

soul-net: >-
  为缓解这些问题，本文提出面向谱 CT 重建的稀疏低秩展开网络（SOUL-Net），以数据驱动方式学习其中的参数与阈值。

spare: >-
  目前四维 CBCT 需要 3–4 分钟的全扇扫描才能保证可用的图像质量。稀疏视角四维 CBCT 重建的进展，为缩短扫描时间与剂量带来了可能。本文共生成 9 名患者的 32 次 CBCT 扫描。

sparse-sampling: >-
  为降低与辐射剂量相关的健康风险，学界正积极研究低剂量 CT 的各种扫描方法与重建算法。作者提出五种不同的稀疏采样方案并做了仿真，以实现既定的剂量削减目标。

sparse-tomography: >-
  本文在投影数据极度受限的层析背景下，研究一种基于小波的稀疏促进重建方法。这类成像问题是病态逆问题，对测量误差与建模误差极为敏感。

sparse-view-laminography-2014: >-
  本文为稀疏视角计算层析成像提出球面正弦扫描轨迹，表明用压缩感知 TV 重建仅 40 个视角时，它在对比度上优于单弧、双弧和斜向轨迹，斜向轨迹的分辨率与之相当。

sparsity2dl: >-
  医学图像重建领域大致出现过四类方法。这些方法通常很快，但存在次优性质，例如 CT 的分辨率-噪声折衷较差；迭代方法则通过降低噪声与伪影改善了图像质量。

special: >-
  SPECIAL 通过增强对抗学习与单次投影误差校正模块结合图像域与投影域信息，改善有限角 CT 的伪影去除、边缘保持与细小结构恢复，包括高衰减组织区域。

spectral-consistent-flow: >-
  本文提出频谱一致流（SC-Flow）：一个在潜空间单次函数求值（1-NFE）的三维医学图像转换框架。

spener: >-
  此外，现有方法尚未充分挖掘图像域先验来求解稀疏视角 CT 的逆问题。本文表明，不完美的重建结果可以为 INR 提供有效的图像域先验，从而提升性能。

spie-dir-2023: >-
  有限角双能 CT 尽管两能谱间存在冗余仍具挑战。本文提出 SPIE-DIR，从两组互补的有限角扫描中提取自先验信息，并在投影、残差和图像三个域施加约束，Wasserstein GAN 进一步改善视觉感知。

spir-de: >-
  本文提出一种迭代算法，以支持一种新的数据采集方案：需要一次全扫描加一次稀疏视角扫描，从而有望降低双能 CT 的成像剂量与工程成本。

splat-based-metal-artifact-reduction-in-cone-beam-ct-via-com: >-
  本文提出一个基于泼溅的金属伪影消除框架，把物理上站得住的多色前向模型引入连续高斯表征，用于锥束 CT。

splat-based-metal-artifact-reduction-in-cone-beam-ct-via-pol: >-
  提出一种新的物理启发、自校准的金属伪影消除方法，在重建三维 CBCT 体积的同时校正射束硬化伪影。这是首个基于泼溅、面向降低 CBCT 射束硬化的方法。

spqi: >-
  本文用基于块对比学习的 GAN 从锥束 CT 生成类 CT 图像，在非配对 CT 与 CBCT 数据上训练，在改善图像质量和 HU 准确性的同时保留解剖结构。

spss: >-
  SPSS 用 20 层残差 CNN 从稀疏视角数据合成全视角正弦图，以零阶和一阶差分损失保留锐度——区域边界与组织纹理，而不是生成过度平滑的正弦图。

spultra: >-
  低剂量 CT 重建近年来是热门研究方向。基于取对数后测量的典型方法是惩罚加权最小二乘（PWLS）。本框架中由稀疏性诱导的数据保真项与正则项都是非凸的。

ssdae: >-
  SSDAE 用堆叠稀疏去噪自编码器做低剂量 CT 后处理恢复，在抑制噪声的同时恢复结构细节，优于 TV-POCS、BM3D 与 U-Net 等基线方法。

statistical-image-reconstruction-using-mixed-poisson-gauss: >-
  X 射线 CT 的统计图像重建方法能产生高质量、准确的图像，同时大幅降低患者受照剂量。本文提出一种新的统计重建方法 MPG（混合泊松-高斯）。

stcnet: >-
  本文提出 STCNet：一个利用时空一致性学习的稀疏视角 4D CBCT 重建框架。每呼吸相位仅需 16 个投影即可重建高质量图像，用物理驱动的位置编码保证投影域几何一致性、用时间编码捕捉呼吸运动，双域协同优化投影域与图像域。

steerable-conditional-diffusion-2025: >-
  去噪扩散模型已成为求解成像逆问题的首选生成框架。为弥合训练与测试之间的落差、提升重建精度，本文提出新的采样框架——可操纵条件扩散。

super: >-
  传统的模型驱动图像重建（MBIR）把前向模型与噪声模型同简单的物体先验结合起来。本文提出统一的监督-无监督（SUPER）学习框架，用于 X 射线 CT 图像重建。

super-2: >-
  本文提出新的监督-无监督（SUPER）重建框架用于 LDCT 重建，兼取有监督学习方法与基于（无监督）变换学习的方法（例如涉及高度图像自适应聚类的 PWLS-ULTRA）之长。

sv-cbct-data-consistent-2023: >-
  从有限投影集重建 CT 图像，在从医学到工业的多个场景中都很重要。为应对数据受限，本文用图像子体积训练、并在测试时做块聚合。

sv-cbct-eval: >-
  该评估表明约束 TV 最小化能用远少于常规的投影数据重建出有用的平板锥束 CT 图像，有望根据扫描条件与成像任务大幅降低成像工作量与辐射剂量。

sv-spectral-lr: >-
  在 kVp 切换能谱 CT 中，每个能谱测量只有稀疏视角。本文提出带能谱块低秩惩罚的惩罚最大似然方法，利用跨能谱的图像块自相似性，定性与定量上均改善了能谱图像；GPU 实现降低了计算成本。

sv-tgv: >-
  PWLS-TGV 用高阶导数的全广义变分正则化替代全变分的分段常数假设，并结合数据依赖的方差加权，减少稀疏视角 CT 重建中的块状伪影。

swap-net-2025: >-
  Swap-Net 是面向稀疏视角 3D CBCT 重建的内存高效 2.5D 网络，用轴交换操作端到端重建三维体积而无需完整 3D 卷积，在惯性约束聚变模拟上验证。

sword: >-
  以小波变换作为引导性的稀疏先验，能显著增强扩散模型的鲁棒性。本文提出逐级小波优化精修扩散（SWORD）模型，用于稀疏视角 CT 重建。

synergizing-physics-model-based-and-data-driven-methods-fo: >-
  自 2016 年以来，深度学习在层析成像上取得了显著成功，尤其是低剂量 CT。一个新兴趋势是把成像物理与模型融入深度网络，实现物理/模型驱动与数据驱动的混合。

synthetic-ct-image-generation-from-cbct-a-systematic-review: >-
  用深度学习从 CBCT 生成合成 CT 是放射肿瘤学的重要进展。本文识别并分析了 35 项相关研究，发现深度学习方法在该任务中占主导。

tamp: >-
  非理想测量 CT（NICT）采用次优成像协议来拓展 CT 的应用。本文提出多尺度集成 Transformer 放大器（TAMP）——首个面向通用 NICT 增强的成像基础模型。

tensor-dl: >-
  在动态 CT 重建中，数据采集速度限制了时空分辨率。本文提出一种自适应方法，在重建过程中训练基于张量的时空字典，用于图像序列的稀疏表示。

tensor-net: >-
  该方法不直接在投影或图像域学习，而是用逐视角反投影张量训练网络——它携带求和前的无损信息，在细节保持上优于图像域、投影域与混合域学习框架。

texture-preserving-implicit-neural-representation-for-cone-b: >-
  CBCT 常受数据截断困扰，这会带来严重伪影并限制有效视野。为此本文提出一个基于神经场景表征的自监督三维重建框架。

tfu-net: >-
  特别地，本文表明双框架 U-Net、紧框架 U-Net 等替代变体满足所谓的框架条件，使它们更适合在稀疏视角 CT 中有效恢复高频边缘。

tg-field-geometry-aware-radiative-gaussian-fields-for-tomogr: >-
  三维高斯泼溅以卓越的效率与质量革新了三维场景表征。为应对这些挑战，本文提出层析几何场（TG-Field）：一个几何感知的高斯形变框架，同时面向静态与动态 CT 重建。

time-resolved-dynamic-cbct-reconstruction-using-prior-model-: >-
  时间分辨 CBCT 重建出反映扫描内运动的动态 CBCT 序列（每张 X 光投影对应一个 CBCT，不做相位排序或分箱），对规则与不规则运动刻画、患者摆位以及运动自适应放疗都很有价值。

tomo-21st: >-
  本文综述解析断层重建方法，介绍线积分模型，并区分二维重建与完全三维重建——后者中射线在空间中取任意方向，而非位于平行平面内。

tomotransformer: >-
  TomoTransformer 是面向 CT 重建的 Transformer 基础模型，把每个局部滤波投影当作 token，在反投影空间中用自注意力预测缺失视角，可处理任意数量的投影、角度与探测器尺寸而无需重训。

toward-a-foundation-plug-and-play-prior-for-computed-tomogra: >-
  CT 的吞吐量受扫描时间限制，而扫描时间同时随采集的投影数量和每个投影的探测器积分时间增长。

toward-ct-equivalent-image-quality-in-low-dose-radiotherapy-: >-
  标准放疗计划过程中往往需要反复做 CT 扫描用于摆位、验证与自适应计划，累积 X 射线剂量随之上升。为缓解这一点，治疗实施过程中会常规采集低剂量 CBCT。

towards-reconstructing-experimental-sparse-view-x-ray-ct-dat: >-
  基于扩散的图像生成器是稀疏视角 X 射线 CT 这类病态逆问题的有前景先验。结果表明域偏移的作用相当微妙：严重不匹配会导致模型崩塌与幻觉，而多样化的先验能做到与匹配良好但狭窄的先验相当、甚至更好。

tv-stokes: >-
  TVS-POCS 在全变分重建中引入等照度线方向，使沿法向和切向的一致性都得到保留，消除块状伪影并保留细微结构，在满视角情况下接近滤波反投影。

tv-wtf: >-
  该方法把全变分与小波紧框架正则化结合用于有限角 CT，加入 l1 和 l0 项并以基于 TV 的 SART 与 ADMM 求解，抑制有限角伪影的同时保留低对比物体。

tvwfr: >-
  为消除稀疏视角 CT 中 TV 正则的阶梯伪影，该方法对小波框架低频系数施加 TV、高频系数施加 l0 惩罚并用 ADMM 求解，在保持边缘的同时抑制阶梯效应与噪声。

two-view-industrial-diffusion-2024: >-
  工业 CT 需要 360° 扫描，太慢而无法在线检测。本文提出双视角 CT 重建，用多尺度条件潜在扩散网络，仅从两个正交投影生成 CT 切片，准确恢复产品几何形状与内部微小缺陷。

ultrafast-deep-learning-based-scatter-estimation-in-cone-bea: >-
  进一步在大规模模拟数据集、以及水与 Sedentex CT 体模的真实 CBCT 扫描上比较散射校正后的重建，清楚证明了本方法的鲁棒性。

uncertainr-uncertainty-quantification-of-end-to-end-implic: >-
  隐式神经表征在场景重建与计算机图形学上成果斐然，而其性能此前主要按重建精度来评价。

undip: >-
  UN-DIP 用无训练生成器网络结合深度图像先验做稀疏视角与有限角 CT 重建，在重建过程中联合优化潜向量与生成器权重。

unsupervised-idbp-svct-2025: >-
  本文提出一个无监督深度学习框架 ADMM-DRP：把未经训练的神经网络与交替方向乘子法（ADMM）迭代重建算法结合起来。

unsupervised-metal-artifact-reduction-in-dental-cbct-using-f: >-
  牙种植体产生的金属伪影会显著降低 CBCT 体数据质量，遮蔽关键解剖结构、损害诊断精度。

variational-garrote: >-
  稀疏正则化在求解由不完整或受损测量引起的逆问题中居于核心地位。本文构建了统一的实验框架，覆盖信号重采样、信号去噪与稀疏视角 CT 等多个重建任务。

view-covariance-loss-2026: >-
  本文提出视角协方差损失，通过近似重建归一化均方误差来度量一组视角的联合信息，并给出选择使该损失最小的视角子集的算法，误差更低、伪影更少，优于现有方法。

view-dependent-detector-displacement-cbct: >-
  工业锥束 CT 用探测器平移来抑制环状伪影，但由此产生的探测器运动在不同投影视角之间可能非均匀变化，形成无法用固定偏移表示的探测器位置。

viss: >-
  本文用卷积神经网络插值稀疏采样正弦图中的缺失视角，补全缺失投影数据，使图像可用解析算法重建，而不必依赖迭代重建。

vodasure: >-
  本文表明，这类性能很大程度上来自在降采样数据上训练，而不是来自真实的低分辨率扫描。为此提出 VoDaSuRe：一个包含配对高、低分辨率扫描的大规模体数据数据集。

vol3dgs: >-
  本文表明泼溅中的核心近似并非必要——即便在光栅化器内部也可以避开。我们改为直接对三维高斯做体积积分、解析地计算其透射率，从而以更高精度、更少的点表示不透明表面。

voxelsynth3d-interpretable-volumetric-image-domain-metal-art: >-
  术后肌骨 CT 中的金属伪影会遮蔽骨-植入物与邻近软组织的界面。本文提出 VoxelSynth3D：一个面向重建后 CT 的免训练三维图像域框架，组合了支撑掩膜、归一化组织合成、偏差门控与受限边缘精修。

vvbp-tsvd: >-
  本文分析 FBP 中排序后的逐视角反投影张量，用张量奇异值分解去噪，利用结构自相似性、稀疏性与噪声统计，在低毫安秒 CT 中优于正弦图预处理、图像后处理与迭代方法。

wav-sgm: >-
  基于分数的生成模型在训练数据含噪时表现受限，如低剂量 CT 或欠采样 MRI。本文提出小波改进框架，通过互反馈机制耦合小波子网络与分数模型，从含噪样本中学习分数，达到用干净数据训练的水平。

wavresnet: >-
  为解决该问题，本文提出一种新的基于框架小波的去噪算法，使用小波残差网络：把小波框架去噪算法的性能保证与深度学习的表达能力协同起来。

wgan-vgg: >-
  本文提出一种新的 CT 图像去噪方法，基于使用 Wasserstein 距离与感知相似度的生成对抗网络。Wasserstein 距离是最优传输理论的核心概念，有望提升 GAN 的表现。

when-are-diffusion-priors-helpful-in-sparse-reconstruction-a: >-
  扩散模型在图像生成上表现最优，并正在稀疏医学图像重建任务中受到关注。本文在低剂量胸壁 CT 的脂肪量量化任务上做了比较。

why-fbp: >-
  这篇综述探讨了尽管迭代和压缩感知重建取得进展，CT 扫描仪的重建算法为何 25 年来几乎没有变化，提炼了背后的数学问题，并建议加强应用数学家与工程师的联系以弥合差距。

x-gaussian: >-
  本文提出基于三维高斯泼溅的框架 X-Gaussian，用于 X 射线新视角合成，并实现了带 CUDA 的可微辐射光栅化（DRR）。它在稀疏视角 CT 重建上的应用也体现了其实用价值。

x-grm-large-gaussian-reconstruction-model-for-sparse-view-x-: >-
  CT 是临床工作流中不可或缺的工具。本文提出 X-GRM（X 射线高斯重建模型）：一个大型前馈模型，从稀疏视角的二维 X 光投影重建三维 CT 体积。

x2-gaussian: >-
  X²-Gaussian 用动态辐射高斯溅射做连续时间四维 CT 重建，通过生理驱动的周期一致性损失从投影中自监督学习患者特异呼吸运动，无需外部呼吸门控设备。

xden-1k: >-
  对物理世界的深入理解是机器人操作与物理真实仿真的前提。为填补这一空白，本文提出 XDen-1K：首个为真实物体提供物理驱动密度场的大规模多模态数据集。

xgenrecon-2025: >-
  XGenRecon 通过在受控几何参数下生成辅助 X 射线投影，从超稀疏投影重建 CBCT：X-Correction 协调生成的投影，CT-Correction 细化重建图像。

zbijewski-2006: >-
  该迭代散射校正方案用经高斯基拟合加速的快速蒙特卡罗模拟从初始重建估计散射，模拟时间缩短三到四个数量级，水体模定量误差从约 12% 降至 1%。

zero-shot-ct-super-resolution-using-diffusion-based-2d-proje: >-
  CT 在临床诊断中很重要，但获取高分辨率 CT 受辐射风险制约。为此本文提出一个零样本三维 CT 超分框架，把基于扩散的上采样二维投影先验融入三维重建过程。

zero-shot-low-dose-ct-denoising-via-sinogram-flicking: >-
  本文提出一种基于正弦图闪动的零样本低剂量 CT 成像方法：它在单张图像内部运作，通过随机共轭射线匹配生成大量副本。仿真研究表明本方法优于 ZS-N2N 等当前最优方法。

zhu-2006: >-
  大面积探测器 CT 中散射会引起严重伪影。本文提出一种利用棋盘格主调制器的散射校正方法：主射线被高频调制而散射保持低频，滤波与解调即可分离两者，仿真中误差从 74.2% 降至 1% 以下。

gan-noise-reduction-low-dose-ct: >-
  训练生成器 CNN 将低剂量 CT 映射为常规剂量 CT，判别器 CNN 提供对抗损失，与体素损失联合使用。在含钙化插入物的体模和 20% 剂量患者心脏 CT 上，联合损失取得最高 PSNR，并改善了冠状动脉钙化定量。

cycle-consistent-adversarial-denoising-network: >-
  无需配对扫描，学习多期冠状动脉 CTA 低剂量期与常规剂量期之间的去噪映射，采用循环一致对抗网络并结合循环一致性与恒等损失。去噪同时保留纹理与边缘，不产生虚假特征，提升了诊断质量。

smgan: >-
  提出 SMGAN，一种利用三维体数据信息的结构敏感多尺度 GAN，并比较不同训练损失，用于低剂量 CT 去噪。它保留常规剂量 CT 的结构与纹理信息，同时抑制噪声与伪影，在放射科医师视觉评估中优于对比方法。

cpce: >-
  提出 CPCE 编解码器网络，在 GAN 框架下有 2D 与 3D 两种配置，用于低剂量 CT 去噪；3D 模型由训好的 2D 网络扩展而来并经微调。3D 网络比从零训练收敛更快、去噪更好，在抑制噪声的同时保留细微结构。

tomogan: >-
  提出 TomoGAN，一种用于低剂量同步辐射 X 射线断层成像的 GAN 去噪方法，在两种固定光子预算下评估：充足的低剂量投影与有限的高剂量投影。模拟数据 SSIM 从 0.18 提升至 0.9，实验数据提升至 0.41，FBP 后接去噪优于 SIRT。

gan-circle: >-
  提出 GAN-CIRCLE，一种半监督 GAN，从含噪低分辨率输入恢复去噪去模糊的高分辨率 CT，采用 Wasserstein 距离循环一致性与联合结构约束。在三个大规模 CT 数据集上验证，超分辨恢复准确、高效、鲁棒。

sparse-view-ct-reconstruction-wasserstein-gans: >-
  用 Wasserstein GAN 直接从有限数量的投影图像重建 2D CT 切片，结合对抗损失与 L1 内容损失。明显优于 FBP，对抗损失比仅用 L1 训练得到更清晰、结构更丰富的图像，但仍需足够数量的投影。

adversarial-sparse-view-cbct-artifact-reduction: >-
  一种后处理方法，用图像到图像 GAN 以对抗方式结合感知损失训练，去除稀疏重建 CBCT 的伪影。特征金字塔判别器加聚焦图针对多尺度条纹伪影，纠正了用 1/3 投影重建的临床 CBCT 的锥束伪影。

conditional-gans-metal-artifact-reduction-ear: >-
  在 90 只耳配对的植入前与植入后 CT 上训练条件 GAN，将含伪影耳部 CT 映射为无伪影 CT，预处理采用分段归一化。在 74 只测试耳上，分割表面误差降至此前方法的一半，平均 0.18 mm。

x2ct-gan: >-
  用 GAN 从两张正交 X 光重建 3D CT 体数据，生成器将 2D X 光提升为 3D CT，融合双视图特征，并结合 MSE 与对抗损失。在公开胸部 CT 数据集上生成高质量 CT 体数据，让低成本 X 光机也能提供类 CT 的 3D 视图。

coil: >-
  CoIL 训练一个 MLP 来编码完整的测量场，将测量坐标映射为响应，仅使用测试对象自身的测量数据。补全的高保真测量场可喂给现有重建方法，在稀疏视角 CT 上持续提升它们的表现。

difir-ct: >-
  DiFiR-CT 无需显式估计运动即可消除运动伪影：它用神经符号距离场表示物体边界，在时空平滑约束下回归与采集正弦图一致的解，在三种运动场景中均优于 FBP。

scope: >-
  SCOPE 从单条稀疏视角正弦图重建无伪影 CT 图像：INR 通过连续性先验约束解空间，随后重投影策略生成稠密视角正弦图，PSNR 比有监督基线至少提升 3 dB。

mepnet: >-
  MEPNet 用双域模型和模型驱动的等变近端网络处理联合稀疏视角重建与金属伪影消除，其近端算子用旋转等变 CNN 编码 CT 扫描的旋转先验，以更少的参数优于传统近端网络。

stinr: >-
  STINR 用空间与时间 MLP 表示动态 CBCT 序列，并对采集投影（每体积一张）进行优化，辅以基于 PCA 的病人特异性运动模型。它将肺部肿瘤追踪到小于 2 mm 的质心误差，重建体积误差低于 10%。

dif-net: >-
  DIF-Net 将 CBCT 重建重新表述为从极稀疏（少于 10 个）投影回归每个三维点的强度，在连续强度场中融合视角特异性特征。它在 1.6 秒内重建出高质量、高分辨率 CBCT，优于现有最优方法。

artifact-reduction-3d-4d-cbct-review: >-
  这篇综述梳理了用于 3D 与 4D 锥束 CT 的深度学习伪影消除方法，涵盖运动、金属与低剂量伪影的投影域/体域方法及嵌入重建的网络，并指出向生成模型发展的趋势。

diffusion-probabilistic-priors-zero-shot-low-dose-ct: >-
  该方法仅用正常剂量 CT 训练级联无条件扩散模型，对低剂量 CT 做零样本去噪，将低剂量图像作为似然引入反向过程，迭代求解 MAP 问题并自适应平衡似然与先验。

corediff: >-
  CoreDiff 用低剂量 CT 图像替代高斯噪声作为扩散起点，并采用均值保持退化算子与上下文误差调制复原网络，减少采样步数，仅用单张图像即可泛化到新的剂量水平。

diffux2ct: >-
  DiffuX2CT 将从正交双平面 X 光重建 CT 建模为条件扩散过程，采用三平面解耦生成器与隐式神经解码器，实现结构可控、纹理保真的重建。

diffusionblend: >-
  DiffusionBlend 通过位置感知的 3D-patch 扩散分数混合学习 3D 图像先验，在稀疏视角与有限角设置下重建大尺度 3D CT 体数据并保持 z 轴一致性。

patch-based-ddpm-sparse-view-ct: >-
  该基于 patch 的 DDPM 在全采样投影数据的 patch 上训练，对下采样投影数据做修复，用于稀疏视角 CT，无需配对数据，可实现无监督、内存高效的重建。

human-guided-shade-artifact-suppression-cbct-mdct: >-
  该框架用 Schrödinger Bridge 公式结合 GAN 先验与人类引导的条件扩散实现 CBCT 到 MDCT 的转换，通过二值人类反馈与基于 tournament 的偏好选择抑制阴影伪影。

art-1970: >-
  提出代数重建技术（ART）：一种逐条射线依次校正的迭代行作用法，从投影中重建物体。迭代 CT 重建的奠基论文。

sirt-1972: >-
  提出从投影中重建三维物体的迭代方法，所有射线同时更新——SIRT 类同步迭代重建的起源。

cormack-1963: >-
  给出从平面区域内所有相交直线的线积分恢复函数的方法，并用于放射学与放射治疗。CT 的数学基础，获 1979 年诺贝尔奖。

tuy-1983: >-
  给出源沿满足弱条件的有界曲线运动时，从锥束数据重建三维物体的解析反演公式，即 Tuy-Smith 数据充分性条件。

kalender-mar-1987: >-
  金属伪影校正的原始论文：指出金属植入物在 CT 中造成的伪影，并证明校正受金属影响的投影数据可以减轻伪影。

parker-1982: >-
  证明用最小完备数据集（180 度加扇角）做扇束卷积重建时，只要加权使每条线积分的两个权重之和为一，重建质量即可与 360 度数据相当。

smith-1985: >-
  推导从锥束投影精确重建的充要条件，并基于 Radon 变换的二阶径向导数给出重建方法。

herman-1979: >-
  提出 CT 中束硬化的校正方法，处理多能 X 射线谱造成的杯状伪影与条纹伪影。

wang-conebeam-1993: >-
  提出通用的锥束重建算法，是三维锥束几何下早期的 FDK 型方法，将滤波反投影推广到 Feldkamp 圆轨道情形之外。

joseph-spital-1978: >-
  提出校正 CT 扫描仪中骨诱发伪影的方法，是最早的束硬化校正之一，通过考虑骨造成的谱移来实现。

nmar-2010: >-
  提出金属伪影校正的广义归一化技术（NMAR）：先用先验图像对正弦图归一化再插值，在几乎不引入新伪影的前提下减轻金属伪影。

katsevich-2002: >-
  提出螺旋 CT 二维探测器的理论精确滤波反投影反演公式：先对锥束投影的导数做移不变滤波，再反投影。该公式还解决了长物体问题。

grangeat-1991: >-
  建立锥束投影与 Radon 变换一阶导数之间的基本关系，是一般源轨道下 Grangeat 型精确锥束重建的基础。

defrise-clack-1994: >-
  把 Grangeat 方法改写为二维移变滤波的滤波反投影，使每张投影一采集到即可滤波并反投影。

kudo-interior-2008: >-
  证明在少量先验知识下 CT 内问题有唯一解，使从截断数据精确重建感兴趣区域成为可能。

bouman-sauer-1993: >-
  提出用于保边 MAP 估计的广义高斯马尔可夫随机场图像模型，这种先验在基于模型的迭代重建中既平滑噪声又保留边缘。

sauer-bouman-1993: >-
  提出从投影迭代重建的局部更新策略——迭代坐标下降，每次更新一个像素——使基于模型的重建在计算上可行。

fessler-rogers-1996: >-
  分析惩罚似然图像重建的空间分辨率特性，刻画惩罚项如何影响统计重建中的局部分辨率与噪声。

os-sart-2004: >-
  从数据校正角度推导两种有序子集 SART 变体并研究其收敛性；第一种与 BSSART 公式一致，即使数据不一致也能按加权最小二乘收敛。

chambolle-pock-2011: >-
  提出凸问题的一阶原始对偶算法及其在成像中的应用，是全变分正则化 CT 重建背后的标准求解器。

split-bregman-2009: >-
  证明 Bregman 迭代可求解一大类约束优化问题，并提出求解 L1 正则化问题的分裂 Bregman 方法，应用于 Rudin-Osher-Fatemi 泛函与压缩感知。

ista-2004: >-
  分析稀疏展开线性反问题的迭代阈值算法——带阈值的 Landweber 迭代——用于 1 ≤ p ≤ 2 的 lp 惩罚正则化。

pnp-2013: >-
  提出即插即用先验：在基于模型的重建中用现成的去噪器代替近端算子，使任何去噪器都成为隐式先验。

red-2017: >-
  提出由去噪正则化（RED）：由任意去噪器构造的显式正则项，为求解反问题提供了即插即用之外的有原则的替代方案。

chambolle-2004: >-
  提出全变分最小化的算法及其在图像去噪中的应用，是全变分正则化 CT 重建背后的实用 TV 求解器。

boyd-admm-2011: >-
  交替方向乘子法在分布式优化与统计学习中的教程综述，是成像与反问题中 ADMM 的标准参考文献。

fista-2009: >-
  提出 FISTA：快速迭代收缩阈值算法，保持 ISTA 的计算简单性但收敛显著更快，且有理论证明的更优全局收敛率。

cnn-mar: >-
  提出基于 CNN 的金属伪影校正框架，融合原始图像与预校正图像以抑制伪影，再由 CNN 图像构建先验，其前向投影替换受金属影响的投影，最后经 FBP 重建。

dudonet: >-
  提出 DuDoNet：端到端可训练的双域网络，同时恢复正弦图一致性并增强 CT 图像，通过新颖的 Radon 反演层连接两个域，使梯度能从图像域反向传播到正弦图域。

nerp: >-
  提出 NeRP：将图像表示为 MLP 参数化的连续函数，把先验图像嵌入网络作为初始化，再按稀疏采样测量的物理模型优化网络；无需大规模训练数据，可推广到 CT 与 MRI。

adn: >-
  提出 ADN：首个无监督金属伪影校正方法，在隐空间中将金属伪影与 CT 图像解耦，通过专用损失支持伪影去除、伪影迁移与自重建等多种生成方式，在临床数据上的泛化能力优于有监督模型。

noise2inverse: >-
  提出 Noise2Inverse：面向线性重建算法的自监督 CNN 去噪方法，无需任何干净或带噪目标数据，通过把测量拆成统计独立的多次重建来训练；在仿真与真实 CT 数据上，PSNR 与 SSIM 均优于现有去噪方法与全变分最小化。

transct: >-
  提出 TransCT：面向低剂量 CT 增强的 Transformer 网络，将带噪图像分解为高频与低频两部分，用三编码器三解码器的改进 Transformer 精炼高频纹理特征，再经分段重建恢复图像；在 Mayo 低剂量 CT 数据集上优于已有方法。

mednerf: >-
  提出 MedNeRF：神经辐射场模型，通过从 2D 图像中解耦形状与体素深度来学习 CT 扫描的连续表示，可从少量甚至单张 X 光重建 CT 投影；在胸部与膝关节数据集上训练，渲染保真度高。

srcnn-cbct: >-
  提出 SR-CNN：对称残差 CNN，用于锐化经全变分正则化重建的欠采样 CBCT 的边缘与解剖细节；在真实投影患者数据上，仅用 120 个半扇束投影即可达到与全采样 FDK 相当的图像质量，并提高肿瘤定位精度，可用于图像引导放疗。

neat: >-
  提出 NeAT：首个面向多视角逆向渲染的自适应分层神经渲染管线，结合神经特征与自适应显式表示，剔除空白空间并在复杂区域集中采样；针对半透明体积层析场景设计，在质量上优于基于优化的层析求解器且速度显著更快。


bayesian-multicontrast-ct: >-
  提出面向有限数据多对比度 X 射线 CT 的联合贝叶斯重建：从分别反演的正弦图联合重建吸收、相位与暗场三幅图像，联合全变分先验耦合三者边缘位置，NUTS 后验采样给出逐像素不确定性；以最多 24 倍的曝光削减抑制欠采样伪影。

temporal-ct-per-bundle: >-
  提出 Temporal CT 的逐束预重建反演：Gauss-Newton 估计器收敛到逐束泊松极大似然解作为无先验基线，蝶形滤波器加管电流调制协同设计压缩通量动态范围，免训练的经验贝叶斯后处理器在患者体数据上达到 Cramer-Rao 下界。

contilnn: >-
  提出 ContiLNN：在 2D 修复骨干上加双向闭式连续时间液态网络模块做跨层建模，层索引间隔调制门控使传播自适应采样变化；CT 去噪超过 Restore-RWKV，延迟与峰值显存分别比 Bi-GRU 低 52.8% 与 57.0%。

cbct-truncation-diffusion: >-
  用条件生成扩散模型补全 CBCT 投影数据的截断区域；相对 RTK 填充在投影域提升 12 dB PSNR 与 0.15 SSIM，重建体数据提升 9 dB PSNR 与 0.10 SSIM，优于 GAN 方法并保留诊断关键特征。
fast-iterative-sparse-angle-ct-lithium-battery: >-
  设计 SART_TI，一种面向圆柱锂电池的几何感知稀疏角度 CT 算法，结合 SART 保真项、径向加权模板、对角正弦图插值与切向平滑；在仿真、X 射线与中子数据上验证，在 10% 投影覆盖下优于 FBP 和 TV-SART，约 30 次迭代收敛。

flex-dd: >-
  提出 Flex-DD，一种面向稀疏视角 CT 的深度去噪模型，联合利用深度先验与灵活的手工先验：用 ADMM 算法优化模型，并通过 HQS 框架将其融入重建；在椭圆体模与人体 CT 实验上表现出强条纹伪影抑制与良好收敛性。

lamigauss: >-
  提出 LamiGauss 用于稀疏视角 X 射线计算层析成像：高斯溅射辐射光栅化结合考虑层析倾角的探测器到世界坐标变换，外加滤除常见层析伪影的初始化策略；直接从稀疏投影重建，在仿真与真实数据上验证有效。

langmamba: >-
  提出 LangMamba，一种语言驱动的 Mamba 低剂量 CT 去噪框架：两阶段策略先预训练语言引导自编码器，把常规剂量 CT 映射到视觉-语言模型导出的语义空间，再用语义增强的 Mamba 去噪器和双空间对齐损失引导去噪。

rcl-mamba: >-
  提出 RCL-Mamba，一种面向旋转稀疏视角扫描计算层析成像的测量导向双域状态空间模型：级联校正投影域旋转模糊与图像域稀疏伪影，采用 Mamba-CNN 双分支；在 PCB 扫描上把视角数从 512 降到 64（8 倍），质量不下降。

rddm: >-
  提出残差驱动漂移模型（RDDM）用于高保真低剂量 CT 去噪：残差漂移场以 LDCT-NDCT 残差为吸引力、以生成残差为排斥力，实现单步去噪，避免了扩散模型多步推理的开销，同时保留细节。

tpaw-adaptive-tv-laminography: >-
  提出截断投影自适应加权（TPAw）用于直线扫描计算层析成像：基于几何的 TPAw 因子抑制 ROI 截断误差，TPAw-LAwTV 算法再加入自适应全变分正则；在仿真与真实主板、硬盘、芯片实验上显著压制截断与混叠伪影。

x-field: >-
  提出 X-Field，首个专为 X 射线成像设计的 3D 表示：用具有不同衰减系数的 3D 椭球体，通过高效路径划分算法建模每种材料对 X 射线的能量吸收，并以混合渐进初始化和基于材料的优化细化材料边界处的几何。


dpka: >-
  提出 DPKA，一种稀疏视角 CT 重建的双域深度先验框架：它施加常被纯 CNN 方法忽略的投影数据约束，并用注意力融合多尺度特征，在严重欠采样下提升重建质量。
dudoswin: >-
  提出 DuDoSwin，一种稀疏视角 CT 重建的自监督双域 Swin Transformer：通过耦合正弦图域与图像域的 Swin 主干，直接从欠采样测量中学习，无需配对真值。
dual-agnet: >-
  提出 Dual-AGNet，一种低剂量 CBCT 重建的双域注意力引导 CNN：注意力模块融合投影域与图像域特征，在降低剂量下抑制噪声并保留解剖细节。
indudonet-plus: >-
  提出 InDuDoNet+，一种 CT 金属伪影校正的深度展开双域网络：将联合正弦图-图像优化展开为可学习的近端算子，嵌入 CT 几何约束，具有可解释性。

modl: >-
  提出 MoDL，一个奠基性的基于模型的深度学习框架：将带 CNN 正则先验的迭代重建展开，同时显式保留正向模型，因而小网络即够用，且架构可迁移到各类逆问题。
tomoselfdeq: >-
  提出 TomoSelfDEQ，一种稀疏角 CT 重建的自监督深度均衡框架：直接在欠采样测量上训练，理论保证与全监督更新一致，仅用 16 个视角即达到最优结果。
c2rv: >-
  提出面向稀疏视角 CBCT 重建的 C2RV：多尺度三维体表示在三维空间实现跨区域学习，尺度-视角交叉注意力模块自适应聚合多尺度多视角特征，重建结果一致性强。

leda: >-
  提出 LEDA，一种即插即用的语言参与双空间对齐损失，用于低剂量 CT 去噪：利用大语言模型将去噪 CT 与文本描述对齐，缓解过平滑并增强可解释性。
proct: >-
  提出 ProCT，一种通用不完备视角 CT 重建的提示上下文 Transformer：视角感知提示使单个模型处理多种稀疏视角与有限角设置，伪影感知上下文学习从上下文图像对中感知伪影模式。
wcdps: >-
  提出小波一致的扩散后验采样，用于有限角与稀疏视角 CT：在扩散采样中施加小波域一致性，从不完备测量中重建出细节锐利的图像。
cyclegan: >-
  提出 CycleGAN 实现无配对图像到图像翻译：两个对抗映射 G: X→Y 与 F: Y→X 由循环一致性损失耦合，无需配对样本即可学习域间映射。该框架成为无配对低剂量 CT 去噪与跨域伪影校正的基础方法。
msdnet: >-
  提出混合尺度密集（MS-D）卷积网络：空洞卷积捕捉多尺度特征，所有层密集连接，参数远少于 U-Net 且可从极小训练集学习。被广泛用作低剂量 CT 去噪的轻量骨干网络。
noise2noise: >-
  证明神经网络仅从受损观测即可学会图像复原：在两组独立噪声图像对上训练，无需干净目标或显式噪声模型即可达到干净数据训练的性能。该原理是 Noise2Inverse 等自监督 CT 方法的基础。
deep-admm-net: >-
  将压缩感知的 ADMM 迭代求解器展开为可学习的深度架构：每个网络阶段对应一次 ADMM 迭代，变换、收缩函数与惩罚参数端到端训练。是后来被引入 CT 重建的深度展开先驱设计。
x-ray-computed-laminography-review: >-
  综述 X 射线计算层析成像（CL）三十年发展：以倾斜旋转轴补足 CT 在扁平高深宽比样品上的短板，涵盖扫描几何与装置、重建方法与软件、从电路板到软包电池的应用，以及优缺点与未来挑战。
