# Batch: Antwerp Vision Lab team sweep #13（中文速读，忠实翻译，技术术语/缩写保留英文）。
swinir-dual-domain-sparse-view: >-
  该文提出双域框架 DDSwinIR，通过正弦图上采样、深度学习重建和残差精修三阶段，从严重欠采样数据中恢复高质量 CT 图像，并强调早期施加数据一致性与稀疏视图拼接带来的改进。实验显示，在稀疏数据上训练、较密数据上测试时泛化较好，反之则不然，且与传统方法相比，该方法在伪影抑制和细节保留方面更优。

to-recurse-low-dose: >-
  该文将稀疏视图 CT 图像切分为小块并转化为时序输入，用循环神经网络去除条纹伪影，并与前馈网络进行比较。结果表明，低噪声时两者恢复性能相近，高噪声时循环神经网络的均方误差更优；按每块计算时循环网络更省算力，但总体上前馈网络更高效。
