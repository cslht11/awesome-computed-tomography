# Batch: 2026-11-21 arXiv sweep follow-up（中文速读，忠实翻译，技术术语/缩写保留英文）。
acus: >-
  面向不完全视角 CT 的不确定性评分。稀疏视角与有限弧扫描通常被当作投影补全、按与单一真值的相似度排名，但即使在离每个已采视角都很远的角度上，这种分数也可能很高——因为学习先验可能"编"出扫描从未约束过的解剖结构。ACUS 改为计算留出投影上名义 90% 预测区间的 Winkler 区间评分，并按到最近已采视角的角距离分箱：区间宽度计入分数，留出像素落在区间外则加重罚，另以已采角度上的坍缩作为对预测器的一致性检查。在胸部与牙科锥束轨道上，区间宽度随角间隙增大，经验覆盖率为 77%–92%，点估计的 PSNR 随宽度上升而下降；最近邻、插值与点补全三者的远端覆盖均为零。ACUS 揭示了点估计 PSNR 单独测不出的、随间隙增大的过度自信。
