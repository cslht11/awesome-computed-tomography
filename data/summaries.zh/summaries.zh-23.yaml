# Batch: 68 条清单后续（中文速读，忠实翻译，技术术语/缩写保留英文）。
geometry-aware-attenuation-learning-sparse-view-cbct: >-
  稀疏视角 CBCT 重建可降低辐射剂量，但近年深度学习与神经渲染方法要么效果不理想，要么因逐例优化而耗时过长。该文提出几何感知的编解码框架：先用 2D CNN 编码多视角 X 线投影的二维特征，再利用 CBCT 扫描几何将其反投影为完备的三维体特征图，最后由 3D CNN 解码恢复 CBCT 图像。该方法在特征反投影阶段尊重三维 CBCT 图像与其二维投影之间的几何关系，并利用从数据群体学到的先验，因而无需逐例训练即可适应极稀疏视角输入，例如仅 5 或 10 个投影。在两个仿真数据集与一个真实数据集上的大量评估表明，该方法重建质量优异且时间效率高。
