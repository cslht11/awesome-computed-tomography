# Batch: UWisc Chen team sweep #6（中文速读，忠实翻译，技术术语/缩写保留英文）。
deep-interior: >-
  Deep-Interior 先用解析加权反投影把任意位置、任意尺寸感兴趣区的扇束投影数据变换到中间特征空间，再用监督学习网络做反卷积恢复真实图像。数值仿真与实验数据显示直径 5 cm 的小感兴趣区也能准确重建，任意尺寸感兴趣区可通过拼接小感兴趣区获得；结论是该框架可实现发散扇束短扫描与超短扫描下的高定量精度内部断层重建。

deep-en-chroma-material-basis: >-
  单能谱 CT 本身不提供物质基图像；Deep-En-Chroma 用物理约束的深度网络从单能谱数据估计水与碘基图像，并以 Deep-QC 检查估计结果与实测多色正弦图谱信息的一致性、给出逐像素误差图。与双能 CT 相比，碘基图像平均差为 -0.25 mg/mL、水基图像为 0.0 g/mL，测试集水与碘均方根误差中位数分别为 14 和 0.73 mg/mL；结论是无需双能采集即可获得临床相关的物质基图像并提示其可信度。

scoutct-net: >-
  现有两视图定位像只能估计近似均匀衰减的患者模型，难以支持视野内或器官特异性剂量调制；ScoutCT-NET 端到端地从两幅正交定位像生成三维断层衰减模型，并用 4214 例回顾性数据训练、在 212 例测试中验证。在 5 mm/10% 的 gamma 标准下 95.0% 的体素通过，基于该模型的通量场调制与器官特异性计划与金标准相比具有高精度；结论是该模型可用于扫描前精确制定剂量调制方案，以实现剂量降低或图像质量提升。

high-pitch-helical-ct: >-
  现有多排探测器 CT 为避免严重有限视角伪影，需把螺距限制在 1.5 以下，而螺距超过 1.5 时能否重建临床可用的螺旋 CT 图像仍是开放问题。该研究将传统螺旋滤波反投影、压缩感知与深度学习方法协同整合，证明单源多排探测器扫描在螺距高达 4 时仍可实现无明显伪影的准确重建。

3d-dla: >-
  目标是仅用一次对比增强 C-arm 锥束 CT 采集生成三维脑血管造影，以减少伪影和辐射剂量；研究用 105 例三维旋转血管造影、逾 1.5 亿标注体素训练深度卷积网络，将每个体素分为血管、骨骼与软组织三类。测试集血管分类准确率为 98.7%，且除耳囊与鼻腔小结构外未见骨骼结构残留信号，表明无掩模重建可准确再现血管解剖并减少配准伪影。
