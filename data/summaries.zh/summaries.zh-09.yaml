# Batch: Purdue Bouman team sweep #7（中文速读，忠实翻译，技术术语/缩写保留英文）。
tmgan: >-
  深度神经网络可用于 CT 去噪与锐化以降低剂量，但直接使用容易产生临床上不理想的纹理，而普通 GAN 虽能改善纹理，却可能引入不准确甚至虚假细节。本文提出的 TMGAN 用并行生成器把解剖结构与生成纹理分开，使生成纹理可匹配目标纹理，从而在提升图像质量的同时产生临床上更可接受的纹理。

multi-slice-fusion-4d: >-
  四维及以上逆问题日益重要，但现有 4D 重建依赖先验建模质量，而 BM4D、深度卷积神经网络等先进去噪器多针对二维或三维图像，难以直接扩展到高维。本文提出多切片融合，用多智能体共识均衡（MACE）融合多个低维去噪器，并将其用于动态样品的 4D 锥束 X 射线 CT，在分布式异构集群上实现。仿真与真实稀疏视角、有限角度 CT 数据表明，该方法相对传统重建可显著提升质量，同时易于实现与训练。
