# Batch: Fessler team sweep #4（中文速读，忠实翻译，技术术语/缩写保留英文）。
dect-multra: >-
  DECT-MULTRA 将惩罚加权最小二乘估计与混合材料模型正则项（MULTRA）结合，预学习同材料与跨材料的稀疏变换，用于双能 CT 图像域材料分解。图像更新与稀疏编码/聚类交替进行且两步均有闭式解，在 XCAT 体模与临床头部数据上的验证表明，其材料图像质量与分解精度优于对比方法。

bcd-net: >-
  BCD-Net 是将去噪卷积神经网络与基于模型的迭代重建（MBIR）模块结合的迭代回归网络，本文改进其结构并给出收敛性质，同时用更快的数值求解器加速 MBIR 模块。幻体实验显示，更快的求解器带来更快、更准确的重建，且优于使用学习变换的 MBIR 方法和 ADMM-Net；临床数据表明，其泛化能力显著优于缺乏 MBIR 模块的非迭代深度回归网络 FBPConvNet。

pwls-ultra: >-
  PWLS-ULTRA 在低剂量 CT 的惩罚加权最小二乘代价中引入预学习变换并集（ULTRA）正则化，图像重建与稀疏编码/聚类交替优化，并用松弛线性化增广拉格朗日方法与有序子集加速重建步骤。在二维/三维 XCAT 体模轴向扫描与三维螺旋胸腹部扫描仿真中，常剂量与低剂量下均显著改善重建质量，优于非自适应边缘保持正则化的 PWLS；与单个学习变换相比，变换并集重建更好；与学习过完备综合字典相比，图像质量相当或更优且计算快得多。

dl-denoising-generalizability: >-
  该研究以残差编解码卷积神经网络（REDCNN）为例，考察低剂量 CT 去噪网络在剂量、重建核与层厚等扫描条件变化下的泛化性，用配对训练集每次只改变一个参数，并在患者、仿真体模与物理体模上以均方误差、调制传递函数、像素级噪声功率谱、低对比病灶可探测性等指标评估。结果显示，REDCNN 在重建核之间泛化较差，混合剂量训练时对任意剂量更稳健，对层厚不高度敏感；结论认为，泛化表现可能与测试数据与训练数据的噪声功率谱相似性高度相关。
