# One-paragraph "what is this paper" blurbs, keyed by paper id.
# Generated by scripts/oneoff/fetch_summaries.py (+ a by-title second
# pass) from the arXiv and Crossref APIs. Every blurb is built from
# **verbatim sentences** of the official abstract, so it can be
# incomplete but never invented. Safe to hand-edit.
2-step-sparse-view-ct-reconstruction-with-a-domain-specifi: >-
  We present a novel framework for sparse-view tomography by decoupling the reconstruction into two steps: First, we overcome its ill-posedness using a super-resolution network, SIN, trained on the sparse projections.

3d-cbct-artefact-removal-using-perpendicular-score-based-dif: >-
  To address this, we propose a 3D dental implant inpainting approach based on perpendicular score-based diffusion models, each trained in two different planes and operating in the projection domain.

3d-field-of-junctions: >-
  Inspired by the strong 2D image denoising properties of Field of Junctions (ICCV 2021), we propose a novel, fully volumetric 3D Field of Junctions (3D FoJ) representation that optimizes a junction of 3D wedges that best explain each 3D patch of a full volume, while encouraging consistency between overlapping patches.

3dip: >-
  In essence, we propose to augment the 2D diffusion prior with a model-based prior in the remaining direction at test time, such that one can achieve coherent reconstructions across all dimensions.

3padmm: >-
  This paper proposes a parameterized plug-and-play ADMM framework for low-dose CT in which the learned prior and the reconstruction parameters are optimized jointly in a single deep-learning framework, improving noise-artifact suppression and edge detail preservation over existing methods.

4dcbct-prior: >-
  To develop a technique to estimate onboard 4D-CBCT using prior information and limited-angle projections for potential 4D target verification of lung radiotherapy. Each phase of onboard 4D-CBCT is considered as a deformation from one selected phase (prior volume) of the planning 4D-CT.

4dgs-4dcbct: >-
  This paper introduces a novel framework leveraging spatiotemporal Gaussian representation for 4D-CBCT reconstruction from sparse projections, achieving a balance between streak artifact reduction, dynamic motion preservation, and fine detail restoration.

a-ct-geometry-with-multiple-centers-of-rotation-for-solving-: >-
  With the emergence of CNT (Carbon nanotube), static and instant CT scanning becomes possible. By transforming the traditionally rotated thermal source into a static ring array source composed of multiple CNTs, the imaging system can achieve high temporal resolution in scanning.

a-learnt-half-quadratic-splitting-based-algorithm-for-fast-a: >-
  In this work, we propose a half-quadratic splitting-based algorithm that uses convolutional neural networks (CNN) in order to obtain high-quality reconstructions from large sparse-view cone-beam CT (CBCT) measurements while overcoming the challenges with typical approaches.

a-review-on-deep-learning-in-medical-image-reconstruction: >-
  Medical imaging is crucial in modern clinics to guide the diagnosis and treatment of diseases. Mathematical models in medical image reconstruction or, more generally, image restoration in computer vision, have been playing a prominent role.

accelerated-optimization-of-implicit-neural-representations-: >-
  An INR represents a CT image as a small-scale neural network that takes spatial coordinates as inputs and outputs attenuation values. In particular, we propose two approaches: (1) using a modified loss function with improved conditioning, and (2) an algorithm based on the alternating direction method of multipliers.

acdnet: >-
  Against this issue, we propose an adaptive convolutional dictionary network (ACDNet), which leverages both model-based and learning-based methods. Hence, our method inherits the clear interpretability of model-based methods and maintains the powerful representation ability of learning-based methods.

acid-a: >-
  ACID stabilizes unstable deep reconstruction networks by combining a data-trained deep network with compressed-sensing-inspired kernel awareness and iterative refinement that minimizes the data residual, removing three reported instability modes and resisting adversarial attacks.

acid-b: >-
  This paper analyzes the ACID tomographic reconstruction workflow from an iterative reconstruction perspective, proving numerical convergence via the Lipschitz constant and local stability against noise, and presents adversarial attacks on both selected networks and the ACID workflow as a whole.

active-view-selection-with-perturbed-gaussian-ensemble-for-t: >-
  In this paper, we present Perturbed Gaussian Ensemble, an active view selection framework that integrates uncertainty modeling with sequential decision-making, tailored for X-ray Gaussian Splatting.

ad-gs: >-
  AD-GS reconstructs sparse-view dental CBCT with anatomical density-guided 3D Gaussian splatting, replacing unstable gradient-driven densification with attenuation-aware MCMC sampling and adding zero-shot semantic regularization from Segment Anything in Medical Images.

adaptive-diffusion-models-for-sparse-view-motion-corrected-h: >-
  In this work, we propose a novel framework combining joint reconstruction and motion estimation (JRM) with an adaptive diffusion model (ADM) that simultaneously addresses motion compensation and sparse-view reconstruction in head CBCT.

admm-net-la: >-
  In the real applications of computed tomography (CT) imaging, the projection data of the scanned objects are usually acquired within a limited-angle range because of the limitation of the scanning condition. Moreover, in some cases, the quality of reconstructed images is less than satisfactory.

advancing-limited-angle-ct-reconstruction-through-diffusion-: >-
  Limited Angle Computed Tomography (LACT) often faces significant challenges due to missing angular information. Unlike previous methods that operate in the image domain, we propose a new method that focuses on sinogram inpainting.

airnet: >-
  Sparse-data computed tomography (CT) frequently occurs, such as breast tomosynthesis, C-arm CT, on-board four-dimensional cone-beam CT (4D CBCT), and industrial CT. However, sparse-data image reconstruction remains challenging due to highly undersampled data.

alpd: >-
  Therefore, it is imperative to develop unsupervised learning protocols that are competitive with supervised approaches in performance. Motivated by the maximum-likelihood principle, we propose an unsupervised learning framework for solving ill-posed inverse problems.

alvarez-1976: >-
  Conventional CT integrates over the X-ray energy spectrum, discarding spectral information. This paper shows that any material's spectral information can be summarized by a few energy-independent constants, recoverable everywhere from low-resolution spectrum measurements plus conventional CT, at similar patient dose.

an-iterative-reconstruction-method-for-dental-cone-beam-comp: >-
  In dental cone-beam computed tomography (CBCT), compact and cost-effective system designs often use small detectors, resulting in a truncated field of view (FOV) that does not fully encompass the patient's head. In this study, we propose a two-stage approach to mitigate truncation artifacts in dental CBCT.

anatomy-preserving-unpaired-cone-beam-ct-refinement-for-imag: >-
  Paired CBCT and CT data are difficult to obtain clinically because of motion, anatomical changes, and acquisition mismatch. We present RefineCBCT, an unpaired CBCT refinement framework that uses pseudo-label guidance and short-step diffusion to reduce artifacts while preserving patient-specific anatomy.

arm-cbct: >-
  Using our approach together with a cyclic registration algorithm yields a combination which shows almost no sensitivity to sparse-view artifacts and thus ensures both high spatial and high temporal resolution.

ascon: >-
  In this paper, we propose a novel Anatomy-aware Supervised CONtrastive learning framework, termed ASCON, which can explore the anatomical semantics for low-dose CT denoising while providing anatomical interpretability.

at-fulltilt: >-
  To overcome this, we propose FullTilt, an end-to-end framework that redefines 3D detection by operating directly on aligned 2D tilt-series. To process the entire tilt-series simultaneously, we introduce a tilt-series encoder to efficiently fuse cross-view information.

atv-limited-angle: >-
  Limited-angle CT suffers because data consistency is angularly varying while total variation minimization is isotropic. This paper introduces an anisotropic TV method that adapts smoothing to the available angular information, outperforming standard TV reconstruction on phantom and real CT images.

autodiff-ct-workflows-2024: >-
  Through four case studies, we demonstrate that auto-differentiation is remarkably effective beyond the boundaries of neural-network training, extending to CT workflows containing varied combinations of classical and machine learning algorithms.

automap: >-
  We present here a unified framework for image reconstruction, AUtomated TransfOrm by Manifold APproximation (AUTOMAP), which recasts image reconstruction as a data-driven, supervised learning task that allows a mapping between sensor and image domain to emerge from an appropriate corpus of training data.

awtv: >-
  The adaptive-weighted total variation (AwTV) model weights neighboring voxels by an exponential function of the local intensity gradient, preserving edges that conventional TV over-smooths, and is solved with an AwTV-POCS scheme for sparse-view low-dose CT reconstruction.

baggagect: >-
  Our approach integrates multi-spectral neural attenuation field reconstruction with Linear pushbroom (LPB) camera model pose optimization, enhancing rendering consistency for novel views through color coding network.

balancing-efficiency-and-restoration-lightweight-mamba-based: >-
  Addressing these issues, we introduce MARMamba, which effectively eliminates artifacts caused by metals of different sizes while maintaining the integrity of the original anatomical structures of the image.

bergner-2010: >-
  To evaluate several algorithms for 4D cone-beam computed tomography (4D CBCT) with slow rotating devices. 4D CBCT is used to perform phase-correlated (PC) reconstructions of moving objects, such as breathing patients, for example. Fast, iterative approaches such as the MKB can therefore be seen as a suitable tradeoff.

bigger-isn-t-always-better-towards-a-general-prior-for-medic: >-
  Diffusion model have been successfully applied to many inverse problems, including MRI and CT reconstruction. Using two different posterior sampling algorithms, we show empirically that such large networks are not necessary.

binary-ct-limited-view-2026: >-
  For industrial CT of binary-valued objects with known attenuation coefficients, this method derives a 0/1 matrix from projection histograms along ray paths and recovers the distribution via a sigmoid mapping, beating SART and FBP from limited views and cutting the error by over 40% under noise.

cadl: >-
  To characterize the noise and spatial resolution properties of a commercially available deep learning-based computed tomography (CT) reconstruction algorithm. Two phantom experiments were performed. All measurements were compared among the algorithms.

cargo-fewview: >-
  This paper describes an X-ray cargo inspection system combining digital radiography, few-view imaging, and CT, with few-view imaging delivering 3D images far faster than CT and an algorithm for reconstructing from severely sparse projections.

cascaded-diffusion-discrepancy-2025: >-
  Sparse-view Computed Tomography (CT) image reconstruction is a promising approach to reduce radiation exposure, but it inevitably leads to image degradation. The cascaded framework minimizes computational costs by moving some inference steps from pixel space to latent space.

casredscan: >-
  Limited-view reconstruction suffers from severe artifacts and inconsistency between the reconstructed image and the measured sinogram. This paper proposes a cascaded residual dense spatial-channel attention network with projection data fidelity layers, improving both limited-angle and sparse-view reconstruction.

cbct-based-synthetic-ct-generation-using-conditional-flow-ma: >-
  Daily or weekly cone-beam computed tomography (CBCT) is employed in image-guided radiotherapy (IGRT) for precise patient alignment. However, its clinical utility in quantitative tasks is hindered by severe artifacts and inaccurate Hounsfeld unit (HU).

cbct-pose-trajectory-optimisation: >-
  Trajectory optimisation for cone-beam computed tomography (CT) determines which information sparse-view scans acquire. Fixed candidate pools prevent off-grid refinement and require new object-specific precomputation for each acquisition manifold.

ccn-cl: >-
  CCN-CL denoises low-dose CT with a content-noise complementary network trained by contrastive learning, using normal-dose images as positive examples and the original low-dose images as negative examples to guide the network.

cd-net: >-
  CD-Net exploits the redundancy between the low- and high-energy images of dual-energy CT with a comprehensive-domain network combining a projection-domain network, an analytical reconstruction operator, and an image-domain network, producing high-quality DECT images directly from sparse projections.

cg-glore-a-conjugate-gradient-based-global-local-regularizat: >-
  We propose \textbf{CG-GLORE}, a compact deep unrolling framework inspired by second-order optimization for sparse-view CT reconstruction. Thus, the method is second-order-inspired rather than an exact Newton method for the full learned objective.

cl-vs-ct: >-
  This paper quantitatively compares computed laminography (CL) with limited-angle CT for flat samples, showing CL wins when the missing angular range is large, while CT offers a better noise-versus-missing-angle tradeoff when projections are noise-limited.

clear: >-
  CLEAR tackles the subtle-structure degeneration and blurring left by aggressive denoising in low-dose CT, mapping raw projections directly to high-quality images with a comprehensive-domain generator, a multi-level loss, and WGAN-GP statistics transfer to curb over-smoothing.

cnn-inverse: >-
  In this paper, we propose a novel deep convolutional neural network (CNN)-based algorithm for solving ill-posed inverse problems. Based on this observation, we propose using direct inversion followed by a CNN to solve normal-convolutional inverse problems.

cnn-invrev: >-
  This review surveys how convolutional neural networks are applied to inverse problems in imaging, including denoising, deconvolution, super-resolution, and medical image reconstruction, where they began to outperform sparsity-based methods such as compressed sensing.

cnnrpgd: >-
  This paper replaces the projector in projected gradient descent with a convolutional neural network that recursively projects the solution toward the space of desired images while gradient descent enforces measurement consistency, with gains over TV, dictionary learning, and direct deep reconstruction.

coco-pnp: >-
  To address these challenges, we propose a cocoercive conservative (CoCo) denoiser, which may be (residual) expansive, leading to improved denoising. Extensive experimental results demonstrate that our approach outperforms closely related methods in both visual quality and quantitative metrics.

cocodiff-a-contextual-conditional-diffusion-model-for-low-: >-
  CoCoDiff is a contextual conditional diffusion model for low-dose CT denoising that reverses a Markov chain conditioned on the low-dose image to generate the residual image, using adjacent-slice context to suppress structural distortion and generalize to unseen noise levels.

coded-aperture: >-
  Instead of random coded apertures, this paper addresses code optimization for compressive X-ray CT based on the system point spread function, improving sensing-matrix quality (RIP and coherence) with PSNR gains over random codes in simulations and results on real projections.

complex-wavelet-based-sinogram-segmentation-for-metal-artifa: >-
  Metal objects pose a significant challenge in cone-beam computed tomography, as their strong and energy-dependent X-ray attenuation leads to inconsistent projections and severe streaking and shading artifacts in reconstructed images.

compressed-sensing-2006: >-
  The field of compressed sensing has shown that a sparse but otherwise arbitrary vector can be recovered exactly from a small number of randomly constructed linear projections (or samples). It is shown that in certain cases (e.g. discrete valued vectors or large distortions) the number of samples can be decreased.

computed-tomography-reconstruction-algorithm-using-markov-ra: >-
  X-ray computed tomography (CT) reveals the materials' internal structures non-destructively from a tilt series of projected images. Filtered back projection (FBP) is a widely-adopted reconstruction algorithm in CT owing to its small computational cost.

conditional-diffusion-for-3d-ct-volume-reconstruction-from-2: >-
  Standard chest X-rays are cost-effective and widely accessible, but provide only 2D projections with limited pathological information. We propose AXON, a multi-stage diffusion-based framework that reconstructs 3D CT volumes directly from real X-rays with substantially improved fidelity over existing approaches.

conditional-diffusion-posterior-alignment-for-sparse-view-ct: >-
  We propose Conditional Diffusion Posterior Alignment (CDPA) to enable scalable 3D sparse-view CT reconstruction. Finally, we show that the same principles also strengthen fast denoising U-Nets, yielding near-diffusion quality at a fraction of the computational cost.

cone-beam-artifact-reduction-in-gamma-knife-cbct-images-usin: >-
  Gamma Knife cone-beam computed tomography (CBCT) images suffer from distinct cone-beam artifacts for some patients, due to the conical X-ray beam which is oriented to intersect the detector perpendicularly at its inferior edge. Approach. Main results. Significance.

cone-beam-ct-image-quality-enhancement-using-a-latent-diffus: >-
  In this study, we propose an overcorrection-free CBCT image quality enhancement method based on a conditional latent diffusion model using pseudo-CBCT images. Pseudo-CBCT images are created from CT images using a simple method that simulates CBCT artifacts and are spatially consistent with the CT images.

continuity-driven-synergistic-diffusion-with-neural-priors-f: >-
  The clinical application of cone-beam computed tomography (CBCT) is constrained by the inherent trade-off between radiation exposure and image quality. To address these challenges, we propose a Continuity-driven Synergistic Diffusion with Neural priors (CSDN) for ultra-sparse-view CBCT reconstruction.

coord-sos-pact: >-
  In this work, we introduce an efficient, self-supervised joint reconstruction method that recovers SOS and high-quality images for ring array PACT systems. Our method removes SOS aberrations more accurately and 35x faster than the current SOTA.

cross-distribution-diffusion-priors-driven-iterative-reconst: >-
  In this work, we propose a Cross-Distribution Diffusion Priors-Driven Iterative Reconstruction (CDPIR) framework to tackle the OOD problem in SVCT. CDPIR integrates cross-distribution diffusion priors, derived from a Scalable Interpolant Transformer (SiT), with model-based iterative reconstruction methods.

cross-modal-guidance-for-fast-diffusion-based-computed-tomog: >-
  Diffusion models have emerged as powerful priors for solving inverse problems in computed tomography (CT). In this work, we propose incorporating an additional modality without retraining the diffusion prior, enabling accelerated imaging of costly modalities.

cryoderec: >-
  Cryo-electron tomography reconstructions suffer from extremely low SNR and missing-wedge artifacts. This paper proposes cryoDeRec, a supervised multi-task framework that jointly denoises and recovers the missing wedge, trained on physically simulated tomograms from real EMDB structures.

cs-cbct-fom: >-
  This article considers the problem of reconstructing cone-beam computed tomography (CBCT) images from a set of undersampled and potentially noisy projection measurements. The performance of the proposed algorithm is demonstrated through a series of digital and experimental phantom studies.

csc-ct: >-
  Over the past few years, dictionary learning (DL)-based methods have been successfully used in various image reconstruction problems. However, traditional DL-based computed tomography (CT) reconstruction methods are patch-based and ignore the consistency of pixels in overlapped patches.

ct-evolution: >-
  This review traces CT reconstruction from filtered back projection to iterative methods and artificial intelligence, covering the clinical impact of iterative reconstruction and the outlook for photon-counting CT, phase-contrast CT, dark-field CT, and AI-driven methods.

ctformer: >-
  Low-dose computed tomography (LDCT) denoising is an important problem in CT research. Compared to the normal dose CT, LDCT images are subjected to severe noise and artifacts. Approach . In this paper, we propose a Convolution-free Token2Token Dilated Vision Transformer (CTformer) for LDCT denoising. Main results .

ctnet: >-
  In this paper, we propose to address this problem through implicit sinogram completion, on a challenging real world dataset containing scans of common checked-in luggage. We show with extensive experimentation that this combined strategy outperforms many competitive baselines.

cvg-diff: >-
  While deep-learning-based methods enable single-step artifact suppression, they often produce over-smoothed results under significant sparsity. To tackle these concerns, we present the Cross-view Generalized Diffusion Model (CvG-Diff), which reformulates sparse-view CT reconstruction as a generalized diffusion process.

dadn: >-
  Deep learning (DL)-based methods have played an increasingly important role in the field of LDCT imaging. Based on this, we propose a novel domain-adaptive denoising network (DADN) via noise estimation and transfer learning to resolve the out-of-distribution problem in LDCT imaging.

dan-net: >-
  DAN-Net reduces CT metal artifacts with a dual-domain adaptive-scaling non-local network: adaptive scaling first corrects the corrupted sinogram to preserve tissue and bone detail, then residual sinogram learning and a non-local module suppress artifacts.

data-driven-filter-design-in-fbp-transforming-ct-reconstru: >-
  In this study, we introduce a Fourier series-based trainable filter for computed tomography (CT) reconstruction within the filtered backprojection (FBP) framework. Code and data are available at https://github.com/sypsyp97/Trainable-Fourier-Series.

data-efficient-limited-angle-ct-using-deep-priors-and-regula: >-
  We propose a very low-data approach to reconstruct the original image from its Radon transform under severe angle limitations. Our method is evaluated on a dataset from the Helsinki Tomography Challenge 2022, where the goal is to reconstruct a binary disk from its limited-angle sinogram.

datadriven: >-
  Recent research in inverse problems seeks to develop a mathematically coherent foundation for combining data-driven models, and in particular those based on deep learning, with domain-specific knowledge contained in physical-analytical models.

dbt-task: >-
  This first task-based comparison of FBP, SART, and maximum-likelihood reconstruction for digital breast tomosynthesis evaluates them with signal CNR and channelised Hotelling observers across iterations, projections, angular range, and dose.

dc-pnpdp: >-
  To resolve this, we propose Dual-Coupled PnP Diffusion (DC-PnPDP), which restores the classical dual variable to provide integral feedback, progressively enforce agreement between the data-consistency and prior.

dctr: >-
  DCTR reconstructs rapidly deforming scenes in limited-view 4D-CT with implicit neural representations coupled to a parametric motion-field warping, optimized self-supervised against the measured sinograms without any training data.

dd-net: >-
  DD-Net first reconstructs an FBP image from the sparsely sampled sinogram, then cleans it with a DenseNet-deconvolution network using shortcut connections, raising structural similarity by up to 18% and cutting RMSE by up to 42% against state-of-the-art sparse-view methods.

ddcl: >-
  Sparse-view CT images from filtered back-projection suffer from artifacts and noise. This paper proposes a dual-domain closed-loop learning network coupling projection-to-image and image-to-projection mappings, while only the first mapping runs at inference, so inference time and hardware needs do not increase.

dddm: >-
  <p> A new deep-learning approach, dual-domain diffu?sion model (DDDM), is proposed for sparse-view CT reconstruc?tion, which is composed of a sinogram upgrading module (SUM) and an image refining module (IRM) connected in series. We release our code at: https://github.com/YC-Markus/code-for-DDDM. </p>

deacnn: >-
  This paper proposes a unified CNN denoising framework for low-dose CT that encodes anatomical prior information from different body sites through an anatomical prior fusion module and a spatial attention mechanism, improving denoising across multiple anatomical sites with a single network.

dear: >-
  DEAR is a three-stage network for sparse-view CT reconstruction: deep embedding extends measurements into artifact-reduced images, deep attention removes sparse-view artifacts and corrects embedding errors, and deep refinement recovers finer features and structures.

deep-pseudo-proximal-map: >-
  To address this, we propose the pseudo-proximal map (PPM), a reformulation of the data-fitting proximal map as the minimum mean square error estimate of a synthetic probabilistic model.

deepcnn: >-
  To address these issues, we propose an algorithm using a deep convolutional neural network (CNN), which is applied to wavelet transform coefficients of low-dose CT images. In addition, we show that wavelet domain CNN is efficient in removing the noises from low-dose CT compared to an image domain CNN.

deepsparse: >-
  To overcome these limitations, we propose DeepSparse, the first foundation model for sparse-view CBCT reconstruction, featuring DiCE (Dual-Dimensional Cross-Scale Embedding), a novel network that integrates multi-view 2D features and multi-scale 3D features.

deer: >-
  Since breast is sensitive to x-ray radiation, dose reduction of breast CT is an important topic, and for this purpose, few-view scanning is a main approach. In this article, we propose a Deep Efficient End-to-end Reconstruction (DEER) network for few-view breast CT image reconstruction.

deman-2001: >-
  This iterative maximum-likelihood algorithm models the polychromatic X-ray spectrum as discrete energies and decomposes attenuation into photoelectric and Compton components, eliminating beam-hardening artifacts in simulations and phantoms, with metal artifact reduction as a promising application.

denomamba: >-
  For high-quality restoration of LDCT images, here we introduce DenoMamba, a novel denoising method based on state-space modeling (SSM), that efficiently captures short- and long-range context in medical images.

desdgan: >-
  This paper proposes a dual-encoder-single-decoder GAN for low-dose CT denoising. One encoder handles shallow visual features such as edges and texture, the other deep semantic features such as tissue structure, and their fusion improves both image quality and diagnostic acceptability over single-encoder GANs.

dfdlm: >-
  Low-dose CT (LDCT) imaging attracted a considerable interest for the reduction of the object's exposure to X-ray radiation. However, the challenge on collecting many such pairs in the clinical setup limits the application of such supervised-learning-based methods for LDCT image reconstruction in practice.

dgr: >-
  In this work, we propose Discretized Gaussian Representation (DGR), a novel framework that reconstructs the 3D volume directly using a set of discretized Gaussian functions in an end-to-end manner.

dgr-2: >-
  Our method exploits such an approach that deep convolutional neural networks (CNNs) generate patterns easier than the noise, therefore randomly initialized generative neural networks can be suitable priors to be used in regularizing the reconstruction.

dict-learning-low-dose-2012: >-
  This paper presents a statistical iterative reconstruction framework for low-dose CT in which a redundant dictionary provides the sparse representation, fixed beforehand or adapted during reconstruction, yielding lower noise and more structural detail than filtered back projection and TV methods in the cases studied.

dif-gaussian: >-
  To this end, we propose a novel reconstruction framework, namely DIF-Gaussian, which leverages 3D Gaussians to represent the feature distribution in the 3D space, offering additional 3D spatial information to facilitate the estimation of attenuation coefficients.

diffmed: >-
  Specifically, we introduce the solid theoretical foundation and fundamental concepts behind diffusion models and the three generic diffusion modelling frameworks: diffusion probabilistic models, noise-conditioned score networks, and stochastic differential equations.

diffnaf: >-
  Multi-source stationary computed tomography (CT) has recently attracted attention for its ability to achieve rapid image reconstruction, making it suitable for time-sensitive clinical and industrial applications. Diff-NAF combines a Neural Attenuation Field representation with a dual-branch conditional diffusion model.

diffnr-diffusion-enhanced-neural-representation-optimization: >-
  Neural representations (NRs), such as neural fields and 3D Gaussians, effectively model volumetric data in computed tomography (CT) but suffer from severe artifacts under sparse-view settings. To address this, we propose DiffNR, a novel framework that enhances NR optimization with diffusion priors.

diffraction-neural-volumetric-prior: >-
  In this work, we develop Neural Volumetric Prior (NVP) for high-fidelity volumetric reconstruction of semi-transparent biological samples from sparse-view microscopic images. NVP integrates explicit and implicit neural representations and incorporates the physical prior of diffractive optics.

diffrecon: >-
  Better algorithms for medical image reconstruction can improve image quality and enable reductions in acquisition time and radiation dose. A prior understanding of the distribution of plausible images is key to realising these benefits.

diffusion-based-limited-angle-ct-reconstruction-under-noisy-: >-
  To improve robustness under realistic noise, we propose RNSD$^+$, a novel noise-aware rectification mechanism that explicitly models inference-time uncertainty, enabling reliable and robust reconstruction.

digs-dynamic-cbct-reconstruction-using-deformation-informed-: >-
  To address these limitations, we introduce a free-form deformation (FFD)-based spatial basis function and a deformation-informed framework that enforces consistency by coupling the temporal evolution of Gaussian's mean position, scale, and rotation under a unified deformation field.

dinr: >-
  In this paper, we present a diffusive computed tomography (CT) inversion framework for regularizing INRs called Diffusive INR (DINR), designed to enable high-quality reconstruction from sparse-view neutron CT.

dior: >-
  DIOR tackles limited-angle CT by combining iterative optimization with deep learning in the residual domain, using asymmetric convolutions for deep priors and a perceptual loss over low- and high-frequency components to preserve tissue detail.

dip: >-
  In this paper we describe an investigation into the application of deep learning methods for low-dose and sparse angle computed tomography using small training datasets. To overcome these problems, we introduce the deep image prior approach in combination with classical regularization and an initial reconstruction.

dip-warm-start-2022: >-
  Deep image prior (DIP) was recently introduced as an effective unsupervised approach for image restoration tasks. DIP represents the image to be recovered as the output of a deep convolutional neural network, and learns the network's parameters such that the output matches the corrupted observation.

dir-view-interp: >-
  To suppress streak artifacts from sparse angular sampling in cone-beam CT, this paper interpolates intermediate views with a shape-driven directional algorithm based on the structure tensor, clearly beating conventional interpolation while trading a small introduced blur for fewer streaks and less noise.

dl: >-
  Limited-angle CT reconstruction is an ill-posed problem. This paper combines dictionary learning with image-gradient l0-norm minimization: the dictionary preserves image details and features, while the l0-norm protects edges and reduces shadow artifacts, outperforming total-variation baselines.

dl-cl: >-
  For limited-angle translational CT, this paper combines SART reconstruction with a U-net convolutional network, and in simulation experiments it effectively suppresses noise and limited-angle artifacts while preserving structures compared with state-of-the-art methods.

dl-ct-incomplete-data-review-2024: >-
  This survey reviews deep-learning methods for CT reconstruction from incomplete projection data, covering sparse-view, limited-angle, metal artifact reduction, interior tomography, and ring artifact reduction, along with limitations and future directions.

dl-ct-rev: >-
  This Nature Machine Intelligence review surveys deep learning for tomographic image reconstruction since 2016, highlighting representative medical imaging results and the key problems the emerging field still needs to solve.

dl-incomplete: >-
  This framework tightly couples a U-Net with CT reconstruction in the sinogram domain, estimating complete projection sinograms from incomplete data and reconstructing high-quality images, validated on sparse-view and limited-angle cases with synthetic and experimental data.

dl-invprob: >-
  Recent work in machine learning shows that deep neural networks can be used to solve a wide variety of inverse problems arising in computational imaging. We explore the central prevailing themes of this emerging area and present a taxonomy that can be used to categorize different problems and reconstruction methods.

dl-piccs: >-
  Sparse-view CT image reconstruction problems encountered in dynamic CT acquisitions are technically challenging. Recently, many deep learning strategies have been proposed to reconstruct CT images from sparse-view angle acquisitions showing promising results.

dlct: >-
  This paper maps filtered back-projection-type algorithms onto neural networks, introducing a cone-beam back-projection layer whose backward pass is a projection operation. It enables joint optimization of correction steps in volume and projection domains, improving ROI PSNR by 23% in limited-angle settings.

dlmir: >-
  This paper formulates image reconstruction from angularly sparse data as an optimization problem and unfolds a fixed number of iterations of an iterative solver with a recurrent neural network, applying it to CT and SAR reconstruction from sparse views and comparing it with traditional approaches.

dm4ct: >-
  To systematically evaluate how diffusion models perform in this context and compare them with established reconstruction methods, we introduce DM4CT, a comprehensive benchmark for CT reconstruction.

dnnss: >-
  In this work, we introduce a deep-neural-network-enabled sinogram synthesis method for sparse-view CT, and show its outperformance to the existing interpolation methods and also to the iterative image reconstruction approach.

dolce-2023: >-
  We present DOLCE, a new deep model-based framework for LACT that uses a conditional diffusion model as an image prior. We show through extensive experimentation on several challenging real LACT datasets that, the same pre-trained DOLCE model achieves the SOTA performance on drastically different types of images.

dose-aware-cold-diffusion-with-physics-consistency-for-gener: >-
  To address these limitations, we propose Dose-Aware Cold Diffusion (DACD), a physics-consistent reconstruction framework that explicitly models radiation dose as a continuous latent factor within a cold diffusion process.

dream-net: >-
  DREAM-Net is an unrolled iterative network for sparse-view CT that applies deep constraints in the projection, residual, and image domains at once: projection inpainting completes missing views, residual awareness estimates the residual image, and image refinement learns a non-standard regularizer.

drone: >-
  DRONE is a dual-domain residual optimization network for sparse-view CT with embedding, refinement, and awareness modules that extend the sparse sinogram, suppress artifacts, recover residual details, and enforce consistency, showing edge preservation and feature recovery on preclinical and clinical data.

dse: >-
  Scatter in cone-beam CT causes cupping and streak artifacts, and Monte Carlo scatter estimation is too slow for routine use. This paper proposes Deep Scatter Estimation, a convolutional network trained to reproduce Monte Carlo scatter output from projections alone, in real time within 2% of ground truth.

dsignet: >-
  DSigNet combines a downsampled imaging geometric model of the CT acquisition process with data-driven priors in a hierarchical neural network, achieving accurate CT reconstruction from clinical patient data, and may help reduce computational complexity and accelerate reconstruction.

dts-deform: >-
  This method reconstructs digital tomosynthesis volumes by solving for a deformation field that warps a prior CBCT or planning CT volume to match new limited-angle projections, combining deformable registration with limited-angle reconstruction for image-guided radiotherapy.

du-gan: >-
  To better regularize the LDCT denoising model, this paper proposes a novel method, termed DU-GAN, which leverages U-Net based discriminators in the GANs framework to learn both global and local difference between the denoised and normal-dose images in both image and gradient domains.

dual-dict: >-
  This few-view reconstruction method couples SART with dictionary learning, sparse representation, and TV minimization using two dictionaries — a transitional one for atom matching and a global one for image updating — outperforming SART and SART-TV on simulated and real projections.

dual-domain-u-nets-with-embedded-back-projection-operators-f: >-
  We propose a deep learning method for motion-resolved 4D CBCT reconstruction from conventional free-breathing scans, without a respiratory signal or explicit projection binning. Experts preferred our method for tumor visibility (59% vs.

dudodp-mar: >-
  In this paper, we propose an unsupervised MAR method based on the diffusion model, a generative model with a high capacity to represent data distributions. Moreover, our method demonstrates superior visual results compared to both supervised and unsupervised methods on clinical datasets.

dudodr-net-2022: >-
  DuDoDR-Net tackles simultaneous sparse-view and metal artifact reduction with a dual-domain data-consistent recurrent network, addressing a combined problem that prior sparse-view or metal-artifact methods cannot handle directly.

dudotrans: >-
  DuDoTrans reconstructs sparse-view CT with a dual-domain Transformer that recovers informative sinograms through long-range modeling and combines enhanced with original sinograms, using fewer parameters with better generalization.

dvg-diffusion-dual-view-guided-diffusion-model-for-ct-recons: >-
  Specifically, we propose a dual-view guided diffusion model (DVG-Diffusion), which couples a real input X-ray view and a synthesized new X-ray view to jointly guide CT reconstruction. Experimental results demonstrate our method outperforms state-of-the-art methods.

dynamic-black-hole-emission-tomography: >-
  To overcome the restrictive assumptions of BH-NeRF, we propose PI-DEF, a physics-informed approach that uses differentiable neural rendering to fit a 4D (time + 3D) emissivity field given EHT measurements.

eagle-an-edge-aware-gradient-localization-enhanced-loss-fo: >-
  To address these limitations, we propose Eagle-Loss, a novel loss function designed to enhance the visual quality of CT image reconstructions. Our results show that Eagle-Loss consistently improves the visual quality of reconstructed images, surpassing state-of-the-art methods across various network architectures.

easel: >-
  Dose reduction in computed tomography (CT) is essential for decreasing radiation risk in clinical applications. Iterative reconstruction is one of the most promising ways to compensate for the increased noise due to reduction of photon flux.

edcnn: >-
  In this paper, we propose the Edge enhancement based Densely connected Convolutional Neural Network (EDCNN). In our network, we design an edge enhancement module using the proposed novel trainable Sobel convolution.

efficient-unrolled-networks: >-
  In this work, we present a domain partitioning strategy and normal operator approximations that enable the training of end-to-end reconstruction models incorporating forward operators of arbitrarily large problems into their architecture.

elbakri-2002: >-
  This paper presents a statistical reconstruction method for polyenergetic X-ray CT that models the source spectrum and energy-dependent attenuation. Formulated as penalized likelihood with an ordered-subsets algorithm, it significantly reduces beam-hardening artifacts in objects containing bone and soft tissue.

empirical-interpolation-projections-2023: >-
  This paper proposes empirical interpolation methods to select the most informative projections for sparse-view industrial X-ray CT when prior information about the inspected object is available, achieving good reconstruction quality from about a dozen projections.

end-to-end-deep-learning-for-interior-tomography-with-low-do: >-
  Main results: We demonstrate that the proposed method outperforms the conventional image-domain deep learning methods, and a projection-domain CNN shows better performance than the image-domain CNNs which are commonly used by many researchers.

enhancing-synthetic-ct-from-cbct-via-multimodal-fusion-and-e: >-
  Cone-Beam Computed Tomography (CBCT) is widely used for intraoperative imaging due to its rapid acquisition and low radiation dose. To overcome the inherent misalignment between modalities, we introduce an end-to-end learnable registration module within the sCT pipeline.

epi-naf: >-
  We present a novel loss term based on consistency conditions between corresponding epipolar lines in X-ray projection images, aimed at regularizing neural attenuation field optimization. This loss results in both qualitative and quantitative improvements in reconstruction compared to baseline methods.

equivariance2inverse-a-practical-self-supervised-ct-reconstr: >-
  Deep learning has shown impressive results in reducing noise and artifacts in X-ray computed tomography (CT) reconstruction. Self-supervised CT reconstruction methods are especially appealing for real-world applications because they require no ground truth training examples.

equivariant-conditional-diffusion-model-for-head-and-neck-ct: >-
  Cone-beam computed tomography CBCT is a commonly used modality for image guided radiotherapy. It offers real time anatomical visualization with low acquisition cost and dose. We propose a novel diffusion based conditional generative model, coined EqDiff-CT, to synthesize high quality CT images from CBCT.

equivariant-multiscale-learned-invertible-reconstruction-for: >-
  In this work we propose LIRE++, an end-to-end rotationally-equivariant multiscale learned invertible primal-dual scheme for fast and memory-efficient CBCT reconstruction. LIRE++ was trained on simulated projection data from a fast quasi-Monte Carlo CBCT projection simulator that we developed as well.

etedn: >-
  ETEDN is an end-to-end network that maps sparse sinograms directly to CT images with three cascaded blocks: sinogram denoising and interpolation, FBP/FDK-based sinogram-to-image mapping, and image denoising, avoiding a fully connected conversion layer.

event-based-bos-tomography: >-
  This chapter presents event-based background-oriented schlieren tomography, reconstructing time-varying 4D density fields from event streams with a neural implicit field, refractive ray tracing, and physics-informed regularization for sparse views.

exact-gs: >-
  Exact-GS replaces the affine approximation of 3D Gaussian Splatting with a mathematically rigorous closed-form splatting solution that matches ray-tracing rendering quality without approximation, enabling fast CUDA rasterization for 3D X-ray CT reconstruction and novel view synthesis.

extreme-few-view-ct-reconstruction-using-deep-inference: >-
  This paper presents a deep network-driven approach to address extreme few-view CT by incorporating convolutional neural network-based inference into state-of-the-art iterative reconstruction. We demonstrate effectiveness of the proposed approach by performing reconstruction experiments on a chest CT dataset.

fact-gs-fast-and-scalable-ct-reconstruction-with-gaussian-sp: >-
  Gaussian Splatting (GS) has emerged as a dominating technique for image rendering and has quickly been adapted for the X-ray Computed Tomography (CT) reconstruction task. FaCT-GS is over 4X faster than the State of the Art GS CT reconstruction on standard 512x512 projections, and over 13X faster on 2k projections.

fast-ct-limited-projections-2023: >-
  Due to the merit of establishing volumetric data, X-ray computed tomography (XCT) is increasingly used as a non-destructive evaluation technique in the quality control of advanced manufactured parts with complex non-line-of-sight features. It also enables a reduction of data size proportionally.

fast-ct-ml-generalization-2025: >-
  Machine-learning enhancement of fast industrial CT must generalize across scanning conditions to preserve measurement accuracy. This paper proposes a methodology to quantify how sensitive accuracy gains are to generalization, laying foundations for integrating machine learning into fast tomography workflows.

fc-cs-rpca: >-
  This paper proposes a feature-constrained compressed sensing reconstruction that extracts prior knowledge from a clinical image database via robust principal component analysis and combines a feature constraint with total variation, improving limited-angle CT reconstruction on phantom and clinical images.

fdk-1984: >-
  The Feldkamp-Davis-Kress (FDK) algorithm gives an approximate convolution-backprojection formula for direct 3D reconstruction from cone-beam projections, reducing to the standard fan-beam formula in the midplane and remaining practical for many real geometries.

fdm: >-
  Recently, many deep learning-based networks have achieved desirable performances compared to iterative reconstruction algorithms. We propose a single degradation-aware deep learning framework to predict clear CT images by understanding the disparity of degradation in both the frequency domain and image domain.

field-of-view-extension-in-dental-cone-beam-ct-via-implicit-: >-
  Dental cone-beam computed tomography (CBCT) systems often employ detector configurations that provide a truncated field of view (FOV) that only captures a small part of the patient's anatomy. In this work, we aim to reconstruct an extended FOV using projections of truncated FOV scans.

find-net-fourier-integrated-network-with-dictionary-kernels-: >-
  To address this challenge, we propose FIND-Net (Fourier-Integrated Network with Dictionary Kernels), a novel MAR framework that integrates frequency and spatial domain processing to achieve superior artifact suppression and structural preservation.

fista-net: >-
  In this paper, we propose a model-based deep learning network, named FISTA-Net, by combining the merits of interpretability and generality of the model-based Fast Iterative Shrinkage/Thresholding Algorithm (FISTA) and strong regularization and tuning-free advantages of the data-driven neural network.

font-sir: >-
  FONT-SIR reconstructs noisy spectral CT images by grouping similar patches across spectral and spatial domains into fourth-order tensors and decomposing each into low-rank and sparse components under weighted nuclear and TV norms, solved with ADMM and beating state-of-the-art methods.

foundation-vae: >-
  Variational autoencoders (VAEs) compress high resolution CT volumes into compact latents while preserving clinically relevant structure. These results demonstrate Foundation VAEs as a practical interface for scalable CT representation reuse and faithful CT generation.

freeseed: >-
  Sparse-view computed tomography (CT) is a promising solution for expediting the scanning process and mitigating radiation exposure to patients, the reconstructed images, however, contain severe streak artifacts, compromising subsequent screening and diagnosis.

from-sparse-x-rays-to-3d-ct-training-free-reconstruction-wit: >-
  To break this dependency, we present TF-PRDiT: a training-free conditional sampling framework that converts a frozen voxel-level 3D Diffusion Transformer prior into a versatile inverse medical problem solver.

fstensor: >-
  Energy-resolved CT is noisier than conventional CT because each energy bin counts fewer photons. This paper proposes FSTensor, which treats multi-energy images as a third-order tensor and combines tensor decomposition, tensor TV, and full-spectrum priors to suppress noise artifacts and improve material estimation.

ganext-a-fully-convnext-enhanced-generative-adversarial-netw: >-
  In this work, we propose GANeXt, a 3D patch-based, fully ConvNeXt-powered generative adversarial network for unified CT synthesis across different modalities and anatomical regions.

gao-2012: >-
  On-board 4D cone beam CT (4DCBCT) offers respiratory phase-resolved volumetric imaging, and improves the accuracy of target localization in image guided radiation therapy. The STF-based algorithm is implemented on a GPU platform for improved computational efficiency.

gaussian-material-fields: >-
  We introduce Gaussian material fields, which represent multiple material distributions with shared anisotropic 3D Gaussian primitives and independent nonnegative material coefficients. These results establish Gaussian material fields as an explicit, adaptive representation for volumetric multi-material reconstruction.

gb-svfbp-gaussian-based-shift-variant-fbp-neural-network: >-
  This paper proposes a Gaussian-Based Shift-Variant filtered backprojection (FBP) neural network, which is designed for the efficient reconstruction of non-circular trajectory cone beam computed tomography.

generative-modeling-in-sinogram-domain-for-sparse-view-ct-: >-
  To relieve this limitation, we present a fully unsupervised score-based generative model in sinogram domain for sparse-view CT reconstruction. Experimental results demonstrated that our method achieved comparable or better performance than the supervised learning counterparts.

geometry-aware-diffusion-approximate-posterior-sampling-for-: >-
  Sparse-view computed tomography (CT) reduces radiation dose and acquisition time and may mitigate motion artifacts. We propose a geometry-aware diffusion-guided stochastic reconstruction framework for sparse-view and limited-angle CT.

gglf: >-
  Incorporating computed tomography (CT) reconstruction operators into differentiable pipelines has proven beneficial in many applications. Such approaches usually focus on the projection data and keep the acquisition geometry fixed. Approach. Main results. Significance.

gh-naf: >-
  GH-NAF decouples the hash-grid levels of a neural attenuation field and adaptively weights them with uncertainty-guided, grid-adaptive attention, stabilizing low-frequency modeling in homogeneous tissue while preserving high-frequency detail near boundaries for sparse-view CBCT.

glfc-unified-global-local-feature-and-contrast-learning-with: >-
  In this work, we propose a Global-Local Feature and Contrast learning (GLFC) framework for sCT generation. Second, we propose a Multiple Contrast Loss (MCL) that calculates synthetic loss at different intensity windows to improve quality for both soft tissues and bone regions.

gmm-unnet: >-
  GMM-unNet is an unsupervised low-dose CT reconstruction method that handles protocol-specific distribution shifts by enrolling unpaired sinograms in training and modeling CT noise with a Gaussian mixture model, optimized via an expectation-maximization algorithm.

gr-gaussian: >-
  GR-Gaussian is a graph-based 3D Gaussian splatting framework for sparse-view CT that suppresses needle-like artifacts with a denoised point-cloud initialization strategy and a pixel-graph-aware gradient strategy, validated on X-3D and real-world datasets.

h3d-marnet-wavelet-guided-dual-path-learning-for-metal-artif: >-
  We propose H3D-MarNet, a two-stage framework for artifact-aware CT domain transformation from kilo-voltage CT (kVCT) to mega-voltage CT (MVCT). In the first stage, a wavelet-based preprocessing module suppresses metal-induced artifacts through frequency-aware denoising while preserving anatomical structures.

haru-net-hybrid-attention-residual-u-net-for-edge-preserving: >-
  To address this research gap, we propose a novel Hybrid Attention Residual U-Net (HARU-Net) for high-quality denoising of CBCT data, trained on a cadaver dataset of human hemimandibles acquired using a high-resolution protocol of the 3D Accuitomo 170 (J.

hd-cnn: >-
  The suppression of streak artifacts in computed tomography with a limited-angle configuration is challenging. In this paper, we present a hybrid-domain convolutional neural network (hdNet) for the reduction of streak artifacts in limited-angle computed tomography.

hdnet: >-
  HDNet splits sparse-view CT reconstruction into two stages, each focused on one task to lower the learning difficulty, and improves artifact suppression, tiny-structure restoration, and contrast retention over competing algorithms on simulated and clinical datasets.

high-energy-ct-metrology-review-2022: >-
  Advanced manufacturing technologies, led by additive manufacturing, have undergone significant growth in recent years. These technologies enable engineers to design parts with reduced weight while maintaining structural and functional integrity. Therefore, the quality of these components is extremely important.

high-fidelity-3d-tooth-reconstruction-by-fusing-intraoral-sc: >-
  We propose a novel, fully-automated pipeline that fuses CBCT and IOS data using a deep implicit representation. Our method first segments and robustly registers the tooth instances, then creates a hybrid proxy mesh combining the IOS crown and the CBCT root.

horuseye-2026: >-
  This paper introduces HorusEye, a self-supervised foundation model for X-ray tomography restoration that learns realistic acquisition degradation from data via interslice contrastive pretraining. Trained on over 100 million images, it generalizes across modalities and tasks, outperforming task-specific approaches.

ictnet: >-
  In sparse-view Computed Tomography (CT), only a small number of projection images are taken around the object, and sinogram interpolation method has a significant impact on final image quality. When the amount of sparsity is high, more advanced sinogram interpolation methods are needed.

idol-net: >-
  Due to the presence of metallic implants, the imaging quality of computed tomography (CT) would be heavily degraded. To address this problem, in this paper, we propose a novel interactive dualdomain parallel network for CT MAR, dubbed as IDOLNet.

ilv-iterative-latent-volumes-for-fast-and-accurate-sparse-vi: >-
  In this work, we introduce Iterative Latent Volumes (ILV), a feed-forward framework that integrates data-driven priors with classical iterative reconstruction principles to overcome key limitations of prior feed-forward models in sparse-view CBCT reconstruction.

imap-tv: >-
  This paper formulates low-dose CT sinogram preprocessing as maximum a posteriori estimation that models both X-ray photon statistics and electronic noise, with a prior encoding piecewise-linear sinogram structure, and solves it with an alternating direction method of multipliers algorithm.

incode: >-
  However, existing INRs face limitations in capturing fine-grained details, handling noise, and adapting to diverse signal types. To address these challenges, we introduce INCODE, a novel approach that enhances the control of the sinusoidal-based activation function in INRs using deep prior knowledge.

indudonet: >-
  Against these issues, we propose a novel interpretable dual domain network, termed as InDuDoNet, which combines the advantages of model-driven and data-driven methodologies. Extensive experiments on synthesized and clinical data show the superiority of our InDuDoNet.

inr-joint: >-
  Computed Tomography (CT) is pivotal in industrial quality control and medical diagnostics. Recognizing that CT often involves scanning similar subjects, we propose a novel approach to improve reconstruction quality through joint reconstruction of multiple objects using INRs.

insideout-integrated-rgb-radiative-gaussian-splatting-for-co: >-
  We introduce InsideOut, an extension of 3D Gaussian splatting (3DGS) that bridges the gap between high-fidelity RGB surface details and subsurface X-ray structures. The fusion of RGB and X-ray imaging is invaluable in fields such as medical diagnostics, cultural heritage restoration, and manufacturing.

integration-of-spectral-ct-with-pet-and-spect-bringing-tissu: >-
  Molecular imaging has been transformed by integrating positron emission tomography (PET) or single-photon emission computed tomography (SPECT) with x-ray computed tomography (CT). Its ability to characterize tissue composition remains underutilized.

intratomo: >-
  IntraTomo is a self-supervised framework combining a sinogram-prediction module, which represents the density field as a neural network learned from the incomplete sinogram, with a geometry-refinement module using local and non-local priors, applied iteratively.

iradonmap: >-
  Radon transform is widely used in physical and life sciences and one of its major applications is the X-ray computed tomography (X-ray CT), which is significant in modern health examination. In this paper, we propose a novel unified framework for Radon inversion via deep learning (DL).

irds: >-
  IRDS proposes a discriminative sparse-transform iterative reconstruction for low-dose CT, using learning-based sparse-transform post-processed images as prior images to avoid the registration and matching problems of classical prior-image methods.

irr-tv: >-
  IRR-TV combines iterative reconstruction-reprojection, which estimates missing projections by extrapolating between projection and image space, with TV regularization for few-view CT, accelerating convergence and improving few-view fan-beam reconstruction including a short-scan variant.

iscs: >-
  3D medical imaging is in high demand and essential for clinical diagnosis and scientific research. Experiments on several medical imaging problems show that our method can effectively improve the performance of medical 3D imaging problems based on 2D diffusion models.

isia: >-
  Because radiation is harmful to patients, it is important to reduce X-ray exposure in the clinic. For CT, reconstructions from sparse views or limited angle tomography are being used more frequently for low dose imaging. To solve this issue, various methods have recently been developed.

joint-decoupled-iterative-cbct-reconstruction-with-hybrid-sc: >-
  This paper proposes a physics-driven iterative framework rooted in the polychromatic Polyquant attenuation model, which decouples these artifacts by establishing an optimization loop between scatter estimation and relative electron density (RED) reconstruction.

k-neas-scalable-multi-material-ct-reconstruction-using-neura: >-
  Computed Tomography (CT) carries significant ionizing radiation risks, driving the need for sparse-view reconstruction. This paper proposes $K$-NeAS, a unified and scalable architecture for automated, multi-material surface reconstruction.

kbr-perfusion: >-
  Dynamic cerebral perfusion CT imposes high dose from repeated acquisitions. This paper proposes tensor-based robust principal component analysis with Kronecker-basis-representation sparsity regularization, separating a low-rank anatomical background from the sparse dynamic perfusion signal, with gains down to 20 mAs.

klip: >-
  We propose an OOD detection metric based on the Kullback-Leibler divergence between the diffusion prior and the posterior distribution, that (i) does not require any calibration data or knowledge of the shifted distribution, and (ii) can detect whole images as OOD as well as localize OOD patches within an image.

ksae: >-
  This paper learns a K-sparse autoencoder manifold from normal-dose images and minimizes the distance between the reconstructed image and the manifold together with data fidelity during iterative reconstruction, reducing noise while preserving detail on Low-dose CT Grand Challenge data.

ksvd-2006: >-
  K-SVD is an iterative dictionary-learning algorithm that generalizes K-means: it alternates between sparse-coding examples with the current dictionary and updating dictionary atoms together with their sparse representations to better fit the training signals.

l0-fewview: >-
  The L1-norm of the gradient-magnitude images (GMI), which is the well-known total variation (TV) model, is widely used as regularization in the few views CT reconstruction. The simulation indicates that the algorithm proposed in this paper can obviously improve the reconstruction quality.

l0-grad: >-
  Accurate images reconstructed from limited computed tomography (CT) data are desired when reducing the X-ray radiation exposure imposed on patients. The total variation (TV), known as the l1-norm of the image gradient magnitudes, is popular in CT reconstruction from incomplete projection data.

l1l2: >-
  We design a specific splitting framework for an unconstrained optimization model so that the alternating direction method of multipliers (ADMM) has guaranteed convergence under certain conditions.

lab-lamino: >-
  This paper shows computed laminography can be done on a conventional industrial lab micro-CT scanner without specialist equipment, using a tilted rotary scan geometry and CGLS reconstruction to image planar objects with fewer artifacts and more isotropic resolution than limited-angle scans.

latent-space-consistency-for-sparse-view-ct-reconstruction: >-
  To address this issue, we propose the Consistent Latent Space Diffusion Model (CLS-DM), which incorporates cross-modal feature contrastive learning to efficiently extract latent 3D information from 2D X-ray images and achieve latent space alignment between modalities.

lctfound: >-
  Labeled lung CT data are scarce, limiting clinical AI adoption. This paper introduces LCTfound, a foundation model diffusion-pretrained on 105,184 multi-center lung CT scans, evaluated across eight task categories from diagnosis to sparse-view reconstruction and low-dose enhancement, outperforming prior models.

ldct-cnn: >-
  This paper maps low-dose CT images to their normal-dose counterparts patch by patch with a deep convolutional neural network, without accessing the original projection data, achieving substantial gains in PSNR, RMSE, and SSIM at a speed an order of magnitude faster than iterative methods.

learn: >-
  Compressive sensing (CS) has proved effective for tomographic reconstruction from sparsely collected data or under-sampled measurements, which are practically important for few-view CT, tomosynthesis, interior tomography, and so on.

learn-plus-plus-2023: >-
  Compressed sensing (CS) computed tomography has been proven to be important for several clinical applications, such as sparse-view computed tomography (CT), digital tomosynthesis and interior tomography.

learned-convex-regularizers-for-inverse-problems: >-
  The ICNN-based convex regularizer is trained adversarially to discern ground-truth images from unregularized reconstructions. In particular, we show that the optimal solution to the variational problem converges to the ground-truth if the penalty parameter decays sub-linearly with respect to the norm of the noise.

learning-the-invisible-2019: >-
  Our method is reliable in the sense that we only learn the part that can provably not be handled by model-based methods, while applying the theoretically controllable sparse regularization technique to the remaining parts.

learning-wavelet-sparse-fdk-for-3d-cone-beam-ct-reconstructi: >-
  In this paper, we introduce an enhanced FDK-based neural network that maintains the classical algorithm's interpretability by selectively integrating trainable elements into the cosine weighting and filtering stages.

learning-where-and-what-to-lift-for-bi-planar-x-ray-to-ct-re: >-
  We observe that once the spatial organization of anatomical regions is established, estimating their CT intensities becomes substantially more tractable. Motivated by this, we propose LiftXR, an interleaved, geometry-guided framework that explicitly incorporates spatial layout recovery into CT reconstruction.

leng-2008: >-
  This paper achieves high temporal resolution (about 100 ms) and streak-free 4D-CBCT by reconstructing each respiratory phase with prior image constrained compressed sensing (PICCS), using a fully sampled prior image to constrain reconstructions from only 10-20 projections.

leveraging-image-editing-foundation-models-for-data-efficien: >-
  We propose a paradigm shift: reframing artifact reduction as an in-context reasoning task by adapting a general-purpose vision-language diffusion foundation model via parameter-efficient Low-Rank Adaptation (LoRA).

limited-angle-cbct-reconstruction-via-geometry-integrated-cy: >-
  We propose a limited-angle (LA) geometry-integrated cycle-domain (LA-GICD) framework for CBCT reconstruction, comprising two denoising diffusion probabilistic models (DDPMs) connected via analytic cone-beam forward and back projectors.

limited-angle-nano-ct-2025: >-
  To tackle this challenge, we propose an approach dubbed Perception Fused Iterative Tomography Reconstruction Engine, which integrates a convolutional neural network (CNN) with perceptional knowledge as a smart regularizer into an iterative solving engine.

limited-angle-spect-image-reconstruction-using-deep-image-pr: >-
  We propose a LA SPECT image reconstruction method that uses an end-to-end deep image prior (DIP) framework to improve reconstructed image quality. The proposed method was evaluated using 20 numerical phantoms and clinical patient data.

linct-tv-admm: >-
  For linear-scan CT with limited-angle, insufficient data, this method reformulates TV minimization as a separable equality-constrained problem and solves it with the alternating direction method, showing robust, efficient reconstruction that outperforms some previous methods on simulations and real data.

lingo: >-
  In this paper, we propose a unified Latent Initialization and Gradient Optimization (LINGO) framework to address these issues. To evaluate the quality of initialization, we introduce the Initialization Point Cloud Structural Deviation (IPSD) metric.

live: >-
  Currently, no 3D or 4D volumetric x-ray imaging techniques are available for intrafraction verification of target position during actual treatment delivery or in-between treatment beams, which is critical for stereotactic radiosurgery (SRS) and stereotactic body radiation therapy (SBRT) treatments.

lmfi: >-
  LMFI reframes sparse-view CT as Fourier-domain interpolation, learning a multi-scale network to predict Cartesian 2D Fourier coefficients directly from available polar-coordinate coefficients, reaching state-of-the-art accuracy with higher efficiency.

lodopab-ct: >-
  Deep learning approaches for tomographic image reconstruction have become very effective and have been demonstrated to be competitive in the field. Comparing these approaches is a challenging task as they rely to a great extent on the data and setup used for training.

low-dose-ct-using-denoising-diffusion-probabilistic-model-: >-
  In this paper, to improve the LDCT denoising performance, we introduce the conditional denoising diffusion probabilistic model (DDPM) and show encouraging results with a high computational efficiency.

low-level-dataset-distillation: >-
  Medical image enhancement is clinically valuable, but existing methods require large-scale datasets to learn complex pixel-level mappings. To address this, we propose the first low-level DD method for medical image enhancement. Notably, downstream users cannot access raw patient data.

lowmas-sparseview: >-
  Low-dose CT can combine low-mAs acquisition with sparse-view sampling, but the resulting sinograms are noisy and incomplete. This paper proposes ASR-TV-POCS, a two-step strategy pairing adaptive sinogram restoration with total-variation POCS, improving noise reduction, contrast-to-noise ratio, and edge preservation.

lpd: >-
  We propose the Learned Primal-Dual algorithm for tomographic reconstruction. The algorithm accounts for a (possibly non-linear) forward operator in a deep neural network by unrolling a proximal primal-dual optimization method, but where the proximal operators have been replaced with convolutional neural networks.

lr-tv-perfusion: >-
  This paper restores low-dose cerebral perfusion CT by stacking sequential perfusion images into a low-rank matrix and applying non-convex spectral-norm and spatiotemporal total-variation regularization to exploit their similarity redundancy.

lrtp: >-
  This paper combines a low-rank representation of inter-channel correlations with a region-specific texture-preserving Markov random field in a unified Bayesian framework for photon-counting spectral CT, preserving texture while suppressing noise in each energy channel.

lucid-learned-undersampling-adaptive-consistency-guided-infe: >-
  We propose Lucid, a sparsity-adaptive, consistency-guided reconstruction framework based on a Flow Matching generative prior for sparse-view CT. During inference, the sampling sparsity level is explicitly incorporated to adapt the generative trajectory of a single pretrained model.

magic: >-
  Low-dose computed tomography (LDCT) scans, which can effectively alleviate the radiation problem, will degrade the imaging quality. In this paper, we propose a novel LDCT reconstruction network that unrolls the iterative scheme and performs in both image and manifold spaces.

maier-2019: >-
  X-ray scattering leads to CT images with a reduced contrast, inaccurate CT values as well as streak and cupping artifacts. Therefore, we propose the deep scatter estimation (DSE): a deep convolutional neural network to derive highly accurate scatter estimates in real time.

malar: >-
  MALAR enhances vascular intensity in ultra-low-dose-contrast CT angiography with a multiple adversarial learning framework: bilateral domain mapping, a dual correlation constraint, and an adaptive fusion module that suppresses high-noise metal interference.

map-nn: >-
  MAP-NN is a modularized neural network for low-dose CT that maps end-to-process rather than end-to-end, letting radiologists tune denoising depth per task; it matches commercial iterative reconstruction from three leading CT vendors.

mar-4dec: >-
  This review surveys nearly 40 years of metal artifact reduction in CT, from the physics of beam hardening, scatter, noise, and partial-volume effects to six classes of correction methods, and argues the future lies in combining improved acquisition with advanced reconstruction.

mccollough-2015: >-
  This review explains the physical principles of dual- and multi-energy CT, where a second X-ray spectrum enables differentiation of materials that share identical CT numbers. It surveys the technical approaches, including photon-counting detectors, and current and evolving clinical applications.

mdst-2023: >-
  Sparse-view computed tomography (SVCT), which can reduce the radiation doses administered to patients and hasten data acquisition, has become an area of particular interest to researchers. Most existing deep learning-based image reconstruction methods are based on convolutional neural networks (CNNs). Approach.

medgmae: >-
  MedGMAE replaces voxel reconstruction in masked autoencoders with 3D Gaussian primitive prediction, learning to predict full Gaussian parameter sets from sparse visible patches and outperforming MAE baselines on downstream medical tasks.

metainv-net: >-
  X-ray Computed Tomography (CT) is widely used in clinical applications such as diagnosis and image-guided interventions. In this paper, we propose a new deep learning based model for CT image reconstruction with the backbone network architecture built by unrolling an iterative algorithm.

mgmar-metal-guided-metal-artifact-reduction-for-x-ray-comput: >-
  We propose MGMAR, a metal-guided MAR method that explicitly leverages metal-related information throughout the reconstruction pipeline. This prior-embedded initialization reduces sensitivity to random initialization and accelerates convergence during measurement-specific refinement.

mindi-3d-iterative-deep-learning-in-3d-for-sparse-view-cone-: >-
  We present MInDI-3D (Medical Inversion by Direct Iteration in 3D), the first 3D conditional diffusion-based model for real-world sparse-view Cone Beam Computed Tomography (CBCT) artefact removal, aiming to reduce imaging radiation exposure.

ml-industrial-ct-review-2024: >-
  This review surveys machine and deep learning across the entire industrial X-ray CT workflow, from reconstruction to segmentation and feature characterization, and flags uncertainty quantification and explainability as keys to wider adoption.

mlem-1982: >-
  This paper gives an accurate Poisson statistical model for emission tomography and derives the EM algorithm that maximizes the likelihood of the observed detector counts, yielding an iterative maximum-likelihood reconstruction.

momentum-net: >-
  This paper proposes the first fast and convergent INN architecture, Momentum-Net, by generalizing a block-wise MBIR algorithm that uses momentum and majorizers with regression NNs.

monstr-model-oriented-neutron-strain-tomographic-reconstruct: >-
  In this paper, we introduce the model-oriented neutron strain tomographic reconstruction (MONSTR) algorithm that reconstructs the 2D residual strain tensor from the neutron Bragg edge strain measurements.

moreau-shearlet-tv-2020: >-
  Iterative computed tomography (CT) image reconstruction with sparse regularization can substantially reduce the amount of projection data. This is because employing local prior information, it is difficult to distinguish structural details from noise.

motion-grad: >-
  This paper introduces a novel approach to CBCT motion estimation using a gradient-based optimization algorithm, which leverages generalized derivatives of the backprojection operator for cone-beam CT geometries.

multi-scale-learned-iterative-2020: >-
  Model-based learned iterative reconstruction methods have recently been shown to outperform classical reconstruction algorithms. As a possible solution to these restrictions we propose a multi-scale learned iterative reconstruction scheme that computes iterates on discretisations of increasing resolution.

mw-cnn: >-
  MWCNN reconstructs sparse-view CT with a multi-level wavelet convolutional neural network applied to FBP reconstructions from 60, 120, and 180 projections, combining wavelet multi-scale analysis with deep learning.

n2s: >-
  We demonstrate that our method outperforms both conventional and compressed sensing based iterative reconstruction methods qualitatively and quantitatively in the reconstruction of analytic CT phantoms and real-world CT images in low-dose CT reconstruction task.

nab: >-
  Motivated by the observation that numerous industrial objects exhibit rectangular structures, we propose a novel Neural Adaptive Binning (NAB) method that effectively integrates rectangular priors into the reconstruction process. Specifically, our approach first maps coordinate space into a binned vector space.

naf: >-
  This paper proposes a novel and fast self-supervised solution for sparse-view CBCT reconstruction (Cone Beam Computed Tomography) that requires no external training data. We synthesize projections discretely and train the network by minimizing the error between real and synthesized projections.

ndi-tv: >-
  PWLS-ndiTV reconstructs sparse-view CT with a normal-dose-image-induced total variation prior, using a normal-dose image induced non-local means filter to reduce the influence of misalignment between the desired and prior images.

neural-discrete-representation-learning-for-sparse-view-cbct: >-
  Here, we propose DeepPriorCBCT - a three-stage deep learning framework that achieves diagnostic-grade reconstruction using only one-sixth of the conventional radiation dose. 4102 patients with 8675 CBCT scans from 12 centers were included to develop and validate DeepPriorCBCT.

neural-field-denoising-2024: >-
  This method conditions neural fields for 3D sparse-view CT with Regularization by Denoising, decoupling the denoiser from neural-field optimization to save memory, applying to any CT geometry including cone-beam, and matching or beating state-of-the-art quality with the lowest memory use.

neuromorphic-xray-ct: >-
  To bridge this gap, we introduce a Neuromorphic X-ray CT framework. Specifically, we propose an Event-enhanced Neural Attenuation Field (ENAF) that models the volumetric attenuation field by jointly leveraging sparse projections and event streams.

ngps: >-
  We propose Neighbor-Guided Patch Sampling (NGPS), a lightweight framework that constructs neighboring supervision under local inter-slice misalignment without explicit registration. Across the evaluated CT and synthetic-Rician MRI settings, NGPS improves fidelity and structure-sensitive metrics.

nlctf: >-
  Spectral computed tomography (CT) reconstructs material-dependent attenuation images with the projections of multiple narrow energy windows, it is meaningful for material identification and decomposition. The method constructs such a group by clustering up a series of non-local spatial-spectrum cubes.

nlm-review: >-
  Low-dose X-ray computed tomography ( LDCT ) imaging is highly recommended for use in the clinic because of growing concerns over excessive radiation exposure. It has since been adapted and applied to many other image types and various inverse problems.

noise-inspired-diffusion-model-for-generalizable-low-dose-ct: >-
  In this paper, we propose a noise-inspired diffusion model for generalizable LDCT reconstruction, termed NEED, which tailors diffusion models for noise characteristics of each domain. Source code is made available at https://github.com/qgao21/NEED.

noise2match: >-
  We propose Noise2Match, a self-supervised low-dose CT denoising method based on adaptive inter-slice matching. An inter-slice matching network models the label transition between adjacent slices and corrects the denoiser's outputs to satisfy the Noise2Noise equal-mean condition, and the method works for low-dose CBCT.

non-circular-scan-trajectories-for-reducing-cone-beam-artifa: >-
  Gamma Knife cone-beam computed tomography (CBCT) images are deteriorated by cone-beam artifacts whose magnitude increases along the superior direction. Approach. Main results. A line-arc-line trajectory with source axial steps of 3.5 mm removes virtually all cone-beam artifacts. Significance.

nonperiodic-dynamic-ct-reconstruction-using-backward-warping: >-
  Dynamic computed tomography (CT) reconstruction faces significant challenges in addressing motion artifacts, particularly for nonperiodic rapid movements such as cardiac imaging with fast heart rates. This paper presents a novel INR-based framework, BIRD, for nonperiodic dynamic CT reconstruction.

offset-cbct: >-
  Offsetting the CBCT detector enlarges the field of view, but analytic algorithms are unlikely to reconstruct accurate images from sparse-view data. This paper studies optimization-based algorithms, including adaptive-steepest-descent weighted POCS, which may yield useful images from fewer projections and reduce dose.

openpros: >-
  We introduce OPENPROS, the first large-scale benchmark dataset for limited-angle prostate USCT, designed to systematically evaluate machine learning methods for quantitative inverse problems.

ordered-subsets-multi-diffusion-model-for-sparse-view-ct-rec: >-
  Score-based diffusion models have shown significant promise in the field of sparse-view CT reconstruction. However, the projection dataset is large and riddled with redundancy. To address these issues, we propose the ordered-subsets multi-diffusion model (OSMM) for sparse-view CT reconstruction.

ox-nerf: >-
  To address this problem we present a new framework, Optimised X-ray Neural Radiance Fields (OX-NeRF), that combines cross-scene feature learning with scene-specific optimisation to reconstruct sets of related scenes.

pbac: >-
  Image quality in computed tomography (CT) often suffers from artifacts which may reduce the diagnostic value of the image. In many cases, these artifacts result from missing or corrupt regions in the projection data, e.g., in the case of metal, truncation, and limited angle artifacts.

pde: >-
  This paper proposes a regional adaptive variational PDE model for CT reconstruction that combines L2 gradient energy with total variation, using a threshold function to apply L2 in low-density regions and TV where features must be preserved.

pdf: >-
  The parameter-dependent framework PDF trains one reconstruction network on data from multiple geometries and dose levels, feeding geometry and dose parameters into multilayer perceptrons that modulate the network feature maps, matching geometry-specific networks while saving training cost.

photon-pile-up-normalizing-flow: >-
  We present a machine learning solution to this problem, using a simulation-based inference framework that allows us to estimate posterior distributions of physical source parameters from piled-up eROSITA data.

phydict: >-
  We propose PhyDiCT, a training-free framework that integrates a differentiable Physics-based forward model, grounded in the Beer-Lambert law, with a text-conditioned Diffusion as a strong prior to reconstruct 3D lung CT images.

physics-inspired-gaussian-kolmogorov-arnold-networks-for-x-r: >-
  Cone-beam CT (CBCT) employs a flat-panel detector to achieve three-dimensional imaging with high spatial resolution. To address this issue, we propose a deep learning-based scatter artifact correction method inspired by physical prior knowledge.

piccs: >-
  PICCS reconstructs dynamic CT image sequences from highly undersampled data by constraining compressed-sensing reconstruction of each time frame with a prior image built from the union of interleaved dynamic datasets, reaching an undersampling factor of 32 in vivo.

piner: >-
  PINER adapts black-box deep sparse-view CT models at test time without source data, using prior-informed implicit neural representations to build adapted inputs under unknown noise levels, and outperforms state-of-the-art methods across anatomical sites and black-box models.

pixel-wise-metrics-reliability: >-
  To address this limitation, we propose a suite of novel anatomy-aware evaluation metrics designed to assess structural completeness across anatomical structures, including large organs, small organs, intestines, and vessels.

planet: >-
  Sparse-view CT methods focus on network design but overlook which projection views to acquire. This paper proposes PLANet, which learns the importance of different view angles through reconstruction training and selects the most informative views, improving reconstruction quality in a unified deep-learning framework.

pnp-proximal-trajectory-2024: >-
  This chapter replaces the Gaussian denoiser in plug-and-play reconstruction with an artifact-specific restoration network trained along a predefined optimization trajectory, beating state-of-the-art PSNR on two 3D cone-beam CT datasets.

polyner: >-
  In this work, we present a novel Polychromatic neural representation (Polyner) to tackle the challenging problem of CT imaging when metallic implants exist within the human body. Polyner instead models the MAR problem from a nonlinear inverse problem perspective.

prior-adapted-progressive-time-resolved-cbct-reconstruction-: >-
  Cone-beam CT (CBCT) provides on-board volumetric anatomy for image guidance and treatment adaptation in radiotherapy. Via DREME-adapt, a virtual fraction is generated from a pre-treatment 4D-CT set of each patient for a clean, 'cold-start' reconstruction.

projection-embedded-diffusion-bridge-for-ct-reconstruction-f: >-
  Reconstructing CT images from incomplete projection data remains challenging due to the ill-posed nature of the problem. In this work, we propose the Projection Embedded Diffusion Bridge (PEDB). In addition, we introduce a free parameter to control the level of stochasticity in the reverse process.

projection-volume-fidelity-divergence-diagnosing-and-control: >-
  To characterize this behavior, we introduce geometry- and volume-level diagnostics that measure needle-like Gaussian degeneration and the stability of the voxelized density field. Based on these observations, we propose LADES, a ground-truth-free optimization controller for sparse-view Gaussian tomography.

psrv: >-
  This paper shows a deep-learning model trained to map a patient's projection radiograph to 3D anatomy can generate volumetric CT images from a single projection view, with potential use in image-guided interventions.

ptpn: >-
  A number of image-processing problems can be formulated as optimization problems. Aiming at solving this problem, this paper proposes an approach that employs deep reinforcement learning to train a system that can automatically adjust parameters in a human-like manner.

r2-gaussian: >-
  This paper introduces R$^2$-Gaussian, the first 3DGS-based framework for sparse-view tomographic reconstruction. To address this issue, we propose a novel rectification technique via refactoring the projection from 3D to 2D Gaussians.

rad: >-
  This paper derives quantitative measures of the bias in prior-image-based CT reconstruction and an analytical relationship between that bias and the prior regularization strength, enabling prospective selection of the strength to admit specific anatomical changes.

radioactive-3d-gaussian-ray-tracing-for-tomographic-reconstr: >-
  3D Gaussian Splatting (3DGS) has recently emerged in computer vision as a promising rendering technique. To address these limitations, we propose a tomographic reconstruction framework based on 3D Gaussian ray tracing.

radon-1917: >-
  This 1917 paper defines the line-integral transform: it asks whether a function can be uniquely recovered from its integrals along lines, and gives the inversion for the two-dimensional case with generalizations.

radon-transforms-aleksandrov-fenchel: >-
  We study Radon transforms on Grassmannians as geometric operators on convex bodies, relating Minkowski's projection body maps to Goodey-Weil mean section body maps. We prove new Aleksandrov-Fenchel inequalities for averages of mixed volumes, showing all intrinsic volumes of mean section bodies are log-concave.

ram: >-
  In this work, we propose a novel non-iterative, lightweight architecture that incorporates knowledge about the forward operator (acquisition physics and noise parameters) without relying on unrolling.

ramachandran-lakshminarayanan-1971: >-
  A new technique is proposed for the mathematical process of reconstruction of a three-dimensional object from its transmission shadowgraphs; it uses convolutions with functions defined in the real space of the object, without using Fourier transforms.

ratv: >-
  This reweighted anisotropic TV method tackles limited-angle CT by approximating the l0 sparsity measure better than l1 and assigning direction-dependent weights from the angular coverage, preventing blurred directions from harming edge detection and beating existing TV-based methods.

rbp-dip-2024: >-
  RBP-DIP improves deep image prior for highly ill-posed CT reconstruction by adding a residual back-projection connection to an untrained U-Net, strengthening regularization as the network weights are optimized each iteration.

red-cnn: >-
  Low-dose CT methods working on reconstructed images struggle to remove noise while preserving structure. This paper proposes RED-CNN, a residual encoder-decoder network combining autoencoder, deconvolution, and shortcut connections, competitive in noise suppression, structural preservation, and lesion detection.

redaep: >-
  REDAEP improves sparse-view CT reconstruction with a denoising autoencoding prior that uses variable augmentation to learn a higher-dimensional three-channel network and a robust Lp regression loss to preserve texture detail, achieving better performance than state-of-the-art methods.

remar-ds-recalibrated-feature-learning-for-metal-artifact-re: >-
  We propose a deep learning framework for metal artifact reduction (MAR) and domain transformation from kVCT to Mega-Voltage CT (MVCT). Unlike traditional MAR methods, our approach bridges the gap between high-resolution kVCT and artifact-resistant MVCT, enhancing radiotherapy planning.

resolution-agnostic-neural-operators-for-multi-rate-sparse-v: >-
  Sparse-view Computed Tomography (CT) reconstructs images from a limited number of X-ray projections to reduce radiation and scanning time, which is an ill-posed inverse problem. We propose Computed Tomography neural Operator (CTO), the first neural operator (NO) framework for CT reconstruction.

revisiting-pose-sensitivity-in-splat-based-computed-tomograp: >-
  X-ray computed tomography (CT) reconstructs volumetric representations of objects from projection images obtained by transmitting X-rays through a target. Through detailed analysis, we show that these artifacts primarily originate from pose inaccuracies in the acquisition geometry rather than from view sparsity itself.

riner: >-
  Ring artifacts are prevalent in 3D cone-beam computed tomography (CBCT) due to non-ideal responses of X-ray detectors, substantially affecting image quality and diagnostic reliability. In this work, we propose Riner, a new unsupervised RAR method.

rit-2009: >-
  Respiratory motion causes artifacts in cone-beam (CB) CT images acquired on slow rotating scanners integrated with linear accelerators. In this article, the authors develop an on-the-fly solution to estimate and compensate for the respiratory motion in the reconstruction of a 3D CBCT image from all the CB projections.

robust-uncertainty-2006: >-
  For example, we show how one can reconstruct a piecewise constant (one or two-dimensional) object from incomplete frequency samples--provided that the number of jumps (discontinuities) obeys the condition above--by minimizing other convex functionals such as the total-variation of $f$.

robustness-and-stability-analysis-of-differentiable-shift-va: >-
  In this work, we present a systematic study of the robustness and adaptability of differentiable SV-FBP under challenging acquisition settings. Instead, the spatial distribution of sampling points plays a more dominant role.

roessl-2007: >-
  This paper investigates K-edge imaging in X-ray CT with energy-sensitive photon-counting detectors, showing that energy-selective photon counting can measure the local density of a gadolinium-based contrast agent and distinguish contrast-filled lumen from plaque.

rof-tv-1992: >-
  The Rudin-Osher-Fatemi model removes image noise by minimizing total variation subject to noise-statistics constraints imposed via Lagrange multipliers, solved with a gradient-projection method that preserves sharp edges.

sacnn: >-
  SACNN denoises low-dose CT with a 3D self-attention CNN that captures long-range spatial context within and between slices, plus a self-supervised autoencoder perceptual loss, matching or beating state-of-the-art methods on the AAPM-Mayo low-dose CT data.

sagan: >-
  Low Dose Computed Tomography (LDCT) has offered tremendous benefits in radiation restricted applications, but the quantum noise as resulted by the insufficient number of photons could potentially harm the diagnostic performance. In this paper, a deep learning based approach was proposed to mitigate this problem.

sart-1984: >-
  SART improves the algebraic reconstruction technique by applying ART error-correction terms simultaneously for all rays in a projection, with longitudinal weighting and bilinear elements, yielding a good reconstruction in a single iteration.

sax-nerf: >-
  In this paper, we propose a framework, Structure-Aware X-ray Neural Radiodensity Fields (SAX-NeRF), for sparse-view X-ray 3D reconstruction. Firstly, we design a Line Segment-based Transformer (Lineformer) as the backbone of SAX-NeRF.

scatter-dl: >-
  This chapter reviews how X-ray scatter degrades cone-beam CT contrast, sharpness, noise, and background homogeneity, and surveys deep-learning scatter-correction methods and their clinical applications.

scatter-rev: >-
  Since scattered radiation in cone-beam volume CT implies severe degradation of CT images by quantification errors, artifacts, and noise increase, scatter suppression is one of the main issues related to image quality in CBCT imaging. Therefore additional references are included when ever it seems pertinent.

scatter-rev-p2: >-
  The main components of scatter correction procedures are scatter estimation and a scatter compensation algorithm. This paper completes a previous paper where a general framework for scatter compensation was presented under the prerequisite that a scatter estimation method is already available.

schlomka-2008: >-
  K-edge CT with energy-discriminating detectors promises material-specific imaging with high-Z contrast agents. This paper demonstrates quantitative K-edge imaging, separating iodine and gadolinium contrast agents from anatomical background with measured concentrations matching ground truth.

sdb: >-
  We introduce System embedded Diffusion Bridge Models (SDBs), a new class of supervised bridge methods that explicitly embed the known linear measurement system into the coefficients of a matrix-valued SDE.

semantic-contrastive-learning-for-orthogonal-x-ray-computed-: >-
  To address these challenges, we propose a novel semantic feature contrastive learning loss function that evaluates semantic similarity in high-level latent spaces and anatomical similarity in shallow latent spaces.

semimar: >-
  SemiMAR is a semi-supervised metal artifact reduction framework that learns only artifact-free parts with a single generator and infers artifacts by subtraction, distilling dual-domain knowledge with a contrastive-learning latent constraint to rival state-of-the-art semi-supervised MAR methods.

senp: >-
  Computed tomography (CT) is one of the most used imaging modalities for imaging both symptomatic and asymptomatic patients. The purpose of this paper is to improve the image quality of quarter dose images and to select the best hyperparameters using the regular dose image as ground truth.

shape-guided-gaussian-splatting-for-sparse-view-x-ray-3d-rec: >-
  This paper proposes a shape-guided Gaussian splatting framework for sparse-view X-ray 3D reconstructions. Our method ensures anatomically consistent reconstruction and improves PSNR by 2.83 dB over a state-of-the-art Gaussian splatting baseline with as few as 5 views.

shearlet: >-
  This paper applies shearlet-based regularization to iterative CT reconstruction, showing that the shearlet transform directional sensitivity preserves image texture better than total variation, which suffers from staircasing, though careless use can cause wavy artifacts.

shepp-logan-1974: >-
  This classic paper presents Fourier reconstruction of a head section, where a modified weighting function achieves accuracy, simplicity, low computation time, and low noise sensitivity, beating an iterative search algorithm that needed 12 iterations and was more noise-sensitive.

sidky-pan-tv-2008: >-
  This paper develops ASD-POCS, an iterative algorithm that minimizes total variation subject to data-consistency and non-negativity constraints, for circular cone-beam CT. It appears robust against cone-beam artifacts and is particularly useful when the angular range is limited or sampling is sparse.

siewerdsen-2001: >-
  This paper quantifies x-ray scatter in flat-panel cone-beam CT in terms of scatter-to-primary ratio as a function of object size and cone angle, showing that scatter degrades contrast-to-noise ratio and that the loss can be restored by increasing dose, slice thickness, or both.

sinogram-interpolation-2024: >-
  This paper proposes a deep-learning sinogram interpolation method that resamples acquired data into a spinogram representation to predict missing projections, validated on real XCT scans of five laser-sintered objects.

sinonet: >-
  Un-SinoNet recovers low-dose CT sinograms without paired training data, learning the gradient of low-dose sinograms in a purely unsupervised way under a maximum a posteriori framework driven by the noise-generating mechanism of CT measurement.

sire-net-2025: >-
  SIRE-Net reconstructs limited-angle CT of plate-type batteries with a generator combining a structure-preserving artifact-removal network and an attention-based contextual enhancement network, plus a WGAN-GP discriminator, reducing edge artifacts and preserving structure and detail on a real battery dataset.

sister: >-
  Multi-energy CT images suffer from severe noise. This paper proposes SISTER, which clusters similar spatial-spectral patches into fourth-order tensor groups and applies tensor decomposition with enhanced sparsity, improving edge preservation, feature recovery, and noise suppression over tensor dictionary learning.

sisvm: >-
  iCT-Net is a deep network with a common architecture trained to reconstruct CT images accurately from sinogram data under a variety of acquisition conditions, including entangled sparse-view and interior tomography problems.

snaf: >-
  In this paper, we propose SNAF for sparse-view CBCT reconstruction by learning the neural attenuation fields, where we have invented a novel view augmentation strategy to overcome the challenges introduced by insufficient data from sparse input views.

sonke-2005: >-
  A cone beam computed tomography (CBCT) scanner integrated with a linear accelerator is a powerful tool for image guided radiotherapy. We have developed an alternative respiratory correlated procedure for CBCT and evaluated its performance.

soul-net: >-
  To relieve these problems, in this paper, we propose a Sparse and lOw-rank UnroLling Network for spectral CT image reconstruction (SOUL-Net), that learns the parameters and thresholds in a data-driven manner.

spare: >-
  Currently, four-dimensional (4D) cone-beam computed tomography (CBCT) requires a 3-4 min full-fan scan to ensure usable image quality. Recent advancements in sparse-view 4D-CBCT reconstruction have opened the possibility to reduce scan time and dose. A total of 32 CBCT scans of nine patients were generated.

sparse-sampling: >-
  Various scanning methods and image reconstruction algorithms are actively investigated for low-dose computed tomography (CT) that can potentially reduce a health-risk related to radiation dose. The authors present five different sparse sampling schemes, and simulated those schemes to achieve a targeted dose reduction.

sparse-tomography: >-
  A wavelet-based sparsity-promoting reconstruction method is studied in the context of tomography with severely limited projection data. Such imaging problems are ill-posed inverse problems, or very sensitive to measurement and modeling errors.

sparse-view-laminography-2014: >-
  This paper proposes a spherical-sinusoidal scan trajectory for sparse-view computed laminography, showing with compressive-sensing TV reconstruction from only 40 views that it beats single-arc, double-arc, and oblique trajectories in contrast, with the oblique scheme comparable in resolution.

sparsity2dl: >-
  The field of medical image reconstruction has seen roughly four types of methods. These methods are typically fast, but have suboptimal properties such as poor resolution-noise trade-off for CT. These iterative methods improved image quality by reducing noise and artifacts.

special: >-
  SPECIAL improves limited-angle CT by combining image- and projection-domain information through enhanced adversarial learning and a single-shot projection error correction module, improving artifact removal, edge preservation, and tiny-structure restoration, including in high-attenuation tissue.

spectral-consistent-flow: >-
  We present Spectral Consistent Flow (SC-Flow), a 3D medical image translation framework with a single function evaluation (1-NFE) in the latent space.

spener: >-
  Additionally, current methods have not fully explored the use of image domain priors for solving SVCT inverse problems. In this work, we demonstrate that imperfect reconstruction results can provide effective image domain priors for INRs to enhance performance.

spie-dir-2023: >-
  Dual-energy CT from limited-angle scans is challenging despite redundancy between the two spectra. This paper proposes SPIE-DIR, deriving self-prior information from two complementary limited-angle scans and constraining projection, residual, and image domains, with a Wasserstein GAN improving visual perception.

spir-de: >-
  In this study, we propose an iterative algorithm to enable a new data acquisition scheme which requires one full scan and a second sparse-view scan for potential reduction in imaging dose and engineering cost of DECT.

splat-based-metal-artifact-reduction-in-cone-beam-ct-via-com: >-
  We introduce a splat-based metal artifact reduction framework that incorporates a physically grounded polychromatic forward model into a continuous Gaussian representation for cone-beam CT.

splat-based-metal-artifact-reduction-in-cone-beam-ct-via-pol: >-
  We propose a novel physics-inspired, self-calibrating metal artifact reduction method that efficiently reconstructs 3D CBCT volumes while correcting beam hardening artifacts. This is the first splat-based method for reducing beam hardening in CBCT.

spqi: >-
  This paper generates CT-like images from cone-beam CT using a patchwise contrastive learning GAN trained on unpaired CT and CBCT data, improving image quality and HU accuracy while preserving anatomical structures.

spss: >-
  SPSS synthesizes full-view sinograms from sparse-view data with a 20-layer residual CNN, using zero- and first-order difference losses to preserve sharpness, region boundaries and tissue texture, rather than producing over-smoothed sinograms.

spultra: >-
  Low-dose CT image reconstruction has been a popular research topic in recent years. A typical reconstruction method based on post-log measurements is called penalized weighted-least squares (PWLS). Both the SP induced data-fidelity term and the regularizer in the proposed framework are nonconvex.

ssdae: >-
  SSDAE restores low-dose CT with stacked sparse denoising autoencoders applied as post-reconstruction processing, suppressing noise while recovering structural detail and outperforming TV-POCS, BM3D, and U-Net baselines.

statistical-image-reconstruction-using-mixed-poisson-gauss: >-
  Statistical image reconstruction (SIR) methods for X-ray CT produce high-quality and accurate images, while greatly reducing patient exposure to radiation. This paper proposes a novel SIR method called MPG (mixed Poisson-Gaussian).

stcnet: >-
  We propose STCNet, a sparse-view 4D CBCT reconstruction framework using spatial-temporal consistency learning. From only 16 projections per respiratory phase, it combines physics-driven positional encoding for geometric consistency with temporal encoding for motion, jointly optimizing projection and image domains.

steerable-conditional-diffusion-2025: >-
  Denoising diffusion models have emerged as the go-to generative framework for solving inverse problems in imaging. To address this discrepancy during train-test time and improve reconstruction accuracy, we introduce a novel sampling framework called Steerable Conditional Diffusion.

super: >-
  Traditional model-based image reconstruction (MBIR) methods combine forward and noise models with simple object priors. In this work, we propose a unified supervised-unsupervised (SUPER) learning framework for X-ray computed tomography (CT) image reconstruction.

super-2: >-
  In this paper, we propose a new Supervised-UnsuPERvised (SUPER) reconstruction framework for LDCT image reconstruction that combines the benefits of supervised learning methods and (unsupervised) transform learning-based methods such as PWLS-ULTRA that involve highly image-adaptive clustering.

sv-cbct-data-consistent-2023: >-
  Reconstruction of CT images from a limited set of projections through an object is important in several applications ranging from medical imaging to industrial settings. To deal with the challenge of limited data, we use image subvolumes to train our method, and patch aggregation during testing.

sv-cbct-eval: >-
  This evaluation shows constrained TV-minimization can reconstruct useful flat-panel cone-beam CT images from a small fraction of the usual projection data, supporting considerably reduced imaging effort and radiation dose depending on scanning conditions and imaging tasks.

sv-spectral-lr: >-
  In kVp-switching spectral CT, each spectral measurement has only sparse views. It proposes a penalized maximum-likelihood method with a spectral patch-based low-rank penalty that exploits patch self-similarity across spectra, improving spectral images qualitatively and quantitatively; a GPU implementation cuts cost.

sv-tgv: >-
  PWLS-TGV replaces the piecewise-constant assumption of total variation with total generalized variation regularization using higher-order derivatives, together with data-dependent variance weighting, reducing patchy artifacts in sparse-view CT reconstruction.

swap-net-2025: >-
  Swap-Net is a memory-efficient 2.5D network for sparse-view 3D CBCT reconstruction that uses axes-swapping operations to reconstruct 3D volumes end-to-end without full 3D convolutions, validated on inertial confinement fusion simulations.

sword: >-
  Employing the Wavelet transform as a guiding sparsity prior significantly enhances the robustness of diffusion models. In this study, we present an innovative approach named the Stage-by-stage Wavelet Optimization Refinement Diffusion (SWORD) model for sparse-view CT reconstruction.

synergizing-physics-model-based-and-data-driven-methods-fo: >-
  Since 2016, deep learning (DL) has advanced tomographic imaging with remarkable successes, especially in low-dose computed tomography (LDCT) imaging. An emerging trend is to integrate imaging physics and model into deep networks, enabling a hybridization of physics/model-based and data-driven elements.

synthetic-ct-image-generation-from-cbct-a-systematic-review: >-
  The generation of synthetic CT (sCT) images from cone-beam CT (CBCT) data using deep learning methodologies represents a significant advancement in radiation oncology. A total of 35 relevant studies were identified and analyzed, revealing the prevalence of deep learning approaches in the generation of sCT.

tamp: >-
  Non-ideal measurement computed tomography (NICT) employs suboptimal imaging protocols to expand CT applications. We propose the multi-scale integrated Transformer AMPlifier (TAMP), the first imaging foundation model for universal NICT enhancement.

tensor-dl: >-
  In dynamic computed tomography (CT) reconstruction, the data acquisition speed limits the spatio-temporal resolution. In this paper, we present an adaptive method to train a tensor-based spatio-temporal dictionary for sparse representation of an image sequence during the reconstruction process.

tensor-net: >-
  Instead of learning in the projection or image domain, this method trains networks on the view-by-view backprojection tensor, which carries lossless pre-summation information, and beats image-, projection-, and hybrid-domain learning frameworks on detail preservation.

texture-preserving-implicit-neural-representation-for-cone-b: >-
  Cone-beam computed tomography (CBCT) frequently suffers from data truncation, which introduces severe artifacts and limits the effective field of view (FOV). To address these challenges, we introduce a self-supervised 3D reconstruction framework based on neural scene representations.

tfu-net: >-
  In particular, we show that the alternative U- Net variants such as dual frame and the tight frame U-Nets satisfy the so-called frame condition which make them better for effective recovery of high frequency edges in sparse view- CT.

tg-field-geometry-aware-radiative-gaussian-fields-for-tomogr: >-
  3D Gaussian Splatting (3DGS) has revolutionized 3D scene representation with superior efficiency and quality. To address these challenges, we propose Tomographic Geometry Field (TG-Field), a geometry-aware Gaussian deformation framework tailored for both static and dynamic CT reconstruction.

time-resolved-dynamic-cbct-reconstruction-using-prior-model-: >-
  Time-resolved CBCT imaging, which reconstructs a dynamic sequence of CBCTs reflecting intra-scan motion (one CBCT per x-ray projection without phase sorting or binning), is highly desired for regular and irregular motion characterization, patient setup, and motion-adapted radiotherapy.

tomo-21st: >-
  This article reviews analytic tomographic reconstruction, covering the line-integral model and the distinction between two-dimensional reconstruction and fully three-dimensional reconstruction, where lines take arbitrary orientations in space rather than lying in parallel planes.

tomotransformer: >-
  TomoTransformer is a transformer-based foundation model for CT reconstruction that treats each local filtered projection as a token and predicts missing views via self-attention in back-projection space, handling any number of projections, angles, and detector sizes without retraining.

toward-a-foundation-plug-and-play-prior-for-computed-tomogra: >-
  Computed tomography (CT) throughput is limited by scan time, which grows with both the number of projections acquired and the detector integration time for each projection.

toward-ct-equivalent-image-quality-in-low-dose-radiotherapy-: >-
  During standard radiotherapy planning, repeated CT acquisitions are often required for patient registration, verification, and adaptive planning, resulting in increased cumulative X-ray dose. To mitigate this, low-dose cone-beam CT (CBCT) is routinely acquired during treatment delivery.

towards-reconstructing-experimental-sparse-view-x-ray-ct-dat: >-
  Diffusion-based image generators are promising priors for ill-posed inverse problems like sparse-view X-ray Computed Tomography (CT). Our results reveal that domain shift plays a nuanced role: while severe mismatch causes model collapse and hallucinations, diverse priors match or exceed well-matched but narrow priors.

tv-stokes: >-
  TVS-POCS introduces isophote directions into total variation reconstruction so that consistency is preserved along both normal and tangent directions, eliminating patchy artifacts and preserving subtle structures in sparse-view CT while approaching filtered back projection in the full-view case.

tv-wtf: >-
  This method combines total variation with wavelet tight frame regularization for limited-angle CT, adding l1 and l0 terms solved by a TV-based SART and ADMM, suppressing limited-angle artifacts while preserving low-contrast objects.

tvwfr: >-
  To remove the staircase artifacts of TV regularization in sparse-view CT, this method combines TV on low-frequency wavelet-frame coefficients with an l0 penalty on high-frequency coefficients, solved with ADMM, preserving edges while suppressing staircasing and noise.

two-view-industrial-diffusion-2024: >-
  Industrial CT needs a full 360-degree scan, too slow for online inspection. This paper proposes two-view reconstruction with a multiscale conditional latent diffusion network, where a two-view condition module guides generation from two orthogonal projections, recovering product geometry and tiny internal defects.

ultrafast-deep-learning-based-scatter-estimation-in-cone-bea: >-
  Further experiments comparing scatter-corrected reconstructions on a large, simulated dataset and real CBCT scans from water and Sedentex CT phantoms clearly demonstrated the robustness of our method.

uncertainr-uncertainty-quantification-of-end-to-end-implic: >-
  Implicit neural representations (INRs) have achieved impressive results for scene reconstruction and computer graphics, where their performance has primarily been assessed on reconstruction accuracy.

undip: >-
  UN-DIP reconstructs sparse-view and limited-angle CT with untrained generator networks regularized by the deep image prior, jointly optimizing the latent vector and the generator weights during reconstruction.

unsupervised-idbp-svct-2025: >-
  In this work, we introduce an unsupervised DL framework called ADMM-DRP, which integrates an untrained neural network with alternating direction method of multipliers (ADMM) iterative reconstruction algorithm.

unsupervised-metal-artifact-reduction-in-dental-cbct-using-f: >-
  Metal artifacts generated by dental implants significantly degrade cone-beam computed tomography (CBCT) volumes, obscuring critical anatomical structures and compromising diagnostic precision.

variational-garrote: >-
  Sparse regularization plays a central role in solving inverse problems arising from incomplete or corrupted measurements. A unified experimental framework is constructed across multiple reconstruction tasks including signal resampling, signal denoising, and sparse-view computed tomography.

view-covariance-loss-2026: >-
  This paper introduces the view covariance loss, which measures the joint information of a set of views by approximating the reconstruction normalized mean squared error, and a selection algorithm that picks views minimizing it, yielding lower error and fewer artifacts than alternative approaches.

view-dependent-detector-displacement-cbct: >-
  Detector shifting is used in industrial cone-beam computed tomography to reduce ring artifacts, but the resulting detector motion can vary nonuniformly across projection views and produce detector positions that cannot be represented by fixed offsets.

viss: >-
  This paper interpolates missing views in sparsely sampled sinograms with a convolutional neural network, filling in the missing projection data so that images can be reconstructed with an analytic algorithm instead of relying on iterative reconstruction.

vodasure: >-
  In this work, we show that much of this performance stems from training on downsampled data rather than real low-resolution scans. To address this, we introduce VoDaSuRe, a large-scale volumetric dataset containing paired high- and low-resolution scans.

vol3dgs: >-
  We show that the core approximations in splatting are unnecessary, even within a rasterizer; We instead volumetrically integrate 3D Gaussians directly to compute the transmittance across them analytically. Our method represents opaque surfaces with higher accuracy and fewer points than 3DGS.

voxelsynth3d-interpretable-volumetric-image-domain-metal-art: >-
  Metal artifacts in postoperative musculoskeletal CT obscure bone-implant and adjacent soft-tissue interfaces. We present VoxelSynth3D, a training-free 3D image-domain framework for reconstructed CT. The framework combines support masking, normalized tissue synthesis, deviation gating, and restricted edge refinement.

vvbp-tsvd: >-
  This paper analyzes the sorted view-by-view backprojection tensor inside FBP and denoises it with tensor singular value decomposition, exploiting structural self-similarity, sparsity, and noise statistics to beat sinogram preprocessing, image postprocessing, and iterative methods in low-mAs CT.

wav-sgm: >-
  Score-based generative models struggle when training data are noisy, as in low-dose CT or undersampled MRI. This paper proposes a wavelet-improved framework coupling a wavelet sub-network with the score-based model through mutual feedback, learning scores from noisy samples and matching models trained on clean data.

wavresnet: >-
  To address this problem, here we propose a novel framelet-based denoising algorithm using wavelet residual network which synergistically combines the expressive power of deep learning and the performance guarantee from the framelet-based denoising algorithms.

wgan-vgg: >-
  In this paper, we introduce a new CT image denoising method based on the generative adversarial network (GAN) with Wasserstein distance and perceptual similarity. The Wasserstein distance is a key concept of the optimal transform theory, and promises to improve the performance of the GAN.

when-are-diffusion-priors-helpful-in-sparse-reconstruction-a: >-
  Diffusion models demonstrate state-of-the-art performance on image generation, and are gaining traction for sparse medical image reconstruction tasks. We make comparisons on low-dose chest wall computed tomography (CT) for fat mass quantification.

why-fbp: >-
  This review examines why CT scanner reconstruction algorithms have remained unchanged for 25 years despite advances in iterative and compressive sensing reconstruction, distills the underlying mathematical problems, and suggests how stronger links between applied mathematicians and engineers could close the gap.

x-gaussian: >-
  In this paper, we propose a 3D Gaussian splatting-based framework, namely X-Gaussian, for X-ray novel view synthesis. Based on this model, we develop a Differentiable Radiative Rasterization (DRR) with CUDA implementation. The application on sparse-view CT reconstruction also reveals the practical values of our method.

x-grm-large-gaussian-reconstruction-model-for-sparse-view-x-: >-
  Computed Tomography serves as an indispensable tool in clinical workflows, providing non-invasive visualization of internal anatomical structures. In this work, we present X-GRM (X-ray Gaussian Reconstruction Model), a large feedforward model for reconstructing 3D CT volumes from sparse-view 2D X-ray projections.

x2-gaussian: >-
  X²-Gaussian reconstructs continuous-time 4D CT with dynamic radiative Gaussian splatting, learning patient-specific breathing motion self-supervised from projections via a physiology-driven periodic consistency loss, without external gating devices.

xden-1k: >-
  A deep understanding of the physical world is essential for robotic manipulation and physically realistic simulation. To address this gap, we introduce XDen-1K, the first large-scale multimodal dataset that provides physically grounded density field for real-world objects.

xgenrecon-2025: >-
  XGenRecon reconstructs CBCT from ultrasparse projections by generating auxiliary X-ray projections under controlled geometric parameters, with X-Correction harmonizing the generated projections and CT-Correction refining the reconstructed image.

zbijewski-2006: >-
  This iterative scatter-correction scheme estimates scatter from an initial reconstruction with a fast Monte Carlo simulation accelerated by Gaussian-basis fitting, cutting simulation time by three to four orders of magnitude and reducing water-phantom quantitative errors from about 12% to 1%.

zero-shot-ct-super-resolution-using-diffusion-based-2d-proje: >-
  Computed tomography (CT) is important in clinical diagnosis, but acquiring high-resolution (HR) CT is constrained by radiation exposure risks. To overcome these limitations, we propose a novel zero-shot 3D CT SR framework that integrates diffusion-based upsampled 2D projection priors into the 3D reconstruction process.

zero-shot-low-dose-ct-denoising-via-sinogram-flicking: >-
  In this paper, we propose a zero-shot low-dose CT imaging method based on sinogram flicking, which operates within a single image but generates many copies via random conjugate ray matching. A simulation study demonstrates that our method outperforms state-of-the-art approaches such as ZS-N2N.

zhu-2006: >-
  Scatter causes severe artifacts in large-detector CT. This paper proposes scatter correction using a checkerboard primary modulator: the primary is modulated at high frequency while scatter stays low-frequency, so filtering and demodulation separate them, cutting error from 74.2% to below 1% in simulations.
