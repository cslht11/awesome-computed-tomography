texture-preserving-implicit-neural-representation-for-cone-b: >-
  Cone-beam computed tomography (CBCT) frequently suffers from data truncation, which introduces severe artifacts and limits the effective field of view (FOV). To address these challenges, we introduce a self-supervised 3D reconstruction framework based on neural scene representations.
tfu-net: >-
  In particular, we show that the alternative U- Net variants such as dual frame and the tight frame U-Nets satisfy the so-called frame condition which make them better for effective recovery of high frequency edges in sparse view- CT.
tg-field-geometry-aware-radiative-gaussian-fields-for-tomogr: >-
  3D Gaussian Splatting (3DGS) has revolutionized 3D scene representation with superior efficiency and quality. To address these challenges, we propose Tomographic Geometry Field (TG-Field), a geometry-aware Gaussian deformation framework tailored for both static and dynamic CT reconstruction.
time-resolved-dynamic-cbct-reconstruction-using-prior-model-: >-
  Time-resolved CBCT imaging, which reconstructs a dynamic sequence of CBCTs reflecting intra-scan motion (one CBCT per x-ray projection without phase sorting or binning), is highly desired for regular and irregular motion characterization, patient setup, and motion-adapted radiotherapy.
toward-a-foundation-plug-and-play-prior-for-computed-tomogra: >-
  Computed tomography (CT) throughput is limited by scan time, which grows with both the number of projections acquired and the detector integration time for each projection.
toward-ct-equivalent-image-quality-in-low-dose-radiotherapy-: >-
  During standard radiotherapy planning, repeated CT acquisitions are often required for patient registration, verification, and adaptive planning, resulting in increased cumulative X-ray dose. To mitigate this, low-dose cone-beam CT (CBCT) is routinely acquired during treatment delivery.
towards-reconstructing-experimental-sparse-view-x-ray-ct-dat: >-
  Diffusion-based image generators are promising priors for ill-posed inverse problems like sparse-view X-ray Computed Tomography (CT). Our results reveal that domain shift plays a nuanced role: while severe mismatch causes model collapse and hallucinations, diverse priors match or exceed well-matched but narrow priors.
ultrafast-deep-learning-based-scatter-estimation-in-cone-bea: >-
  Further experiments comparing scatter-corrected reconstructions on a large, simulated dataset and real CBCT scans from water and Sedentex CT phantoms clearly demonstrated the robustness of our method.
uncertainr-uncertainty-quantification-of-end-to-end-implic: >-
  Implicit neural representations (INRs) have achieved impressive results for scene reconstruction and computer graphics, where their performance has primarily been assessed on reconstruction accuracy.
unsupervised-idbp-svct-2025: >-
  In this work, we introduce an unsupervised DL framework called ADMM-DRP, which integrates an untrained neural network with alternating direction method of multipliers (ADMM) iterative reconstruction algorithm.
unsupervised-metal-artifact-reduction-in-dental-cbct-using-f: >-
  Metal artifacts generated by dental implants significantly degrade cone-beam computed tomography (CBCT) volumes, obscuring critical anatomical structures and compromising diagnostic precision.
variational-garrote: >-
  Sparse regularization plays a central role in solving inverse problems arising from incomplete or corrupted measurements. A unified experimental framework is constructed across multiple reconstruction tasks including signal resampling, signal denoising, and sparse-view computed tomography.
view-dependent-detector-displacement-cbct: >-
  Detector shifting is used in industrial cone-beam computed tomography to reduce ring artifacts, but the resulting detector motion can vary nonuniformly across projection views and produce detector positions that cannot be represented by fixed offsets.
vodasure: >-
  In this work, we show that much of this performance stems from training on downsampled data rather than real low-resolution scans. To address this, we introduce VoDaSuRe, a large-scale volumetric dataset containing paired high- and low-resolution scans.
vol3dgs: >-
  We show that the core approximations in splatting are unnecessary, even within a rasterizer; We instead volumetrically integrate 3D Gaussians directly to compute the transmittance across them analytically. Our method represents opaque surfaces with higher accuracy and fewer points than 3DGS.
voxelsynth3d-interpretable-volumetric-image-domain-metal-art: >-
  Metal artifacts in postoperative musculoskeletal CT obscure bone-implant and adjacent soft-tissue interfaces. We present VoxelSynth3D, a training-free 3D image-domain framework for reconstructed CT. The framework combines support masking, normalized tissue synthesis, deviation gating, and restricted edge refinement.
wavresnet: >-
  To address this problem, here we propose a novel framelet-based denoising algorithm using wavelet residual network which synergistically combines the expressive power of deep learning and the performance guarantee from the framelet-based denoising algorithms.
wgan-vgg: >-
  In this paper, we introduce a new CT image denoising method based on the generative adversarial network (GAN) with Wasserstein distance and perceptual similarity. The Wasserstein distance is a key concept of the optimal transform theory, and promises to improve the performance of the GAN.
when-are-diffusion-priors-helpful-in-sparse-reconstruction-a: >-
  Diffusion models demonstrate state-of-the-art performance on image generation, and are gaining traction for sparse medical image reconstruction tasks. We make comparisons on low-dose chest wall computed tomography (CT) for fat mass quantification.
x-gaussian: >-
  In this paper, we propose a 3D Gaussian splatting-based framework, namely X-Gaussian, for X-ray novel view synthesis. Based on this model, we develop a Differentiable Radiative Rasterization (DRR) with CUDA implementation. The application on sparse-view CT reconstruction also reveals the practical values of our method.
x-grm-large-gaussian-reconstruction-model-for-sparse-view-x-: >-
  Computed Tomography serves as an indispensable tool in clinical workflows, providing non-invasive visualization of internal anatomical structures. In this work, we present X-GRM (X-ray Gaussian Reconstruction Model), a large feedforward model for reconstructing 3D CT volumes from sparse-view 2D X-ray projections.
xden-1k: >-
  A deep understanding of the physical world is essential for robotic manipulation and physically realistic simulation. To address this gap, we introduce XDen-1K, the first large-scale multimodal dataset that provides physically grounded density field for real-world objects.
zero-shot-ct-super-resolution-using-diffusion-based-2d-proje: >-
  Computed tomography (CT) is important in clinical diagnosis, but acquiring high-resolution (HR) CT is constrained by radiation exposure risks. To overcome these limitations, we propose a novel zero-shot 3D CT SR framework that integrates diffusion-based upsampled 2D projection priors into the 3D reconstruction process.
zero-shot-low-dose-ct-denoising-via-sinogram-flicking: >-
  In this paper, we propose a zero-shot low-dose CT imaging method based on sinogram flicking, which operates within a single image but generates many copies via random conjugate ray matching. A simulation study demonstrates that our method outperforms state-of-the-art approaches such as ZS-N2N.
