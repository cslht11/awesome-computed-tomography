limited-angle-spect-image-reconstruction-using-deep-image-pr: >-
  We propose a LA SPECT image reconstruction method that uses an end-to-end deep image prior (DIP) framework to improve reconstructed image quality. The proposed method was evaluated using 20 numerical phantoms and clinical patient data.
lingo: >-
