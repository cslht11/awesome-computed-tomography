indudonet: >-
  Against these issues, we propose a novel interpretable dual domain network, termed as InDuDoNet, which combines the advantages of model-driven and data-driven methodologies. Extensive experiments on synthesized and clinical data show the superiority of our InDuDoNet.
inr-joint: >-
  Computed Tomography (CT) is pivotal in industrial quality control and medical diagnostics. Recognizing that CT often involves scanning similar subjects, we propose a novel approach to improve reconstruction quality through joint reconstruction of multiple objects using INRs.
insideout-integrated-rgb-radiative-gaussian-splatting-for-co: >-
  We introduce InsideOut, an extension of 3D Gaussian splatting (3DGS) that bridges the gap between high-fidelity RGB surface details and subsurface X-ray structures. The fusion of RGB and X-ray imaging is invaluable in fields such as medical diagnostics, cultural heritage restoration, and manufacturing.
integration-of-spectral-ct-with-pet-and-spect-bringing-tissu: >-
