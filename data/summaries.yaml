# One-paragraph "what is this paper" blurbs, keyed by paper id.
# Generated by scripts/oneoff/fetch_summaries.py (+ a by-title second
# pass) from the arXiv and Crossref APIs. Every blurb is built from
# **verbatim sentences** of the official abstract, so it can be
# incomplete but never invented. Safe to hand-edit.

2-step-sparse-view-ct-reconstruction-with-a-domain-specifi: >-
  We present a novel framework for sparse-view tomography by decoupling the reconstruction into two steps: First, we overcome its ill-posedness using a super-resolution network, SIN, trained on the sparse projections.
3d-cbct-artefact-removal-using-perpendicular-score-based-dif: >-
  To address this, we propose a 3D dental implant inpainting approach based on perpendicular score-based diffusion models, each trained in two different planes and operating in the projection domain.
3d-field-of-junctions: >-
  Inspired by the strong 2D image denoising properties of Field of Junctions (ICCV 2021), we propose a novel, fully volumetric 3D Field of Junctions (3D FoJ) representation that optimizes a junction of 3D wedges that best explain each 3D patch of a full volume, while encouraging consistency between overlapping patches.
3dip: >-
  In essence, we propose to augment the 2D diffusion prior with a model-based prior in the remaining direction at test time, such that one can achieve coherent reconstructions across all dimensions.
4dcbct-prior: >-
  To develop a technique to estimate onboard 4D-CBCT using prior information and limited-angle projections for potential 4D target verification of lung radiotherapy. Each phase of onboard 4D-CBCT is considered as a deformation from one selected phase (prior volume) of the planning 4D-CT.
4dgs-4dcbct: >-
  This paper introduces a novel framework leveraging spatiotemporal Gaussian representation for 4D-CBCT reconstruction from sparse projections, achieving a balance between streak artifact reduction, dynamic motion preservation, and fine detail restoration.
a-ct-geometry-with-multiple-centers-of-rotation-for-solving-: >-
  With the emergence of CNT (Carbon nanotube), static and instant CT scanning becomes possible. By transforming the traditionally rotated thermal source into a static ring array source composed of multiple CNTs, the imaging system can achieve high temporal resolution in scanning.
a-learnt-half-quadratic-splitting-based-algorithm-for-fast-a: >-
  In this work, we propose a half-quadratic splitting-based algorithm that uses convolutional neural networks (CNN) in order to obtain high-quality reconstructions from large sparse-view cone-beam CT (CBCT) measurements while overcoming the challenges with typical approaches.
a-review-on-deep-learning-in-medical-image-reconstruction: >-
  Medical imaging is crucial in modern clinics to guide the diagnosis and treatment of diseases. Mathematical models in medical image reconstruction or, more generally, image restoration in computer vision, have been playing a prominent role.
accelerated-optimization-of-implicit-neural-representations-: >-
  An INR represents a CT image as a small-scale neural network that takes spatial coordinates as inputs and outputs attenuation values. In particular, we propose two approaches: (1) using a modified loss function with improved conditioning, and (2) an algorithm based on the alternating direction method of multipliers.
acdnet: >-
  Against this issue, we propose an adaptive convolutional dictionary network (ACDNet), which leverages both model-based and learning-based methods. Hence, our method inherits the clear interpretability of model-based methods and maintains the powerful representation ability of learning-based methods.
active-view-selection-with-perturbed-gaussian-ensemble-for-t: >-
  In this paper, we present Perturbed Gaussian Ensemble, an active view selection framework that integrates uncertainty modeling with sequential decision-making, tailored for X-ray Gaussian Splatting.
adaptive-diffusion-models-for-sparse-view-motion-corrected-h: >-
  In this work, we propose a novel framework combining joint reconstruction and motion estimation (JRM) with an adaptive diffusion model (ADM) that simultaneously addresses motion compensation and sparse-view reconstruction in head CBCT.
admm-net-la: >-
  In the real applications of computed tomography (CT) imaging, the projection data of the scanned objects are usually acquired within a limited-angle range because of the limitation of the scanning condition. Moreover, in some cases, the quality of reconstructed images is less than satisfactory.
advancing-limited-angle-ct-reconstruction-through-diffusion-: >-
  Limited Angle Computed Tomography (LACT) often faces significant challenges due to missing angular information. Unlike previous methods that operate in the image domain, we propose a new method that focuses on sinogram inpainting.
airnet: >-
  Sparse-data computed tomography (CT) frequently occurs, such as breast tomosynthesis, C-arm CT, on-board four-dimensional cone-beam CT (4D CBCT), and industrial CT. However, sparse-data image reconstruction remains challenging due to highly undersampled data.
alpd: >-
  Therefore, it is imperative to develop unsupervised learning protocols that are competitive with supervised approaches in performance. Motivated by the maximum-likelihood principle, we propose an unsupervised learning framework for solving ill-posed inverse problems.
an-iterative-reconstruction-method-for-dental-cone-beam-comp: >-
  In dental cone-beam computed tomography (CBCT), compact and cost-effective system designs often use small detectors, resulting in a truncated field of view (FOV) that does not fully encompass the patient's head. In this study, we propose a two-stage approach to mitigate truncation artifacts in dental CBCT.
anatomy-preserving-unpaired-cone-beam-ct-refinement-for-imag: >-
  Paired CBCT and CT data are difficult to obtain clinically because of motion, anatomical changes, and acquisition mismatch. We present RefineCBCT, an unpaired CBCT refinement framework that uses pseudo-label guidance and short-step diffusion to reduce artifacts while preserving patient-specific anatomy.
arm-cbct: >-
  Using our approach together with a cyclic registration algorithm yields a combination which shows almost no sensitivity to sparse-view artifacts and thus ensures both high spatial and high temporal resolution.
ascon: >-
  In this paper, we propose a novel Anatomy-aware Supervised CONtrastive learning framework, termed ASCON, which can explore the anatomical semantics for low-dose CT denoising while providing anatomical interpretability.
at-fulltilt: >-
  To overcome this, we propose FullTilt, an end-to-end framework that redefines 3D detection by operating directly on aligned 2D tilt-series. To process the entire tilt-series simultaneously, we introduce a tilt-series encoder to efficiently fuse cross-view information.
autodiff-ct-workflows-2024: >-
  Through four case studies, we demonstrate that auto-differentiation is remarkably effective beyond the boundaries of neural-network training, extending to CT workflows containing varied combinations of classical and machine learning algorithms.
automap: >-
  We present here a unified framework for image reconstruction, AUtomated TransfOrm by Manifold APproximation (AUTOMAP), which recasts image reconstruction as a data-driven, supervised learning task that allows a mapping between sensor and image domain to emerge from an appropriate corpus of training data.
baggagect: >-
  Our approach integrates multi-spectral neural attenuation field reconstruction with Linear pushbroom (LPB) camera model pose optimization, enhancing rendering consistency for novel views through color coding network.
balancing-efficiency-and-restoration-lightweight-mamba-based: >-
  Addressing these issues, we introduce MARMamba, which effectively eliminates artifacts caused by metals of different sizes while maintaining the integrity of the original anatomical structures of the image.
bergner-2010: >-
  To evaluate several algorithms for 4D cone-beam computed tomography (4D CBCT) with slow rotating devices. 4D CBCT is used to perform phase-correlated (PC) reconstructions of moving objects, such as breathing patients, for example. Fast, iterative approaches such as the MKB can therefore be seen as a suitable tradeoff.
bigger-isn-t-always-better-towards-a-general-prior-for-medic: >-
  Diffusion model have been successfully applied to many inverse problems, including MRI and CT reconstruction. Using two different posterior sampling algorithms, we show empirically that such large networks are not necessary.
cadl: >-
  To characterize the noise and spatial resolution properties of a commercially available deep learning-based computed tomography (CT) reconstruction algorithm. Two phantom experiments were performed. All measurements were compared among the algorithms.
cascaded-diffusion-discrepancy-2025: >-
  Sparse-view Computed Tomography (CT) image reconstruction is a promising approach to reduce radiation exposure, but it inevitably leads to image degradation. The cascaded framework minimizes computational costs by moving some inference steps from pixel space to latent space.
cbct-based-synthetic-ct-generation-using-conditional-flow-ma: >-
  Daily or weekly cone-beam computed tomography (CBCT) is employed in image-guided radiotherapy (IGRT) for precise patient alignment. However, its clinical utility in quantitative tasks is hindered by severe artifacts and inaccurate Hounsfeld unit (HU).
cbct-pose-trajectory-optimisation: >-
  Trajectory optimisation for cone-beam computed tomography (CT) determines which information sparse-view scans acquire. Fixed candidate pools prevent off-grid refinement and require new object-specific precomputation for each acquisition manifold.
cg-glore-a-conjugate-gradient-based-global-local-regularizat: >-
  We propose \textbf{CG-GLORE}, a compact deep unrolling framework inspired by second-order optimization for sparse-view CT reconstruction. Thus, the method is second-order-inspired rather than an exact Newton method for the full learned objective.
cnn-inverse: >-
  In this paper, we propose a novel deep convolutional neural network (CNN)-based algorithm for solving ill-posed inverse problems. Based on this observation, we propose using direct inversion followed by a CNN to solve normal-convolutional inverse problems.
coco-pnp: >-
  To address these challenges, we propose a cocoercive conservative (CoCo) denoiser, which may be (residual) expansive, leading to improved denoising. Extensive experimental results demonstrate that our approach outperforms closely related methods in both visual quality and quantitative metrics.
complex-wavelet-based-sinogram-segmentation-for-metal-artifa: >-
  Metal objects pose a significant challenge in cone-beam computed tomography, as their strong and energy-dependent X-ray attenuation leads to inconsistent projections and severe streaking and shading artifacts in reconstructed images.
compressed-sensing-2006: >-
  The field of compressed sensing has shown that a sparse but otherwise arbitrary vector can be recovered exactly from a small number of randomly constructed linear projections (or samples). It is shown that in certain cases (e.g. discrete valued vectors or large distortions) the number of samples can be decreased.
computed-tomography-reconstruction-algorithm-using-markov-ra: >-
  X-ray computed tomography (CT) reveals the materials' internal structures non-destructively from a tilt series of projected images. Filtered back projection (FBP) is a widely-adopted reconstruction algorithm in CT owing to its small computational cost.
conditional-diffusion-for-3d-ct-volume-reconstruction-from-2: >-
  Standard chest X-rays are cost-effective and widely accessible, but provide only 2D projections with limited pathological information. We propose AXON, a multi-stage diffusion-based framework that reconstructs 3D CT volumes directly from real X-rays with substantially improved fidelity over existing approaches.
conditional-diffusion-posterior-alignment-for-sparse-view-ct: >-
  We propose Conditional Diffusion Posterior Alignment (CDPA) to enable scalable 3D sparse-view CT reconstruction. Finally, we show that the same principles also strengthen fast denoising U-Nets, yielding near-diffusion quality at a fraction of the computational cost.
cone-beam-artifact-reduction-in-gamma-knife-cbct-images-usin: >-
  Gamma Knife cone-beam computed tomography (CBCT) images suffer from distinct cone-beam artifacts for some patients, due to the conical X-ray beam which is oriented to intersect the detector perpendicularly at its inferior edge. Approach. Main results. Significance.
cone-beam-ct-image-quality-enhancement-using-a-latent-diffus: >-
  In this study, we propose an overcorrection-free CBCT image quality enhancement method based on a conditional latent diffusion model using pseudo-CBCT images. Pseudo-CBCT images are created from CT images using a simple method that simulates CBCT artifacts and are spatially consistent with the CT images.
continuity-driven-synergistic-diffusion-with-neural-priors-f: >-
  The clinical application of cone-beam computed tomography (CBCT) is constrained by the inherent trade-off between radiation exposure and image quality. To address these challenges, we propose a Continuity-driven Synergistic Diffusion with Neural priors (CSDN) for ultra-sparse-view CBCT reconstruction.
coord-sos-pact: >-
  In this work, we introduce an efficient, self-supervised joint reconstruction method that recovers SOS and high-quality images for ring array PACT systems. Our method removes SOS aberrations more accurately and 35x faster than the current SOTA.
cross-distribution-diffusion-priors-driven-iterative-reconst: >-
  In this work, we propose a Cross-Distribution Diffusion Priors-Driven Iterative Reconstruction (CDPIR) framework to tackle the OOD problem in SVCT. CDPIR integrates cross-distribution diffusion priors, derived from a Scalable Interpolant Transformer (SiT), with model-based iterative reconstruction methods.
cross-modal-guidance-for-fast-diffusion-based-computed-tomog: >-
  Diffusion models have emerged as powerful priors for solving inverse problems in computed tomography (CT). In this work, we propose incorporating an additional modality without retraining the diffusion prior, enabling accelerated imaging of costly modalities.
cs-cbct-fom: >-
  This article considers the problem of reconstructing cone-beam computed tomography (CBCT) images from a set of undersampled and potentially noisy projection measurements. The performance of the proposed algorithm is demonstrated through a series of digital and experimental phantom studies.
csc-ct: >-
  Over the past few years, dictionary learning (DL)-based methods have been successfully used in various image reconstruction problems. However, traditional DL-based computed tomography (CT) reconstruction methods are patch-based and ignore the consistency of pixels in overlapped patches.
ctformer: >-
  Low-dose computed tomography (LDCT) denoising is an important problem in CT research. Compared to the normal dose CT, LDCT images are subjected to severe noise and artifacts. Approach . In this paper, we propose a Convolution-free Token2Token Dilated Vision Transformer (CTformer) for LDCT denoising. Main results .
ctnet: >-
  In this paper, we propose to address this problem through implicit sinogram completion, on a challenging real world dataset containing scans of common checked-in luggage. We show with extensive experimentation that this combined strategy outperforms many competitive baselines.
cvg-diff: >-
  While deep-learning-based methods enable single-step artifact suppression, they often produce over-smoothed results under significant sparsity. To tackle these concerns, we present the Cross-view Generalized Diffusion Model (CvG-Diff), which reformulates sparse-view CT reconstruction as a generalized diffusion process.
dadn: >-
  Deep learning (DL)-based methods have played an increasingly important role in the field of LDCT imaging. Based on this, we propose a novel domain-adaptive denoising network (DADN) via noise estimation and transfer learning to resolve the out-of-distribution problem in LDCT imaging.
data-driven-filter-design-in-fbp-transforming-ct-reconstru: >-
  In this study, we introduce a Fourier series-based trainable filter for computed tomography (CT) reconstruction within the filtered backprojection (FBP) framework. Code and data are available at https://github.com/sypsyp97/Trainable-Fourier-Series.
data-efficient-limited-angle-ct-using-deep-priors-and-regula: >-
  We propose a very low-data approach to reconstruct the original image from its Radon transform under severe angle limitations. Our method is evaluated on a dataset from the Helsinki Tomography Challenge 2022, where the goal is to reconstruct a binary disk from its limited-angle sinogram.
datadriven: >-
  Recent research in inverse problems seeks to develop a mathematically coherent foundation for combining data-driven models, and in particular those based on deep learning, with domain-specific knowledge contained in physical-analytical models.
dc-pnpdp: >-
  To resolve this, we propose Dual-Coupled PnP Diffusion (DC-PnPDP), which restores the classical dual variable to provide integral feedback, progressively enforce agreement between the data-consistency and prior.
dddm: >-
  <p> A new deep-learning approach, dual-domain diffu?sion model (DDDM), is proposed for sparse-view CT reconstruc?tion, which is composed of a sinogram upgrading module (SUM) and an image refining module (IRM) connected in series. We release our code at: https://github.com/YC-Markus/code-for-DDDM. </p>
deep-pseudo-proximal-map: >-
  To address this, we propose the pseudo-proximal map (PPM), a reformulation of the data-fitting proximal map as the minimum mean square error estimate of a synthetic probabilistic model.
deepcnn: >-
  To address these issues, we propose an algorithm using a deep convolutional neural network (CNN), which is applied to wavelet transform coefficients of low-dose CT images. In addition, we show that wavelet domain CNN is efficient in removing the noises from low-dose CT compared to an image domain CNN.
deepsparse: >-
  To overcome these limitations, we propose DeepSparse, the first foundation model for sparse-view CBCT reconstruction, featuring DiCE (Dual-Dimensional Cross-Scale Embedding), a novel network that integrates multi-view 2D features and multi-scale 3D features.
deer: >-
  Since breast is sensitive to x-ray radiation, dose reduction of breast CT is an important topic, and for this purpose, few-view scanning is a main approach. In this article, we propose a Deep Efficient End-to-end Reconstruction (DEER) network for few-view breast CT image reconstruction.
denomamba: >-
  For high-quality restoration of LDCT images, here we introduce DenoMamba, a novel denoising method based on state-space modeling (SSM), that efficiently captures short- and long-range context in medical images.
dfdlm: >-
  Low-dose CT (LDCT) imaging attracted a considerable interest for the reduction of the object's exposure to X-ray radiation. However, the challenge on collecting many such pairs in the clinical setup limits the application of such supervised-learning-based methods for LDCT image reconstruction in practice.
dgr: >-
  In this work, we propose Discretized Gaussian Representation (DGR), a novel framework that reconstructs the 3D volume directly using a set of discretized Gaussian functions in an end-to-end manner.
dgr-2: >-
  Our method exploits such an approach that deep convolutional neural networks (CNNs) generate patterns easier than the noise, therefore randomly initialized generative neural networks can be suitable priors to be used in regularizing the reconstruction.
dif-gaussian: >-
  To this end, we propose a novel reconstruction framework, namely DIF-Gaussian, which leverages 3D Gaussians to represent the feature distribution in the 3D space, offering additional 3D spatial information to facilitate the estimation of attenuation coefficients.
diffmed: >-
  Specifically, we introduce the solid theoretical foundation and fundamental concepts behind diffusion models and the three generic diffusion modelling frameworks: diffusion probabilistic models, noise-conditioned score networks, and stochastic differential equations.
diffnaf: >-
  Multi-source stationary computed tomography (CT) has recently attracted attention for its ability to achieve rapid image reconstruction, making it suitable for time-sensitive clinical and industrial applications. Diff-NAF combines a Neural Attenuation Field representation with a dual-branch conditional diffusion model.
diffnr-diffusion-enhanced-neural-representation-optimization: >-
  Neural representations (NRs), such as neural fields and 3D Gaussians, effectively model volumetric data in computed tomography (CT) but suffer from severe artifacts under sparse-view settings. To address this, we propose DiffNR, a novel framework that enhances NR optimization with diffusion priors.
diffraction-neural-volumetric-prior: >-
  In this work, we develop Neural Volumetric Prior (NVP) for high-fidelity volumetric reconstruction of semi-transparent biological samples from sparse-view microscopic images. NVP integrates explicit and implicit neural representations and incorporates the physical prior of diffractive optics.
diffrecon: >-
  Better algorithms for medical image reconstruction can improve image quality and enable reductions in acquisition time and radiation dose. A prior understanding of the distribution of plausible images is key to realising these benefits.
diffusion-based-limited-angle-ct-reconstruction-under-noisy-: >-
  To improve robustness under realistic noise, we propose RNSD$^+$, a novel noise-aware rectification mechanism that explicitly models inference-time uncertainty, enabling reliable and robust reconstruction.
digs-dynamic-cbct-reconstruction-using-deformation-informed-: >-
  To address these limitations, we introduce a free-form deformation (FFD)-based spatial basis function and a deformation-informed framework that enforces consistency by coupling the temporal evolution of Gaussian's mean position, scale, and rotation under a unified deformation field.
dinr: >-
  In this paper, we present a diffusive computed tomography (CT) inversion framework for regularizing INRs called Diffusive INR (DINR), designed to enable high-quality reconstruction from sparse-view neutron CT.
dip: >-
  In this paper we describe an investigation into the application of deep learning methods for low-dose and sparse angle computed tomography using small training datasets. To overcome these problems, we introduce the deep image prior approach in combination with classical regularization and an initial reconstruction.
dip-warm-start-2022: >-
  Deep image prior (DIP) was recently introduced as an effective unsupervised approach for image restoration tasks. DIP represents the image to be recovered as the output of a deep convolutional neural network, and learns the network's parameters such that the output matches the corrupted observation.
dl-invprob: >-
  Recent work in machine learning shows that deep neural networks can be used to solve a wide variety of inverse problems arising in computational imaging. We explore the central prevailing themes of this emerging area and present a taxonomy that can be used to categorize different problems and reconstruction methods.
dl-piccs: >-
  Sparse-view CT image reconstruction problems encountered in dynamic CT acquisitions are technically challenging. Recently, many deep learning strategies have been proposed to reconstruct CT images from sparse-view angle acquisitions showing promising results.
dm4ct: >-
  To systematically evaluate how diffusion models perform in this context and compare them with established reconstruction methods, we introduce DM4CT, a comprehensive benchmark for CT reconstruction.
dnnss: >-
  In this work, we introduce a deep-neural-network-enabled sinogram synthesis method for sparse-view CT, and show its outperformance to the existing interpolation methods and also to the iterative image reconstruction approach.
dolce-2023: >-
  We present DOLCE, a new deep model-based framework for LACT that uses a conditional diffusion model as an image prior. We show through extensive experimentation on several challenging real LACT datasets that, the same pre-trained DOLCE model achieves the SOTA performance on drastically different types of images.
dose-aware-cold-diffusion-with-physics-consistency-for-gener: >-
  To address these limitations, we propose Dose-Aware Cold Diffusion (DACD), a physics-consistent reconstruction framework that explicitly models radiation dose as a continuous latent factor within a cold diffusion process.
du-gan: >-
  To better regularize the LDCT denoising model, this paper proposes a novel method, termed DU-GAN, which leverages U-Net based discriminators in the GANs framework to learn both global and local difference between the denoised and normal-dose images in both image and gradient domains.
dual-domain-u-nets-with-embedded-back-projection-operators-f: >-
  We propose a deep learning method for motion-resolved 4D CBCT reconstruction from conventional free-breathing scans, without a respiratory signal or explicit projection binning. Experts preferred our method for tumor visibility (59% vs.
dudodp-mar: >-
  In this paper, we propose an unsupervised MAR method based on the diffusion model, a generative model with a high capacity to represent data distributions. Moreover, our method demonstrates superior visual results compared to both supervised and unsupervised methods on clinical datasets.
dvg-diffusion-dual-view-guided-diffusion-model-for-ct-recons: >-
  Specifically, we propose a dual-view guided diffusion model (DVG-Diffusion), which couples a real input X-ray view and a synthesized new X-ray view to jointly guide CT reconstruction. Experimental results demonstrate our method outperforms state-of-the-art methods.
dynamic-black-hole-emission-tomography: >-
  To overcome the restrictive assumptions of BH-NeRF, we propose PI-DEF, a physics-informed approach that uses differentiable neural rendering to fit a 4D (time + 3D) emissivity field given EHT measurements.
eagle-an-edge-aware-gradient-localization-enhanced-loss-fo: >-
  To address these limitations, we propose Eagle-Loss, a novel loss function designed to enhance the visual quality of CT image reconstructions. Our results show that Eagle-Loss consistently improves the visual quality of reconstructed images, surpassing state-of-the-art methods across various network architectures.
easel: >-
  Dose reduction in computed tomography (CT) is essential for decreasing radiation risk in clinical applications. Iterative reconstruction is one of the most promising ways to compensate for the increased noise due to reduction of photon flux.
edcnn: >-
  In this paper, we propose the Edge enhancement based Densely connected Convolutional Neural Network (EDCNN). In our network, we design an edge enhancement module using the proposed novel trainable Sobel convolution.
efficient-unrolled-networks: >-
  In this work, we present a domain partitioning strategy and normal operator approximations that enable the training of end-to-end reconstruction models incorporating forward operators of arbitrarily large problems into their architecture.
end-to-end-deep-learning-for-interior-tomography-with-low-do: >-
  Main results: We demonstrate that the proposed method outperforms the conventional image-domain deep learning methods, and a projection-domain CNN shows better performance than the image-domain CNNs which are commonly used by many researchers.
enhancing-synthetic-ct-from-cbct-via-multimodal-fusion-and-e: >-
  Cone-Beam Computed Tomography (CBCT) is widely used for intraoperative imaging due to its rapid acquisition and low radiation dose. To overcome the inherent misalignment between modalities, we introduce an end-to-end learnable registration module within the sCT pipeline.
epi-naf: >-
  We present a novel loss term based on consistency conditions between corresponding epipolar lines in X-ray projection images, aimed at regularizing neural attenuation field optimization. This loss results in both qualitative and quantitative improvements in reconstruction compared to baseline methods.
equivariance2inverse-a-practical-self-supervised-ct-reconstr: >-
  Deep learning has shown impressive results in reducing noise and artifacts in X-ray computed tomography (CT) reconstruction. Self-supervised CT reconstruction methods are especially appealing for real-world applications because they require no ground truth training examples.
equivariant-conditional-diffusion-model-for-head-and-neck-ct: >-
  Cone-beam computed tomography CBCT is a commonly used modality for image guided radiotherapy. It offers real time anatomical visualization with low acquisition cost and dose. We propose a novel diffusion based conditional generative model, coined EqDiff-CT, to synthesize high quality CT images from CBCT.
equivariant-multiscale-learned-invertible-reconstruction-for: >-
  In this work we propose LIRE++, an end-to-end rotationally-equivariant multiscale learned invertible primal-dual scheme for fast and memory-efficient CBCT reconstruction. LIRE++ was trained on simulated projection data from a fast quasi-Monte Carlo CBCT projection simulator that we developed as well.
extreme-few-view-ct-reconstruction-using-deep-inference: >-
  This paper presents a deep network-driven approach to address extreme few-view CT by incorporating convolutional neural network-based inference into state-of-the-art iterative reconstruction. We demonstrate effectiveness of the proposed approach by performing reconstruction experiments on a chest CT dataset.
fact-gs-fast-and-scalable-ct-reconstruction-with-gaussian-sp: >-
  Gaussian Splatting (GS) has emerged as a dominating technique for image rendering and has quickly been adapted for the X-ray Computed Tomography (CT) reconstruction task. FaCT-GS is over 4X faster than the State of the Art GS CT reconstruction on standard 512x512 projections, and over 13X faster on 2k projections.
fast-ct-limited-projections-2023: >-
  Due to the merit of establishing volumetric data, X-ray computed tomography (XCT) is increasingly used as a non-destructive evaluation technique in the quality control of advanced manufactured parts with complex non-line-of-sight features. It also enables a reduction of data size proportionally.
fdm: >-
  Recently, many deep learning-based networks have achieved desirable performances compared to iterative reconstruction algorithms. We propose a single degradation-aware deep learning framework to predict clear CT images by understanding the disparity of degradation in both the frequency domain and image domain.
field-of-view-extension-in-dental-cone-beam-ct-via-implicit-: >-
  Dental cone-beam computed tomography (CBCT) systems often employ detector configurations that provide a truncated field of view (FOV) that only captures a small part of the patient's anatomy. In this work, we aim to reconstruct an extended FOV using projections of truncated FOV scans.
find-net-fourier-integrated-network-with-dictionary-kernels-: >-
  To address this challenge, we propose FIND-Net (Fourier-Integrated Network with Dictionary Kernels), a novel MAR framework that integrates frequency and spatial domain processing to achieve superior artifact suppression and structural preservation.
fista-net: >-
  In this paper, we propose a model-based deep learning network, named FISTA-Net, by combining the merits of interpretability and generality of the model-based Fast Iterative Shrinkage/Thresholding Algorithm (FISTA) and strong regularization and tuning-free advantages of the data-driven neural network.
foundation-vae: >-
  Variational autoencoders (VAEs) compress high resolution CT volumes into compact latents while preserving clinically relevant structure. These results demonstrate Foundation VAEs as a practical interface for scalable CT representation reuse and faithful CT generation.
freeseed: >-
  Sparse-view computed tomography (CT) is a promising solution for expediting the scanning process and mitigating radiation exposure to patients, the reconstructed images, however, contain severe streak artifacts, compromising subsequent screening and diagnosis.
from-sparse-x-rays-to-3d-ct-training-free-reconstruction-wit: >-
  To break this dependency, we present TF-PRDiT: a training-free conditional sampling framework that converts a frozen voxel-level 3D Diffusion Transformer prior into a versatile inverse medical problem solver.
ganext-a-fully-convnext-enhanced-generative-adversarial-netw: >-
  In this work, we propose GANeXt, a 3D patch-based, fully ConvNeXt-powered generative adversarial network for unified CT synthesis across different modalities and anatomical regions.
gao-2012: >-
  On-board 4D cone beam CT (4DCBCT) offers respiratory phase-resolved volumetric imaging, and improves the accuracy of target localization in image guided radiation therapy. The STF-based algorithm is implemented on a GPU platform for improved computational efficiency.
gaussian-material-fields: >-
  We introduce Gaussian material fields, which represent multiple material distributions with shared anisotropic 3D Gaussian primitives and independent nonnegative material coefficients. These results establish Gaussian material fields as an explicit, adaptive representation for volumetric multi-material reconstruction.
gb-svfbp-gaussian-based-shift-variant-fbp-neural-network: >-
  This paper proposes a Gaussian-Based Shift-Variant filtered backprojection (FBP) neural network, which is designed for the efficient reconstruction of non-circular trajectory cone beam computed tomography.
generative-modeling-in-sinogram-domain-for-sparse-view-ct-: >-
  To relieve this limitation, we present a fully unsupervised score-based generative model in sinogram domain for sparse-view CT reconstruction. Experimental results demonstrated that our method achieved comparable or better performance than the supervised learning counterparts.
geometry-aware-diffusion-approximate-posterior-sampling-for-: >-
  Sparse-view computed tomography (CT) reduces radiation dose and acquisition time and may mitigate motion artifacts. We propose a geometry-aware diffusion-guided stochastic reconstruction framework for sparse-view and limited-angle CT.
gglf: >-
  Incorporating computed tomography (CT) reconstruction operators into differentiable pipelines has proven beneficial in many applications. Such approaches usually focus on the projection data and keep the acquisition geometry fixed. Approach. Main results. Significance.
glfc-unified-global-local-feature-and-contrast-learning-with: >-
  In this work, we propose a Global-Local Feature and Contrast learning (GLFC) framework for sCT generation. Second, we propose a Multiple Contrast Loss (MCL) that calculates synthetic loss at different intensity windows to improve quality for both soft tissues and bone regions.
h3d-marnet-wavelet-guided-dual-path-learning-for-metal-artif: >-
