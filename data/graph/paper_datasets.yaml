# Verified paper -> dataset usage, for the knowledge graph (scripts/graph.py).
#
# HAND-VERIFIED, one paper at a time, against the paper's own experiments
# section (arXiv / publisher / PMC full text; a code README alone never
# suffices). An entry exists only where the paper actually USES the dataset
# in its experiments; `usage` says how (train / eval / both), and `evidence`
# records the section and the sentence that establishes the use. Papers
# checked with no library-dataset use are NOT listed here — the per-batch
# audit logs live in the maintainer's research notes.
#
# This file is authoritative for the pairs it covers: it supersedes the
# resource-page derivation in scripts/graph.py for those pairs.
# Dataset values are exact `name`s from data/datasets.yaml.

- paper: cnn-inverse
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "IV-A Data Preparation (with IV-B Training Procedure: 475 training / 25 test images for the synthetic datasets, test from a different subject) — “The biomedical dataset is a synthetic dataset that comprises 500 real in-vivo CT images from the Low-dose Grand challenge competition from database made by the Mayo clinic.”"

- paper: red-cnn
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "III-A-2) Clinical Data — “a real clinical database was used, which was authorized by Mayo Clinics for “the 2016 NIH-AAPM-Mayo Clinic Low Dose CT Grand Challenge”.”"

- paper: lpd
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "Experiments, 'b) Human phantoms' (data description, Fig. 1) — “human abdomen CT scans as provided by Mayo Clinic for the AAPM Low Dose CT Grand Challenge”"

- paper: deepcnn
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "III.4 Data Set — “In the 2016 CT low-dose Grand Challenge, only abdominal CT images were provided as the training data set”"

- paper: wgan-vgg
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "III-A Experimental Datasets — “We used a real clinical dataset authorized for “the 2016 NIH-AAPM-Mayo Clinic Low Dose CT Grand Challenge” by Mayo Clinic for the training and evaluation of the proposed networks”"

- paper: learn
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "III. Experimental Design and Representative Results — “a set of clinical data and images was used, which was established and authorized by Mayo Clinics for “the 2016 NIH-AAPM-Mayo Clinic Low Dose CT Grand Challenge”.”"

- paper: tfu-net
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "IV-A Data Set — “As a training data, we used ten patient data provided by AAPM Low Dose CT Grand Challenge”"

- paper: cnn-mar
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "II-A. Generating Metal-free and Metal-inserted Images — “clinical CT images are collected from online resources and “the 2016 Low-dose CT Grand Challenge” training dataset”"

- paper: dudonet
  uses:
    - dataset: DeepLesion
      usage: both
      evidence: "4. Experimental Results — Metal Artifact Dataset — “Due to its high diversity and quality, we use a subset of images from DeepLesion to synthesize metal artifact.”"

- paper: map-nn
  uses:
    - dataset: LDCT-and-Projection-data
      usage: train
      evidence: "Methods — Training dataset for MAP-NN — “The training dataset we used is an authorized clinical low-dose CT dataset, which was used for the 2016 NIH-AAPM-Mayo Clinic Low-Dose CT Grand Challenge.”"

- paper: cnnrpgd
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "V-A. Dataset — “Our dataset consists of clinically realistic invivo (512 × 512) CT scans of human abdomen from Mayo clinic for the AAPM Low Dose CT Grand Challenge”"

- paper: wavresnet
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "III-C. Training dataset — “We used projection data obtained from “2016 Low-Dose CT Grand Challenge.””"

- paper: ksae
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "Section III.A Datasets — “The experiments were carried on 2016 Low-dose CT Grand Challenge datasets, which contained projection and image data of the chest and abdomen from 10 different patients.”"

- paper: cpce
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "Section IV.A Low-dose dataset with simulated noise — “The experimental data set stems from an authorized clinical low-dose CT dataset, which was made for the 2016 NIH-AAPM-Mayo Clinic Low-Dose CT Grand Challenge”"

- paper: dlct
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "Section 2.5 Experiments — “We perform a tenfold cross validation on 2378 slices of ten different patients.” Identity: the acknowledgements credit McCollough, Mayo Clinic and AAPM (grants EB017095/EB017185) for providing the data; 2,378 slices / 10 patients is the documented composition of the 2016 Low-Dose CT Grand Challenge release."

- paper: adn
  uses:
    - dataset: DeepLesion
      usage: both
      evidence: "Section IV-B Datasets — “For SYN, we randomly select 4,118 artifact-free CT images from DeepLesion [27] and follow the method from CNNMAR [4] to synthesize metal artifacts.”"

- paper: magic
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "Section 3 Experiments and results — “To evaluate the performance of our MAGIC, the dataset “the 2016 NIH-AAPM-Mayo Clinic Low-Dose CT Grand Challenge” [50] was used in our experiments.”"

- paper: naf
  uses:
    - dataset: LIDC-IDRI
      usage: both
      evidence: "3.1 Experimental settings (Data) — “The chest data are from LIDC-IDRI dataset [4], and the rest are from Open Scientific Visualization Datasets [12].” The model is trained on TIGRE-generated projections from these volumes and evaluated against the raw volumetric CT data."

- paper: 3dip
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "4 Experimental setup — Dataset — “For both CT reconstruction tasks (i.e. SV-CT, LA-CT) we use the data from the AAPM 2016 CT low-dose grand challenge.” All volumes but one train the 2D score function and one volume is held out for testing (Appendix B.1)."

- paper: intratomo
  uses:
    - dataset: LoDoPaB-CT
      usage: both
      evidence: "4.2 Applications — Limited angle tomography (Fig. 5, Table 1) — “for SL, LoDoPaB-CT data [43], Pepper, and Rose dataset, the iterative approaches (SART and TV) outperform the analytical solution (FBP), while the deep prior achieves the best performance among all baselines.” Self-supervised: trained on the object's own limited-angle projections and scored against ground truth, hence both."

- paper: x2ct-gan
  uses:
    - dataset: LIDC-IDRI
      usage: both
      evidence: "5.1 Datasets — “we use the publicly available LIDC-IDRI dataset [1], which contains 1,018 chest CT scans” and “We randomly select 916 CT scans for training and the rest 102 CT scans are used for testing.” The paired X-rays are DRRs synthesized from these volumes."

- paper: dip
  uses:
    - dataset: LoDoPaB-CT
      usage: both
      evidence: "6.1 The LoDoPaB-CT Dataset — “The low-dose parallel beam (LoDoPaB) CT dataset [25] consists of more than 40,000 two-dimensional CT images and corresponding simulated low-intensity measurements.” The standard split (35,820 training / 3,522 validation / 3,553 test pairs) is used; the method is trained on fractions of it and tested on test samples (§6.4)."

- paper: dudodr-net-2022
  uses:
    - dataset: DeepLesion
      usage: both
      evidence: "3.1 Data Preparation — “we randomly chose 1200 CT images from the DeepLesion dataset (Yan et al., 2018) and collected 100 manually segmented metal implants” (1,000 images / 90 masks synthesize the training data; the remaining 200 images / 10 masks are for evaluation)."

- paper: csc-ct
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "IV-A Simulated Results — “a dataset of clinical CT images, authorized by Mayo Clinic and downloaded from ”the NIH-AAPM-Mayo Clinic Low Dose CT Grand Challenge,” was used [57].” Ten images from this dataset train the predetermined filters and its images serve the reconstruction evaluations."

- paper: pdf
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "Section 3 Experiments and Results — “the dataset “the 2016 NIH-AAPM-Mayo Clinic Low-Dose CT Grand Challenge”, which has 5936 full-dose CT images from 10 patients, was used in our experiments” (400 images from eight patients as the training set; 100 images from the remaining two patients as the testing set)."

- paper: coil
  uses:
    - dataset: LDCT-and-Projection-data
      usage: eval
      evidence: "Experiments (Fig. 4 caption) — “Eight 512 × 512 images from the scans of two patients in the AAPM human phantom dataset [96] were used for testing.” The dataset footnote identifies it as “The 2016 NIH-AAPM-Mayo Clinic Low Dose CT Grand Challenge”, i.e. the TCIA release catalogued here; test images only, hence eval."

- paper: casredscan
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "V-A Data Preparation and Training — “we collected 10 whole body CT scans from the AAPM Low Dose CT Grand Challenge” (the derived 2D images are split patient-wise into 1,834 training / 428 validation / 1,135 test images)."
    - dataset: DeepLesion
      usage: both
      evidence: "V-A Data Preparation and Training — “we collected 2900 2D CT slices from the DeepLesion dataset” (split into 1,960 training / 300 validation / 640 test images)."

- paper: metainv-net
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "III-B Training Setting (with III-C Test Setting) — “The “2016 NIH-AAPM-Mayo Clinic Low Dose CT Grand Challenge” data set has ten patients' normal dose CT images” (five patients' data as the training set; four other patients form the AAPM-Test set). The Pancreas-Test set is not counted: no NIH Pancreas-CT collection identity is established for it."

- paper: ctformer
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "IV Experiments — Dataset — “A publicly released dataset from 2016 NIH-AAPM-Mayo Clinic LDCT Grand Challenge is used for model training and testing” (patient L506 held out for evaluation, the other nine patients for training)."

- paper: indudonet
  uses:
    - dataset: DeepLesion
      usage: both
      evidence: "3 Experimental Results — Synthesized Data — “we randomly select a subset from the DeepLesion [27] to synthesize metal artifact data. … We choose 1,000 images and 90 metal masks to synthesize the training samples, and pair the additional 200 CT images from 12 patients with the remaining 10 metal masks” (for testing)."

- paper: indudonet-plus
  uses:
    - dataset: DeepLesion
      usage: both
      evidence: "6.1 Details Description — Synthesized DeepLesion — “we randomly select a subset from the DeepLesion (Yan et al., 2018) to synthesize metal-corrupted CT images … We choose 1,000 clean CT images and 90 metal masks to synthesize the training samples, and pair the additional 200 CT images from 12 patients with the remaining 10 metal masks to generate 2,000 images for testing.”"

- paper: datadriven
  uses:
    - dataset: LIDC-IDRI
      usage: both
      evidence: "Section 7 numerical examples (Table 7.6, Fig. 7.12) — “the adversarial regularizer from Section 4.7 on the LIDC/IDRI database (Armato et al. 2011) of lung scans” and “Training and test measurements have been simulated by taking the ray transform of the two-dimensional CT slices”."
- paper: glimpse-scalable-robust-ct
  uses:
    - dataset: LoDoPaB-CT
      usage: both
      evidence: "§4.1.1 Training data of chest images — “We use 35820 training samples of chest images from the LoDoPaB-CT dataset [64] in resolution 128 × 128.” §4.2 trains on LoDoPaB-CT at 512 × 512 (90 projections, 40dB measurement noise); chest test samples used for in-distribution evaluation."
- paper: one-network-all-rois
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "§III.A Data Set — “Ten subject data sets from American Association of Physicists in Medicine (AAPM) Low-Dose CT Grand Challenge were used in this study.” 8/1/1 patient split = 3720/254/486 slices for train/val/test; raw projection data from the same challenge used in the test phase."
- paper: dbp-domain-conebeam-artifact
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "§IV Data Set — “simulated projection data from ten subject data sets from American Association of Physicists in Medicine (AAPM) Low-Dose CT Grand Challenge were used. The data set was selected from the abdominal scans that include liver regions.” 8/1/1 patient split for train/val/test (8192/1024 coronal/sagittal slices for train/val)."
- paper: cycle-free-cyclegan
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "§IV.A “AAPM CT dataset” — “AAPM CT dataset is a reconstructed CT image dataset from abdominal CT projection data in the AAPM 2016 Low Dose CT Grand Challenge… To train our network, we use 3839 CT images, while the other 421 images were used to test our network.” Poisson noise inserted to 25% of standard dose."
- paper: adain-tunable-cyclegan
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "§IV.A “Chest CT Scans” — “The low-dose CT image data released in 2020 by the Mayo clinic [29], [30] was used for quantitative analysis of the network performance. Of the 100 chest CT data provided, 50 were used. 45 data is as training data, the remaining five were used as test data.” 14,965 train / 1,683 test images; ref [30] is the TCIA Low Dose CT Image and Projection Data set."
- paper: mbdl-unsupervised-low-dose
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "§III.A.1 Dataset — “We conducted our experiments based on thorax CT data from AAPM Low Dose CT Grand Challenge.” 5936 CT images from 10 patients; LDCT projections simulated from NDCT images; 5376 images from nine patients for training, the remaining one patient for testing (§III.B)."
- paper: prior-4d-cbct
  uses:
    - dataset: SPARE 4D-CBCT
      usage: eval
      evidence: "§IV.A.1 Dataset Acquisition — “Clinical data was provided by the SPARE Challenge.” Elekta dataset (one case) and Varian dataset (one patient) evaluated by the PRIOR-Net trained on simulated images, as clinical datasets have no ground truth images."
- paper: deep-sinogram-completion-mar
  uses:
    - dataset: DeepLesion
      usage: both
      evidence: "§III-A Dataset and Simulation — “For the simulation data, we randomly selected a subset of CT images from the recently released DeepLesion dataset to synthesize metal artifacts.” Training 1000 CT images + 90 metal masks; evaluation 2000 combinations from the remaining 10 masks × another 200 CT images (12 patients)."
- paper: mar-self-supervised-cross-domain
  uses:
    - dataset: DeepLesion
      usage: both
      evidence: "§III-A Datasets — “For network training, we randomly chose 1000 CT slices from the DeepLesion dataset and 90 metal masks from the collected metal masks.” Evaluation 2000 combinations from 200 slices + 10 masks; clinical metal CT images in §III-E from DeepLesion + local hospital (DeepLesion part counted as eval)."
- paper: cas-pred-limited-angle-cbct
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "§III.A Experimental conditions — “The lung data are obtained from the AAPM dataset (from the low-dose CT challenge) and the LIDC-IDRI dataset (from the National Cancer Institute).” 23 lung + 42 leg scans in total; 50 sets training, 10 sets test, 5 sets prior (Table I splits by anatomy, not by named dataset)."
    - dataset: LIDC-IDRI
      usage: both
      evidence: "§III.A Experimental conditions — “The lung data are obtained from the AAPM dataset (from the low-dose CT challenge) and the LIDC-IDRI dataset (from the National Cancer Institute).” Fig. 6(f1) is a LIDC-IDRI test result; overall split 50 sets training / 10 sets test / 5 sets prior."
- paper: dcdl-gs-sparse-view
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "§3 Experiment settings — “we conducted training and testing using two datasets: the low-dose CT image and projection dataset (named the LDCT-P dataset), which consists of low-dose CT images and projections; and the United Image Healthcare (UIH) clinical dataset (named the UIH dataset).” LDCT-P is the TCIA Low-Dose CT Image and Projection Data collection, identical to the library entry (same collection URL and 2016 AAPM challenge origin); the UIH clinical dataset is not among the 79 library names. No per-dataset slice counts are given in this section, so none are written."
- paper: geometry-aware-attenuation-learning-sparse-view-cbct
  uses:
    - dataset: FleX-ray Walnut CBCT Collection (CWI)
      usage: both
      evidence: "§IV-A1 Dataset — “we collect the third dataset includes 42 real-world walnut CBCT scanning collections from [48].” “We split this dataset into 32 cases for training, 5 cases for validation, and 5 cases for testing.” Reference [48] is Der Sarkissian et al., Scientific Data 2019, the CWI FleX-ray cone-beam CT data collection for machine learning, identical to the library entry. The dental dataset (130 self-collected images) and the spine dataset (from CTSpine1K, not among the 79 library names) yield no edges."

- paper: efmct
  uses:
    - dataset: LDCT-and-Projection-data
      usage: both
      evidence: "Datasets section: the first dataset is the AAPM 2016 Low Dose CT Grand Challenge data, 9 patients for training and patient L506 for testing; per the established mapping, the 2016 AAPM challenge is LDCT-and-Projection-data."
    - dataset: Medical Segmentation Decathlon
      usage: both
      evidence: "Datasets section: Medical Segmentation Decathlon CT, Task_06 Lung subset, 10 patients for training and patient 017 for evaluation."
- paper: sr4zct
  uses:
    - dataset: Medical Segmentation Decathlon
      usage: both
      evidence: "§3: Task06 Lung volumes 06, 14, 22 and 23 (2170 axial slices); axial slices are used for training per volume and coronal/sagittal views for evaluation."
    - dataset: LDCT-and-Projection-data
      usage: eval
      evidence: "§3, Real-world CT Images without Reference: Low Dose CT Challenge patient L291 is used for reference-free visual evaluation only."
- paper: multi-stage-artifact-reduction-parallel-beam-ct
  uses:
    - dataset: LoDoInd
      usage: both
      evidence: "§4.1: LoDoInd reference-tube sample, upper half for training and lower half for testing."
    - dataset: TomoBank
      usage: both
      evidence: "§4.1: TomoBank fatigue-corrosion data, tomo_00056 for training and tomo_00055 for testing."
