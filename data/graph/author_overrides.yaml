# Author identities for the knowledge graph (scripts/graph.py).
#
# data/graph/authors.yaml keys each authorship by its OpenAlex author id, and
# OpenAlex splits some people across several ids (and merges unrelated people
# into one). Each entry here names one person: `id` is the canonical OpenAlex
# id (the node and its link), `same` lists other ids whose authorships IN THIS
# LIBRARY belong to that person, and `team` makes them the PI of a team in
# data/teams.yaml (the graph's "leads" edge is keyed by this id, not by name,
# so a namesake can never pick up a team).
#
# A `same` id is listed only on evidence, recorded beside it: the same ORCID;
# or at least three shared co-authors across the library; or the same
# institution plus a shared co-author. Ids without such evidence stay separate
# even when the name matches. Ids are checked by build.py --check.
